ás colaboración entre gobiernos y bancos centrales habría evitado quiebras, Marichal presenta la reinterpretación de Eichengreen: era precisamente la existencia del patrón oro y el apego a la ortodoxia monetaria lo que volvía inflexible el menú de respuestas. Recién cuando los países abandonaron el oro y devaluaron pudieron cambiar la ecuación, y los que salieron antes se recuperaron antes.","por_que_no":["Contradice el capítulo: la crisis fue mundial, con quiebras bancarias en Austria y Alemania, hundimiento del comercio y fuertes efectos en América Latina.","Falso: la moratoria de 1931 llegó tarde y no resolvió la crisis; la cooperación transatlántica terminó muriendo en 1934.","","Opuesto a Eichengreen: salir pronto del oro permitió recuperarse antes; la salida británica no se presenta como el error."],"pag":"pp. 117-118"},{"id":"mar2-m3","tema":"P1","nivel":"muy_dificil","enunciado":"¿Cuál de las siguientes comparaciones entre Alemania y Francia en la década de 1920 es correcta según Marichal?","opciones":["Ambas frenaron la inflación gracias a empréstitos de Nueva York: Alemania con el plan Dawes y Francia con préstamos para volver al oro en 1926.","La inflación había borrado gran parte de la deuda pública alemana, mientras Francia, muy endeudada, recién se estabilizó en 1926 con el ajuste de Poincaré.","Francia sufrió en 1926 una inflación causada por las reparaciones que le debía a Alemania, hasta que Poincaré consiguió que se suspendieran.","Alemania llegó al patrón oro con una deuda pública abrumadora, mientras que Francia lo hizo con presupuestos equilibrados desde comienzos de la década."],"correcta":1,"explicacion":"Marichal contrasta los dos casos: en Alemania la hiperinflación había liquidado la mayor parte de la deuda pública (lo que irritaba a Francia, que reclamaba más reparaciones), mientras que Francia, el país europeo más endeudado en relación con su riqueza, sufrió una inflación del 350% en 1926 hasta que el gobierno de Poincaré aplicó austeridad y equilibrio presupuestario y el franco se afirmó en el patrón oro.","por_que_no":["Falla en ambos casos: la inflación alemana se frenó en 1923, antes del préstamo del plan Dawes (1924), y Francia se estabilizó con austeridad, no con préstamos neoyorquinos.","","Invierte actores: era Alemania la que debía reparaciones a Francia; la inflación francesa se vinculó a su enorme deuda pública.","Invierte la situación: Francia cargaba con la mayor deuda pública (su servicio absorbía el 44% del gasto en 1927) y Alemania la había licuado con la hiperinflación."],"pag":"pp. 98-99"},{"id":"mar2-m4","tema":"P2","nivel":"muy_dificil","enunciado":"¿Cuál de las siguientes explicaciones de la hiperinflación alemana de 1922-1923 es la más fiel al planteo de Marichal?","opciones":["Se explica por la caída de la producción que provocaron la revolución y la guerra civil, como en el caso ruso, sin una relación directa con las reparaciones.","Empezó cuando Francia exigió cobrar las reparaciones en marcos de papel, lo que obligó al Reichsbank a imprimir sin respaldo hasta fines de 1923.","Fue un error técnico del Reichsbank, que quedó corregido en cuanto el plan Dawes de 1922 bajó los pagos a una décima parte de lo previsto.","Las reparaciones la originaron, y la agravaron el uso de la caída del marco como argumento para no pagar y el veto de empresarios y sindicatos al ajuste."],"correcta":3,"explicacion":"Marichal, con Eichengreen, ubica en las reparaciones la causa última: tras el acuerdo de Londres de 1921 el marco se hundió. Pero muestra también mecanismos internos: la depreciación fue tolerada como argumento para no pagar en oro, y el gobierno no pudo cerrar el déficit porque empresarios y sindicatos se oponían a nuevas reformas fiscales, por lo que recurrió a una emisión cada vez más acelerada.","por_que_no":["Traslada a Alemania la explicación que el texto da para el caso ruso (revolución y guerra civil); para Alemania, Marichal pone en primer plano las reparaciones.","Falso: el problema eran los pagos en oro o en metálico; justamente para conseguirlos el gobierno emitió cada vez más.","Error cronológico y de fondo: el plan Dawes es de 1924, posterior a la estabilización de 1923, y la hiperinflación no fue un simple error técnico.",""],"pag":"pp. 91-95"},{"id":"mar2-m5","tema":"P3","nivel":"muy_dificil","enunciado":"Un alto funcionario de Seligman Brothers describió las finanzas de posguerra como un «movimiento triangular». ¿Qué reconstrucción de ese circuito es correcta según Marichal?","opciones":["Europa le prestaba a América Latina con el oro cobrado por reparaciones; América Latina exportaba a EE.UU., y EE.UU. le pagaba a Europa por esas materias primas.","EE.UU. prestaba a Alemania, Alemania pagaba reparaciones a Francia y Gran Bretaña, y estas invertían esos fondos en bonos latinoamericanos.","Nueva York prestaba a América Latina, que pagaba rentas a Europa, y Europa usaba esos dólares para pagar importaciones y deudas de guerra a EE.UU.","América Latina depositaba sus reservas de oro en Nueva York, que las prestaba a Europa, y Europa compraba con ellas exportaciones latinoamericanas."],"correcta":2,"explicacion":"El banquero citado explica que, después de la guerra, Europa debía pagarle a EE.UU. un gran excedente de importaciones y las deudas de guerra; los dólares los obtenía de las ganancias de sus inversiones en América Latina, que a su vez se financiaba con préstamos de Wall Street (en buena parte para refinanciar viejas deudas con Europa). Por eso Marichal dice que esos flujos sostenían el triángulo América Latina–Europa–EE.UU.","por_que_no":["Invierte la dirección del crédito: el prestamista era Nueva York, y los europeos eran los que cobraban intereses y ganancias desde América Latina.","Mezcla el argumento de Schuker (préstamos a Alemania que financiaban reparaciones) con el triángulo; el último eslabón es inventado y el circuito de Seligman pasa por América Latina.","","Falso: América Latina era deudora; recibía préstamos de Wall Street para refinanciar viejas deudas con Europa y acumular reservas."],"pag":"pp. 101-102"},{"id":"mar2-m6","tema":"P4","nivel":"muy_dificil","enunciado":"Sobre América Latina frente a la Gran Depresión, considere:\nI. Chile siguió pagando su deuda externa durante buena parte de 1929-1931, aunque sus exportaciones y su recaudación se desplomaban, y la suspendió a mediados de 1931.\nII. Para Rosemary Thorp, en Perú devaluación y cese de pagos fueron de la mano: al devaluar, el peso de la deuda medido en moneda nacional se volvió tan grande que empujó a suspender.\nIII. La Argentina, al igual que Brasil, suspendió el servicio de su deuda en 1932 y recién lo normalizó durante el gobierno de Perón.\nIV. México sufrió un impacto financiero menor, posiblemente porque ya había suspendido los pagos de su deuda externa en 1914.\n¿Cuáles son correctas según Marichal?","opciones":["Solo I, II y IV.","Solo I y III.","Solo II, III y IV.","Solo II y IV."],"correcta":0,"explicacion":"I, II y IV coinciden con el texto: Chile transfirió 90 millones de dólares a sus acreedores antes de suspender a mediados de 1931; Thorp sostiene que la devaluación volvió tan pesado el servicio de la deuda en moneda nacional que hubo un fuerte incentivo para suspender; México ya había dejado de pagar en 1914. III es falsa: la Argentina fue la única gran excepción, siguió pagando tras el pacto Roca-Runciman (1933) y canceló su deuda en 1947, bajo Perón.","por_que_no":["","Incluye III, que es falsa (la Argentina fue la excepción: siguió pagando), y deja afuera II y IV, que son correctas.","Incluye III, que es falsa, y excluye I, que describe bien el caso chileno.","Deja afuera I, que es correcta: Chile transfirió 90 millones de dólares a sus acreedores antes de suspender a mediados de 1931."],"pag":"pp. 131-134"},{"id":"mar2-m7","tema":"P4","nivel":"muy_dificil","enunciado":"Si alguien afirmara que el ascenso del nazismo era inevitable porque la república de Weimar no tenía herramientas para enfrentar la Depresión, ¿qué le objetaría Marichal?","opciones":["Que el nazismo no se explica por la Depresión sino por la hiperinflación de 1923, que había arruinado a las clases medias una década antes.","Que Weimar mantuvo un manejo fiscal ortodoxo y que, según dos historiadores, más gasto en empleo en los distritos golpeados podría haber restado muchos votos a Hitler.","Que Weimar sí lanzó un gran plan de obras públicas y autopistas, pero Schacht lo desmanteló cuando Hitler llegó al poder.","Que Alemania ya se estaba recuperando en 1932 gracias a su temprana salida del patrón oro, de modo que la crisis no influyó en el voto."],"correcta":1,"explicacion":"Marichal no presenta el ascenso nazi como inevitable: señala que Weimar mantuvo al principio una política fiscal ortodoxa y que, según dos historiadores, si el gobierno hubiera gastado más en crear empleo en los distritos con alta desocupación, el voto a Hitler podría haberse reducido sustancialmente en noviembre de 1932. Los dirigentes de Weimar no vieron que esa lucha se libraba en el «frente fiscal».","por_que_no":["Contradice el texto: la inmensa mayoría de los estudios que cita Marichal atribuye a la Gran Depresión el descontento que llevó al nazismo.","","Invierte los hechos: según Marichal, fue Schacht quien, desde 1933, autorizó más gasto público y promovió la construcción de autopistas.","Falso: a fines de 1932 había más de seis millones de desocupados, buena parte de los cuales votó a los nazis; además, Weimar primero endureció el oro."],"pag":"pp. 127-128"},{"id":"mar2-m8","tema":"P4","nivel":"muy_dificil","enunciado":"¿Qué secuencia reconstruye mejor el argumento de Marichal sobre cómo el crac bursátil se convirtió en una depresión mundial?","opciones":["Caída de la bolsa → ruina de la mayoría de los ahorristas → derrumbe inmediato del consumo → quiebras de empresas → recién al final, quiebras bancarias.","Caída de la bolsa → aranceles de 1930 → hundimiento del comercio mundial → caída de los precios → pánicos bancarios como consecuencia final.","Caída de la bolsa → EE.UU. abandona el oro y devalúa → fuga de capitales → quiebras bancarias → derrumbe del consumo y del comercio mundial.","Caída de la bolsa → quiebras bancarias y menos crédito → menor consumo, deflación y quiebras de firmas → hundimiento del comercio."],"correcta":3,"explicacion":"El texto describe una cadena: el crac destruyó riqueza y confianza; la «segunda ola» fueron las quiebras bancarias, que contrajeron el crédito y provocaron caída del consumo, deflación y suspensiones de pagos de empresas; la reducción del crédito hundió el comercio mundial (60% entre 1928 y 1932), lo que alimentó más deflación y bancarrotas. El proteccionismo agravó esa caída del comercio, pero no fue el primer eslabón.","por_que_no":["Contradice dos datos: solo el 2% de la población invertía en la bolsa, y las quiebras bancarias fueron la «segunda ola», que vino antes de la caída del consumo y de las quiebras de empresas.","Invierte la causalidad: para Marichal, las quiebras bancarias y la contracción del crédito hundieron el comercio (el proteccionismo lo agravó); los pánicos no fueron la consecuencia final.","Falso: EE.UU. siguió aferrado al oro hasta 1933; las quiebras bancarias empezaron a fines de 1930 sin que mediara ninguna devaluación.",""],"pag":"pp. 108-109"}],"desarrollo":[{"id":"mar2-d-n1","tema":"P4","nivel":"normal","consigna":"Según Marichal, ¿qué explicaciones ofrecieron economistas e historiadores sobre las causas de la Gran Depresión? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Friedman y Schwartz: culpa de la Reserva Federal","detalle":"Debe decir que, para Friedman y Schwartz, la Reserva Federal fue la gran responsable por no expandir dinero y crédito (liquidez) a los bancos ante la recesión, es decir, por no aplicar medidas anticíclicas.","peso":3,"indicios":[["friedman","schwartz"],["reserva federal","fed","banco central","bancos centrales","liquidez","anticicl","dinero"]]},{"id":"b","punto":"Temin: consumo y debilidades reales","detalle":"Debe mencionar el enfoque sintetizado por Temin: caída de ingresos y consumo por la baja de la construcción de viviendas, de los precios agrícolas y de algunas industrias antes del crac.","peso":3,"indicios":[["temin"],["consumo","vivienda","agricol","construccion","ingresos"]]},{"id":"c","punto":"Bernanke: crédito y demanda","detalle":"Debe explicar que Bernanke concilia demanda y oferta monetaria: la fragilidad financiera contrajo el crédito, comprimió la demanda y convirtió la recesión en una depresión prolongada.","peso":2,"indicios":[["bernanke"],["credito","crediti","demanda","financier","prolongad"]]},{"id":"d","punto":"Romer: incertidumbre tras el crac","detalle":"Debe señalar que, para Romer, el desplome bursátil disparó la incertidumbre: los empresarios invirtieron menos y los consumidores compraron menos.","peso":2,"indicios":[["romer"],["incertidumbre","confianza","expectativa","insegur"]]},{"id":"e","punto":"Eichengreen: rigidez del patrón oro","detalle":"Debe mencionar que Eichengreen atribuye la falta de respuestas al apego al patrón oro y a la ortodoxia monetaria.","peso":1,"indicios":[["eichengreen","patron oro","patron de oro","patron de cambio","al oro","del oro","el oro"],["rigid","inflexib","apego","atad","ortodox","corse"]]},{"id":"f","punto":"Liquidacionistas y pasividad (DeLong)","detalle":"Complementario: la pasividad de las autoridades se explica por el predominio de los liquidacionistas, que aconsejaban no intervenir.","peso":1,"indicios":[["liquidacionist","delong","no intervenir","no interven","pasividad"]]}],"respuesta_modelo":"Marichal repasa varias explicaciones de la Gran Depresión. Quizás el estudio más influyente sobre sus causas monetarias en EE.UU. sea el de **Milton Friedman y Anna Schwartz**: la Reserva Federal fue la gran culpable, porque no expandió el dinero ni dio liquidez masiva a los bancos cuando asomaba la recesión, es decir, no aplicó medidas anticíclicas. Otros economistas, sintetizados por **Peter Temin**, respondieron que pesaron debilidades reales previas al crac: caída de la construcción de viviendas, baja de los precios agrícolas en un país casi mitad rural y retroceso de algunas industrias, que redujeron ingresos y consumo. **Ben Bernanke** buscó unir ambas visiones: la fragilidad financiera contrajo el crédito, eso deprimió la demanda y convirtió una recesión severa en una depresión prolongada. **Christina Romer** destacó la incertidumbre que el crac generó en empresarios y consumidores. **Eichengreen** culpa al apego al patrón oro, y **DeLong** explica la pasividad oficial por el predominio de los «liquidacionistas» (Schumpeter, Hayek, Robbins, Mellon), que aconsejaban no intervenir.","errores_comunes":["Atribuir a Friedman y Schwartz la explicación por la caída del consumo (es la de Temin) o decir que culpan a la especulación bursátil.","Presentar a Bernanke como opuesto a ambos enfoques, cuando lo que hace es conciliar la demanda con la oferta de dinero a través del crédito.","Mezclar a Romer (incertidumbre de empresarios y consumidores después del crac) con Temin (debilidades reales previas al crac).","Confundir a Eichengreen con quienes piden más cooperación internacional: él culpa al propio apego al patrón oro."],"pag":"pp. 111-113, 117"},{"id":"mar2-d-n2","tema":"P1","nivel":"normal","consigna":"Según Marichal, ¿qué consecuencias financieras y monetarias dejó la Primera Guerra Mundial en Europa durante la década de 1920? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"La guerra como crisis financiera","detalle":"Debe decir que la guerra trastocó mercados de capitales, moneda, banca, crédito, fisco y deudas, y que el capitalismo clásico dio paso a un capitalismo de Estado militarizado.","peso":2,"indicios":[["capitalismo de estado","militariz","capitalismo clasico","sistema nervioso"]]},{"id":"b","punto":"Inflación de posguerra (1919-1920)","detalle":"Debe explicar la inflación de 1919-1920 por el desmonte apresurado de los controles, la demanda de posguerra y la emisión acumulada, y mencionar la crisis deflacionaria de 1920-1921.","peso":3,"indicios":[["inflac"],["control","desregul","demanda","relanz","reconver","apresur","premura"]]},{"id":"c","punto":"Hiperinflaciones en Europa central y Alemania","detalle":"Debe mencionar las inflaciones extremas de Europa central y Rusia (libre flotación y emisión) y la hiperinflación alemana de 1922-1923 ligada a las reparaciones.","peso":3,"indicios":[["hiperinflac","hiper inflac","inflaciones extremas"],["alemana","alemania","austria","hungria","polonia","rusia","marco"]]},{"id":"d","punto":"Reparaciones y deudas interaliadas encadenadas","detalle":"Debe explicar la cadena: Alemania debía reparaciones; sin esos pagos, Francia no pagaba a Gran Bretaña ni Europa a EE.UU., y Washington no aceptó cancelar los créditos de guerra.","peso":3,"indicios":[["repara"],["interaliad","cadena","deudas de guerra","creditos de guerra","cancel","condon"]]},{"id":"e","punto":"Regreso al patrón de cambio oro","detalle":"Debe mencionar el retorno al oro en 1924-1928 bajo la forma de patrón de cambio oro y su carácter de ilusión (nostalgia del orden previo a 1914).","peso":2,"indicios":[["patron oro","patron de oro","patron de cambio","al oro","del oro","el oro"],["regres","retorno","volv","ilusion","nostalg","restablec","restaur"]]},{"id":"f","punto":"Peso de las deudas públicas: Francia","detalle":"Complementario: el peso de las deudas públicas heredadas (Francia: servicio del 44% del gasto en 1927, inflación de 1926, estabilización de Poincaré).","peso":1,"indicios":[["poincare","deuda publica francesa","franco"]]}],"respuesta_modelo":"Para Marichal, la Primera Guerra fue, en lo financiero, una crisis de enorme magnitud para los beligerantes: alteró mercados de capitales, moneda, banca, crédito, fisco y deudas, al punto de que desde 1914 el capitalismo clásico fue reemplazado por un **capitalismo de Estado militarizado**. Terminada la guerra, el desmonte apresurado de los controles, la demanda de las empresas que se reconvertían y la gran emisión acumulada desataron la **inflación de 1919-1920**, seguida por la crisis deflacionaria de 1920-1921. En Europa central y Rusia, la libre flotación y la emisión produjeron inflaciones extremas, y en Alemania la **hiperinflación de 1922-1923** se ligó a las **reparaciones** de Versalles. Esas reparaciones encabezaban una cadena de **deudas interaliadas**: sin pagos alemanes, Francia no podía pagar a Gran Bretaña ni Europa a EE.UU., que se negó a cancelar sus créditos. Por último, entre 1924 y 1928 se volvió a un **patrón de cambio oro**, alentado por la ilusión de recuperar la prosperidad de antes de 1914, mientras países muy endeudados como Francia recién se estabilizaron en 1926 con Poincaré.","errores_comunes":["Atribuir la inflación de 1919-1920 a las reparaciones: Marichal la explica por la desregulación apresurada, la demanda de posguerra y la emisión acumulada.","Decir que el patrón oro restaurado era igual al de antes de 1914: era un patrón de cambio oro, con reservas en oro o en divisas convertibles (sobre todo dólares y libras).","Presentar las reparaciones como un problema solo franco-alemán, sin la cadena de deudas interaliadas con Gran Bretaña y EE.UU.","Confundir la libre flotación de 1919 en Europa central con el patrón oro de mediados de los años 20."],"pag":"pp. 86-99"},{"id":"mar2-d-d1","tema":"P3","nivel":"dificil","consigna":"Explique por qué, según Marichal, el auge bursátil de los años 20 —en especial el de Wall Street— desembocó en una crisis. Relacione las bases reales del auge con los factores que lo volvieron insostenible y con las señales de alarma previas a octubre de 1929.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Nuevas industrias y estabilidad monetaria","detalle":"Debe describir la etapa de innovación en las industrias eléctrica, química, petrolera y automotriz, los bienes durables, la radio y el cine, en paralelo a la estabilidad monetaria que reactivó el crédito y las bolsas.","peso":2,"indicios":[["electric","automo","quimic","petrol","radio","cine","durable","heladera"]]},{"id":"b","punto":"Fundamentos reales (White)","detalle":"Debe señalar que, según White, el auge tenía bases reales: crecimiento de más del 4% anual, desempleo bajo (3,7%) e inflación baja.","peso":3,"indicios":[["white","fundamentals","fundamentos","racional"],["crec","desemple","inflac"]]},{"id":"c","punto":"Ilusión y crédito especulativo","detalle":"Debe explicar que la ilusión de una innovación sin fin y la multiplicación de los fondos de inversión (de 40 a 750) inflaron el crédito para especular.","peso":3,"indicios":[["especul","burbuja","get rich","enriquec"],["fondos de inversion","de 40 a 750","750 fondos","ilusion","innovac"]]},{"id":"d","punto":"Señales previas en Europa","detalle":"Debe mencionar las caídas de las bolsas de Berlín (1927), Bruselas (1928) y París (1929) y la fuga de capitales europeos hacia Nueva York.","peso":2,"indicios":[["berlin","bruselas","paris","lowenstein","loewenstein"],["bolsa","caida","cayo","cayeron","desplom","derrumb","quiebra"]]},{"id":"e","punto":"Suba de tasas de la Fed y oro","detalle":"Debe explicar que la suba de tasas de la Reserva Federal no frenó la especulación y restringió el crédito productivo, y que la acumulación de oro de EE.UU. y Francia forzó subas de tasas en otros países.","peso":3,"indicios":[["tasa"],["subi","suba","aument","alza","elev"],["reserva federal","fed","francia","60 del oro","60 de las reservas","60 por ciento"]]},{"id":"f","punto":"Periferia: precios y corte de capitales","detalle":"Complementario: caída de los precios de exportación latinoamericanos desde 1927 y suspensión de las exportaciones de capital de EE.UU. en 1929 por la absorción de fondos en la especulación.","peso":1,"indicios":[["america latina","latinoameric","periferi","materias primas","exportaciones de capital","estano","azucar","precios de exportacion"]]}],"respuesta_modelo":"Marichal explica que el auge de los años 20 tuvo bases reales, pero terminó volviéndose insostenible. Tras el regreso al oro, la estabilidad monetaria reactivó el crédito y las bolsas; el mayor auge fue el de **Wall Street (1922-1929)**, apoyado en acciones y bonos de corporaciones como General Motors, Ford o General Electric. Además, fue una etapa de fuerte dinamismo de las industrias eléctrica, química, petrolera y automotriz (más de cuatro millones de autos por año en 1927-1928), de los bienes durables ligados a la electrificación y de la radio y el cine. Siguiendo a **Eugene White**, el autor reconoce **fundamentos**: crecimiento de más del 4% anual, desempleo cercano al 3,7% y baja inflación. Sin embargo, la ilusión de que la innovación no tendría fin y la multiplicación de los **fondos de inversión** (de 40 a 750) expandieron peligrosamente el crédito especulativo, en un clima de «get rich quick». Las señales de alarma aparecieron primero en Europa: caídas de Berlín (1927), Bruselas (1928) y París (1929), con fuga de capitales hacia Nueva York. La **Reserva Federal subió las tasas**, pero no frenó la especulación y sí restringió el crédito a la economía real, un efecto contradictorio que favoreció la recesión. Además, EE.UU. y Francia acumulaban más del 60% del oro, lo que obligó a otros países a subir sus tasas; desde 1927 caían los precios de exportación latinoamericanos y en 1929 la especulación cortó los préstamos al exterior. Así, el jueves negro llegó sobre una economía mundial ya agrietada.","errores_comunes":["Presentar el auge como pura especulación sin bases reales: con White, Marichal reconoce crecimiento, bajo desempleo y baja inflación.","Decir que la Reserva Federal bajó las tasas en 1928-1929: las subió; la baja coordinada de tasas fue en 1927, tras la caída de Berlín.","Ignorar que las primeras señales de alarma aparecieron en Europa y en los precios de las materias primas, antes del crac.","Afirmar que la mayoría de los estadounidenses invertía en la bolsa: en 1929 solo lo hacía el 2%."],"pag":"pp. 102-107"},{"id":"mar2-d-d2","tema":"P2","nivel":"dificil","consigna":"Explique por qué Marichal considera las reparaciones el principal «talón de Aquiles» financiero de la Europa de los años 20. Relacione el Tratado de Versalles, la hiperinflación alemana, la estabilización de 1923 y el plan Dawes con el papel de Estados Unidos.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Versalles: paz cartaginense y montos","detalle":"Debe presentar las exigencias de Versalles (pensiones y deudas comerciales; Clemenceau como el más duro, apoyado por Lloyd George en el cobro de las deudas comerciales), el cálculo de Keynes y el total fijado en Londres en 1921 (132 mil millones de marcos).","peso":2,"indicios":[["cartagin","clemenceau","40 mil millones","pensiones","lloyd","132 mil millones"],["repara"]]},{"id":"b","punto":"Depreciación como estrategia y Ruhr","detalle":"Debe explicar que el gobierno y el Reichsbank toleraron la caída del marco como argumento para no pagar en oro, y que Francia ocupó el Ruhr en 1923.","peso":2,"indicios":[["deprecia","caida del marco","derrumbe del marco","ruhr","devalu"]]},{"id":"c","punto":"Reparaciones → hiperinflación (Eichengreen)","detalle":"Debe sostener que, para Eichengreen, las reparaciones fueron responsables «en última instancia» de la hiperinflación, y explicar el mecanismo que narra Marichal: déficit que no se cerraba porque empresarios y sindicatos frenaban las reformas fiscales, y emisión acelerada para pagar en metálico.","peso":3,"indicios":[["hiperinflac","inflac"],["eichengreen","ultima instancia","sindicat","empresari","reforma","deficit"]]},{"id":"d","punto":"Estabilización de 1923","detalle":"Debe mencionar la estabilización de noviembre de 1923 (reservas, nueva paridad, fin del crédito al gobierno) y que funcionó gracias a un acuerdo político-social creíble.","peso":2,"indicios":[["estabiliz"],["credib","creib","acuerdo politico","politico social","paridad","grifo","credito del banco central","normas de reservas","nuevas reservas"]]},{"id":"e","punto":"Cadena de deudas y negativa de EE.UU.","detalle":"Debe explicar que sin pagos alemanes Francia no pagaba a Gran Bretaña ni Europa a EE.UU., y que Washington rechazó cancelar los créditos de guerra (propuesta de Keynes).","peso":3,"indicios":[["estados unidos","ee uu","eeuu","washington","norteameric","estadounid"],["cadena","interaliad","cancel","condon","creditos de guerra","deudas de guerra"]]},{"id":"f","punto":"Plan Dawes y préstamos de Wall Street","detalle":"Debe describir el plan Dawes (1924: reducción drástica de las cuotas —según Marichal, a un décimo—, Reichsbank supervisado, empréstito de Nueva York) y el argumento de Schuker: paradójicamente, los mercados estadounidenses financiaron las reparaciones.","peso":3,"indicios":[["dawes"],["prestam","emprestit","nueva york","schuker","schucker","wall street"]]}],"respuesta_modelo":"Para Marichal, el punto débil que más problemas generó en la Europa de posguerra fue el de las **reparaciones**. En Versalles se impuso una **«paz cartaginense»**: Clemenceau era el más duro, Lloyd George lo apoyó en el cobro de las deudas comerciales, y se exigieron pensiones para viudas y heridos además de esas deudas; Keynes calculó unos 40 mil millones de dólares, una carga que la economía alemana no podía afrontar. En Londres (1921) el total se fijó en 132 mil millones de marcos y el marco se desplomó. El gobierno y el Reichsbank toleraron la depreciación como argumento para no pagar en oro, y Francia respondió ocupando el Ruhr en 1923. Según **Eichengreen**, las reparaciones fueron responsables «en última instancia» de la **hiperinflación de 1922-1923**; Marichal describe el mecanismo: el déficit no se podía cerrar porque empresarios y sindicatos se oponían a las reformas fiscales, y se emitió cada vez más para pagar en metálico. La estabilización de noviembre de 1923 (nuevas reservas, fin del crédito del banco central al gobierno) funcionó gracias a un acuerdo político-social que la hizo creíble. El problema excedía a Alemania: sin sus pagos, Francia no podía pagar a Gran Bretaña ni Europa a EE.UU., y Washington rechazó la propuesta de Keynes de cancelar los créditos de guerra. La salida fue el **plan Dawes (1924)**: una reducción drástica de las cuotas (según Marichal, a un décimo), el Reichsbank bajo supervisión aliada y un gran empréstito colocado en Nueva York. Así, paradójicamente, como señala Schuker, fueron los mercados estadounidenses los que financiaron las reparaciones.","errores_comunes":["Ubicar el plan Dawes antes de la estabilización de 1923 o atribuirle esa estabilización: el plan es de 1924.","Decir que EE.UU. cobraba reparaciones: era acreedor de las deudas interaliadas, no de las reparaciones.","Explicar la hiperinflación solo por las reparaciones, sin la estrategia de depreciación ni el bloqueo de las reformas fiscales por empresarios y sindicatos.","Citar el plan Young como si estuviera en Marichal: este capítulo no lo menciona."],"pag":"pp. 91-97"},{"id":"mar2-d-m1","tema":"P4","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «El regreso al patrón oro en los años 20 fue la base de la estabilidad de entreguerras, y su abandono a partir de 1931 hundió a la economía mundial en la depresión». ¿Es correcta según Marichal? Justifique con los argumentos y los casos del texto.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Juicio: la afirmación es incorrecta","detalle":"Debe concluir que, para Marichal, la afirmación es incorrecta: el oro no fue una base sólida de estabilidad y su abandono ayudó a salir de la crisis, no la provocó.","peso":3,"indicios":[["incorrect","falsa","no es correcta","erronea","no coincide","inexact","no es asi","no es cierta"]]},{"id":"b","punto":"Patrón de cambio oro e ilusión (Mouré)","detalle":"Debe explicar que el retorno (unos 50 países; Gran Bretaña 1925, Francia 1926) fue un patrón de cambio oro y que, según Mouré, respondía a la ilusión o nostalgia de la belle époque.","peso":2,"indicios":[["ilusion","nostalg","moure","belle epoque"]]},{"id":"c","punto":"El oro como factor restrictivo previo","detalle":"Debe señalar que la acumulación de oro (EE.UU. y Francia, más del 60% de las reservas) forzó a otros países a subir tasas y reforzó la restricción crediticia mundial.","peso":3,"indicios":[["60 del oro","60 de las reservas","60 por ciento","acumul"],["tasa","restric"]]},{"id":"d","punto":"Eichengreen: rigidez de las respuestas","detalle":"Debe exponer la tesis de Eichengreen: el apego al oro y a la ortodoxia volvió inflexible el menú de respuestas (emisión rígida, crédito limitado, fugas de capital que minaban a los bancos centrales).","peso":3,"indicios":[["eichengreen","rigid","inflexib","apego","ortodox","traba"]]},{"id":"e","punto":"Salir antes = recuperarse antes","detalle":"Debe decir que, tras la salida británica (21/9/1931), los que dejaron el oro antes se recuperaron antes (América Latina, escandinavos), mientras EE.UU., Francia y Bélgica fueron más lentos.","peso":3,"indicios":[["abandon","salieron","salida","dejaron","devalu"],["recuperaron antes","recuperaron primero","recuperaron mas rapido","recuperaron mas pronto","recuperacion mas temprana","recuperacion temprana","recuperarse antes","se recuperaron"]]},{"id":"f","punto":"Bloques monetarios y falta de acuerdo","detalle":"Complementario: el fracaso de la conferencia de Londres de 1933 y la división del mundo en bloques monetarios que reflejaban tensiones crecientes.","peso":1,"indicios":[["bloque","conferencia de londres","esterlina"]]},{"id":"g","punto":"Matiz: estabilidad real pero frágil","detalle":"Complementario: reconocer que el retorno al oro coincidió con estabilidad monetaria y auge de crédito y bolsas a mediados de los 20, aunque era frágil.","peso":1,"indicios":[["estabilidad","auge","prosperidad"],["fragil","transitori","breve","aparente","corto"]]}],"respuesta_modelo":"La afirmación es incorrecta según Marichal, porque invierte el papel que el autor le asigna al patrón oro. Es cierto que el regreso al oro coincidió con una etapa de estabilidad: tras el plan Dawes, unos cincuenta países volvieron a él (Gran Bretaña en 1925, Francia en 1926) y la nueva estabilidad monetaria impulsó el crédito y las bolsas. Pero ese orden era frágil. Se trataba de un **patrón de cambio oro**, con reservas en oro o en divisas convertibles (sobre todo dólares y libras), y, además de buscar estabilidad, era una idea poderosa que, como señala **Kenneth Mouré**, prometía volver a la belle époque; Marichal habla de una «fatal ilusión». Además, el oro funcionó como factor restrictivo antes del crac: los banqueros centrales más ortodoxos acumulaban reservas, EE.UU. y Francia llegaron a concentrar más del 60% del oro mundial y los demás países tuvieron que subir sus tasas, lo que reforzó una restricción crediticia global. La segunda parte de la afirmación también es errónea. Según **Eichengreen**, fue precisamente el apego al oro y a la ortodoxia lo que volvió inflexibles las respuestas a la crisis: rigidez en la emisión y bancos centrales incapaces de ampliar el crédito mientras sufrían fugas de capital. Cuando Gran Bretaña abandonó el oro, el 21 de septiembre de 1931, y la siguieron otros 21 países, no sobrevino el desastre anunciado: quienes salieron antes, como varios latinoamericanos y los escandinavos, se recuperaron antes, mientras que EE.UU., Francia y Bélgica, que siguieron atados al oro, tuvieron una recuperación más lenta. Lo que sí agravó el panorama fue la falta de acuerdo: tras el fracaso de la conferencia de Londres de 1933, el mundo se partió en bloques monetarios. En síntesis, para Marichal el oro no fue la base de una estabilidad sólida sino un factor de rigidez, y su abandono fue parte de la salida, no la causa de la depresión.","errores_comunes":["Aceptar la afirmación: confundir el abandono del oro (parte de la salida) con la causa de la depresión.","Decir que EE.UU. fue de los primeros en salir del oro: siguió aferrado hasta 1933 y se recuperó más lento, igual que Francia y Bélgica (que siguieron hasta 1936).","Olvidar que el sistema de los años 20 era un patrón de cambio oro, no el clásico de antes de 1914.","Reducir el problema a la falta de cooperación: para Eichengreen, el problema de fondo era el propio apego al oro."],"pag":"pp. 97-98, 106-107, 117-121"},{"id":"mar2-d-m2","tema":"P4","nivel":"muy_dificil","consigna":"Analice: «La Gran Depresión fue tan profunda y prolongada porque el crac de Wall Street destruyó los ahorros de la mayoría de los norteamericanos». ¿Qué objetaría Marichal? Explique qué mecanismos, según el autor, transformaron el crac en una depresión mundial y por qué duró tanto.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"El crac no arruinó a la mayoría","detalle":"Debe objetar que solo el 2% de la población invertía en la bolsa en 1929; el daño del crac fue la pérdida de riqueza y confianza en el sector que financiaba a las empresas.","peso":3,"indicios":[["2 de la poblacion","solo el 2","apenas el 2","2 por ciento","dos por ciento","minoria"],["invert","accion","bolsa"]]},{"id":"b","punto":"Segunda ola: quiebras bancarias y crédito","detalle":"Debe explicar los pánicos y quiebras bancarias de 1930-1933 (sistema de casi 24.000 bancos pequeños; unos 10.000 suspendieron) y su efecto: contracción del crédito, caída del consumo, deflación y quiebras de empresas.","peso":3,"indicios":[["quebr","quiebra","panico","corrida"],["banco","bancari"],["credito","crediti","prestamo"]]},{"id":"c","punto":"Comercio mundial y proteccionismo","detalle":"Debe mencionar el derrumbe del comercio mundial (60% entre 1928 y 1932), agravado por los aranceles estadounidenses desde 1930 que otros países imitaron.","peso":2,"indicios":[["comercio"],["arancel","protecc","tarifa","un 60","60 por ciento"]]},{"id":"d","punto":"Transmisión internacional","detalle":"Debe mostrar el carácter mundial: Creditanstalt (1931) y crisis doble en Alemania; caída de exportaciones y moratorias en América Latina.","peso":2,"indicios":[["creditanstalt","danat","bruning","crisis doble","america latina","latinoameric"]]},{"id":"e","punto":"Patrón oro y cooperación fallida","detalle":"Debe explicar que el apego al oro impidió responder (Eichengreen: quienes lo dejaron antes se recuperaron antes) y que la cooperación internacional llegó tarde y fracasó (Hoover 1931, Lausana 1932, Londres 1933, fin de los pagos de deudas de guerra en 1934).","peso":2,"indicios":[["patron oro","patron de oro","patron de cambio","al oro","del oro","el oro","cooperacion","hoover","lausana","conferencia de londres"],["apego","rigid","abandon","salieron del","eichengreen","inflexib","atad","tarde","fracas","moratoria"]]},{"id":"f","punto":"Pasividad: Fed y liquidacionistas","detalle":"Debe explicar la duración por la pasividad oficial: la Reserva Federal no dio liquidez (Friedman y Schwartz) y dominaban los liquidacionistas (DeLong; Mellon, Hayek, Schumpeter, Robbins).","peso":3,"indicios":[["liquidacionist","pasividad","friedman","mellon","no intervenir","no interven","delong"]]},{"id":"g","punto":"Bernanke: crédito, demanda y depresión prolongada","detalle":"Debe incorporar el argumento de Bernanke: la fragilidad financiera contrajo el crédito, eso comprimió la demanda y ayudó a convertir una recesión severa en una depresión prolongada.","peso":2,"indicios":[["bernanke"],["credito","crediti","demanda","prolongad"]]}],"respuesta_modelo":"Marichal objetaría la afirmación desde el comienzo: en 1929 apenas el **2%** de la población norteamericana invertía en la bolsa. El crac fue gravísimo porque destruyó riqueza y confianza en el sector que financiaba a las empresas, pero no explica por sí solo la profundidad ni la duración de la crisis. Lo decisivo fue la **segunda ola**: las quiebras bancarias. EE.UU. tenía casi 24.000 bancos, en su mayoría pequeños y rurales, debilitados por la crisis agrícola de los años 20; entre 1930 y 1933 hubo oleadas de pánicos y unos 10.000 bancos suspendieron pagos. Eso contrajo el crédito, hizo caer el consumo, generó deflación y llevó a miles de empresas a suspender pagos; como señala **Bernanke**, la contracción del crédito comprimió la demanda y ayudó a convertir una recesión severa en una depresión prolongada. La reducción del crédito, sumada al **proteccionismo** que EE.UU. inició en 1930 y otros imitaron, hundió el comercio mundial un 60% entre 1928 y 1932, lo que trajo más deflación y quiebras. La crisis fue mundial: la quiebra del **Creditanstalt** en 1931 provocó en Alemania una crisis doble, monetaria y bancaria, y Brüning declaró que Alemania no podía seguir pagando las reparaciones; en América Latina se desplomaron las exportaciones y se generalizaron las moratorias. ¿Por qué duró tanto? Primero, por la **pasividad oficial**: según Friedman y Schwartz, la Reserva Federal no dio liquidez a los bancos, y DeLong muestra que dominaban los liquidacionistas (Schumpeter, Hayek, Robbins, Mellon), que pedían dejar quebrar a las empresas. Segundo, por el **apego al patrón oro**, que según Eichengreen ató las manos de los bancos centrales; quienes lo abandonaron antes se recuperaron antes. Tercero, por el **fracaso de la cooperación**: la moratoria Hoover llegó en 1931, Lausana en 1932, la conferencia de Londres de 1933 fracasó y en 1934 se cortaron los pagos de las deudas de guerra. Por lo tanto, la afirmación confunde el detonante con los mecanismos que transformaron el crac en una depresión mundial.","errores_comunes":["Aceptar que el crac arruinó a la mayoría: solo el 2% de la población invertía en la bolsa en 1929.","Ubicar los aranceles de 1930 o la salida británica del oro (1931) antes del crac.","Reducir la crisis a EE.UU., olvidando el Creditanstalt, la crisis doble alemana y América Latina.","Confundir el feriado bancario de Roosevelt (marzo de 1933) con el feriado bancario alemán de 1931."],"pag":"pp. 108-123"}]},{"id":"baines","autor":"Dudley E. Baines","obra":"Los Estados Unidos entre las dos guerras, 1919-1941 (cap. 6 de W. P. Adams, comp., «Los Estados Unidos de América», Historia Universal Siglo XXI, vol. 30) — selección","temas":["P3","P4","P5"],"resumen":[{"titulo":"La prosperidad de los años veinte: productividad, auto y electricidad","puntos":["Para Baines, 1919-1941 es un **ciclo económico completo**. En los años veinte EE.UU. fue la primera **sociedad de consumo de masas**, basada en bienes «duros» baratos producidos en gran escala.","La clave fue la **productividad**: con la **cadena de producción** (Ford fue su exponente más famoso, no su creador) cada obrero tenía más equipo y repetía tareas simples; se producía y ganaba más y los precios bajaban. En 1929 la industria producía un 70 % más que en 1919 con la misma mano de obra.","Los rasgos más característicos fueron el **automóvil** y la **electricidad**: generaban industrias auxiliares e inversión, abrían nuevas formas de gastar y volvían aceptable una sociedad dominada por la economía. No eran una novedad estricta: lo nuevo fue su difusión masiva. Eran **complementarios**: el auto llevó a la casa suburbana, que pedía electricidad y electrodomésticos.","En un **oligopolio** (Ford, General Motors, Chrysler) se competía más en calidad y diseño que en precio, y la publicidad pasó a **diferenciar** productos parecidos.","Las **ventas a plazos** orientaron la demanda hacia bienes caros (60 % de los autos, 75 % de los muebles), aunque la morosidad hace sospechar que muchos no podían pagarlos."],"pags":"pp. 257-268"},{"titulo":"Construcción, Estado y crédito","puntos":["La **construcción** fue otro motor: viviendas hasta mediados de la década, edificios comerciales y rascacielos hasta 1928. La vivienda tiene ciclos propios de 15-20 años porque su compra puede postergarse.","El **gobierno federal** casi no intervino (**laissez-faire**, superávit, impuestos bajos), aunque estados y municipios gastaron mucho en carreteras. El arancel **Fordney-McCumber** (1922) no protegía nada, porque casi ninguna importación podía competir: solo mostraba que el gobierno estaba con los empresarios.","El **dinero barato** facilitó emisiones de acciones y especulación, pero los factores monetarios fueron **marginales**. Como los precios no subían, se creyó que la expansión era permanente."],"pags":"pp. 269-274"},{"titulo":"La agricultura, gran perdedora de los años veinte","puntos":["El mayor problema de la década: la **agricultura no participó de la prosperidad**. Los precios agrícolas cayeron frente a los industriales y la tierra perdió valor. También sufrían el textil de Nueva Inglaterra y el carbón de los Apalaches.","Problema básico: era más fácil **aumentar la producción que restringirla**; ante la baja de precios cada agricultor producía más, mientras el consumo de trigo y maíz crecía muy despacio (**sobreproducción**).","La guerra lo agravó: con precios garantizados se cultivaron tierras marginales con deudas hipotecarias que quedaron al terminar esos precios (1920-1921). La **mecanización** sumó oferta; las exportaciones no pasaron de dos tercios de las de guerra y las fibras artificiales redujeron la demanda de algodón.","Se salvaron frutas, hortalizas y lácteos con acceso a las ciudades. La **paridad** que reclamaban (precios con el poder adquisitivo de 1910-1914) fue vetada dos veces."],"pags":"pp. 274-277"},{"titulo":"El crac de la Bolsa (1928-1929)","puntos":["Desde marzo de 1928 las acciones casi duplicaron su valor en 20 meses: parecía imposible perder y cada inversor se volvió **especulador**, aunque eran pocos (lo de los lustrabotas es «pura fantasía»).","La Bolsa cayó porque las **cotizaciones dejaron de reflejar la economía**. La especulación se apoyó en los altos **beneficios** de las grandes empresas (que preferían prestar a especuladores), en la venta agresiva de títulos y en el **crédito fácil**: se pagaba una parte de las acciones y el agente adelantaba el resto.","El dinero barato de 1927 pudo desencadenar la suba. En octubre de 1929 el derrumbe fue repentino (pánico el 24, nueva ola el 28-29): a fin de mes las cotizaciones habían caído un 40 %, y hasta 1932 caerían un 83 %."],"pags":"pp. 286-290"},{"titulo":"De la recesión a la Gran Depresión (1929-1933)","puntos":["En 1929 faltaban las causas clásicas (no subían costos ni precios): normalmente el crac sería un **efecto** y no una causa. Causas reales: crisis de la **construcción** (desde 1925), recorte de obras estatales, carbón, algodón, agro y comercio mundial; y, en vez del «**subconsumo**», **sobreinversión**: capacidad que ningún consumo podía justificar.","Fue la peor depresión del país: en 1932 el PNB real cayó 27 % y la producción industrial 50 %; el paro pasó de 1,5 a 13 millones. La agravaron la capacidad ociosa, la caída de la **confianza** empresaria, el crac (acciones de 87.000 a 19.000 millones de dólares: menos beneficios e incentivo al ahorro) y la ruina agrícola.","**Transmisión al mundo**: al subir la Bolsa y llegar la depresión, EE.UU. retiró sus préstamos y repatrió dos tercios de sus inversiones; en 1931 quebró el Kredit Anstalt, se hundió Alemania y Gran Bretaña dejó el oro. La autarquía (arancel Hawley-Smoot, 1930) prolongó la crisis.","El **sistema bancario** fue el factor individual más importante: bancos locales sin sucursales quebraron en oleadas hasta el pánico de febrero-marzo de 1933. La **Reserva Federal** lo agravó al endurecer el crédito sin necesidad; Hoover veía la depresión como una «purga»."],"pags":"pp. 290-301"},{"titulo":"Consecuencias sociales y políticas (1930-1933)","puntos":["Ya en 1931 había 8 millones de parados (una familia de cada seis), sin seguro de desempleo; se impuso «compartir el trabajo» y en 1932 los salarios nominales eran un 60 % más bajos que en 1929.","La pobreza vino más de la **duración** que de la profundidad. La asistencia era solo local (para no crear una clase de indigentes protegida por el Estado) y en 1932 todas las grandes ciudades estaban en bancarrota.","Hoover quedó desprestigiado («**Hoovervilles**», desalojo violento del **Bonus Army**). Roosevelt ganó en 1932 sin programa coherente, prometiendo **acción** y «experimentación»."],"pags":"pp. 301-305"},{"titulo":"El primer New Deal (1933-1935)","puntos":["El New Deal tuvo tres objetivos: **asistencia** urgente, **recuperación** y **reforma** (esta última pasó a primer plano con el tiempo).","Al asumir (4 de marzo de 1933) Roosevelt decretó un **feriado bancario**: era una crisis de **confianza** y, tras su primera «**charla junto al fuego**», la gente volvió a depositar. Luego, reforma financiera: **FDIC** (seguro de depósitos), RFC ampliada, hipotecas refinanciadas y **SEC**.","Los «**cien días**» crearon **FERA** (fondos a estados y municipios), **CCC** (campamentos para desocupados de 18 a 25 años), **PWA** (obras públicas), **AAA** (primas por reducir cultivos), **NRA** (códigos de precios y salarios) y **TVA** (valle del Tennessee; el más exitoso). En noviembre de 1933 llegó la **CWA** (4 millones de empleos), luego reemplazada por la **WPA**.","Para recuperar la economía apostó a **subir los precios**: la NRA (códigos dictados por las grandes empresas) subió precios pero no la producción; la AAA no redujo la producción (los precios subieron sobre todo por la sequía); devaluar el dólar no movió los precios.","El gasto, pagado en buena parte con impuestos, fue chico: Roosevelt no aplicaba a Keynes. En 1935 los empresarios se fueron y el **caso Schechter** anuló la NIRA: Roosevelt giró a la izquierda."],"pags":"pp. 305-314"},{"titulo":"El segundo New Deal (1935-1941)","puntos":["Reelecto en 1936 (46 de 48 estados), Roosevelt vio a los empresarios como **enemigos** del cambio social.","Medidas: abandono de la NRA y juicios **antimonopolio**; anuncio de la **seguridad social**, una ley de vivienda y agencias regionales al estilo TVA; impuestos más **progresivos** e impuesto a la riqueza (sin redistribución real).","Apoyo a los **sindicatos**: la **Ley Wagner** reemplazó a la NIRA y creó la National Labour Relations Board; el **CIO** organizó el acero y el automóvil (afiliación +60 % en 1937).","Error de 1936-1937: cortó el déficit y la Reserva Federal duplicó los encajes; vino una nueva recesión. La salida llegó con el **rearme** (1940-1941)."],"pags":"pp. 314-318"},{"titulo":"Balance del New Deal según Baines","puntos":["**No fue un éxito total**: según Baines el PNB siguió debajo de 1929 hasta la guerra (la renta per cápita lo recuperó en 1940, con el rearme) y cada invierno hubo 9-10 millones de parados: una «década perdida».","Pero **no fue un fracaso**: sin él la caída habría sido mayor, la recuperación no era su único fin (también asistir y **reformar**) y un gobierno decidido a actuar devolvió la confianza.","Sus objetivos eran a menudo **excluyentes** (subsidiar agricultores sobrantes; la NRA subía precios y salarios a la vez) y el gasto fue insuficiente: el déficit nunca superó el 5 % de la renta nacional.","No fue hostil a los empresarios: **salvó al capitalismo**. Reforzó el poder **federal** y **presidencial**, y su legado fue «revolucionar las expectativas»: la gente pasó a esperar que el gobierno garantizara su nivel de vida."],"pags":"pp. 258, 320-323"}],"conceptos":[{"termino":"Bienes de consumo «duros» (durables)","def":"Artículos que duran varios años (autos, radios, electrodomésticos). Su producción masiva y barata fue la base de la primera sociedad de consumo de masas, en los años veinte."},{"termino":"Cadena de producción","def":"Sistema en que el producto pasa frente a obreros que repiten una operación simple; con más equipo por obrero eleva la productividad. Ford fue su exponente más famoso, «aunque en modo alguno su creador»: desde 1914 aplicó al Modelo T la «gestión científica» de Taylor y pagó 5 dólares diarios."},{"termino":"Ventas a plazos","def":"Compras en cuotas pagadas con ingresos futuros. Llevaron la demanda hacia bienes caros (60 % de los autos, 75 % de los muebles), pero ocultaron la debilidad del mercado; con la crisis, los bienes recuperados por impago lo saturaron más."},{"termino":"Paridad (parity)","def":"Reclamo de los agricultores: que el gobierno federal sostuviera los precios agrícolas para devolverles el poder adquisitivo de 1910-1914. Fue vetada dos veces en los años veinte y la AAA tampoco la alcanzó."},{"termino":"Compra de acciones a crédito","def":"Mecanismo de 1928-1929: el inversor pagaba al contado una parte y el agente adelantaba el resto con las acciones como garantía. Al caer las cotizaciones obligó a vender para pagar y agravó el pánico."},{"termino":"Sobreinversión (frente al «subconsumo»)","def":"Explicación que Baines prefiere al subconsumo: las empresas invirtieron en una capacidad productiva que ningún aumento del consumo podía justificar; al advertirlo recortaron la inversión y arrastraron a la economía."},{"termino":"Hoovervilles y Bonus Army","def":"Símbolos del desprestigio de Hoover en la depresión: «Hoovervilles» llamaban a los barrios de chabolas. El Bonus Army eran veteranos desocupados que en 1932 reclamaron en Washington el pago adelantado de sus bonos; Hoover los hizo desalojar por el ejército."},{"termino":"Feriado (vacaciones) bancario","def":"Cierre temporal de los bancos para frenar las corridas. Michigan lo aplicó en febrero de 1933; Roosevelt lo decretó en todo el país al asumir (cuatro días, extendidos a una semana) y la confianza volvió tras su charla radial."},{"termino":"Primer New Deal y los «cien días»","def":"Etapa 1933-1935, centrada en la asistencia y la recuperación. En los «cien días» (desde marzo de 1933) el Congreso creó, entre otros, la AAA, la NRA, la TVA, el CCC, la FERA y la PWA, más el seguro de depósitos; en noviembre de 1933 se sumó la CWA."},{"termino":"AAA (Agricultural Adjustment Administration)","def":"Organismo del primer New Deal que pagaba primas a los agricultores que reducían voluntariamente sus cultivos, para subir los precios; se financiaba con un impuesto a la primera elaboración. No logró reducir la producción y la Corte anuló ese impuesto en 1936."},{"termino":"NIRA / NRA (National Recovery Administration)","def":"Ley y organismo del primer New Deal para la industria: códigos de precios, salarios y competencia aprobados por el presidente (símbolo: el Águila Azul) para eliminar la competencia «antieconómica» y subir precios. Las grandes empresas dictaron los códigos; la Corte anuló la NIRA en el caso Schechter (1935)."},{"termino":"TVA (Tennessee Valley Authority)","def":"Organismo federal de los «cien días» para el desarrollo integral del valle del Tennessee: electricidad, fertilizantes, control del río, fin de la malaria. Para Baines, el más exitoso del New Deal, aunque nunca se autofinanció."},{"termino":"CCC, FERA, PWA, CWA y WPA","def":"Programas de asistencia y empleo. De los «cien días»: CCC (campamentos de trabajo para desocupados de 18 a 25 años), FERA (fondos federales a estados y municipios) y PWA (obras públicas, lenta). Después: CWA (noviembre de 1933, 4 millones de empleos) y la WPA, que la reemplazó y absorbió a la FERA."},{"termino":"Segundo New Deal y seguridad social","def":"Etapa 1935-1941, tras el caso Schechter: Roosevelt giró a la izquierda y priorizó la reforma. Anunció la seguridad social (Baines la menciona sin desarrollarla), una ley de vivienda y agencias regionales al estilo TVA; impulsó juicios antimonopolio e impuestos más progresivos."},{"termino":"Ley Wagner (National Labor Relations Act)","def":"Ley del segundo New Deal que reemplazó a la NIRA anulada: reguló las relaciones entre empresarios y sindicatos, reforzó a estos y creó la National Labour Relations Board para terminar con las prácticas antisindicales."}],"cronologia":[{"fecha":"1914","hecho":"Ford aplica la cadena de producción al Modelo T y fija un salario de 5 dólares diarios."},{"fecha":"1920-1921","hecho":"Breve recesión de posguerra: precios y salarios bajan rápido y al año se reanuda la expansión. Terminan los precios agrícolas de guerra."},{"fecha":"1922","hecho":"Arancel Fordney-McCumber (derechos medios del 33 %)."},{"fecha":"1925","hecho":"Pico del auge especulativo de tierras en Florida; empieza a caer la construcción de viviendas."},{"fecha":"1927","hecho":"Dinero barato de la Reserva Federal para ayudar a la libra; Ford cierra sus plantas y lanza el Modelo A."},{"fecha":"Marzo de 1928","hecho":"Comienza la gran suba de la Bolsa: en 20 meses el índice casi se duplica."},{"fecha":"Octubre de 1929","hecho":"Quiebra de la Bolsa de Nueva York: pánico el 24 y nueva ola el 28-29."},{"fecha":"1930","hecho":"Arancel Hawley-Smoot (+50 %); primera oleada de quiebras bancarias (invierno 1930-1931)."},{"fecha":"1931","hecho":"Ya hay 8 millones de parados. Quiebra del Kredit Anstalt y crisis financiera internacional; en septiembre Gran Bretaña abandona el patrón oro."},{"fecha":"1932","hecho":"Hoover crea la Reconstruction Finance Corporation; la Bolsa toca fondo (−83 %); desalojo del «Bonus Army»; Roosevelt gana la elección."},{"fecha":"1933","hecho":"Pánico bancario final (febrero). El 4 de marzo asume Roosevelt, decreta el feriado bancario y empiezan los «cien días»; en noviembre se crea la CWA."},{"fecha":"Mayo de 1935","hecho":"Caso Schechter: la Corte Suprema anula la NIRA; Roosevelt gira a la izquierda (segundo New Deal)."},{"fecha":"1936","hecho":"Roosevelt reelecto (46 de 48 estados); la Corte anula el impuesto de la AAA; Ley Wagner (año según Baines). Roosevelt corta el déficit y la Reserva Federal duplica los encajes."},{"fecha":"1937","hecho":"Nueva recesión; fracasa el plan para ampliar la Corte Suprema; afiliación sindical +60 %."},{"fecha":"1940-1941","hecho":"Rearme: en 1940 se recuperan la producción y la renta per cápita de 1929; Pearl Harbor (7 de diciembre de 1941)."}],"guia":[{"tema":"P3","pregunta":"¿Cuáles fueron las características de la economía de Estados Unidos en la década de 1920? ¿Por qué el sector agrícola quedó al margen de la prosperidad?","puntos":["Idea general: primera **sociedad de consumo de masas**, con crecimiento casi ininterrumpido basado en la **productividad** y en dos innovaciones: **automóvil** y **electricidad**.","Productividad: **cadena de producción** (Ford, desde 1914, fue su exponente más famoso, no su creador; aplicó la gestión científica de Taylor y pagó 5 dólares diarios). Más equipo por obrero y tareas simples → se produce más, se gana más y bajan los precios → suben los ingresos reales (+70 % de producción manufacturera con la misma mano de obra).","Auto y electricidad dominan por cuatro razones: eran nuevos (aunque Baines aclara que no eran una novedad estricta: lo nuevo fue su difusión masiva); arrastraban industrias auxiliares (acero, caucho, vidrio, carreteras) que generaban inversión; abrían nuevas formas de gastar; hacían aceptable una sociedad dominada por la economía. Son complementarios: auto → suburbio → electricidad y electrodomésticos.","Consumo de **bienes durables** sostenido por publicidad (radio, diarios; diferenciación de productos), cadenas de tiendas y **ventas a plazos** (60 % de los autos, 75 % de los muebles), con tanta morosidad que hace sospechar que muchos no podían pagar.","**Construcción**: viviendas (hasta 1925, con ciclos propios de 15-20 años), edificios comerciales y rascacielos; suburbios y grandes ciudades; especulación de tierras en Florida (1925).","Estado: el **gobierno federal** practicó el **laissez-faire** (gasto mínimo y superávit), aunque estados y municipios gastaron mucho en carreteras; el arancel Fordney-McCumber (1922) en realidad no protegía nada; **crédito barato** que facilitó emisiones y especulación, pero con un papel marginal.","**Agricultura**, la gran perdedora: **sobreproducción** (ante la baja de precios se produce más; demanda de alimentos básicos estancada), herencia de la guerra (tierras marginales y deudas), mecanización, exportaciones a dos tercios de las de guerra, fibras artificiales; precios agrícolas en baja frente a los industriales y tierra que pierde valor; se salvan frutas, hortalizas y lácteos. La **paridad** fue vetada dos veces. También quedaron al margen el textil de Nueva Inglaterra y el carbón de los Apalaches."],"ojo":"Tus apuntes dicen «transporte»: en Baines eso es el **automóvil** (y el camión y las carreteras); los **ferrocarriles pierden** pasajeros. «Sobreoferta» está bien: Baines habla de sobreproducción agrícola. No digas que el **gobierno federal** impulsó la prosperidad (los que gastaron fueron los estados y municipios, en carreteras) ni que el arancel la protegió (Baines dice lo contrario), ni que se basó en el crédito barato: para él la base fue la productividad real."},{"tema":"P4","pregunta":"Explique la crisis de la Bolsa de 1929 y la Gran Depresión según Baines: causas, mecanismos y consecuencias.","puntos":["Especulación: desde marzo de 1928 el índice casi se duplica en 20 meses; las **cotizaciones dejaron de reflejar la economía**. Los inversores eran pocos (lo de los lustrabotas es un mito), pero todos especulaban.","Combinación de factores: fondos de los **altos beneficios** de las grandes empresas (productividad, fusiones, sindicatos débiles, impuestos favorables) que convenía prestar a especuladores; venta agresiva de títulos y **sociedades de cartera**; **compra a crédito** (se pagaba una parte y el agente adelantaba el resto, con préstamos al 12 %); dinero barato de 1927. Nadie podía frenar el crédito.","El crac: **octubre de 1929** (pánico el 24, nueva ola el 28-29) por incertidumbre (teletipo atrasado) y ventas forzadas de quienes compraron a crédito; a fin de mes las cotizaciones habían caído un 40 %, y hasta 1932 caerían un 83 %. El detonante pudo ser cualquier hecho menor.","La recesión de 1929 no tuvo las causas clásicas (no subían costos ni precios): normalmente el crac sería un efecto. Causas reales: crisis de la **construcción** (desde 1925), recorte de obras estatales y municipales, carbón y algodón, **agricultura**, contracción del comercio mundial y, sobre todo, **sobreinversión** (no «subconsumo»).","Por qué fue tan profunda: capacidad ociosa y viviendas vacías (no hacía falta invertir); caída de beneficios y de la **confianza** empresaria, agravada por el crac (acciones de 87.000 a 19.000 millones de dólares: menos beneficios, menos incentivo al ahorro, fin del mercado de lujo); ingresos agrícolas −70 % con deudas impagables; y el **sistema bancario**, factor individual más importante: oleadas de quiebras 1930-1933.","**Transmisión al mundo**: EE.UU. prestaba para que otros le compraran (Alemania dependía por completo de esos préstamos); con la suba de la Bolsa y la depresión retiró préstamos y repatrió dos tercios de sus inversiones. En 1931 quebró el Kredit Anstalt, se hundió Alemania (6 millones de parados) y Gran Bretaña dejó el oro; la autarquía (Hawley-Smoot, 1930) prolongó la crisis y el dólar alto y fijo impidió una política monetaria expansiva.","Políticas que agravaron: la **Reserva Federal** endureció el crédito ante la crisis mundial (innecesario); Hoover veía la depresión como una «purga» (RFC y Federal Farm Board insuficientes); nadie usaba el déficit fiscal. Para Baines, el derrumbe bancario probablemente pudo evitarse.","Datos y consecuencias sociales: PNB real −27 % y producción industrial −50 % en 1932; el paro pasó de 1,5 a 13 millones (un cuarto de la fuerza laboral); ya en 1931 había 8 millones de parados, sin seguro de desempleo y con asistencia solo local (en 1932 las grandes ciudades quebraron); salarios nominales −60 %; Hoovervilles y Bonus Army. Recién en 1940 se recupera la producción de 1929."],"ojo":"No digas que el crac **causó por sí solo** la depresión (tuvo causas reales y bancarias), pero tampoco que fue irrelevante: la **agravó** (confianza, beneficios, incentivo al ahorro, sector financiero). No le atribuyas el «subconsumo» (lo rechaza: habla de **sobreinversión**) ni la tesis de Friedman de que todo se debió a la caída del dinero (le parece discutible). Tampoco digas que vino del comercio exterior: era menos del 10 % del PNB, y fue al revés, la crisis estadounidense arrastró al mundo. Los lustrabotas accionistas son un mito, y es falso el rumor de financistas que se tiraban de los rascacielos durante el pánico; en la depresión, en cambio, los suicidios de hombres sí subieron un 20 %."},{"tema":"P5","pregunta":"¿En qué consistieron el primer y el segundo New Deal de Roosevelt? ¿Qué programas incluyó cada uno y cómo los evalúa Baines?","puntos":["Contexto: Roosevelt, elegido en 1932, no tenía un programa coherente: prometía **acción** e «intentar algo». Asume el **4 de marzo de 1933** con el sistema bancario quebrado.","**Los tres objetivos del New Deal** según Baines: **asistencia** urgente (parados y agricultores arruinados), **recuperación** de la economía y **reforma** del orden económico para que no se repitiera 1929-1933. El primer New Deal se concentró en asistir y recuperar; la reforma pasó a primer plano con el tiempo, en el segundo.","**Feriado bancario**: apenas asume decreta vacaciones bancarias (cuatro días, extendidos a una semana) y convoca al Congreso; en su primera **charla junto al fuego** asegura que los bancos son seguros y la gente vuelve a depositar: era una **crisis de confianza**. Después, reforma financiera: **FDIC** (garantía de depósitos), RFC ampliada (la había creado Hoover), Federal Farm Mortgage Corporation y Home Owners Loan Corporation (hipotecas), **SEC** (control de la Bolsa).","**PRIMER NEW DEAL (1933-1935)**. Los «**cien días**» (desde marzo de 1933): **AAA** (primas a los agricultores que reducían cultivos, para subir los precios); **NRA/NIRA** (códigos de precios y salarios por industria, Águila Azul, para frenar la competencia y subir precios); **TVA** (desarrollo del valle del Tennessee: electricidad, fertilizantes, control del río; el más exitoso); **CCC** (campamentos de trabajo para desocupados de 18 a 25 años); **FERA** (fondos federales de ayuda a estados y municipios); **PWA** (obras públicas, lenta). Después, todavía en el primer New Deal según Baines: **CWA** (noviembre de 1933, 4 millones de empleos en el invierno).","Herramienta de la recuperación: **subir los precios** (NRA, AAA, devaluación del dólar y compras de oro y plata). Resultados según Baines: la NRA subió precios pero no la producción; la AAA no redujo la producción y los precios subieron más por la sequía; la devaluación no movió los precios.","Fin del primero: los empresarios se van en 1935; **caso Schechter** (mayo de 1935): la Corte Suprema anula la NIRA (y en 1936 el impuesto de la AAA). Roosevelt **gira a la izquierda**.","**SEGUNDO NEW DEAL (1935-1941)**, centrado en la **reforma**: **Ley Wagner** (National Labor Relations Act) y **National Labour Relations Board** (libertad sindical); **seguridad social**; anuncio de una ley de vivienda y de agencias regionales al estilo TVA; juicios **antimonopolio** (se abandona la NRA); impuestos más **progresivos** e impuesto a la riqueza. Empresarios vistos como enemigos; auge del CIO; choque con la Corte (1937); error de 1936-1937 (recorte del déficit → recesión).","Evaluación de Baines: **no fue un éxito total** (según Baines, el PNB siguió debajo de 1929 hasta la guerra; la renta per cápita recién lo recuperó en 1940, con el **rearme**; 9-10 millones de parados cada invierno; la inversión privada no se recuperó), pero tampoco un fracaso: sin él habría sido peor, la recuperación no era su único objetivo y devolvió la confianza. No logró la recuperación plena porque el **gasto y el déficit fueron chicos** (Roosevelt no era keynesiano) y sus objetivos se contradecían. Legado: **salvó al capitalismo**, agrandó el poder federal y presidencial y «revolucionó las expectativas»."],"ojo":"«Hay como cuatro planes»: Baines no habla de «cuatro planes»; menciona muchos organismos con siglas. Para cumplir, nombrá al menos **AAA, NRA (NIRA), TVA y CCC** (y si podés FERA, PWA y CWA) para el primero, y **Ley Wagner y seguridad social** para el segundo, con una línea de qué hacía cada uno. Trampa típica: **AAA, NRA y TVA son del primero**; **Ley Wagner, seguridad social, antimonopolio e impuestos progresivos, del segundo**. La CWA no es de los «cien días» (es de noviembre de 1933). Si nombrás la **WPA**, decí que **reemplazó a la CWA** (en la cronología estándar es de 1935) y no la ubiques en el primer New Deal. La RFC la creó **Hoover** (1932); Roosevelt solo la amplió. «Subir los precios» no era el objetivo del New Deal sino la herramienta de la recuperación: los objetivos eran **asistencia, recuperación y reforma**. Baines fecha la Ley Wagner en 1936: si dudás del año, ubicala «tras la anulación de la NIRA». «No había dinero para consumir»: Baines no lo dice así; planteá que el New Deal **no inyectó suficiente poder adquisitivo** (déficits chicos, gasto pagado con impuestos)."}],"mc":[{"id":"bai-n1","tema":"P3","nivel":"normal","enunciado":"Según Baines, ¿cuál fue el rasgo más característico de la prosperidad estadounidense de la década de 1920?","opciones":["La producción masiva de autos y la difusión de la energía eléctrica, dos innovaciones que mantuvieron alta la inversión.","El crecimiento sostenido de las exportaciones agrícolas a Europa, que financió la modernización de la industria pesada.","El aumento del gasto federal en obras públicas, que compensó la debilidad de la inversión privada.","La protección arancelaria de 1922, que resguardó a la industria nacional de la competencia de la mano de obra extranjera barata."],"correcta":0,"explicacion":"Baines señala al automóvil y a la electricidad como los dos rasgos distintivos del auge: arrastraban industrias auxiliares, abrían nuevas formas de gastar y por eso sostuvieron un alto nivel de inversión y de expansión. La prosperidad descansó en la productividad industrial y en estos dos sectores, no en el Estado ni en el comercio exterior.","por_que_no":["","Confunde: la agricultura fue la gran perdedora de la década y sus exportaciones nunca superaron dos tercios de las de la guerra.","Es la imagen del New Deal, no de los años veinte: el gobierno federal gastaba muy poco, tenía superávit y no intentó estimular el empleo ni la inversión.","Es el argumento que Baines refuta: el arancel no protegía nada porque casi ninguna importación podía competir; solo mostraba que el gobierno estaba con los empresarios."],"pag":"p. 265"},{"id":"bai-n2","tema":"P3","nivel":"normal","enunciado":"Según Baines, ¿cuál era el problema básico de los agricultores estadounidenses en la década de 1920?","opciones":["La escasez de mano de obra rural, provocada por la migración a las ciudades, que encarecía las cosechas.","La «paridad» impuesta por el gobierno, que congeló los precios agrícolas en los niveles de 1910-1914.","Ante la baja de los precios tendían a producir más, mientras la demanda de alimentos básicos crecía muy poco.","La mecanización redujo la superficie cultivada y con ella el volumen que podían vender en el mercado."],"correcta":2,"explicacion":"Baines explica que en el agro era más fácil aumentar la producción que restringirla: había muchísimos productores sin poder sobre el precio y cada uno respondía a la caída de precios produciendo más. Pero el consumo de trigo y maíz crecía lentamente (al enriquecerse, la gente comía menos pan), así que la mayor oferta no se vendía y los precios seguían bajando.","por_que_no":["Baines no habla de escasez de brazos: el problema era el exceso de producción y la caída de los precios, no los costos laborales.","Trampa de palabras: la paridad fue un reclamo de los agricultores para que el gobierno sostuviera sus precios, y el presidente la vetó dos veces.","","Al revés: los tractores liberaron tierras antes dedicadas a forraje y aumentó la superficie para el mercado, lo que agravó la sobreproducción."],"pag":"pp. 275-277"},{"id":"bai-n3","tema":"P3","nivel":"normal","enunciado":"¿Qué papel atribuye Baines a las ventas a plazos en la economía de los años veinte?","opciones":["Reemplazaron a la publicidad como el principal medio para diferenciar productos parecidos entre sí.","Orientaron la demanda hacia bienes caros, como autos y muebles, aunque quizá muchos no podían pagarlos.","Fueron impulsadas por el gobierno federal para sostener el consumo de las familias durante la recesión de 1920-1921.","Se usaron sobre todo para alimentos y artículos baratos, porque los bienes durables se seguían pagando al contado."],"correcta":1,"explicacion":"Para Baines las ventas a plazos fueron decisivas porque permitieron que la demanda se dirigiera a productos de alto valor: a fines de la década cubrían cerca del 60 % de las ventas de autos y el 75 % de las de muebles. Pero la gran cantidad de morosos sugiere que muchos compradores no estaban en condiciones de afrontar esas compras.","por_que_no":["Diferenciar productos parecidos era la función de la publicidad, no del crédito al consumo.","","El gobierno federal no intervino en el consumo: las ventas a plazos fueron una práctica de las empresas, como las fábricas de autos.","Al revés: el crédito se concentró en los bienes durables y caros (60 % de los autos, 75 % de los muebles)."],"pag":"p. 267"},{"id":"bai-n4","tema":"P4","nivel":"normal","enunciado":"Según Baines, ¿por qué se derrumbó la Bolsa de Nueva York en 1929?","opciones":["Porque la Reserva Federal restringió con energía el crédito en 1928 para frenar la especulación.","Porque el precio de las acciones se había despegado de lo que realmente producían y ganaban las empresas.","Porque una masa de pequeños ahorristas, como los célebres lustrabotas, retiró al mismo tiempo su dinero.","Porque la suba de los salarios industriales recortó los beneficios de las empresas que cotizaban."],"correcta":1,"explicacion":"Baines sostiene que la Bolsa cayó porque las cotizaciones ya no reflejaban la marcha de la economía: acciones que valían unas diez veces sus beneficios pasaron a valer dieciséis veces a comienzos de 1929. Cuando la suba perdió toda relación con la industria, la caída era solo cuestión de tiempo, y el detonante pudo ser cualquier hecho menor.","por_que_no":["Al revés: en 1928 la Reserva Federal dudó en restringir el crédito, y Baines cree que la política monetaria sola no habría frenado la suba.","","Mito que Baines desmiente: los inversores eran muy pocos y lo de los lustrabotas con acciones es «pura fantasía».","Al revés: la creciente productividad se usó para subir los beneficios a costa de los salarios; los sindicatos eran muy débiles."],"pag":"pp. 286-289"},{"id":"bai-n5","tema":"P4","nivel":"normal","enunciado":"¿Qué factor considera Baines como el que, por sí solo, más influyó en la profundidad de la depresión?","opciones":["El derrumbe de las exportaciones, ya que el comercio exterior era la principal fuente de ingresos del país.","La caída de los salarios nominales, que en 1932 estaban un 60 % por debajo de los de 1929 y deprimieron el consumo.","El arancel Hawley-Smoot, que desató la guerra comercial y cerró los mercados externos a la industria.","La fragilidad de la banca, formada por pequeños bancos locales muy expuestos a los retiros."],"correcta":3,"explicacion":"Baines afirma que el funcionamiento del sistema bancario fue el factor individual de mayor peso en la profundidad de la depresión. Fuera de California casi no había sucursales: cada banco dependía de unas pocas industrias locales y era muy vulnerable a las corridas, de modo que las oleadas de quiebras de 1930-1933 destruyeron ahorros y cortaron el crédito.","por_que_no":["Para Baines el comercio exterior era menos del 10 % del PNB y la depresión fue un problema esencialmente interno.","El dato del 60 % está en el texto, pero Baines no lo presenta como el factor que más profundizó la crisis.","Baines lo ve como la señal del comienzo de la guerra económica, pero no como el factor decisivo: la depresión era un problema interno.",""],"pag":"p. 298"},{"id":"bai-n6","tema":"P4","nivel":"normal","enunciado":"Según Baines, ¿qué alimentó el pánico en la Bolsa de Nueva York en octubre de 1929?","opciones":["La negativa del banco J. P. Morgan a comprar títulos, que confirmó que los grandes financistas se retiraban.","La incertidumbre: el teletipo iba horas atrasado y, sin saber el precio real, muchos vendían para cortar pérdidas.","El cierre de la Bolsa de Chicago, que obligó a los inversores del interior a liquidar sus acciones en Nueva York.","Una seguidilla de suicidios de financistas famosos, cuya noticia provocó ventas masivas en todo el país."],"correcta":1,"explicacion":"Baines dice que el principal motivo del pánico fue la inseguridad: el teletipo llevaba dos horas de retraso, no se podía hablar por teléfono con la Bolsa y las pocas cotizaciones anunciadas eran mucho más bajas. Sin conocer el valor real de sus acciones, los inversores ordenaban vender; además, quienes habían comprado a crédito tuvieron que vender para pagar.","por_que_no":["Al revés: un agente de J. P. Morgan, vicepresidente de la Bolsa, compró títulos por 240 millones de dólares y los grandes bancos actuaron juntos para cortar el pánico.","","Era un rumor: Baines aclara que la Bolsa de Chicago no había cerrado.","Otro rumor de esos días: Baines afirma que era falso que destacados financieros se hubieran arrojado desde los rascacielos."],"pag":"pp. 287-288"},{"id":"bai-n7","tema":"P5","nivel":"normal","enunciado":"Según Baines, ¿qué hizo Roosevelt inmediatamente después de asumir la presidencia, en marzo de 1933?","opciones":["Devaluó el dólar para que los precios internos subieran de manera automática.","Creó la Reconstruction Finance Corporation para prestarles dinero a los bancos.","Dispuso un feriado bancario y llamó al Congreso a sesiones extraordinarias.","Lanzó la seguridad social y una ley de vivienda para los sectores más pobres."],"correcta":2,"explicacion":"Lo primero fue enfrentar la quiebra casi total del sistema bancario: el día de la asunción era casi imposible cobrar un cheque. Roosevelt decretó «vacaciones bancarias» (cuatro días, que se extendieron a una semana) y llamó al Congreso a sesiones extraordinarias, con lo que empezaron los «cien días».","por_que_no":["La devaluación vino después (a mediados de 1933, en torno a la conferencia de Londres) y, según Baines, no logró subir los precios.","Trampa de atribución: la RFC la creó Hoover en 1932; Roosevelt solo amplió sus funciones.","","La seguridad social y la ley de vivienda pertenecen al segundo New Deal (desde 1935)."],"pag":"pp. 305-306"},{"id":"bai-n8","tema":"P5","nivel":"normal","enunciado":"¿Cómo buscaba la AAA (Agricultural Adjustment Administration) mejorar los ingresos de los agricultores, según Baines?","opciones":["Pagando primas a quienes reducían voluntariamente sus cultivos, para que subieran los precios.","Refinanciando las hipotecas que pesaban sobre las explotaciones agrícolas más endeudadas.","Comprando los excedentes de las cosechas a precio de mercado para exportarlos a Europa.","Fijando por código precios mínimos para cada producto agrícola, como hacía la NRA con la industria."],"correcta":0,"explicacion":"Baines explica que la única forma de subir los precios agrícolas era disminuir la producción. La AAA ofrecía primas a los agricultores que voluntariamente restringían sus cultivos, financiadas con un impuesto sobre la primera elaboración del producto (por ejemplo, la molienda).","por_que_no":["","Eso lo hacía otro organismo, la Federal Farm Mortgage Corporation, que refinanció alrededor de una de cada cinco hipotecas rurales.","La AAA no compraba para exportar: buscaba achicar la oferta, y Baines señala que exportar más era imposible por el colapso del comercio mundial.","Confunde la AAA con la NRA: los códigos de precios eran el instrumento para la industria, no para el agro."],"pag":"p. 311"},{"id":"bai-n9","tema":"P5","nivel":"normal","enunciado":"Según Baines, ¿cuál era la función de la NRA (National Recovery Administration)?","opciones":["Financiar grandes obras públicas, como puentes, túneles y carreteras, para dar empleo a los desocupados.","Asegurar los depósitos bancarios en todo el país para que los ahorristas recuperaran la confianza en los bancos.","Organizar campamentos de trabajo donde jóvenes desocupados hacían tareas de conservación de la naturaleza.","Promover códigos de precios y salarios por industria para frenar la competencia y subir precios."],"correcta":3,"explicacion":"La NRA era el instrumento del primer New Deal para la industria: invitaba a cada rama a presentar un «código» de precios y salarios «justos», aprobado por el presidente, con el fin de eliminar la competencia «antieconómica», elevar los precios y, con ellos, la inversión. Las empresas adheridas exhibían el «Águila Azul».","por_que_no":["Eso describe a la PWA (Public Works Administration), que hizo, por ejemplo, el puente de Triborough y el túnel Lincoln.","Eso lo hacía la Federal Deposit Insurance Corporation (FDIC).","Eso describe al Civilian Conservation Corps (CCC).",""],"pag":"pp. 305, 311"},{"id":"bai-n10","tema":"P5","nivel":"normal","enunciado":"¿Cuál de los siguientes organismos fue creado durante los «cien días» del primer New Deal, según Baines?","opciones":["La Reconstruction Finance Corporation, para prestar dinero a los bancos en problemas.","La Tennessee Valley Authority, para el desarrollo integral del valle del Tennessee.","La National Labour Relations Board, para arbitrar conflictos entre empresas y sindicatos.","La Federal Farm Board, para estabilizar los precios del trigo y del algodón."],"correcta":1,"explicacion":"Entre las leyes de los «cien días» Baines menciona la creación de un organismo federal para rescatar el valle del Tennessee, la TVA, que llegó a ser el organismo más exitoso del New Deal: produjo electricidad y fertilizantes, controló el río, terminó con la malaria y modernizó la agricultura de la región.","por_que_no":["La creó Hoover en 1932; Roosevelt solo amplió sus atribuciones.","",
