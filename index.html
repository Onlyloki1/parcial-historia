"Pertenece al segundo New Deal: se creó con la Ley Wagner, después de la anulación de la NIRA.","También es de la época de Hoover y, según Baines, resultó inadecuada."],"pag":"pp. 305, 309"},{"id":"bai-f1","tema":"P3","nivel":"dificil","enunciado":"Baines relaciona el aumento de los ingresos reales de los años veinte con la productividad. ¿Qué mecanismo describe?","opciones":["Con más equipo por obrero y tareas simples y repetidas se producía más, se pagaba mejor y bajaban los precios al consumidor.","La llegada de inmigrantes abarató los salarios y eso permitió a las empresas reducir sus precios de venta.","La inversión, mucho mayor que antes de la guerra, se destinó sobre todo a abrir fábricas nuevas más que a mejorar los procesos.","Los aranceles alejaron la competencia externa y así permitieron a la industria sostener a la vez precios altos y buenos salarios."],"correcta":0,"explicacion":"Según Baines, buena parte de la inversión se dedicó a mejorar los procesos: con la cadena de producción cada obrero disponía de más equipo y repetía operaciones sencillas, lo que elevó la producción por persona. Así los trabajadores producían y ganaban más y los precios bajaban, lo que aumentó los ingresos reales.","por_que_no":["","Baines no explica la prosperidad por salarios bajos: habla de mano de obra relativamente escasa y de obreros que ganaban más (Ford pagaba 5 dólares diarios).","Al revés en las dos partes: Baines dice que la inversión fue relativamente menor que antes de la guerra y que se usó sobre todo para mejorar los procesos de producción.","Baines niega que el arancel protegiera algo: casi ninguna importación podía competir con la industria estadounidense."],"pag":"p. 264"},{"id":"bai-f2","tema":"P3","nivel":"dificil","enunciado":"Baines da cuatro razones del dominio del automóvil y la electricidad sobre la economía de los años veinte. ¿Cuál de las siguientes NO es una de ellas?","opciones":["Daban lugar a numerosas industrias auxiliares que, a su vez, generaban inversión y expansión.","Abrían a los consumidores oportunidades nuevas de gastar su dinero en bienes y servicios.","Atraían capitales europeos que suplían la escasez de ahorro dentro del país.","Volvían más aceptable para el público una sociedad dominada por la economía."],"correcta":2,"explicacion":"Las cuatro razones de Baines son: eran innovaciones nuevas (aunque aclara que, en sentido estricto, no eran una novedad: lo nuevo fue su difusión masiva), generaban industrias auxiliares que creaban inversión, ofrecían al consumidor nuevas formas de gastar y cambiaron la actitud del público hacia una sociedad dominada por la economía. La atracción de capitales europeos no figura; al contrario, en los años veinte el ahorro interno era alto y Estados Unidos prestaba al exterior.","por_que_no":["Es una de las razones: la producción de autos arrastraba al acero, el caucho, el vidrio y la construcción de carreteras.","Es una de las razones: el auto y la electricidad barata daban al consumidor nuevas formas de gastar.","","Es una de las razones: su desarrollo hizo más aceptable para muchos la idea de una sociedad dominada por la economía."],"pag":"p. 265"},{"id":"bai-f3","tema":"P3","nivel":"dificil","enunciado":"¿Qué sostiene Baines sobre el arancel Fordney-McCumber de 1922?","opciones":["Que fue indispensable para la prosperidad de la década, porque defendió el nivel de vida estadounidense frente a la mano de obra extranjera barata.","Que permitió que la industria química, que había tomado patentes alemanas, se desarrollara al amparo de esa protección.","Que no podía proteger nada, pues casi ninguna importación competía; solo mostraba que el gobierno estaba con los empresarios.","Que fue reemplazado en 1930 por el Hawley-Smoot, más moderado, como respuesta tardía a la quiebra de Wall Street."],"correcta":2,"explicacion":"Baines rechaza que el arancel de 1922 fuera condición de la prosperidad: salvo los tejidos de algodón, ningún producto importado podía venderse en masa en EE.UU., el productor más barato de autos, electricidad y bienes domésticos, y los servicios y las viviendas no se importan. Por eso el arancel no pudo «proteger» a la economía; solo mostró que el gobierno apoyaba a los empresarios.","por_que_no":["Es la tesis que Baines cita para refutarla: dice que esa afirmación carece de todo fundamento.","Mezcla dos cosas: la presión de la industria química explica el arancel de emergencia de 1921, y Baines agrega que a fines de la década esa industria ya podía valerse por sí misma.","","El Hawley-Smoot subió los derechos un 50 %, se aprobó antes de la quiebra de Wall Street y era una extensión previsible del arancel de 1922."],"pag":"pp. 272, 297"},{"id":"bai-f4","tema":"P4","nivel":"dificil","enunciado":"Según Baines, ¿cómo se financiaba la compra de acciones en 1928-1929 y qué podía lograr la política monetaria frente a esa especulación?","opciones":["La Reserva Federal prestaba directamente a los especuladores a tasas bajas, así que solo un cambio en su conducción podía cortar ese crédito.","Se pagaba al contado una parte y el agente adelantaba el resto con crédito bancario; si la Reserva Federal subía las tasas a tiempo, se cortaba.","Los bancos europeos financiaban la mayor parte de las compras para atraer capitales a sus plazas, y ese crédito escapaba al control de Washington.","Se pagaba al contado una parte y el agente adelantaba el resto; como pagaba intereses muy altos, conseguía fondos de empresas y extranjeros sin pasar por los bancos."],"correcta":3,"explicacion":"Baines describe la compra a crédito: el comprador ponía al contado una parte y el agente le adelantaba el resto con los títulos como garantía. Como el agente podía pagar un 12 % (y más tarde un 20 %) por el dinero sobrante de grandes compañías, bancos y especuladores extranjeros, no dependía de los bancos; por eso el autor duda de que la política monetaria, por sí sola, hubiera podido frenar el alza (p. 289).","por_que_no":["No es lo que describe Baines: la Reserva Federal no prestaba a los especuladores; eran los agentes los que adelantaban el dinero a los compradores (pp. 287-289).","Mitad bien, mitad mal: la compra a crédito es correcta, pero Baines dice que los agentes no dependían de los bancos y que es dudoso que la política monetaria, sola, hubiera frenado el alza (p. 289).","No es lo que dice el texto: el crédito lo daban los agentes, que se fondeaban con empresas, bancos y especuladores extranjeros ofreciéndoles intereses altos; no eran bancos europeos financiando las compras.",""],"pag":"pp. 287-289"},{"id":"bai-f5","tema":"P4","nivel":"dificil","enunciado":"Según Baines, ¿de dónde provenía la mayor parte de los fondos usados para especular en la Bolsa?","opciones":["De los ahorros de millones de pequeños inversores de todo el país, que se habían volcado en masa a comprar acciones.","De las abultadas ganancias de las grandes empresas, que preferían prestarlas a especuladores.","De los créditos que los agricultores habían tomado durante la guerra con la garantía de sus tierras.","Del superávit del gobierno federal, que colocaba sus excedentes de caja en el mercado de valores neoyorquino."],"correcta":1,"explicacion":"Baines dice que el grueso del dinero especulativo salió de las abultadas ganancias de las grandes empresas, favorecidas por la productividad, las fusiones, la debilidad sindical y un sistema impositivo favorable. Con la Bolsa en alza les resultaba más ventajoso prestar efectivo a los especuladores que usarlo productivamente, a veces financiando la especulación con sus propias acciones.","por_que_no":["Mito desmentido por Baines: el número de inversores era muy pequeño.","","Trampa de palabras: los agricultores sí se endeudaron con garantía de sus tierras durante la guerra, pero para comprar más tierra y equipo, no para especular.","El gobierno federal tenía superávit en los años veinte, pero Baines no lo vincula con la especulación: el gobierno federal casi no intervenía en la economía."],"pag":"pp. 288-289"},{"id":"bai-f6","tema":"P4","nivel":"dificil","enunciado":"Baines observa que en 1929 faltaban casi todas las causas tradicionales de una depresión. ¿Qué agrega a esa observación?","opciones":["Que el derrumbe bursátil, en tiempos normales, se habría leído como consecuencia de la crisis antes que como su origen.","Que la crisis se explicó por la inflación de costos, como había ocurrido en las depresiones de 1870 y 1890.","Que, por eso, la quiebra de Wall Street debe verse como la causa principal de la recesión de 1929.","Que la depresión llegó desde afuera, con el retiro de los préstamos estadounidenses a Alemania y Europa central."],"correcta":0,"explicacion":"Baines señala que en 1929 no había presión sobre la capacidad productiva, ni suba de salarios o materias primas, ni crisis de crédito. Por eso afirma que, en circunstancias normales, el colapso bursátil se habría interpretado como efecto y no como causa; las causas evidentes estaban en la economía real: construcción, inversión pública, carbón y algodón, agricultura y comercio internacional.","por_que_no":["","Baines dice lo contrario: en los años veinte los precios no subían, a diferencia de lo que había precedido a las depresiones anteriores.","Al revés: justamente por eso Baines dice que el crac sería más un efecto que una causa; las causas evidentes estaban en la economía real.","Para Baines la depresión y su superación fueron problemas internos; el retiro de préstamos fue un efecto sobre Europa, no la causa en EE.UU."],"pag":"pp. 290, 296-297"},{"id":"bai-f7","tema":"P4","nivel":"dificil","enunciado":"¿Cómo evalúa Baines la actuación de la Reserva Federal (Federal Reserve Board) durante la depresión?","opciones":["Hizo todo lo que pudo, pero la escasez de oro le impidió bajar las tasas de interés y sostener a los bancos.","Causó la depresión al dejar caer un tercio la masa monetaria, como prueba la relación entre dinero y actividad.","Acertó al restringir el crédito, porque así depuró la economía de las empresas y los bancos menos eficientes.","La empeoró: frente a la crisis mundial cortó el crédito y dejó quebrar bancos sin que hiciera falta."],"correcta":3,"explicacion":"Según Baines, de la Reserva Federal se esperaba que ayudara a salir de la depresión, pero en el período crítico la agravó: tras bajar las tasas, ante la crisis mundial y la salida de oro cambió bruscamente de política y restringió el crédito, lo que multiplicó las quiebras. Como el país tenía cerca del 40 % del oro mundial, esas restricciones eran «totalmente innecesarias».","por_que_no":["Al revés: EE.UU. tenía alrededor del 40 % del oro monetario del mundo; no le faltaba oro.","Es la tesis de Milton Friedman, que Baines considera discutible: que dinero y actividad se muevan juntos no prueba cuál causó a cuál.","Es la idea de la «purga», propia de los economistas ortodoxos y de Hoover en esa época, no la evaluación de Baines.",""],"pag":"pp. 299-301"},{"id":"bai-f8","tema":"P5","nivel":"dificil","enunciado":"Según Baines, ¿por qué la crisis bancaria pudo resolverse en apenas una semana en marzo de 1933?","opciones":["Porque la Reserva Federal inyectó de inmediato grandes sumas de dinero en los bancos en problemas, que así pudieron devolver los depósitos.","Porque era una crisis de confianza: tras el feriado, Roosevelt aseguró por radio que los bancos eran seguros y los depósitos volvieron.","Porque el gobierno dejó quebrar a los bancos más débiles y después reflotó con fondos federales a los pequeños bancos rurales.","Porque el abandono inmediato del patrón oro permitió devaluar el dólar, subir los precios y aliviar así a los deudores."],"correcta":1,"explicacion":"Baines dice que la crisis bancaria era esencialmente una crisis de confianza y por eso se solucionó con facilidad: después de unas vacaciones bancarias de una semana, en su primera «charla junto al fuego» Roosevelt explicó a 60 millones de oyentes que los bancos reabrirían y que era seguro depositar, y así ocurrió. Incluso sugiere que pudo resolverse antes de su asunción.","por_que_no":["Baines no menciona ningún rescate de la Reserva Federal: destaca el factor confianza, y la reforma financiera (FDIC, RFC ampliada) vino después.","","Al revés: Baines aclara que los pequeños bancos que habían quebrado no fueron resucitados en 1933.","La devaluación fue posterior y, según Baines, no logró subir los precios."],"pag":"pp. 306-307"},{"id":"bai-f9","tema":"P5","nivel":"dificil","enunciado":"Baines sostiene que varios objetivos del New Deal eran «mutuamente excluyentes». ¿Qué ejemplo da?","opciones":["La TVA debía llevar electricidad barata a toda la región y, al mismo tiempo, cobrar tarifas altas para autofinanciarse.","La NRA ayudaba a las empresas a fijar precios para ganar más, pero también impulsaba a los sindicatos a conseguir aumentos salariales.","La CCC daba trabajo a jóvenes desocupados en los parques nacionales, pero recortaba el presupuesto destinado a conservarlos.","La Ley Wagner fortalecía a los sindicatos, pero al mismo tiempo prohibía las huelgas en las grandes industrias de producción en masa."],"correcta":1,"explicacion":"Para Baines el New Deal quería a la vez asistir, recuperar y reformar, y muchos objetivos chocaban. Un caso es la NRA: para Roosevelt, si el Estado colaboraba con las empresas en la fijación de precios, debía también estimular las subas salariales de los sindicatos; pero como lo que se buscaba era aumentar los beneficios, ambas cosas eran incompatibles. Otro ejemplo es subsidiar a agricultores para que siguieran en granjas que debían abandonar.","por_que_no":["Baines dice que la TVA nunca pudo autofinanciarse, pero no plantea ningún dilema de tarifas.","","Invención: la CCC hacía justamente tareas de conservación de la naturaleza y hasta se crearon nuevos parques.","Al revés: el arma principal de los sindicatos del CIO fue la huelga de brazos caídos."],"pag":"p. 321"},{"id":"bai-f10","tema":"P5","nivel":"dificil","enunciado":"Según Baines, ¿qué cambio de orientación marca el paso del primer al segundo New Deal?","opciones":["Roosevelt dejó de lado el gasto social y buscó la recuperación mediante una alianza con los grandes empresarios.","Roosevelt priorizó la estabilidad del dólar y la cooperación monetaria internacional por sobre la política interna.","Roosevelt reemplazó las primas voluntarias de la AAA por compras estatales obligatorias de las cosechas de cereales.","Roosevelt giró a la izquierda: abandonó la NRA, impulsó juicios antimonopolio y respaldó a los sindicatos."],"correcta":3,"explicacion":"Tras el caso Schechter (1935), que anuló la NIRA, y el abandono de los empresarios, Roosevelt respondió «inclinándose hacia la izquierda». En el segundo New Deal vio a los empresarios como enemigos del cambio social: abandonó la política de la NRA, reforzó los juicios contra los trusts, dio amplio apoyo federal a los sindicatos (Ley Wagner), anunció la seguridad social y volvió más progresivos los impuestos.","por_que_no":["Es al revés: la alianza con los empresarios caracterizó al primer New Deal (la NRA); en el segundo fueron vistos como enemigos.","Al revés: Roosevelt siempre antepuso la política interna; ya en 1933 se negó a estabilizar el dólar en la conferencia de Londres.","Invención: tras la anulación de la AAA se pasó a subsidiar la conservación del suelo, no a comprar cosechas.",""],"pag":"pp. 314-315"},{"id":"bai-m1","tema":"P3","nivel":"muy_dificil","enunciado":"Lea las siguientes afirmaciones sobre la economía estadounidense de los años veinte:\nI. El consumo masivo llegó más tarde a Europa sobre todo porque sus sociedades estaban más divididas en clases.\nII. Entre las automotrices dominantes (Ford, General Motors, Chrysler) se competía más en diseño y calidad que en precios.\nIII. El crédito barato y los demás factores monetarios fueron la base principal de la prosperidad.\nIV. La construcción de viviendas seguía ciclos propios de 15 a 20 años, porque la compra de una casa puede postergarse.\n¿Cuáles son correctas según Baines?","opciones":["Solo I y II","Solo II y IV","Solo III y IV","Solo I, II y IV"],"correcta":1,"explicacion":"II es correcta: como una guerra de precios entre esas empresas podía arruinarlas, competían en calidad y diseño. IV también: la vivienda tiene ciclos de 15-20 años que no siguen al ciclo económico porque su demanda puede aplazarse. I es falsa: para Baines el mercado europeo era menor porque esos países eran más pobres, no por razones sociológicas. III es falsa: los factores monetarios influyeron solo marginalmente; la base fue la productividad y el auto y la electricidad.","por_que_no":["Incluye I, que Baines refuta (el problema europeo era la pobreza, no la división de clases), y omite IV.","","Incluye III: para Baines los factores monetarios fueron marginales frente a los «reales».","Incluye I: es la explicación «sociológica» que Baines considera sin fundamento."],"pag":"pp. 265, 267, 270, 273"},{"id":"bai-m2","tema":"P3","nivel":"muy_dificil","enunciado":"¿Cuál es la mejor síntesis de lo que Baines considera el problema fundamental de la producción en serie?","opciones":["Bajar los precios exigía pagar salarios bajos, lo que reducía el poder de compra de los mismos obreros que debían consumir.","Para abaratar había que estandarizar y vender en masa, pero la demanda solo se sostenía si el producto cambiaba con los gustos.","La cadena de montaje requería obreros muy calificados, escasos en el país, y eso limitaba el ritmo de expansión de las fábricas.","La producción masiva saturaba muy rápido el mercado interno, por lo que la industria dependía de colocar sus excedentes en los mercados europeos."],"correcta":1,"explicacion":"Baines explica que reducir los precios al mínimo dependía de vender un producto estandarizado en un mercado grande, pero mantener la demanda a largo plazo exigía mejorarlo según los gustos cambiantes y crear nuevas necesidades. Por eso la publicidad pasó a diferenciar productos parecidos, y por eso Ford fracasó: su Modelo T, siempre igual, terminó compitiendo con sus propios autos usados.","por_que_no":["Es un enfoque ajeno a Baines: para él los obreros producían y ganaban más (Ford pagaba 5 dólares diarios).","","Al revés: la cadena se basaba en que cada obrero repitiera una operación sencilla.","Baines no plantea esa dependencia: el mercado de consumo estadounidense era enorme y el europeo, más pobre, era más chico."],"pag":"pp. 266-268"},{"id":"bai-m3","tema":"P3","nivel":"muy_dificil","enunciado":"Si alguien afirmara que en los años veinte toda la agricultura estadounidense estuvo en crisis, ¿qué matiz agregaría Baines?","opciones":["Que los productores de trigo y maíz prosperaron gracias a la recuperación de las ventas a Europa a mediados de la década.","Que los aparceros del Sur lograron salvarse al diversificar sus cultivos hacia el maní y otros productos nuevos.","Que los productores de frutas, hortalizas y lácteos con buen acceso por carretera a las ciudades aprovecharon el auge urbano.","Que la crisis golpeó sobre todo a los endeudados durante la guerra, mientras los demás mantuvieron ingresos estables."],"correcta":2,"explicacion":"Baines aclara que hubo agricultores que salieron bien parados: los de cítricos, hortalizas, frutas y lácteos aprovecharon la suba de los ingresos urbanos y el cambio de gustos hacia alimentos más livianos. La clave era el acceso a los mercados, que dependía de buenas carreteras. Aun así, desde 1925 los ingresos agrícolas en conjunto dejaron de crecer.","por_que_no":["Al revés: el trigo y el maíz fueron los grandes perdedores y las exportaciones nunca volvieron a superar dos tercios del nivel de la guerra.","Trampa de palabras: el maní revitalizó zonas del Sur solo donde había capital para diversificar, algo que no estaba al alcance de los aparceros.","","Las deudas pesaron mucho, pero el problema era general: precios agrícolas en baja frente a los industriales, tierra que perdía valor e ingresos que desde 1925 no crecieron."],"pag":"p. 276"},{"id":"bai-m4","tema":"P4","nivel":"muy_dificil","enunciado":"Según Baines, los factores que provocaron la caída de 1929 no alcanzan para explicar que la depresión se profundizara hasta 1933. ¿Cuál es la mejor explicación de esa profundización según el autor?","opciones":["Los sindicatos impidieron que bajaran los salarios, y esos costos altos frenaron la recuperación de la inversión.","Con fábricas ociosas, beneficios en caída y la confianza empresaria destruida, la inversión no reaccionó ni con costos muy bajos.","El gobierno de Hoover incurrió en grandes déficits fiscales que asustaron a los inversores privados y encarecieron todavía más el crédito.","La Reserva Federal bajó las tasas al mínimo y alimentó una nueva ola especulativa que terminó en un segundo crac."],"correcta":1,"explicacion":"Baines explica que en 1932 las industrias trabajaban tan por debajo de su capacidad que cualquier demanda podía atenderse sin invertir, y había viviendas vacías por hipotecas impagas. Aunque los costos cayeron, la inversión no respondió: los beneficios se desplomaron (destruyendo las fuentes de financiamiento) y, sobre todo, se hundió la confianza de los empresarios. A eso se sumaron la ruina agrícola, la crisis bancaria y la internacional.","por_que_no":["Al revés: los sindicatos eran débiles y en 1932 los salarios nominales estaban un 60 % por debajo de los de 1929.","","Baines dice que en esos años ningún gobierno usaba el déficit para reactivar; Hoover era ortodoxo y compartía la idea de la «purga».","Mitad mal: al principio la Reserva Federal bajó las tasas, pero ante la crisis mundial endureció el crédito y multiplicó las quiebras; no hubo un segundo auge especulativo."],"pag":"pp. 293-294"},{"id":"bai-m5","tema":"P4","nivel":"muy_dificil","enunciado":"Baines rechaza la tesis del «subconsumo» como explicación de la crisis de 1929. ¿Cuál es su argumento central?","opciones":["Que en 1929 la demanda de bienes durables estaba en plena expansión y casi todos los autos nuevos iban a compradores nuevos.","Que en los años veinte los salarios crecieron más rápido que los beneficios, de modo que no faltó demanda de consumo.","Que la crisis fue ante todo monetaria y se habría evitado si la Reserva Federal hubiera sostenido la oferta de dinero.","Que el ingreso no gastado se ahorra; el problema fue invertir en una capacidad que ningún aumento del consumo podía justificar."],"correcta":3,"explicacion":"Baines admite indicios de subconsumo, pero lo considera una explicación demasiado simple: es difícil saturar un mercado de consumo y lo que no se gasta se ahorra. Las empresas, con grandes reservas, invirtieron masivamente en industrias pesadas; cuando vieron que la producción de las nuevas fábricas no podría venderse, recortaron la inversión. Por eso prefiere hablar de «sobreinversión».","por_que_no":["Invierte el dato: en 1929 menos de la mitad de los autos nuevos se vendió a compradores nuevos, lo que Baines cita como indicio de saturación.","Al revés: con sindicatos débiles, la productividad se volcó a los beneficios más que a los salarios y aumentó la desigualdad.","Es la tesis de Friedman, que Baines considera discutible porque no está clara la relación entre dinero y actividad.",""],"pag":"pp. 290-291"},{"id":"bai-m6","tema":"P4","nivel":"muy_dificil","enunciado":"¿Cuál de las siguientes comparaciones entre la depresión de Estados Unidos y la de Gran Bretaña sostiene Baines?","opciones":["Gran Bretaña sufrió una caída del producto similar a la estadounidense, pero se recuperó antes porque se mantuvo firme en el patrón oro.","Estados Unidos tuvo bastante menos desempleo que Gran Bretaña, lo que muestra que allí la depresión fue más leve.","Con un paro casi tan alto, el producto británico cayó mucho menos y se recuperó desde mediados de 1932.","La depresión golpeó más fuerte a Gran Bretaña, porque dependía de importar alimentos y estos se encarecieron mucho."],"correcta":2,"explicacion":"Baines usa a Gran Bretaña para mostrar que el desempleo no es el mejor indicador: allí el paro fue casi tan alto como en EE.UU., pero el producto real cayó apenas un tercio de lo que cayó en EE.UU., la mayoría vivía mejor en 1932 que en 1929 y la recuperación empezó a mediados de 1932, cuando la economía estadounidense seguía cayendo. Además, los alimentos importados baratos aumentaron el poder de compra británico.","por_que_no":["Doble error: la caída británica fue mucho menor y Gran Bretaña abandonó el patrón oro en 1931, lo que le permitió una política monetaria expansiva.","Al revés: el desempleo británico fue casi tan alto, y la depresión en EE.UU. fue mucho más profunda.","","Al revés: Baines dice que las importaciones de alimentos baratos aumentaron el poder adquisitivo de los consumidores británicos."],"pag":"pp. 292, 298, 301-302, 321"},{"id":"bai-m7","tema":"P5","nivel":"muy_dificil","enunciado":"Lea las siguientes medidas:\nI. La Ley Wagner y la creación de la National Labour Relations Board.\nII. Los códigos de precios y salarios de la NRA, con el símbolo del Águila Azul.\nIII. Impuestos más altos a los ingresos elevados y un nuevo impuesto a la riqueza.\nIV. Las primas de la AAA, financiadas con un impuesto a la primera elaboración de los productos agrícolas.\n¿Cuáles corresponden al segundo New Deal según Baines?","opciones":["Solo I y II","Solo II y IV","Solo I y III","Solo I, III y IV"],"correcta":2,"explicacion":"La Ley Wagner (que reemplazó a la NIRA anulada) y la reforma impositiva más progresiva, con el impuesto a la riqueza, pertenecen al segundo New Deal, cuando Roosevelt giró a la izquierda. Los códigos de la NRA y las primas de la AAA son del primer New Deal (los «cien días» de 1933), y ambos fueron anulados por la Corte Suprema: la NIRA en 1935 y el impuesto de la AAA en 1936.","por_que_no":["Incluye II: la NRA es el gran programa industrial del primer New Deal y su política fue abandonada en el segundo.","Son justamente las dos medidas del primer New Deal: es la trampa de cruzar las etapas.","","Incluye IV: la AAA es del primer New Deal; tras la anulación de su impuesto se pasó a subsidiar la conservación del suelo."],"pag":"pp. 311, 315-316"},{"id":"bai-m8","tema":"P5","nivel":"muy_dificil","enunciado":"Si alguien sostuviera que el New Deal fracasó porque, al llegar la guerra, el ingreso por habitante seguía por debajo del de 1929, ¿qué objetaría Baines?","opciones":["Que el dato no prueba el fracaso: sin el New Deal la caída habría sido mayor, y sus metas incluían también asistir a los necesitados y reformar.","Que el dato no prueba el fracaso: lo que frenó la recuperación fue la Corte, al anular la NIRA justo cuando estaba haciendo crecer la producción.","Que el dato no prueba el fracaso: aunque el ingreso no se recuperó, el desempleo ya había vuelto a niveles normales hacia 1937.","Que el dato no prueba el fracaso: la devaluación del dólar ya había hecho subir los precios, y esa era la meta central del programa."],"correcta":0,"explicacion":"Baines reconoce que el producto seguía por debajo de 1929, pero dice que eso no demuestra el fracaso: dadas las circunstancias extraordinarias de los años treinta, sin el New Deal el nivel habría caído mucho más. Además, el New Deal también perseguía la asistencia a los necesitados y la reforma del orden económico para evitar otro 1929-1933, y su efecto sobre la confianza fue difícil de medir pero real.","por_que_no":["","Mitad bien, mitad mal: la Corte anuló la NIRA en 1935, pero según Baines la NRA había subido los precios sin aumentar la producción.","Falso según el texto: el desempleo siguió muy alto toda la década (en 1937, más del 14 %, contra un 3 % en 1929).","Falso según el texto: la devaluación no tuvo un efecto apreciable sobre los precios (p. 313), y subir los precios era una herramienta de la recuperación, no la meta central."],"pag":"pp. 320-321"},{"id":"bai-m9","tema":"P5","nivel":"muy_dificil","enunciado":"¿Qué explicación da Baines de por qué el gasto del New Deal no alcanzó para reactivar plenamente la economía?","opciones":["El gasto fue excesivo: los déficits espantaron a la inversión privada y así terminaron frenando la recuperación.","Las obras eran improductivas: pagar murales en lugar de construir represas impidió que el gasto generara crecimiento.","El estímulo fue tímido: déficits modestos y un gasto que en gran parte solo pasaba ingreso de los ocupados a los pobres.","La devaluación del dólar hizo bajar los precios internos y deprimió todavía más los ingresos de los productores."],"correcta":2,"explicacion":"Para Baines lo que importaba era el volumen del gasto público. El mayor déficit nunca superó el 5 % de la renta nacional y buena parte del gasto se financió con impuestos, de modo que se quitaba ingreso a quienes tenían empleo para dárselo a los pobres: era justo, pero no generaba crecimiento. Con déficits mayores, como en la guerra, las rentas habrían subido; Roosevelt no aplicaba las ideas de Keynes.","por_que_no":["Baines menciona ese argumento y lo considera «muy discutible»: si el gasto hubiera vuelto rentable invertir, los empresarios habrían invertido.","Trampa: Baines dice que, desde el punto de vista económico, daba igual gastar en murales o en represas; lo que contaba era la cuantía.","","La devaluación no bajó los precios: Baines dice que no tuvo efectos apreciables sobre ellos, aunque buscaba subirlos."],"pag":"pp. 309-310, 322"},{"id":"bai-m10","tema":"P5","nivel":"muy_dificil","enunciado":"Sobre la apuesta del primer New Deal a subir los precios para lograr la recuperación, lea:\nI. Ni la devaluación del dólar ni las compras de oro lograron mover los precios de manera significativa.\nII. La NRA elevó precios, pero eso no explica el aumento del empleo industrial de 1933.\nIII. Los precios agrícolas subieron sobre todo porque la AAA logró reducir la producción.\nIV. Las compras de plata perjudicaron a países con patrón plata, como México y China.\n¿Cuáles son correctas según Baines?","opciones":["Solo I y III","Solo I, II y IV","Solo II, III y IV","Solo I y II"],"correcta":1,"explicacion":"I es correcta: subir el precio del oro y devaluar no movió los precios pese a la gran entrada de oro. II también: subir precios no significa aumentar la producción, así que los dos millones de empleos de 1933 no se deben a la NRA (a lo sumo ayudó a la confianza). IV es correcta: la plata comprada revaluó las monedas de Perú, México y China y los hundió más en la depresión. III es falsa: la producción agrícola creció un 10 % y la suba de precios se debió sobre todo a la sequía.","por_que_no":["Incluye III, que es falsa (la AAA no logró reducir la producción), y omite II y IV, que son correctas.","","Incluye III: Baines atribuye la suba de los precios agrícolas sobre todo a la sequía del Oeste.","Omite IV, que es correcta: las compras de plata dañaron a Perú, México y China."],"pag":"pp. 311-314"}],"desarrollo":[{"id":"bai-d-n1","tema":"P3","nivel":"normal","consigna":"Según Baines, ¿cuáles fueron las principales características de la economía de Estados Unidos en la década de 1920? ¿Qué sector quedó al margen de la prosperidad? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Automóvil y electricidad como motores","detalle":"Identificar la producción en serie de autos y el consumo masivo de electricidad como los rasgos centrales, que arrastraron industrias auxiliares y sostuvieron la inversión.","peso":3,"indicios":[["automovil","autos","vehiculo","ford","automotr","modelo t"],["electric"]]},{"id":"b","punto":"Productividad y producción en serie","detalle":"Explicar que la cadena de producción elevó la productividad: se producía y ganaba más y bajaban los precios, lo que subió los ingresos reales.","peso":3,"indicios":[["productiv","cadena de produc","cadena de montaje","en serie","montaje","taylor"]]},{"id":"c","punto":"Consumo masivo de bienes durables y crédito","detalle":"Mencionar la primera sociedad de consumo de masas: bienes durables baratos, publicidad y ventas a plazos (con muchos morosos).","peso":2,"indicios":[["durable","durader","duros","consumo de masas","consumo masivo"],["a plazos","ventas a plazo","cuotas","publicidad","credito al consumo"]]},{"id":"d","punto":"Construcción y urbanización","detalle":"Señalar el auge de la construcción de viviendas, edificios comerciales y rascacielos, y el crecimiento de suburbios y ciudades.","peso":2,"indicios":[["construc","vivienda","rascacielo","edificio","suburb"]]},{"id":"e","punto":"Gobierno federal liberal y dinero barato","detalle":"Indicar que el gobierno federal casi no intervino (laissez-faire, superávit; los que gastaron en carreteras fueron estados y municipios), que el arancel no protegía realmente y que el crédito barato tuvo un papel marginal.","peso":1,"indicios":[["laissez","superavit","no interv","poco interv","escasa interv","no protegia","no protegio"]]},{"id":"f","punto":"La agricultura no participa","detalle":"Explicar que el agro quedó afuera por la sobreproducción: precios agrícolas en baja frente a los industriales, deudas de la guerra y exportaciones en caída (también sufrían el textil y el carbón).","peso":3,"indicios":[["agricult","agro","campo","agricola","granj"],["sobreprod","sobreoferta","excedent","deuda","precios agricolas","cayeron","perdedor","no particip","no compart"]]}],"respuesta_modelo":"Según Baines, en la década de 1920 Estados Unidos fue la primera sociedad de consumo de masas. El crecimiento fue casi ininterrumpido y se apoyó en un gran aumento de la productividad: la cadena de producción, que Ford aplicó al Modelo T, permitió producir más con la misma mano de obra, pagar mejores salarios y bajar los precios. Los dos rasgos más característicos fueron el automóvil y la electricidad: arrastraban industrias auxiliares (acero, caucho, vidrio, carreteras), abrían nuevas formas de gastar y sostuvieron una alta inversión. El consumo de bienes durables se apoyó en la publicidad y en las ventas a plazos. También crecieron la construcción de viviendas, edificios comerciales y rascacielos, y los suburbios. El gobierno federal casi no intervino y, para Baines, ni el arancel ni el crédito barato explican el auge. Quedaron al margen el textil de Nueva Inglaterra, el carbón de los Apalaches y, sobre todo, la agricultura: por la sobreproducción, los precios agrícolas cayeron frente a los industriales, pesaron las deudas de la guerra y bajaron las exportaciones.","errores_comunes":["Decir que la prosperidad se debió al gasto del gobierno federal o al arancel de 1922: Baines sostiene que el gobierno federal casi no intervino (los que gastaron en carreteras fueron estados y municipios) y que el arancel no protegía nada.","Atribuir el auge sobre todo al crédito barato: para Baines los factores monetarios fueron marginales frente a la productividad.","Poner a los ferrocarriles como motor del transporte: en los años veinte perdieron pasajeros frente al automóvil y el camión.","Decir que toda la agricultura se arruinó: frutas, hortalizas y lácteos con acceso a las ciudades se salvaron."],"pag":"pp. 264-277"},{"id":"bai-d-n2","tema":"P4","nivel":"normal","consigna":"Según Baines, ¿cuáles fueron las causas de la quiebra de la Bolsa de 1929 y de la depresión que le siguió? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Especulación desligada de la economía","detalle":"Explicar que desde 1928 las acciones subieron sin relación con la marcha real de la industria y que cada inversor se volvió especulador.","peso":3,"indicios":[["especula","burbuja","sobrevalu"]]},{"id":"b","punto":"Crédito fácil y beneficios empresarios","detalle":"Mencionar la compra de acciones a crédito (el agente adelantaba parte del precio), los préstamos a especuladores con los beneficios de las grandes empresas o el dinero barato de 1927.","peso":2,"indicios":[["a credito","credito facil","credito barato","dinero barato","prestamos a","margen","solo una parte"]]},{"id":"c","punto":"El pánico de octubre de 1929","detalle":"Describir el derrumbe de octubre de 1929 (días 24 y 28-29), el pánico por la incertidumbre y las ventas forzadas.","peso":1,"indicios":[["octubre","jueves"],["panico","teletipo","incertidumbre","vendi","ventas"]]},{"id":"d","punto":"Causas reales: construcción y agro","detalle":"Señalar la crisis de la construcción (desde 1925), el recorte de la inversión pública, la crisis agrícola, del carbón y del algodón, y la contracción del comercio mundial.","peso":2,"indicios":[["construc","agricult","agro","carbon","algodon"]]},{"id":"e","punto":"Sobreinversión, no subconsumo","detalle":"Explicar que para Baines hubo sobreinversión: se invirtió en una capacidad que el consumo no podía absorber, en un contexto de desigualdad creciente.","peso":3,"indicios":[["sobreinver","sobre inver","exceso de inver","demasiada inver","capacidad ocios","capacidad productiva","sobrecapacidad","exceso de capacidad"]]},{"id":"f","punto":"Crisis bancaria y Reserva Federal","detalle":"Indicar que el sistema bancario fue el factor que más profundizó la depresión (oleadas de quiebras) y que la Reserva Federal la agravó al restringir el crédito.","peso":3,"indicios":[["banc"],["quiebras banc","quiebra de banc","quiebras de banc","bancos quebr","corrida","oleada","reserva federal","crisis banc","sistema banc","panico banc"]]}],"respuesta_modelo":"Para Baines, la prosperidad terminó en una «orgía especulativa»: desde marzo de 1928 las acciones subieron sin freno y las cotizaciones dejaron de reflejar la marcha de la economía. La especulación se alimentó de los altos beneficios de las grandes empresas, que preferían prestar a los especuladores antes que invertir; de la venta agresiva de títulos; y del crédito fácil, porque se compraban acciones pagando solo una parte del precio. Cuando la suba perdió relación con la industria, el derrumbe era cuestión de tiempo: tras el pánico de octubre de 1929, a fin de mes las cotizaciones habían caído un 40 %. Sin embargo, el crac no explica solo la depresión. Ya había causas reales: la construcción estaba en crisis desde 1925, se recortaron las obras públicas, el agro se deterioró y el comercio mundial se contrajo. Además, Baines rechaza el «subconsumo» y habla de sobreinversión: se había invertido en una capacidad que ningún consumo podía justificar. Por último, la crisis bancaria y la restricción del crédito de la Reserva Federal la convirtieron en la peor depresión del país.","errores_comunes":["Presentar el crac como causa única de la depresión: Baines dice que en condiciones normales habría sido más un efecto que una causa (aunque después la agravó al hundir la confianza).","Atribuirle a Baines la tesis del «subconsumo»: la considera simplista y prefiere hablar de sobreinversión.","Decir que millones de pequeños ahorristas especulaban (los «lustrabotas»): Baines afirma que los inversores eran pocos.","Culpar al comercio exterior: era menos del 10 % del PNB y la depresión fue un problema interno."],"pag":"pp. 286-300"},{"id":"bai-d-n3","tema":"P5","nivel":"normal","consigna":"¿Cuáles fueron las principales medidas del primer New Deal de Roosevelt (1933-1935) según Baines? Nombre los programas y explique brevemente qué hacía cada uno.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Feriado bancario y confianza","detalle":"Mencionar que al asumir (marzo de 1933) Roosevelt decretó vacaciones bancarias, habló por radio («charla junto al fuego») y los bancos reabrieron con la confianza recuperada.","peso":3,"indicios":[["feriado","vacaciones banc","cierre de los bancos","cerro los bancos","cierre bancario","asueto banc"]]},{"id":"b","punto":"AAA: reducir cultivos para subir precios","detalle":"Explicar que la AAA pagaba primas a los agricultores que reducían sus cultivos, para que subieran los precios agrícolas.","peso":3,"indicios":[["aaa","agricultural adjustment","ajuste agricola"]]},{"id":"c","punto":"NRA (NIRA): códigos de precios y salarios","detalle":"Explicar que la NRA promovía códigos de precios, salarios y competencia por industria para frenar la competencia y subir los precios.","peso":3,"indicios":[["nra","nira","national recovery","recuperacion nacional","aguila azul"]]},{"id":"d","punto":"Asistencia y empleo: CCC, FERA, PWA, CWA","detalle":"Nombrar al menos dos programas de ayuda a desocupados con su función (de los «cien días»: CCC, campamentos para jóvenes; FERA, fondos a estados y municipios; PWA, obras públicas; después, en noviembre de 1933, la CWA).","peso":3,"indicios":[["ccc","fera","cwa","pwa","wpa","civilian","emergency relief","public works","civil works"]]},{"id":"e","punto":"TVA: desarrollo regional","detalle":"Mencionar la Tennessee Valley Authority: electricidad, fertilizantes, control del río y modernización de una región pobre.","peso":2,"indicios":[["tva","tennessee"]]},{"id":"f","punto":"Reforma financiera","detalle":"Mencionar el seguro de depósitos (FDIC), la refinanciación de hipotecas o el control de la Bolsa (SEC).","peso":1,"indicios":[["fdic","seguro de deposito","garantia de deposito","aseguro los deposit","securities","hipotec"]]},{"id":"g","punto":"Subir precios para recuperar","detalle":"Señalar que, para la recuperación, varias medidas buscaban elevar los precios (NRA, AAA, devaluación del dólar) y que Baines duda de sus resultados; idealmente, ubicar las medidas en los objetivos de asistencia, recuperación y reforma.","peso":2,"indicios":[["subir los precios","subir precios","suba de precios","suba de los precios","elevar los precios","elevar precios","aumentar los precios","alza de los precios","alza de precios","subieran los precios"]]}],"respuesta_modelo":"Según Baines, el New Deal buscaba asistir, recuperar la economía y, con el tiempo, reformarla. El primero comenzó el 4 de marzo de 1933 con el colapso bancario: Roosevelt decretó un feriado bancario y, como era una crisis de confianza, a la semana anunció por radio («charla junto al fuego») que los bancos eran seguros, y la gente volvió a depositar. Luego la FDIC aseguró los depósitos y la SEC controló la Bolsa. En los «cien días» se crearon muchos organismos: la AAA pagaba primas a los agricultores que reducían sus cultivos, para subir los precios agrícolas; la NRA impulsaba códigos de precios y salarios por industria para frenar la competencia y elevar los precios; la TVA desarrolló el valle del Tennessee; el CCC empleaba a jóvenes desocupados en campamentos; la FERA daba fondos a estados y municipios, y la PWA hacía obras públicas. Después, en noviembre de 1933, la CWA creó cuatro millones de empleos. Para Baines, la apuesta a subir los precios dio pocos resultados.","errores_comunes":["Ubicar la Ley Wagner o la seguridad social en el primer New Deal: son del segundo.","Poner la CWA o la WPA entre las leyes de los «cien días»: la CWA es de noviembre de 1933 y la WPA la reemplazó después.","Atribuir a Roosevelt la creación de la Reconstruction Finance Corporation: la creó Hoover en 1932.","Confundir funciones: la AAA era para el agro y la NRA para la industria y el comercio."],"pag":"pp. 305-314"},{"id":"bai-d-f1","tema":"P3","nivel":"dificil","consigna":"Baines afirma que el mayor problema económico de la década de 1920 fue que la agricultura no participó de la prosperidad industrial. Explique por qué ocurrió, relacionando sus causas estructurales, los efectos de la Primera Guerra Mundial y la situación de los mercados.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Sobreproducción estructural","detalle":"Explicar que era más fácil aumentar que restringir la producción: con muchos productores sin poder sobre el precio, ante la baja cada uno producía más.","peso":3,"indicios":[["sobreprod","sobreoferta","producir mas","produciendo mas","producian mas","exceso de produc","excedent"]]},{"id":"b","punto":"Demanda de alimentos estancada","detalle":"Señalar que el consumo de trigo y maíz crecía muy despacio, la población crecía menos y, al enriquecerse, la gente comía menos pan.","peso":2,"indicios":[["demanda","consumo"],["crecia muy despacio","crecia lentamente","crecia poco","lento","lenta","despacio","estanc","menos pan","comia menos","comian menos","inelast","no crecia"]]},{"id":"c","punto":"Herencia de la guerra: expansión y deudas","detalle":"Explicar que con precios altos y garantizados se cultivaron tierras marginales con préstamos hipotecarios; terminados esos precios en 1920-1921, las deudas quedaron.","peso":3,"indicios":[["marginal","garantiz","precios altos","durante la guerra","precios de guerra"],["deuda","hipotec","prestam","endeud"]]},{"id":"d","punto":"Mecanización","detalle":"Mencionar que los tractores reemplazaron a los caballos y liberaron tierras de forraje, lo que aumentó la producción para el mercado.","peso":2,"indicios":[["tractor","mecaniz","maquin","forraje"]]},{"id":"e","punto":"Mercados externos y sustitutos","detalle":"Señalar que las exportaciones no superaron dos tercios de las de guerra (Europa no podía pagar y se protegía) y que las fibras artificiales redujeron la demanda de algodón.","peso":2,"indicios":[["export","fibras artificiales","fibra","sustitut"],["cayeron","bajaron","dos tercios","nunca super","no super","no se recuper","proteg","no podia pagar","no podian pagar","redujeron"]]},{"id":"f","punto":"Precios relativos, excepciones y paridad","detalle":"Indicar que los precios agrícolas cayeron frente a los industriales y la tierra perdió valor, que algunos productores se salvaron (frutas, lácteos) y que la paridad fue vetada.","peso":1,"indicios":[["paridad","valor de la tierra","tierra perdio","tierra perdia","relacion de intercambio","frente a los industriales","frente a los productos industriales","frutas","hortaliz","lacteos","citric"]]}],"respuesta_modelo":"Para Baines, el gran problema de la década de 1920 fue que la agricultura quedó al margen de la prosperidad industrial: los precios agrícolas cayeron en comparación con los industriales y la tierra, principal reserva de los agricultores, perdió valor. La causa de fondo era estructural: en el campo era más sencillo expandir la producción que achicarla. Como cada producto era cultivado por muchísimos agricultores, ninguno podía influir sobre el precio, y ante la baja la reacción típica era producir más. Pero la demanda de alimentos básicos como el trigo y el maíz crecía muy despacio: la población aumentaba menos que antes de la guerra y, al enriquecerse, la gente comía menos pan e incluso menos carne. La Primera Guerra Mundial agravó el problema: con precios altos y garantizados se pusieron en cultivo tierras marginales y muchos agricultores se endeudaron hipotecando sus tierras; cuando en 1920-1921 terminaron esos precios, las deudas siguieron y, con las ejecuciones, aumentaron los arrendamientos. Además, la mecanización (tractores en lugar de caballos) liberó tierras antes dedicadas a forraje y sumó oferta. En los mercados, las exportaciones nunca superaron dos tercios de las de guerra, porque Europa no podía pagar y protegía a sus agricultores, y las fibras artificiales redujeron la demanda de algodón. Solo se salvaron los productores de frutas, hortalizas y lácteos con acceso a las ciudades. Los agricultores reclamaron la «paridad», pero el presidente la vetó dos veces.","errores_comunes":["Explicar la crisis agrícola por falta de producción o de mano de obra: el problema era el exceso de oferta.","Decir que la mecanización redujo la superficie cultivada: al liberar tierras de forraje, aumentó la producción para el mercado.","Afirmar que el gobierno aplicó la «paridad» en los años veinte: fue un reclamo de los agricultores, vetado dos veces.","Generalizar la ruina a todos los productores: frutas, hortalizas y lácteos se beneficiaron del consumo urbano."],"pag":"pp. 274-277"},{"id":"bai-d-f2","tema":"P4","nivel":"dificil","consigna":"Según Baines, los factores que provocaron la caída de 1929 no alcanzan para explicar la profundidad y la duración de la depresión hasta 1933. Explique cuáles fueron esos factores iniciales y qué mecanismos convirtieron la recesión en la peor depresión de la historia estadounidense.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Factores iniciales de la caída","detalle":"Mencionar los factores de la caída de 1929: sobreinversión, fin del auge de la construcción, recorte de obras públicas y dificultades agrícolas.","peso":2,"indicios":[["sobreinver","sobre inver","exceso de inver","sobrecapacidad","construc"]]},{"id":"b","punto":"Capacidad ociosa: la inversión no reacciona","detalle":"Explicar que, con la industria muy por debajo de su capacidad y viviendas vacías, no hacía falta invertir aunque los costos cayeran.","peso":2,"indicios":[["ociosa","ocioso","ociosas","ociosos","por debajo de su capacidad","capacidad ociosa","viviendas vacias","casas vacias","sin invertir","no hacia falta invertir","no reacciono","no respondio"]]},{"id":"c","punto":"Caída de beneficios y de la confianza","detalle":"Señalar que los beneficios se desplomaron y, sobre todo, se hundió la confianza empresaria; el crac contribuyó (acciones de 87.000 a 19.000 millones: menos beneficios y menos incentivo al ahorro).","peso":3,"indicios":[["confianza","pesimis","incertidumbre","expectativ"]]},{"id":"d","punto":"Ruina agrícola y deudas","detalle":"Indicar que los ingresos agrícolas cayeron un 70 % y que, con precios en baja, las deudas se volvieron impagables, con ejecuciones masivas.","peso":2,"indicios":[["agricult","agro","campo","granj"],["deuda","endeud","hipotec","ejecuc","impagab","arruin","ruina"]]},{"id":"e","punto":"Sistema bancario: factor decisivo","detalle":"Explicar que la fragilidad de los bancos locales y las oleadas de quiebras (1930-1933) destruyeron ahorros y crédito; para Baines fue el factor individual más importante.","peso":3,"indicios":[["banc"],["quiebras banc","quiebra de banc","quiebras de banc","bancos quebr","corrida","oleada","crisis banc","sistema banc","panico banc"]]},{"id":"f","punto":"Políticas que agravaron","detalle":"Mencionar que la Reserva Federal endureció el crédito, que Hoover veía la crisis como una «purga» y que la autarquía (Hawley-Smoot) y la crisis internacional de 1931 empeoraron todo.","peso":2,"indicios":[["reserva federal","purga","hawley","arancel","autarqu","patron oro","kredit","ortodox"]]},{"id":"g","punto":"Magnitud de la depresión","detalle":"Dar alguna cifra: PNB real −27 % y producción industrial −50 % en 1932; el paro pasó de 1,5 a 13 millones (un cuarto de la fuerza laboral).","peso":1,"indicios":[["cuarta parte","un cuarto de","pnb","producto nacional","produccion industrial","millones de parados","millones de desocupados","millones de personas"]]}],"respuesta_modelo":"Baines sostiene que la depresión posterior a 1929 fue, por lejos, la peor de la historia estadounidense: en 1932 el PNB real había caído un 27 % y la producción industrial un 50 %, y el paro pasó de 1,5 a 13 millones de personas, un cuarto de la fuerza laboral. La caída inicial se explica por la sobreinversión, el fin del auge de la construcción y las dificultades agrícolas. Pero las depresiones anteriores se habían resuelto solas cuando los costos bajaban lo suficiente como para estimular la inversión, y esta vez eso no ocurrió. Las industrias trabajaban tan por debajo de su capacidad, y había tantas viviendas vacías por hipotecas impagas, que cualquier demanda podía cubrirse sin invertir. Los beneficios se desplomaron y, sobre todo, se hundió la confianza de los empresarios. El crac pesó en eso: las acciones de Nueva York pasaron de valer 87.000 a 19.000 millones de dólares, lo que recortó beneficios, quitó el incentivo a ahorrar y golpeó al sector financiero. El campo agravó la situación: los ingresos agrícolas cayeron un 70 % y las deudas se volvieron impagables. El factor individual más importante fue el sistema bancario: bancos locales sin sucursales quebraron en oleadas entre 1930 y 1933, destruyendo ahorros y cortando el crédito. La política lo empeoró: la Reserva Federal restringió el crédito ante la crisis mundial, Hoover veía la depresión como una «purga» y el arancel Hawley-Smoot y la crisis financiera de 1931 hundieron el comercio internacional.","errores_comunes":["Explicar todo por la quiebra de Wall Street, o al revés, decir que el crac no influyó: Baines lo ve como un agravante (confianza, beneficios, ahorro), pero no como la causa única.","Decir que la crisis se prolongó por salarios altos o sindicatos fuertes: los sindicatos eran débiles y los salarios nominales cayeron un 60 %.","Atribuirle a Baines la tesis de Friedman (todo se debió a la caída de la oferta monetaria): la considera discutible.","Afirmar que Hoover usó el déficit para reactivar: ningún gobierno de la época empleaba la política fiscal con ese fin."],"pag":"pp. 290-300"},{"id":"bai-d-f3","tema":"P5","nivel":"dificil","consigna":"Compare el primer New Deal (1933-1935) y el segundo New Deal (1935-1941) según Baines: objetivos, programas principales y relación del gobierno con los empresarios y los sindicatos.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Primero: emergencia, asistencia y recuperación","detalle":"Caracterizar el primero como respuesta de emergencia (feriado bancario, «cien días») centrada en asistir y recuperar la economía, con la apuesta a subir los precios.","peso":2,"indicios":[["emergencia","cien dias","feriado","vacaciones banc","asistencia","asistir","subir los precios","suba de precios","suba de los precios","elevar los precios","elevar precios"]]},{"id":"b","punto":"Programas del primero","detalle":"Nombrar programas del primero con su función: AAA, NRA, TVA, CCC, FERA, PWA (y la CWA, de noviembre de 1933).","peso":3,"indicios":[["aaa","nra","nira","tva","ccc","fera","cwa","pwa"]]},{"id":"c","punto":"Coalición con los empresarios","detalle":"Explicar que el primero funcionó como una coalición de intereses en la que los empresarios no eran hostiles y las grandes firmas dictaban los códigos de la NRA.","peso":2,"indicios":[["coalicion","no eran hostiles","no fueron hostiles","no hostil","aliad","grandes firmas","dictaban","redactaban","colabor"]]},{"id":"d","punto":"Ruptura de 1935: caso Schechter","detalle":"Señalar que en 1935 los empresarios abandonaron la coalición y el caso Schechter anuló la NIRA, y que Roosevelt respondió girando a la izquierda.","peso":3,"indicios":[["schechter","corte suprema","tribunal supremo","izquierda","anul"]]},{"id":"e","punto":"Programas del segundo: la reforma","detalle":"Nombrar medidas del segundo, centrado en la reforma: Ley Wagner y National Labour Relations Board, seguridad social, juicios antimonopolio, impuestos progresivos, anuncio de una ley de vivienda.","peso":3,"indicios":[["wagner","seguridad social","labor relations","labour relations","antitrust","antimonopol","contra los trust","impuestos progresiv","mas progresiv"]]},{"id":"f","punto":"Empresarios enemigos, sindicatos fortalecidos","detalle":"Indicar que en el segundo los empresarios fueron vistos como enemigos y los sindicatos crecieron (CIO, huelgas), y mencionar el choque con la Corte o la recesión de 1937.","peso":1,"indicios":[["enemig","cio","afiliac","huelga","plan para ampliar","jueces"]]},{"id":"g","punto":"Matiz: no fue anticapitalista","detalle":"Aclarar que, en su balance, Baines dice que el New Deal no era en absoluto hostil a los empresarios y que salvó al capitalismo.","peso":1,"indicios":[["salvo al capitalismo","salvando al capitalismo","salvador del capitalismo","no era en absoluto hostil","no fue anticapitalista","nunca fue anticapitalista","no era anticapitalista"]]}],"respuesta_modelo":"Para Baines, el New Deal perseguía tres objetivos: asistir, recuperar la economía y reformarla. El primer New Deal (1933-1935) fue una respuesta de emergencia centrada en los dos primeros. Roosevelt asumió con los bancos quebrados: decretó un feriado bancario, recuperó la confianza con su primera «charla junto al fuego» y en los «cien días» el Congreso creó una avalancha de organismos: la AAA pagaba a los agricultores para reducir cultivos y subir los precios; la NRA promovía códigos de precios y salarios por industria; la TVA desarrolló el valle del Tennessee; el CCC, la FERA y la PWA asistían a los desocupados. En noviembre de 1933 se sumó la CWA. Era una coalición de intereses: los empresarios no eran hostiles y las grandes firmas redactaban los códigos de la NRA. Esa etapa terminó en 1935: los empresarios se fueron, alarmados por el déficit, y en el caso Schechter la Corte Suprema anuló la NIRA. Roosevelt giró a la izquierda. El segundo New Deal (1935-1941) priorizó la reforma y vio a los empresarios como enemigos del cambio social: abandonó la NRA, impulsó juicios antimonopolio, anunció la seguridad social y volvió más progresivos los impuestos. Sobre todo, respaldó a los sindicatos con la Ley Wagner y la National Labour Relations Board, y creció el CIO. Aun así, en su balance Baines aclara que el New Deal «no era en absoluto hostil a los empresarios»: terminó salvando al capitalismo.","errores_comunes":["Ubicar la AAA, la NRA o la TVA en el segundo New Deal: son de los «cien días» de 1933.","Ubicar la Ley Wagner o la seguridad social en el primer New Deal.","Presentar al New Deal como anticapitalista: aunque el segundo vio a los empresarios como enemigos, en su balance Baines dice que no era hostil a los empresarios y que salvó al capitalismo.","Omitir el caso Schechter (1935) como punto de quiebre entre ambas etapas."],"pag":"pp. 305-318, 322"},{"id":"bai-d-m1","tema":"P3","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «La prosperidad estadounidense de los años veinte era sólida y equilibrada; la crisis de 1929 fue un accidente bursátil que llegó de afuera». ¿Es correcta según Baines? Justifique relacionando las características de la economía de los años veinte con la crisis.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Prosperidad real basada en productividad","detalle":"Reconocer que para Baines la prosperidad tenía base real: productividad, automóvil, electricidad y consumo masivo.","peso":2,"indicios":[["productiv","automovil","electric","cadena de produc","cadena de montaje"]]},{"id":"b","punto":"Desequilibrios: agro y regiones deprimidas","detalle":"Señalar que la agricultura no participó (sobreproducción, precios en baja, deudas) y que había regiones deprimidas (textil, carbón).","peso":3,"indicios":[["agricult","agro","campo","agricola","granj"],["no particip","no compart","sobreprod","excedent","deuda","cayeron","caian","perdia","perdio","crisis agr","deprimid","perdedor"]]},{"id":"c","punto":"Desigualdad, salarios y crédito a plazos","detalle":"Explicar que la productividad se volcó a los beneficios más que a los salarios, con sindicatos débiles y desigualdad creciente, y que el crédito a plazos ocultaba la debilidad del mercado de durables.","peso":3,"indicios":[["desigual","sindicatos debil","sindicatos eran debil","a costa de los salarios","a plazos","ventas a plazo","cuotas","morosi"]]},{"id":"d","punto":"Sobreinversión y construcción saturada","detalle":"Mencionar que la inversión creció más que el consumo hasta generar sobreinversión y que la construcción estaba saturada y en crisis desde 1925.","peso":3,"indicios":[["sobreinver","sobre inver","exceso de inver","sobrecapacidad","capacidad productiva","capacidad ocios","saturad"]]},{"id":"e","punto":"Especulación alimentada por beneficios y crédito","detalle":"Relacionar los beneficios empresarios y el dinero barato con la especulación (Florida, Bolsa 1928-1929) y con el crac.","peso":2,"indicios":[["especula","florida"]]},{"id":"f","punto":"No vino de afuera: el crac como efecto","detalle":"Refutar el «afuera»: el comercio exterior era menos del 10 % del PNB y la depresión fue un problema interno; el crac habría sido normalmente un efecto, no la causa.","peso":2,"indicios":[["problema interno","crisis interna","causas internas","origen interno","dentro de la propia","dentro del pais","no vino de afuera","no llego de afuera","no vino del exterior","no llego del exterior","un efecto","como efecto"]]}],"respuesta_modelo":"La afirmación es incorrecta según Baines, aunque contiene una parte de verdad. Baines reconoce que la prosperidad de los años veinte tenía una base real: el enorme aumento de la productividad gracias a la cadena de producción y a dos innovaciones, el automóvil y la electricidad, que arrastraban industrias auxiliares y sostuvieron la inversión; por eso considera marginales los factores monetarios. Pero esa prosperidad no era equilibrada. La agricultura, que todavía ocupaba a un cuarto de la población, no participó: la sobreproducción hacía caer sus precios frente a los industriales, la tierra perdía valor y pesaban las deudas de la guerra; también había regiones deprimidas por la crisis del textil y del carbón. Además, como los sindicatos eran débiles, la productividad se volcó a los beneficios más que a los salarios y la desigualdad aumentó, lo que achicaba el mercado de bienes durables; esa debilidad quedaba oculta porque autos y muebles se compraban a plazos, con muchos morosos. Los beneficios se invirtieron en una capacidad productiva que ningún consumo podía justificar —lo que Baines llama sobreinversión— o fueron a la Bolsa. La construcción, otro motor, se saturó y empezó a caer desde 1925. El dinero barato y los beneficios alimentaron la especulación, primero en Florida y luego en Wall Street, donde las cotizaciones se desligaron de la economía. Tampoco es cierto que la crisis llegara de afuera: el comercio exterior era menos del 10 % del PNB y Baines considera la depresión un problema interno; fue la crisis estadounidense la que arrastró a Europa al repatriar capitales. Por último, el crac no fue un simple accidente ni la causa principal: en condiciones normales se lo habría visto como un efecto de la recesión, aunque después la agravó al hundir la confianza. En conclusión, la crisis se gestó dentro de la propia prosperidad.","errores_comunes":["Negar que hubiera prosperidad real: Baines la reconoce y la funda en la productividad.","Aceptar que la crisis vino del exterior: Baines la considera un problema interno que, a la inversa, golpeó a Europa.","Explicar la crisis por el «subconsumo» sin matices: Baines habla de sobreinversión.","Tratar el crac como causa suficiente: para Baines habría sido normalmente un efecto, aunque luego agravó la depresión."],"pag":"pp. 264-297"},{"id":"bai-d-m2","tema":"P4","nivel":"muy_dificil","consigna":"Baines afirma que el sistema bancario fue «el factor individual» que más influyó en la profundidad de la depresión. Explique el mecanismo completo de la crisis bancaria: sus causas estructurales, sus oleadas, el papel de la Reserva Federal y del gobierno de Hoover, y cómo se resolvió en 1933.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Debilidad estructural de los bancos","detalle":"Explicar que casi no había sucursales: bancos locales que dependían de pocas industrias y eran vulnerables a los retiros; ya en 1921-1929 quebraron más de 5.000.","peso":3,"indicios":[["sin sucursales","no habia sucursales","casi no habia sucursales","no existian sucursales","pocas sucursales","bancos locales","bancos pequenos","pequenos bancos","unitari","industrias locales"]]},{"id":"b","punto":"Oleadas de quiebras 1930-1933","detalle":"Describir las oleadas: 1930-1931 (Bank of the United States), tras la crisis internacional de 1931 (grandes bancos) y el pánico final de Michigan (febrero de 1933).","peso":2,"indicios":[["michigan","bank of the united","detroit","primera oleada","segunda oleada","kredit","moneda canadiense","moneda local","panico final"]]},{"id":"c","punto":"Círculo vicioso de ahorro y crédito","detalle":"Explicar que las quiebras destruían ahorros y obligaban a los bancos a restringir préstamos para tener liquidez, lo que hundía a sus clientes y a la economía.","peso":3,"indicios":[["liquidez","cortar prestamos","cortaban prestamos","cortar el credito","cortaban el credito","restringir prestamos","restringian prestamos","dejaron de prestar","destruian los ahorros","destruian ahorros","perdian sus ahorros","circulo vicioso"]]},{"id":"d","punto":"Reserva Federal: restricción innecesaria","detalle":"Señalar que la Reserva Federal, tras bajar tasas, endureció el crédito ante la crisis mundial y la salida de oro, algo innecesario; puede mencionarse la discusión con Friedman.","peso":2,"indicios":[["reserva federal","federal reserve","la fed"],["restring","restricc","endurec","contrac","innecesar","tasas","oro","friedman"]]},{"id":"e","punto":"Hoover: ortodoxia y medidas insuficientes","detalle":"Mencionar que Hoover veía la depresión como una «purga» y que la RFC y la Federal Farm Board fueron insuficientes; nadie usaba la política fiscal.","peso":2,"indicios":[["hoover"],["purga","rfc","reconstruction","farm board","ortodox","insuficien","inadecuad"]]},{"id":"f","punto":"Solución de 1933: confianza y reforma","detalle":"Explicar que Roosevelt decretó el feriado bancario, recuperó la confianza con la charla radial y luego reformó el sistema (FDIC, SEC); casi no hubo más quiebras.","peso":3,"indicios":[["feriado","vacaciones banc","cierre de los bancos","cerro los bancos","charla","fdic","seguro de deposito"],["roosevelt","confianza","fdic","seguro de deposito","reabri","reapert"]]},{"id":"g","punto":"Juicio de Baines: era evitable","detalle":"Señalar que, para Baines, pese a la debilidad estructural el derrumbe probablemente pudo evitarse, y que la propia crisis bancaria prolongó la depresión hasta 1933 (con cuatro meses sin conducción entre la elección y la asunción).","peso":1,"indicios":[["probablemente pudo","probablemente se pudo","probablemente podria","evitable","cuatro meses","interregno","prolongo la depresion"]]}],"respuesta_modelo":"Para Baines, el funcionamiento del sistema bancario fue el factor que más contribuyó a que la depresión fuera tan profunda. La causa estructural era su fragmentación: fuera de California casi no existían sucursales, así que cada banco dependía de unas pocas industrias locales y era muy vulnerable a los retiros. Ya entre 1921 y 1929 habían quebrado más de 5.000 bancos pequeños. Con la depresión llegaron las oleadas: la primera, en el invierno de 1930-1931, con la quiebra del Bank of the United States; la segunda, tras la crisis financiera internacional de 1931, que alcanzó a grandes bancos; y el pánico final, cuando Michigan decretó vacaciones bancarias en febrero de 1933: al asumir Roosevelt, casi la mitad de los estados había cerrado sus bancos. El mecanismo era un círculo vicioso: las quiebras destruían los ahorros y obligaban a los bancos que seguían abiertos a cortar préstamos para conservar liquidez, lo que hundía a sus clientes. La política agravó el proceso. La Reserva Federal, tras bajar las tasas, endureció bruscamente el crédito ante la crisis mundial y la salida de oro, aunque el país tenía el 40 % del oro mundial: una restricción innecesaria (aunque Baines no comparte la tesis de Friedman de que la oferta monetaria explica toda la depresión). Hoover veía la depresión como una «purga» y sus organismos, la RFC y la Federal Farm Board, resultaron insuficientes. Por eso Baines cree que, pese a la debilidad estructural, el derrumbe probablemente pudo evitarse; de hecho, la propia crisis bancaria prolongó la depresión hasta 1933, agravada por cuatro meses sin conducción entre la elección y la asunción. La salida fue rápida porque era una crisis de confianza: Roosevelt decretó un feriado bancario, en su primera «charla junto al fuego» aseguró que los bancos eran seguros y la gente volvió a depositar. Luego reformó el sistema con el seguro de depósitos (FDIC) y la SEC, y casi no hubo más quiebras.","errores_comunes":["Ubicar la crisis bancaria solo en octubre de 1929: las oleadas de quiebras fueron entre 1930 y 1933.","Atribuir a Roosevelt la creación de la RFC: la creó Hoover; Roosevelt la amplió.","Decir que la Reserva Federal no tenía margen por falta de oro: el país tenía el 40 % del oro monetario mundial.","Presentar el derrumbe como inevitable o explicar la solución de 1933 por una inyección de dinero: Baines cree que probablemente pudo evitarse y atribuye la salida a la recuperación de la confianza."],"pag":"pp. 298-301, 306-307"},{"id":"bai-d-m3","tema":"P5","nivel":"muy_dificil","consigna":"Analice: «El New Deal fue un fracaso porque no sacó a Estados Unidos de la depresión». ¿Qué evaluación hace Baines? Considere los objetivos del primer y del segundo New Deal, los resultados económicos, la política fiscal y su legado.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Resultados económicos limitados","detalle":"Reconocer los límites: según Baines, PNB debajo de 1929 hasta la guerra; renta per cápita recuperada recién en 1940 con el rearme; 9-10 millones de parados cada invierno; inversión privada sin recuperarse: «década perdida».","peso":3,"indicios":[["no se recuper","no recuper","por debajo","debajo de","decada perdida","no fue un exito total","no logro","limitad"],["desemple","parados","desocupados","rearme","inversion privada","per capita"]]},{"id":"b","punto":"No prueba el fracaso: objetivos múltiples","detalle":"Argumentar que sin el New Deal habría sido peor y que perseguía también la asistencia y la reforma, no solo la recuperación.","peso":3,"indicios":[["habria sido peor","hubiera sido peor","seria peor","aun peor","mucho peor","habria caido","no prueba","no demuestra","no fue un fracaso","no significa"],["asistencia","asistir","reforma","reformar"]]},{"id":"c","punto":"Objetivos contradictorios","detalle":"Explicar que los objetivos chocaban: subsidiar a demasiados agricultores (AAA) y la NRA (precios para beneficios frente a salarios); Roosevelt no tenía estrategia global.","peso":2,"indicios":[["contradict","contradec","excluyent","incompatib","choca"],["aaa","nra","agricult","salari"]]},{"id":"d","punto":"Gasto insuficiente: no keynesiano","detalle":"Señalar que el déficit fue chico (nunca más del 5 % de la renta) y pagado en parte con impuestos; Roosevelt no aplicaba a Keynes y, al cortar el déficit en 1936-1937, la economía recayó.","peso":3,"indicios":[["deficit","gasto publico","keynes","poder adquisitivo"],["chico","pequen","insuficien","escas","impuesto","no conoc","no aplic","limitad"]]},{"id":"e","punto":"Logros: confianza, bancos, reformas","detalle":"Valorar logros: feriado bancario y confianza, reforma financiera, TVA, reformas del segundo New Deal (Ley Wagner, seguridad social).","peso":2,"indicios":[["confianza","feriado","tva","wagner","seguridad social","fdic"]]},{"id":"f","punto":"Legado: salvó al capitalismo","detalle":"Concluir que salvó al capitalismo, aumentó el poder federal y presidencial y «revolucionó las expectativas».","peso":2,"indicios":[["salvo al capitalismo","salvo el capitalismo","salvando al capitalismo","salvador del capitalismo","rescato al capitalismo","poder federal","poder del gobierno federal","poder del presidente","poder presidencial","expectativ"]]}],"respuesta_modelo":"La afirmación es parcialmente correcta, pero Baines la matiza. Es cierto que el New Deal no logró una recuperación plena: según Baines, el PNB seguía por debajo de 1929 al estallar la guerra, la renta per cápita real solo recuperó ese nivel en 1940, cuando el motor era el rearme, cada invierno había 9 o 10 millones de parados y la inversión privada nunca se recuperó; económicamente, los años treinta fueron una «década perdida». Sin embargo, Baines sostiene que eso no prueba un fracaso. En primer lugar, sin el New Deal la caída habría sido mucho mayor. En segundo lugar, la recuperación no era su único objetivo: debía asistir a los hambrientos y a los agricultores arruinados y, con el tiempo, reformar el orden económico para evitar otro 1929; ese fue el sentido del giro del segundo New Deal hacia los sindicatos (Ley Wagner), la seguridad social y los impuestos progresivos. El problema es que esos objetivos se contradecían: subsidiar con la AAA a agricultores que deberían haber dejado el campo no ayudaba a la recuperación, y la NRA quería subir los beneficios empresarios y a la vez los salarios; además, Roosevelt no tenía una estrategia global. Para Baines la clave económica fue fiscal: lo que importaba era el volumen del gasto público, y el déficit fue chico (nunca superó el 5 % de la renta nacional), en buena parte se pagó con impuestos y Roosevelt no conocía las recetas de Keynes; cuando en 1936-1937 eliminó el déficit, la economía recayó. Aun así hubo logros: el feriado bancario resolvió una crisis de confianza, la reforma financiera evitó nuevas quiebras, la TVA fue un éxito admirado y un gobierno decidido a actuar levantó la moral. Por último, el New Deal no fue hostil a los empresarios: al evitar soluciones radicales salvó al capitalismo, aumentó de manera duradera el poder del gobierno federal y del presidente y su verdadero legado fue «revolucionar las expectativas».","errores_comunes":["Concluir que fue un éxito total que terminó con el desempleo: Baines lo niega.","Concluir que fue un fracaso total: Baines dice que sin él la depresión habría sido peor y que tenía otros objetivos.","Atribuir los límites del New Deal a un gasto excesivo: para Baines el problema fue que el gasto y el déficit fueron chicos.","Presentar al New Deal como socialista o anticapitalista: Baines dice que salvó al capitalismo."],"pag":"pp. 309-310, 317, 320-323"}]},{"id":"gross","autor":"Stephen G. Gross","obra":"La economía nazi (cap. 16 de A Companion to Nazi Germany, eds. Baranowski, Nolzen y Szejnmann, 2018) — traducción de la cátedra a cargo de Rodolfo Battagliese","temas":["P6"],"resumen":[{"titulo":"Introducción: el debate y la tesis de Gross","puntos":["La economía nazi se discute desde 1933: la izquierda la vio como **instrumento del capitalismo monopolista** y la derecha negó todo vínculo estructural con el capitalismo. Entre ambos polos: «**economía vampírica**», «**capitalismo de crisis con garrote**», «**socialismo heterodoxo**».","**Franz Neumann** (1942) ya planteó los cuatro ejes que Gross retoma: **imperialismo**, **crisis y comercio exterior**, **orientación estatal de la industria privada** y **«arianización»**, que explican la recuperación, la colaboración empresaria y la guerra.","**Tesis**: los nazis comenzaron a desvincular a Alemania (históricamente dependiente del comercio exterior) del mercado mundial y la prepararon para la guerra. Crearon una **economía capitalista fuertemente dirigista**, a veces coercitiva, **plagada de amiguismo** y orientada a la expansión imperial, la producción militar y el despojo de los judíos.","Conservaron la **competencia y la ganancia** como incentivos, pero **condicionaron la propiedad privada** a su agenda racial y transformaron precios y salarios."],"pags":"PDF p. 1"},{"titulo":"Imperialismo: semiperiferia, Lebensraum e ideología racial","puntos":["La búsqueda de **mercados imperiales** unió al régimen con la industria: muchos empresarios creían que un imperio resolvería sus problemas.","Para **Tooze**, Alemania era una economía **semiperiférica**: buen nivel de vida, pero inferior al de Gran Bretaña y EE.UU., con industria moderna y agro atrasado.","Con EE.UU. como modelo (gran mercado interno y materias primas propias), Hitler quería un continente propio, el **Lebensraum** («espacio vital»), con recursos y mercados para la **producción en masa**.","Explicaciones estructurales: para los marxistas (**Anievas**), el Lebensraum fue el más radical de los **bloques económicos** nacidos de la sobreproducción y del colapso comercial; para los liberales (**Frieden**), la clave es el **endeudamiento externo**: los países de ingreso medio («la clase media de las naciones») repudiaron sus deudas en la Depresión y giraron al nacionalismo económico.","Gross les objeta que pierden lo específico del caso nazi: la **centralidad de la ideología racial** (lucha contra una supuesta conspiración judía mundial y desprecio por los eslavos, que ubicaba el imperio en **Europa del Este**)."],"pags":"PDF pp. 2-3"},{"titulo":"Imperio informal: el comercio con el sudeste europeo y España","puntos":["Gross distingue **imperio informal** (penetración comercial sin control político) e **imperio formal** (dominio territorial). Ya antes de 1933, varias élites buscaron una vía intermedia entre comercio global y **autarquía**: el **sudeste y sur de Europa**.","Herramientas: **acuerdos de compensación** y **tratados bilaterales** (surgidos de las crisis de 1931); **HISMA-ROWAK**, que en la Guerra Civil Española convirtió deudas de Franco en propiedad alemana de empresas españolas; e inversiones del **Mitteleuropäische Wirtschaftstag** para que el sudeste proveyera materias primas.","**Hjalmar Schacht** encarnó esta vía: comercio sin la volatilidad mundial y control de la política económica de países como **Yugoslavia** o España, sin quitarles soberanía.","Hitler usó el comercio bilateral para obtener insumos del rearme **sin gastar divisas**, pero lo veía como **transitorio**: el poder debía apoyarse en un **imperio territorial formal**."],"pags":"PDF pp. 3-4"},{"titulo":"Crisis y comercio exterior: la dialéctica crisis-regulación","puntos":["Los proyectos imperiales y el rearme provocaron **crisis** que el régimen aprovechó para **extender el control estatal**, un mecanismo que venía de fines de Weimar.","Tras 1933 se intensificó por tres factores: el **descrédito del laissez-faire y del patrón oro**; el fracaso de la cooperación internacional y el proteccionismo ajeno; y, sobre todo, el **rearme**, que obligaba a importar petróleo y hierro, agotaba las **divisas** y ampliaba el **déficit comercial**.","Se formó así una **dialéctica**: cada crisis del comercio exterior habilitaba más regulación, que a su vez generaba nuevas crisis.","**1934**: Schacht suspende el pago de la deuda externa y crea el **Nuevo Plan** (divisas asignadas según las prioridades del rearme). **1936**: **Plan Cuatrienal** (sintéticos, nacionalización de algunos yacimientos de carbón, más control del comercio), con alivio solo temporario. **Fines de 1938**: nueva crisis.","**Mason**: la guerra fue una salida a esa crisis y permitía imponer sacrificios imposibles en paz. **Overy**: es un relato de ilusiones británicas y conservadores; Alemania solo tenía fricciones normales. Gross: el vínculo no es tan directo, pero en el comercio vale la «**profecía autocumplida**» de **Kaiser** (el rearme aumentó la dependencia y adelantó la conquista); **Austria y Checoslovaquia** aportaron minerales y divisas."],"pags":"PDF pp. 4-5"},{"titulo":"¿Keynesianismo? La salida de la Depresión","puntos":["La lectura **protokeynesiana** destaca que unos 5 millones volvieron a trabajar hacia 1936, con obras a crédito, autopistas, Volkswagen y préstamos matrimoniales, pagados con déficit y emisión.","Gross la corrige (**Buchheim**): la inversión privada ya crecía a fines de 1932, el clima de negocios mejoró sobre todo por la **destrucción de los sindicatos** y los programas de empleo se **heredaron de Weimar**.","Desde 1934 el **gasto militar** triplicaba al civil; las autopistas se aceleraron recién en 1936, con pleno empleo; y antes del Plan Cuatrienal déficit, emisión y deuda (≈50% del PIB) eran normales.","Conclusión: no fue **más keynesiano** que otros países; se recuperó más rápido porque **militarizó su economía** antes que Gran Bretaña y EE.UU."],"pags":"PDF pp. 5-6"},{"titulo":"¿Economía dirigida? Estado, empresas y amiguismo","puntos":["A favor de una economía dirigida: **propiedad** condicionada (expropiación de **Junkers**, 1933; **Reichswerke Hermann Göring**, 1937), asignación estatal de divisas, materias primas y capital, el Estado como mayor cliente y congelamiento de **salarios (1933)** y **precios (1936)**.","En contra: entre 1937 y 1942 no estaba claro quién mandaba; era una **policracia** de organismos con metas cruzadas, que las empresas aprovechaban para conservar autonomía.","El régimen combinó **garro
