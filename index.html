a y media baja (bonos, pensiones, depósitos, seguros) y no hubo compensación justa para los acreedores.","peso":3,"indicios":[["ahorr","pension","bono","seguro","acreedor"],["clase media","mittelstand","media baja","burgues"]]},{"id":"f","punto":"Crisis de Weimar y voto nazi","detalle":"El resentimiento rompió el vínculo con los partidos burgueses, fragmentó el sistema y benefició a la extrema derecha: el Mittelstand aportó probablemente más de la mitad del voto nazi.","peso":3,"indicios":[["nazi","extrema derecha","hitler","nacionalsocial"],["vot","electora","fragment","escision","mitad","weimar","partidos burgueses","partidos tradicionales"]]},{"id":"g","punto":"Costo económico de la inflación","detalle":"Para el autor, la inflación retrasó la normalización: hubo una crisis tras la estabilización y el crecimiento de los años veinte fue débil.","peso":1,"indicios":[["estabiliz","estanca"],["retras","normalidad","normaliz","convencional","locomotora","debil"]]}],"respuesta_modelo":"Según Aldcroft, el Tratado de Versalles impuso a Alemania pérdidas territoriales y de activos, un control de seguridad (desmilitarización y ocupación de zonas clave) y reparaciones. Aunque luego las exigencias se redujeron, una carga que parecía imposible y la cláusula de culpabilidad generaron desde el inicio un fuerte resentimiento contra los vencedores. Siguiendo a Fischer, el autor sostiene que el problema no era la capacidad de pago sino la falta de voluntad política y psicológica: los pagos del Plan Dawes (1924) no pasaban, en promedio, del 2% de la renta. Antes de Dawes, la resistencia se expresó emitiendo dinero, y el marco se hundió en 1923, con la ocupación del Ruhr. En lo económico, la inflación retrasó la normalización y fue seguida por una crisis al estabilizar. En lo político, borró los ahorros de la clase media (bonos, pensiones, seguros); sin compensación, ese sector rompió con los partidos burgueses, lo que debilitó a la República de Weimar y favoreció a la extrema derecha: el Mittelstand aportó probablemente más de la mitad del voto nazi.","errores_comunes":["Decir que las reparaciones eran impagables: Aldcroft relativiza esa idea (el problema era de voluntad; los pagos del Plan Dawes no superaban en promedio el 2% de la renta).","Ubicar el inicio de la inflación en 1923: ese año es el hundimiento definitivo del marco, con la ocupación del Ruhr; la emisión venía de antes.","Atribuir a Alemania el corte de vías de comunicación y de transportes, que el texto describe para los Estados surgidos de Austria-Hungría.","Decir que el voto nazi vino de los obreros arruinados: el texto señala a la clase media (Mittelstand), que incluía a la mayoría de los acreedores."],"pag":"pp. 47-48"},{"id":"ald-d-d1","tema":"P1","nivel":"dificil","consigna":"Explique por qué, según Aldcroft, la reorganización territorial de Europa tras la Primera Guerra Mundial debilitó al continente política y económicamente en lugar de estabilizarlo. Relacione las decisiones de los tratados con sus consecuencias.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Mayor remodelación territorial de la historia","detalle":"Los tratados redibujaron el mapa de casi todos los países; nacieron o renacieron Polonia, Checoslovaquia y Yugoslavia, y pocos quedaron conformes (litigios fronterizos).","peso":1,"indicios":[["polonia","checoslov","yugoslav","mapa"],["frontera","litig","remodel","redibuj","nuevos estados"]]},{"id":"b","punto":"Paradoja del principio de nacionalidades","detalle":"El criterio de Wilson de dar Estado a grupos étnicos homogéneos terminó en Estados con mezclas heterogéneas de nacionalidades y conflictos étnicos.","peso":2,"indicios":[["wilson","nacionalidad","etnic"],["heterog","mezcla","minoria","homogen"]]},{"id":"c","punto":"Desmembramiento de Austria-Hungría","detalle":"Se perdió la unidad orgánica y el mercado común del Imperio; los Estados sucesores eran débiles y quedaron peor económicamente que antes de la guerra.","peso":3,"indicios":[["austro","austria","habsburgo","imperio"],["desmembr","fragment","divid","mercado","unidad","desintegr"]]},{"id":"d","punto":"Fronteras sin lógica económica","detalle":"Se trazaron fronteras sin atender a la integridad económica (Polonia con tres segmentos; Austria y Hungría con restos): administraciones creadas desde cero, comunicaciones y rutas cortadas, industrias separadas de materias primas y mercados, aranceles.","peso":3,"indicios":[["comunicac","transporte","ruta","vias","materias primas","integridad","sentido economico"],["cort","separ","arancel","sin tener en cuenta","escasa atencion","polonia","hungria"]]},{"id":"e","punto":"Reconstrucción sin plan e inflación","detalle":"Abandonados por los aliados y por EE.UU., los países recurrieron a inflación, depreciación y controles: estímulo inicial pero costos mayores; producción de 1925 por debajo de 1913, con Checoslovaquia como excepción.","peso":2,"indicios":[["inflac","depreci"],["sin plan","ningun plan","no hubo un plan","abandon","checoslov","costo","perjuic"]]},{"id":"f","punto":"Vacío de poder y camino a la guerra","detalle":"La desintegración dejó un vacío de poder que ocuparía una potencia depredadora, Alemania (por Versalles, su expansión al Este y la pasividad franco-británica): ahí está la semilla de la Segunda Guerra.","peso":3,"indicios":[["vacio","equilibrio de poder","depredador","satelite"],["alemania","segunda guerra","hitler","conflagr","expansion"]]}],"respuesta_modelo":"Aldcroft sostiene que la nueva organización territorial generó más problemas de los que solucionó. Los tratados produjeron la mayor remodelación del mapa europeo de la historia: casi todos los países cambiaron sus fronteras y surgieron o renacieron Estados como Polonia, Checoslovaquia y Yugoslavia, pero pocos quedaron conformes. Paradójicamente, el principio de Wilson de reconocer naciones étnicamente homogéneas dio lugar a Estados con mezclas heterogéneas de nacionalidades y a litigios fronterizos.\nSin embargo, para el autor lo más grave no fue lo étnico sino lo económico y lo político. El desmembramiento del Imperio austro-húngaro destruyó una unidad que funcionaba como mercado común y dejó Estados débiles. Las fronteras se trazaron sin atender a la integridad económica: Polonia debió integrar tres partes muy distintas y Austria y Hungría armar economías viables con restos del Imperio. Se cortaron comunicaciones y lazos comerciales, los centros industriales quedaron separados de sus materias primas y mercados, y las rutas se llenaron de aranceles.\nComo los aliados y Estados Unidos no impulsaron ningún plan de reconstrucción, estos países recurrieron a la inflación y la depreciación, cuyos costos superaron a los beneficios: en 1925 la producción seguía por debajo de 1913, salvo en Checoslovaquia. Por último, la debilidad de la región dejó un vacío de poder que ocupó Alemania, impulsada por el resentimiento de Versalles y su afán de expansión hacia el Este: allí estaba la semilla de la Segunda Guerra Mundial.","errores_comunes":["Decir que el problema principal fue étnico: Aldcroft dice que la cuestión étnica fue mucho menos grave que las consecuencias políticas y económicas.","Sostener que se priorizaron las unidades económicas sobre la coherencia étnica: para el autor faltaron ambas (el mapa prestó escasa atención a lo económico).","Ubicar la semilla de la Segunda Guerra en la ocupación del Ruhr: Aldcroft la ubica en el vacío de poder de Europa central y oriental.","Aplicar a Alemania el corte de comunicaciones y rutas, que el texto refiere a los Estados sucesores de Austria-Hungría."],"pag":"pp. 45-47"},{"id":"ald-d-d2","tema":"P2","nivel":"dificil","consigna":"Explique, según Aldcroft, cómo se encadenaron las reparaciones, la inflación y la crisis política de la República de Weimar. Justifique con argumentos y datos del texto.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Peso de la carga y capacidad de pago","detalle":"Antes del Plan Dawes la carga era muy pesada (20.000 millones de marcos-oro, más del 10% de la renta; luego 3.000 millones anuales), pero el problema era más de voluntad política y psicológica que de capacidad (Fischer; los pagos de Dawes no superaban el 2% de la renta).","peso":2,"indicios":[["voluntad","disposic","psicolog","dawes","fischer","sobrevalor"],["pesad","elevad","renta nacional","londres","marcos oro"]]},{"id":"b","punto":"Aliados divididos, sin plan común","detalle":"Francia buscaba seguridad y compensación, Gran Bretaña era ambivalente y EE.UU. vacilaba y no ligó reparaciones con deudas de guerra: Alemania no podía apoyarse en los aliados.","peso":1,"indicios":[["francia","breta","inglaterra","estados unidos","eeuu","aliad"],["discrepan","desacuerdo","ambival","vacil","sin plan","plan comun","deudas de guerra","divid"]]},{"id":"c","punto":"Resistencia mediante la emisión","detalle":"La negativa a aceptar la carga llevó a demostrar la imposibilidad de pagar emitiendo dinero; según Holtfrerich, ningún gobierno podía pagar sin inflación.","peso":3,"indicios":[["emiti","emisi","imprimi","maquinita"],["protest","demostr","imposib","resist","holtfrerich"]]},{"id":"d","punto":"1923: Ruhr y colapso del marco","detalle":"El marco se derrumbó definitivamente en 1923, mientras Francia y Bélgica ocupaban el Ruhr con el pretexto de la falta de pago.","peso":2,"indicios":[["ruhr"],["hund","colaps","derrumb","hiperinflac","ocupa"]]},{"id":"e","punto":"Efectos económicos: visión convencional","detalle":"Aldcroft se inclina por la visión convencional: la inflación retrasó la normalización, hubo una crisis tras la estabilización y el crecimiento fue débil.","peso":1,"indicios":[["estabiliz","estanca"],["retras","normalidad","convencional","locomotora","debil"]]},{"id":"f","punto":"Ahorros de la clase media destruidos","detalle":"Se perdió la mayor parte de los ahorros (31 millones de cuentas, más de 25.000 millones de marcos en bonos, pensiones, bancos y seguros) y no hubo compensación justa para los acreedores.","peso":3,"indicios":[["ahorr","pension","bono","seguro","acreedor"],["clase media","mittelstand","burgues","media baja","compensa"]]},{"id":"g","punto":"Ruptura política y extrema derecha","detalle":"El resentimiento quebró la identificación con los partidos burgueses de centro y derecha, fragmentó el sistema y benefició a la extrema derecha: el Mittelstand fue probablemente más de la mitad del voto nazi.","peso":3,"indicios":[["nazi","extrema derecha","hitler"],["partido","vot","electora","fragment","escision","mitad"]]}],"respuesta_modelo":"Aldcroft muestra una cadena que va de las reparaciones a la crisis de Weimar. Antes del Plan Dawes, la carga era muy pesada: 20.000 millones de marcos-oro antes de mayo de 1921, más del 10% de la renta nacional, reducidos luego a 3.000 millones anuales. Siguiendo a Fischer, el autor aclara que el problema no era la capacidad productiva sino la falta de disposición política y psicológica a aceptar la culpa y pagar: los pagos del Plan Dawes (1924) no pasaban, en promedio, del 2% de la renta. Además, los aliados no tenían un plan común: Francia buscaba seguridad y compensación, Gran Bretaña era ambivalente y Estados Unidos se mantenía al margen.\nFracasada la protesta verbal, la resistencia tomó la forma de demostrar que era imposible pagar emitiendo dinero; según Holtfrerich, ningún gobierno podía cumplir sin inflación. El marco se hundió definitivamente en 1923, durante la ocupación del Ruhr. En lo económico, Aldcroft cree que la inflación retrasó la normalización, ya que siguió una crisis tras la estabilización.\nHay más acuerdo sobre sus efectos políticos: destruyó los ahorros de la clase media y media baja, invertidos en bonos, pensiones, bancos y seguros, y como no hubo compensación justa a los acreedores se generó un fuerte resentimiento. Ese sector rompió con los partidos burgueses de centro y derecha, lo que fragmentó el sistema y desestabilizó la República. La gran beneficiaria fue la extrema derecha: el Mittelstand aportó probablemente más de la mitad del voto nazi.","errores_comunes":["Afirmar que la inflación empezó con la ocupación del Ruhr: 1923 es el colapso final; la idea de resistir emitiendo dinero ya se planteaba a comienzos de 1919.","Decir que el Plan Dawes causó la hiperinflación: es de 1924, posterior, y sus pagos eran modestos.","Sostener que las reparaciones eran impagables por falta de capacidad productiva: Aldcroft, con Fischer, dice que faltaba voluntad política y psicológica.","Presentar la inflación como causa única y directa del nazismo: el texto describe un mecanismo (ahorros perdidos, resentimiento, ruptura con los partidos burgueses) y la considera un factor significativo de la desintegración de Weimar."],"pag":"pp. 47-48"},{"id":"ald-d-md1","tema":"P1","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «El problema de la Europa de los años veinte fue que no logró volver al orden económico anterior a 1914». ¿Es correcta según Aldcroft? Justifique con los argumentos del autor sobre el restablecimiento del statu quo, los problemas estructurales y la decadencia de Europa.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"La afirmación invierte el argumento","detalle":"Para Aldcroft el error fue justamente priorizar la vuelta al orden liberal del siglo XIX (sin controles, libre comercio y sobre todo patrón oro) en lugar de encarar la reconstrucción.","peso":3,"indicios":[["patron oro","patron de oro","libre comercio","liberal","siglo xix","preguerra"],["error","equivoc","empen","priori","descuid","invier","al contrario","parte del problema","incorrecta","no es correcta","falsa"]]},{"id":"b","punto":"El orden de preguerra no era tan estable","detalle":"Keynes ya había advertido que la economía previa a 1914 era excepcional e inestable; y el propio Aldcroft señala que el aparente éxito del patrón oro se apoyó en la armonía entre los países y en el liderazgo británico.","peso":2,"indicios":[["keynes","excepcional","armonia","liderazgo","hegemon"],["preguerra","antes de la guerra","siglo xix","previa","prebelic"]]},{"id":"c","punto":"El mundo había cambiado","detalle":"No se comprendieron los cambios de 1914-1920: costos y precios relativos distintos, debilidad británica y ascenso de EE.UU. como acreedor.","peso":2,"indicios":[["costo","precio","acreedor","debilit"],["estados unidos","eeuu","breta","inglaterra","britanic"]]},{"id":"d","punto":"Restauración desordenada e inestable","detalle":"Se estabilizó país por país, sin plan ni coordinación, con paridades desequilibradas (libra sobrevaluada; francos francés y belga subvaluados), sin líder ni aceptación de las reglas del juego; el sistema fue fuente de inestabilidad y propagó la depresión.","peso":3,"indicios":[["paridad","tipo de cambio","tipos de cambio","patron oro","sobrevalu","subvalu"],["desequilib","coordin","sin plan","separado","lider","propag","transmi","reglas del juego"]]},{"id":"e","punto":"Se descuidó el cambio estructural","detalle":"La verdadera tarea —reconstruir y transformar estructuras con exceso de capacidad, agricultura ineficiente e industrias básicas en decadencia— quedó relegada; para Svennilson fue una larga crisis de transformación estructural.","peso":3,"indicios":[["capacidad","industrias basicas","agricultura","transforma","svennilson","exceso"],["reconstru","descuid","adapt","ajuste","rigid","relegad"]]},{"id":"f","punto":"Estabilidad superficial y decadencia","detalle":"La estabilidad de fines de los veinte fue superficial (Sally Marks): capital prestado y vulnerabilidad; Europa perdió peso mundial y el centro de gravedad pasó al oeste.","peso":2,"indicios":[["superficial","aparente","prestad","prestamo","credito","fragil","ficticia","endeud"],["gravedad","export","depresion","treinta","vulnerab","supremac","oeste","shock","perturbac"]]}],"respuesta_modelo":"La afirmación es incorrecta según Aldcroft, porque invierte su argumento. Para el autor, el problema no fue no poder volver al orden anterior a 1914, sino haberse empeñado en volver a él. Los políticos veían como prioridad restaurar cuanto antes el sistema liberal del siglo XIX —sin controles, con libre comercio y sobre todo con patrón oro, al que le tenían una fe casi mística— y por eso descuidaron la verdadera tarea de reconstruir Europa.\nEsa meta era equivocada por dos motivos. Primero, Keynes ya había advertido que la economía previa a 1914 era excepcional e inestable, y el propio Aldcroft señala que el aparente éxito del patrón oro se había apoyado en la armonía entre los países y en el liderazgo británico. Segundo, entre 1914 y 1920 el mundo había cambiado: se alteraron los costos y precios relativos, Gran Bretaña se debilitó y Estados Unidos pasó a ser un gran acreedor.\nAdemás, la restauración se hizo mal: cada país estabilizó por separado y sin plan común, con paridades desequilibradas (la libra sobrevaluada; los francos francés y belga, subvaluados). Pocos países querían sacrificar su estabilidad interna para respetar las reglas del juego, y el sistema quedó sin líder. Lejos de estabilizar, fue fuente de inestabilidad y, al llegar la depresión, la propagó.\nMientras tanto, lo que realmente hacía falta quedó relegado. Según Svennilson, el período fue una larga crisis de transformación estructural: exceso de capacidad en industrias tradicionales, agricultura ineficiente, desempleo y exportaciones concentradas en sectores en decadencia.\nPor eso la estabilidad de fines de los años veinte fue superficial: muchos países vivían de capital prestado y eran vulnerables a cualquier shock. Y Europa, que ya había perdido su supremacía con la guerra (el centro de gravedad se había corrido al oeste), no la recuperó: entre 1913 y 1929 su parte en las exportaciones mundiales bajó del 58,9% al 48%. En síntesis, para Aldcroft el apego al statu quo fue parte del problema, no la solución que faltó.","errores_comunes":["Aceptar la afirmación y proponer que había que restaurar más rápido el patrón oro: para Aldcroft esa prioridad fue un error.","Suponer que el orden anterior a 1914 era estable por naturaleza: el autor, con Keynes, lo considera excepcional e inestable.","Culpar solo al patrón oro de la crisis de 1929: Aldcroft dice que es cuestionable atribuírsela solo a él, aunque sí propagó la depresión.","Olvidar los problemas estructurales, que el autor considera de importancia más trascendental para la economía real."],"pag":"pp. 45, 48-50"},{"id":"ald-d-md2","tema":"P2","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «Las reparaciones eran impagables; por eso Alemania cayó en la hiperinflación, y la hiperinflación llevó a Hitler al poder». ¿Qué conserva y qué corrige Aldcroft de este razonamiento? Justifique.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Corrige: no eran técnicamente impagables","detalle":"Siguiendo a Fischer, el problema se sobrevaloró: Alemania conservaba potencial productivo y lo que faltaba era disposición política y psicológica a aceptar culpa y pagos. Los pagos del Plan Dawes, que no superaban en promedio el 2% de la renta, estaban a su alcance.","peso":3,"indicios":[["voluntad","disposic","psicolog","dawes","fischer","sobrevalor"]]},{"id":"b","punto":"Conserva: la carga inicial era muy pesada","detalle":"Antes de Dawes las exigencias eran muy elevadas (más del 10% de la renta; luego 5-6%) y los aliados no tenían un plan común, así que Alemania no podía apoyarse en ellos.","peso":2,"indicios":[["pesad","elevad","excesiv","renta nacional"],["antes de dawes","antes del plan","londres","inicial","al principio","aliad"]]},{"id":"c","punto":"Conserva: vínculo reparaciones-inflación","detalle":"La resistencia a pagar se expresó emitiendo dinero y, según Holtfrerich, ningún gobierno podía pagar sin inflación; el marco colapsó en 1923, con la ocupación del Ruhr.","peso":3,"indicios":[["emiti","emisi","imprimi","maquinita","inflac"],["ruhr","protest","demostr","holtfrerich"]]},{"id":"d","punto":"Matiz: un acuerdo moderado quizá no alcanzaba","detalle":"Aldcroft duda de que un acuerdo anterior y más moderado hubiera aliviado la situación, por la hostilidad alemana hacia todo lo ligado a la culpa y las indemnizaciones.","peso":1,"indicios":[["moderad","acuerdo anterior"],["hostil","dudoso","duda"]]},{"id":"e","punto":"Corrige: el puente es la clase media arruinada","detalle":"La inflación no lleva directamente a Hitler: destruyó los ahorros de la clase media (bonos, pensiones, seguros) y, sin compensación, el resentimiento rompió su lealtad con los partidos burgueses de centro y derecha.","peso":3,"indicios":[["ahorr","pension","bono","seguro","acreedor"],["clase media","mittelstand","burgues","media baja"]]},{"id":"f","punto":"Fragmentación y voto nazi","detalle":"Hubo escisión partidaria e inestabilidad; la extrema derecha fue la gran beneficiaria y el Mittelstand aportó probablemente más de la mitad del voto nazi. La inflación es un factor significativo de la caída de Weimar, no la única causa.","peso":2,"indicios":[["nazi","extrema derecha","nacionalsocial"],["vot","electora","fragment","escision","mitad"]]},{"id":"g","punto":"Otro origen del resentimiento: Versalles","detalle":"El resentimiento también nacía de Versalles y la cláusula de culpabilidad, y las ambiciones de expansión al Este ya eran visibles en los años veinte, con Hitler o sin él.","peso":1,"indicios":[["culpab","clausula","versalles"],["resentim","rencor","humill","vencedor"]]}],"respuesta_modelo":"El razonamiento tiene una parte de verdad, pero Aldcroft lo corrige en sus dos extremos.\nPrimero, las reparaciones no eran técnicamente impagables. Siguiendo a Fischer, el autor sostiene que el problema se sobrevaloró: Alemania conservaba un enorme potencial productivo, y lo que faltaba era disposición política y psicológica para aceptar la culpa de la guerra y pagar. Lo muestra el Plan Dawes de 1924, cuyos pagos no pasaban, en promedio, del 2% de la renta nacional. Ahora bien, Aldcroft reconoce que antes de Dawes la carga era muy pesada —20.000 millones de marcos-oro, más del 10% de la renta— y que los aliados, divididos, no ofrecían un plan coherente.\nSegundo, conserva el vínculo entre reparaciones e inflación: la resistencia a pagar tomó la forma de demostrar que era imposible hacerlo emitiendo dinero y, como señala Holtfrerich, ningún gobierno podía cumplir sin inflación. El marco se hundió en 1923, durante la ocupación del Ruhr. Aun así, duda de que un acuerdo más moderado y temprano hubiera alcanzado, dada la hostilidad alemana hacia la culpa y las indemnizaciones.\nTercero, el paso de la inflación a Hitler no es directo. La inflación borró los ahorros de la clase media y media baja, invertidos en bonos, pensiones, bancos y seguros. Como no hubo una compensación justa para los acreedores, el resentimiento quebró la identificación con los partidos burgueses de centro y derecha, provocó escisiones e inestabilidad y terminó beneficiando a la extrema derecha: el Mittelstand aportó probablemente más de la mitad del voto nazi. Para Aldcroft es un factor significativo de la desintegración de Weimar, no la única causa; el resentimiento venía también de Versalles y de la cláusula de culpabilidad.\nEn síntesis, la afirmación acierta en la conexión general, pero exagera la imposibilidad de pagar y simplifica el mecanismo político.","errores_comunes":["Aceptar que las reparaciones eran impagables por falta de capacidad: Aldcroft lo relativiza con Fischer y el Plan Dawes.","Presentar la hiperinflación de 1923 como causa inmediata del ascenso de Hitler: el texto describe un efecto político de largo plazo, a través de la clase media.","Confundir a los perjudicados: perdieron los ahorristas y acreedores de clase media (Mittelstand), no los deudores.","Ubicar el Plan Dawes antes de la hiperinflación o presentarlo como su causa."],"pag":"pp. 47-48"}]},{"id":"marichal2","autor":"Carlos Marichal","obra":"Nueva historia de las grandes crisis financieras. Una perspectiva global, 1873-2008 — Capítulo 2: El colapso financiero de 1929: ¿Por qué hubo una gran depresión en los años 30?","temas":["P1","P2","P3","P4","P5"],"resumen":[{"titulo":"Planteo: el legado de la Gran Guerra","pags":"pp. 85-87","puntos":["Keynes, delegado británico en Versalles (1919), se fue antes del final porque los acuerdos llevaban a un desastre político y financiero; Marichal cree que **no le faltaba razón**.","La **Gran Depresión** fue la mayor convulsión económica del siglo XX fuera de las guerras: **global**, con epicentro en Europa y EE.UU., en **varias etapas** y con efectos distintos según el país.","Su antecedente fundamental fue el **legado de la Primera Guerra**: caída de imperios, revolución rusa, sufragio universal y sindicatos complicaron la coordinación; el nacionalismo desplazó a la **cooperación internacional** y pesó la **«fatal ilusión»** de que volver al oro traería la prosperidad de antes de 1914."]},{"titulo":"De la guerra a la paz inestable: inflación y crisis de 1920-1921","pags":"pp. 87-92","puntos":["La guerra fue una **crisis financiera mayor**: desde agosto de 1914 el capitalismo clásico fue reemplazado por un **capitalismo de Estado militarizado** (moneda, banca, crédito, fisco y deudas alterados).","**Inflación de 1919-1920**: desmonte apresurado de los controles de guerra, demanda de empresas que relanzaban la producción de paz y, en Europa continental, la enorme emisión acumulada (materias primas +200% sobre 1914).","Desde mediados de 1920, derrumbe de precios. La Reserva Federal **no bajó las tasas**: evitó pánicos, pero causó una fuerte **deflación** y recesión (precios mayoristas -50% a junio de 1921).","Según **Wicker**, Strong y Norman creían que deflación y quiebras servían para **«curar al paciente»**. Como la crisis fue breve, no vieron el error y la **ortodoxia de no intervenir** siguió vigente hasta 1929.","En Europa central y Rusia, la **libre flotación** (1919) y la emisión dieron inflaciones extremas (Austria ×14.000, Hungría ×17.000). En **Alemania**, gobierno y Reichsbank toleraron la **depreciación del marco** como argumento para no pagar en oro; Francia ocupó el **Ruhr (1923)**."]},{"titulo":"Las reparaciones y la hiperinflación alemana (1922-1923)","pags":"pp. 92-97","puntos":["Las **reparaciones** fueron el mayor «talón de Aquiles» financiero. Versalles impuso una **«paz cartaginense»**: Clemenceau era el más duro y Lloyd George lo apoyó en el cobro de las deudas comerciales. Keynes calculó 40 mil millones de dólares, impagables.","En **Londres (1921)** se fijaron 132 mil millones de marcos y el marco se hundió. Para **Eichengreen**, las reparaciones fueron responsables **«en última instancia»** de la hiperinflación; Marichal agrega el mecanismo: **empresarios y sindicatos** frenaban las reformas fiscales, el déficit no se cerraba y se emitió cada vez más.","**Noviembre de 1923**: normas de reservas, nueva paridad y fin del crédito del banco central al gobierno; la inflación ya había borrado la deuda flotante. Funcionó por un **acuerdo político-social** que volvió creíble el ajuste.","**Cadena de deudas**: sin pagos alemanes, Francia no pagaba a Gran Bretaña ni Europa a EE.UU. Keynes había propuesto cancelar los créditos de guerra; Washington se negó.","**Plan Dawes (1924)**: reducción drástica de las cuotas (según Marichal, a cerca de un décimo de las de 1921), Reichsbank supervisado y empréstito colocado en Nueva York. Paradójicamente, como señala **Schuker**, Wall Street terminó financiando las reparaciones."]},{"titulo":"El regreso al patrón oro (1925-1928) y la diplomacia del dólar","pags":"pp. 97-102","puntos":["Cerca de **50 países** volvieron al oro (Gran Bretaña 1925, Francia 1926) bajo un **patrón de cambio oro**: reservas en oro o en divisas convertibles (sobre todo dólares y libras).","Se buscaba estabilizar las economías, pero para **Kenneth Mouré** no era solo algo técnico: el oro prometía volver al orden de la **belle époque** y despertaba nostalgia.","Pesaban las **deudas públicas heredadas de la guerra**: en Francia su servicio absorbía el 44% del gasto (1927) y la inflación llegó al 350% (1926) hasta la austeridad de **Poincaré**; Alemania, en cambio, había licuado su deuda.","En América Latina triunfó la **diplomacia del dólar** (bonos en Wall Street, misiones de **Kemmerer**); Brasil y la Argentina ya tenían bancos con grandes reservas de oro (Banco do Brasil, Banco de la Nación).","**Nueva York desplazaba a Londres**: América Latina se endeudaba sobre todo para pagar viejas deudas europeas previas a 1914, en un **movimiento triangular** (Nueva York → América Latina → Europa → EE.UU.)."]},{"titulo":"El auge bursátil de los años 20 y las señales de alarma","pags":"pp. 102-107","puntos":["La estabilidad monetaria reactivó el crédito y las bolsas; además fue una etapa de innovación en las industrias **eléctrica, química, petrolera y automotriz**, los bienes durables, la radio y el cine. El lema era **«get rich quick»**.","El auge fue **internacional** (Londres, París desde 1925, Bruselas, Ámsterdam, Berlín y Frankfurt), aunque más atenuado que el de **Wall Street (1922-1929)**.","Según **Eugene White**, había **fundamentos** (crecimiento de más del 4%, desempleo cercano al 3,7%, baja inflación), pero la ilusión de una innovación sin fin y los **fondos de inversión** (de 40 a 750) inflaron el crédito especulativo.","Las alarmas sonaron en Europa: Berlín (1927, con baja coordinada de tasas impulsada por **Strong y Norman**), Bruselas (1928) y París (1929); los capitales huyeron a Nueva York.","La **Reserva Federal subió las tasas**: no frenó la especulación y restringió el crédito productivo. EE.UU. y Francia tenían **más del 60% del oro**, lo que forzó subas de tasas en el resto del mundo.","Desde 1927 caían los precios de exportación latinoamericanos, y en 1929 la especulación cortó las **exportaciones de capital** de EE.UU."]},{"titulo":"El crac de Wall Street, sus mecanismos y sus interpretaciones","pags":"pp. 107-116","puntos":["**Jueves negro (24/10/1929)** y colapso del 29; caen las bolsas europeas. Solo el **2%** de los estadounidenses invertía, pero era el sector que financiaba a las empresas.","**Segunda ola**: quiebras bancarias → menos crédito → caída del consumo y deflación → quiebras de miles de empresas. El **comercio mundial cayó 60%** (1928-1932), agravado por el **proteccionismo** desde 1930.","Interpretaciones: **Friedman y Schwartz** (la Reserva Federal no dio liquidez ni aplicó medidas anticíclicas); **Temin** (caída del consumo y debilidades reales: vivienda, agro, industria); **Bernanke** (la fragilidad financiera contrajo crédito y demanda); **Romer** (incertidumbre tras el crac).","EE.UU. tenía un sistema bancario enorme y **desconcentrado** (casi 24.000 bancos, muchos rurales golpeados por la crisis agrícola): unos 10.000 suspendieron pagos; en marzo de 1933 Roosevelt decretó un feriado bancario.","La quiebra del **Creditanstalt** (mayo de 1931) llevó a Alemania una **crisis doble**, monetaria y bancaria (Balderston); Brüning declaró que no podía seguir pagando reparaciones y cayó el Danatbank."]},{"titulo":"Fracaso de la cooperación y abandono del patrón oro","pags":"pp. 117-122","puntos":["**Eichengreen**: el **apego al oro y a la ortodoxia** dejó sin opciones a casi todos. Gran Bretaña salió el **21/9/1931** y la siguieron 21 países (la Argentina ya en 1929): los que salieron antes se recuperaron antes; EE.UU., Francia y Bélgica, más lento.","Cooperación tardía (recién en 1932 se plantearon reuniones; en 2008-2009 bastaron meses): **moratoria Hoover** (1931) y **Lausana (1932)**, que bajó las reparaciones a menos de mil millones de dólares; EE.UU. solo dio un año de gracia.","La **conferencia de Londres (1933)** fracasó: Roosevelt devaluó y dejó el oro, y el mundo se dividió en **bloques monetarios**. En 1934 (ley Johnson, suspensión de los pagos de deudas de guerra a EE.UU.) murió la cooperación transatlántica."]},{"titulo":"Respuestas a la crisis: liquidacionistas, New Deal y nazismo","pags":"pp. 122-130","puntos":["1929-1932: la producción industrial cayó 46% en EE.UU. y 42% en Alemania, con un cuarto de desocupados. Para **DeLong**, la pasividad se debió a los **liquidacionistas** (Schumpeter, Hayek, Robbins, Mellon): dejar quebrar a las empresas ineficientes.","**New Deal** (desde 1933): para muchos historiadores, probablemente la flexibilización monetaria fue lo que más oxígeno dio, junto con el gasto público y nuevas agencias y leyes (NRA, TVA, seguro social, HOLC, FDIC, SEC, Glass-Steagall).","**Alemania**: Weimar mantuvo una **política fiscal ortodoxa**; con más de 6 millones de desocupados, muchos votaron a los nazis. Según Marichal, **Schacht** impulsó el gasto público, las obras y las autopistas (el gobierno sumó el rearme), mientras el **Estado nazi** disolvía los sindicatos y perseguía a socialdemócratas, comunistas y judíos.","La Depresión fortaleció a Mussolini, polarizó Francia, debilitó a la República española y preparó la **Segunda Guerra**. La recuperación de 1932-1938 fue desigual."]},{"titulo":"América Latina en los años 30","pags":"pp. 130-134","puntos":["Golpe inicial durísimo sobre el comercio; desde 1931, controles de cambio y recortes, y desde 1932, recuperación. **Chile** pagó hasta mediados de 1931; en **Perú**, devaluación y suspensión de pagos fueron de la mano (**Thorp**).","**Brasil** suspendió parcialmente (1932) y **Vargas** industrializó; en **México** el impacto financiero fue menor, quizá porque no pagaba su deuda desde 1914.","Entre los países grandes, la única excepción fue la **Argentina**: siguió pagando tras el pacto **Roca-Runciman (1933)**. Para Marichal, las **moratorias** dieron oxígeno a la región."]}],"conceptos":[{"termino":"Capitalismo de Estado militarizado","def":"Para Marichal, el régimen que reemplazó al capitalismo clásico en buena parte de Europa desde agosto de 1914: el Estado en guerra pasó a controlar producción, comercio, crédito y moneda durante casi cinco años."},{"termino":"Paz cartaginense","def":"Calificativo que recibió el Tratado de Versalles: una paz de castigo que imponía a Alemania pagos y cesiones que su economía no podía afrontar (Clemenceau fue el más empecinado)."},{"termino":"Reparaciones","def":"Pagos exigidos a Alemania por los vencedores (pensiones de guerra y deudas comerciales). Para Marichal, el principal «talón de Aquiles» financiero de los años 20: Londres (1921) las fijó en 132 mil millones de marcos y Lausana (1932) las redujo a menos de mil millones de dólares."},{"termino":"Deudas interaliadas («deudas aliadas»)","def":"Créditos de guerra que EE.UU. y Gran Bretaña dieron a sus aliados (con EE.UU., más de 10 mil millones de dólares). Estaban encadenadas a las reparaciones: si Alemania no pagaba, Francia no podía pagar a Gran Bretaña ni Europa a EE.UU."},{"termino":"Plan Dawes (1924)","def":"Acuerdo surgido de una comisión encabezada por Charles Dawes: redujo drásticamente las cuotas alemanas (según Marichal, a cerca de un décimo de las de 1921), puso al Reichsbank bajo supervisión aliada y se acompañó de un gran empréstito colocado en Nueva York."},{"termino":"Préstamos de EE.UU. que financiaban las reparaciones (Schuker)","def":"Argumento del historiador Stephen Schuker (en el libro, «Schucker») que Marichal retoma: paradójicamente, fueron los mercados financieros estadounidenses, con una cadena de préstamos a Alemania, los que financiaron las reparaciones a los aliados en la segunda mitad de los años 20."},{"termino":"Patrón de cambio oro (gold exchange standard)","def":"Versión del patrón oro restaurada a mediados de los 20 en unos 50 países: los bancos centrales podían respaldar sus monedas con oro o con divisas convertibles, sobre todo dólares y libras."},{"termino":"Ilusión del patrón oro","def":"Tesis de Kenneth Mouré que Marichal retoma: el retorno al oro no fue solo técnico, sino una idea poderosa que prometía volver al orden de la belle époque; el autor habla de una «fatal ilusión»."},{"termino":"Diplomacia del dólar y «money doctors»","def":"Préstamos de Wall Street a América Latina desde 1923 y misiones de expertos estadounidenses como Edwin Kemmerer, que reorganizaron finanzas públicas, crearon bancos centrales andinos y ataron las monedas al oro."},{"termino":"Movimiento triangular","def":"Circuito de los años 20 descrito por un banquero de Seligman: Nueva York prestaba a América Latina, que pagaba rentas a inversores europeos, y Europa usaba esos dólares para pagarle a EE.UU. importaciones y deudas de guerra."},{"termino":"«Fundamentals» vs. especulación","def":"Debate sobre el auge de Wall Street. Según Eugene White, había bases reales (crecimiento, poco desempleo, baja inflación), pero la ilusión tecnológica y el crédito de los fondos de inversión llevaron la bolsa a niveles insostenibles."},{"termino":"Medidas anticíclicas","def":"Políticas que, según Friedman y Schwartz, la Reserva Federal no aplicó: aumentar el dinero y dar liquidez a todos los sectores cuando asoma la recesión, para evitar la caída de la actividad y las quiebras."},{"termino":"Liquidacionistas","def":"Corriente dominante tras 1929 (Schumpeter, Hayek, Robbins; el secretario del Tesoro Mellon) que, según DeLong, aconsejaba no intervenir y dejar quebrar a las empresas ineficientes; explica la pasividad de los bancos centrales."},{"termino":"Crisis doble (Alemania, 1931)","def":"Según Theo Balderston, crisis a la vez monetaria (fuga de capitales, pérdida de reservas del Reichsbank) y bancaria (corridas, cierre del Danatbank), desatada tras la quiebra del Creditanstalt de Viena."},{"termino":"Bloques monetarios","def":"División del mundo tras la conferencia de Londres (1933): bloque del oro (Francia, Bélgica, Holanda, Italia), centroeuropeos con vínculo nominal al oro, área de la libra esterlina y países con monedas inconvertibles; reflejaba tensiones crecientes."}],"cronologia":[{"fecha":"Agosto de 1914","hecho":"Con la guerra, el capitalismo clásico deja de funcionar en buena parte de Europa: capitalismo de Estado militarizado."},{"fecha":"1919","hecho":"Conferencia y Tratado de Versalles («paz cartaginense»); Keynes se retira; la marina alemana hunde su flota (21 de junio) y Alemania ratifica el tratado (7 de julio)."},{"fecha":"1919-1921","hecho":"Gran inflación de posguerra; desde mediados de 1920, derrumbe de precios y deflación en EE.UU. (precios mayoristas -50% a junio de 1921)."},{"fecha":"1921","hecho":"Acuerdo de Londres: reparaciones por 132 mil millones de marcos (31 mil millones de dólares); el marco se desploma."},{"fecha":"1922-1923","hecho":"Hiperinflación alemana; Francia ocupa el Ruhr (1923); estabilización de noviembre de 1923."},{"fecha":"1924","hecho":"Plan Dawes y gran empréstito para Alemania colocado en Nueva York."},{"fecha":"1925-1926","hecho":"Gran Bretaña (1925) y Francia (1926, con Poincaré) vuelven al oro; se generaliza el patrón de cambio oro."},{"fecha":"1927-1928","hecho":"Caída de la bolsa de Berlín (13 de mayo de 1927) y baja coordinada de tasas (Strong y Norman); caída de la bolsa de Bruselas (agosto de 1928)."},{"fecha":"24 y 29 de octubre de 1929","hecho":"Jueves negro y colapso de Wall Street."},{"fecha":"1930","hecho":"EE.UU. ratifica tarifas cada vez más altas a las importaciones y otros países lo imitan; entre noviembre y diciembre caen unos 600 bancos del sur y del medio oeste."},{"fecha":"Mayo-julio de 1931","hecho":"Quiebra del Creditanstalt; Brüning anuncia que Alemania no puede seguir pagando reparaciones (6 de junio); moratoria Hoover (20 de junio); cierre del Danatbank y feriado bancario alemán."},{"fecha":"21 de septiembre de 1931","hecho":"Gran Bretaña abandona el patrón oro; la siguen otros 21 países."},{"fecha":"1932","hecho":"Conferencia de Lausana: las reparaciones bajan a menos de mil millones de dólares. En Alemania, más de 6 millones de desocupados y elecciones de noviembre."},{"fecha":"1933","hecho":"Marzo: feriado bancario de Roosevelt y comienzo del New Deal. Junio: fracasa la conferencia económica de Londres; EE.UU. devalúa y deja de hecho el oro; el mundo se divide en bloques monetarios."},{"fecha":"1934","hecho":"Ley Johnson contra la venta de bonos extranjeros; Gran Bretaña (4 de junio) y luego Francia, Italia y Bélgica suspenden los pagos de sus deudas de guerra a EE.UU."}],"guia":[{"tema":"P1","pregunta":"¿Qué consecuencias económicas y financieras tuvo la Primera Guerra Mundial en Europa? (inflación, deudas, patrón oro)","puntos":["Marco general: la guerra fue una **crisis financiera mayor** para los beligerantes; desde agosto de 1914 el capitalismo clásico fue reemplazado por un **capitalismo de Estado militarizado** que alteró mercados de capitales, moneda, banca, crédito, fisco y deudas.","Legado político que trabó la economía: caída de imperios (austrohúngaro, otomano, ruso), fragmentación y conflictos, sufragio universal y sindicatos; la **cooperación internacional** fue desplazada por el nacionalismo. Para Marichal es el antecedente fundamental de 1929.","**Inflación de 1919-1920**: controles de guerra desmantelados con prisa, demanda de empresas para la paz y emisión acumulada (materias primas +200% sobre 1914). Luego, **crisis de 1920-1921**: derrumbe de precios y deflación (la Reserva Federal no bajó las tasas).","**Inflaciones extremas** en Europa central y Rusia por la libre flotación (1919) y la emisión: Austria ×14.000, Hungría ×17.000, Polonia más de 2 millones de veces; en Alemania, hiperinflación de 1922-1923 (ver P2).","**Deudas**: reparaciones alemanas encadenadas a las **deudas interaliadas** (con EE.UU., más de 10 mil millones de dólares: 42% Gran Bretaña, 34% Francia, 16% Italia). Keynes propuso cancelarlas; Washington se negó.","**Patrón oro**: regreso entre 1924 y 1928 (unos 50 países; Gran Bretaña 1925, Francia 1926) como **patrón de cambio oro** (reservas en oro o en divisas convertibles, sobre todo dólares y libras); para Mouré, además de buscar estabilidad, una **ilusión** de volver a la belle époque. Francia: el servicio de su deuda pública absorbía el 44% del gasto (1927); inflación del 350% hasta **Poincaré** (1926)."],"ojo":"Los apuntes dicen «inflación, patrón oro»: está bien, pero distinguí las dos inflaciones (la general de 1919-1920, por desregulación, demanda y emisión; y las hiperinflaciones de Europa central y Alemania). No digas que la inflación de 1919-1920 la causaron las reparaciones. El patrón oro de los años 20 NO es igual al de antes de 1914: es un patrón de cambio oro."},{"tema":"P2","pregunta":"¿Qué consecuencias económicas y políticas tuvieron para Alemania el Tratado de Versalles y las reparaciones?","puntos":["Versalles (1919), **«paz cartaginense»**: Clemenceau quería castigar (Lloyd George lo apoyó en el cobro de las deudas comerciales; Wilson cedió). Se pedían unos 25 mil millones de dólares para **pensiones de viudas y soldados heridos** más deudas comerciales; Keynes estimó 40 mil millones (más de 2 mil millones por año): impagable.","Tras el hundimiento de la flota alemana (21 de junio de 1919): cesión de colonias, confiscación de inversiones externas, control de parte de la marina mercante y ocupación de la zona del Rin (minas, tierras, navegación).","**Londres (1921)**: 132 mil millones de marcos (31 mil millones de dólares); el marco se desploma. Gobierno y Reichsbank toleran la **depreciación** como argumento para no pagar en oro → **ocupación del Ruhr (1923)** para cobrar en especie.","**Hiperinflación de 1922-1923**: para Eichengreen, las reparaciones fueron responsables «en última instancia». Marichal agrega el mecanismo: déficit crecientes que no se podían cerrar porque empresarios y sindicatos frenaban las reformas fiscales, y emisión acelerada; los comercios terminan fijando precios en dólares.","**Estabilización (noviembre de 1923)**: normas de reservas, nueva paridad, fin del crédito del banco central al gobierno; la inflación había destruido la deuda flotante (más del 50% de la deuda pública). Clave: un **acuerdo político-social** que hizo creíble el ajuste.","**Plan Dawes (1924)**: reducción drástica de las cuotas (según Marichal, a cerca de 1/10 de las de 1921), Reichsbank supervisado por los aliados, empréstito de 800 millones de marcos colocado en Nueva York → paradójicamente, como señala **Schuker**, Wall Street financió las reparaciones.","Desenlace con la Depresión: Creditanstalt → **crisis doble** en Alemania (1931), **Brüning** declara que Alemania no puede seguir pagando, moratoria Hoover, **Lausana 1932** (reparaciones a menos de mil millones de dólares). Weimar, con política fiscal ortodoxa y más de 6 millones de desocupados, abre paso al nazismo."],"ojo":"Marichal **no menciona el plan Young**. Las «pensiones» de tus apuntes son las que los aliados querían cobrarle a Alemania (para viudas y soldados heridos de los países vencedores), no pensiones alemanas. «Tipo de cambio flotante»: en el texto aparece la libre flotación de 1919 en Europa central y el paso de Weimar a tasas flotantes intervenidas en 1930-1931. «Se dificultan los transportes» no aparece en Marichal. Ojo con la cronología: el plan Dawes (1924) es POSTERIOR a la estabilización de 1923."},{"tema":"P3","pregunta":"¿Qué características tuvo la economía de Estados Unidos en la década de 1920 y qué papel financiero cumplió?","puntos":["Arranque: crisis de 1920-1921 (la Reserva Federal no bajó las tasas → deflación, precios mayoristas -50%); expansión desde fines de 1921 y persistencia de la **ortodoxia de no intervención**.","**Nuevas industrias**: eléctrica, química, petrolera y automotriz (más de 4 millones de autos por año en 1927-1928); **bienes durables** ligados a la red eléctrica (heladeras, lámparas, tocadiscos); radio y cine; primeras multinacionales.","Datos de **White**: crecimiento de más del 4% anual, desempleo cercano al 3,7%, inflación baja → **fundamentos** reales del auge bursátil; pero ilusión de innovación sin fin y **fondos de inversión** de 40 (1921) a 750 (1929) → crédito especulativo; «get rich quick».","**Nueva York desplaza a Londres**: préstamos a Alemania (plan Dawes) y a América Latina (más de mil millones de dólares en bonos, 1922-1928), **diplomacia del dólar**, Kemmerer, **movimiento triangular**.","Debilidades según la síntesis de **Temin**: baja de los **precios agrícolas** en un país casi mitad rural, **caída de la construcción de viviendas** en la segunda mitad de la década y retroceso de algunas industrias antes del crac → menos ingresos y consumo.","Fragilidad bancaria (no forma parte de la síntesis de Temin): casi 24.000 bancos, en su mayoría pequeños y rurales, muchos debilitados por la prolongada **crisis agrícola** de los años 20.","Final del auge: la Reserva Federal sube las tasas (no frena la especulación y restringe el crédito productivo); EE.UU. y Francia con más del 60% del oro; en 1929 la especulación absorbe fondos y se cortan las **exportaciones de capital** → golpe a la periferia."],"ojo":"Tus apuntes (de Baines) ponen «construcción, viviendas» como sector en auge: en Marichal la **construcción de viviendas cayó** en la segunda mitad de los 20 y aparece como debilidad. Electricidad y transporte (automotores) sí coinciden. La «sobreoferta» agrícola no aparece en Marichal: él habla de baja de precios y crisis agrícola. No digas que la mayoría invertía en la bolsa: solo el 2% en 1929."},{"tema":"P4","pregunta":"La crisis de la bolsa de 1929 y la Gran Depresión: causas, mecanismos de transmisión y consecuencias.","puntos":["**Antecedente**: el legado de la Primera Guerra (reparaciones y deudas, tensiones políticas, cooperación fallida, «fatal ilusión» del oro).","**Señales previas**: caídas de las bolsas de Berlín (1927), Bruselas (1928) y París (1929); la Reserva Federal sube las tasas sin frenar la especulación; EE.UU. y Francia acumulan más del 60% del oro; precios de materias primas en baja desde 1927; se cortan los préstamos de EE.UU. al exterior.","**Crac**: jueves negro (24/10/1929) y colapso del 29; caen las bolsas europeas; pérdida de riqueza y confianza (solo el 2% invertía, pero era el sector que financiaba a las empresas).","**Mecanismo**: quiebras bancarias («segunda ola») → menos crédito → menos consumo, deflación y quiebras de empresas → comercio mundial -60% (1928-1932), agravado por el **proteccionismo** desde 1930 → depresión.","**Interpretaciones**: Friedman y Schwartz (la Reserva Federal no dio liquidez), Temin (consumo y debilidades reales), Bernanke (crédito → demanda), Romer (incertidumbre), Eichengreen (patrón oro), DeLong (liquidacionistas).","**Bancos**: EE.UU. (600 bancos a fines de 1930, pánico de Chicago en 1932, unos 10.000 suspendidos; feriado bancario de Roosevelt en marzo de 1933); **Creditanstalt** (mayo de 1931) → crisis doble en Alemania, Brüning declara que no puede seguir pagando, cae el Danatbank, feriado bancario.","**Oro y cooperación**: Gran Bretaña sale el 21/9/1931; los que salieron antes se recuperaron antes; moratoria Hoover (1931), Lausana (1932), fracaso de Londres (1933), bloques monetarios, ley Johnson y suspensión de pagos de deudas de guerra (1934).","**Consecuencias**: producción industrial 1929-1932: EE.UU. -46%, Alemania -42%; un cuarto de desocupados; nazismo, Mussolini, polarización en Francia, Guerra Civil española → Segunda Guerra. América Latina: moratorias que dieron oxígeno (entre los países grandes, la única excepción fue la Argentina, que siguió pagando)."],"ojo":"No reduzcas la crisis a la especulación de Wall Street ni a EE.UU.: Marichal la presenta como mundial, con etapas y efectos distintos según el país. Cuidá las atribuciones (Friedman ≠ Temin ≠ Bernanke ≠ Romer ≠ Eichengreen). La salida del oro NO causó la depresión: ayudó a salir de ella. La suba de tasas de la Reserva Federal fue en 1928-1929; la baja coordinada de tasas, en 1927."},{"tema":"P5","pregunta":"El New Deal de Roosevelt: medidas y efectos (lo que aporta Marichal).","puntos":["Contexto: entre 1929 y 1932 las respuestas tardaron por la ortodoxia de los **liquidacionistas** (Mellon: dejar quebrar a las empresas ineficientes).","Marzo de 1933: **feriado bancario** nacional para revisar las cuentas y reabrir solo los bancos sólidos.","Para muchos historiadores, **probablemente** la **flexibilización monetaria** fue lo que más oxígeno dio; también el **gasto público** y las nuevas agencias. Hubo reformas en los «cien días» y aún más en los tres años siguientes.","Medidas: National (Industrial) Recovery Act y ley agrícola (1933), obras públicas y **TVA**, **Wagner Act** (1935, negociación colectiva), **seguro social** y pensiones (1935), **HOLC** (compró hipotecas, redujo su valor y las pasó a largo plazo y baja tasa), Fannie Mae.","Regulación financiera: **FDIC** (seguro de depósitos contra los pánicos), **SEC** (vigilar la especulación bursátil), **Glass-Steagall** (separa banca comercial y de inversión; J. P. Morgan tuvo que dividirse).","Frente externo: Roosevelt se negó a fijar paridades en la conferencia de Londres (1933), devaluó el dólar y salió discretamente del oro."],"ojo":"Marichal no divide explícitamente en «primer» y «segundo» New Deal: habla de los «cien días» y de las reformas de los tres años siguientes (1935: Wagner Act y seguro social). Para la división en dos etapas, usá a Baines."}],"mc":[{"id":"mar2-n1","tema":"P1","nivel":"normal","enunciado":"Según Marichal, ¿qué combinación de factores explica la gran inflación que se desató en buena parte del mundo entre 1919 y comienzos de 1920?","opciones":["El pago de las primeras cuotas de reparaciones en oro, que vació las reservas europeas y obligó a los bancos centrales a emitir sin respaldo.","La eliminación precipitada de las regulaciones de guerra, la demanda de firmas que relanzaban su producción de paz y la emisión acumulada en Europa continental.","La prolongación de los controles de precios y de abastecimiento de tiempos de guerra, que generó escasez de materias primas y alimentos en Europa y Estados Unidos.","La ola de préstamos de Wall Street hacia Europa y América Latina, que expandió el crédito y encareció los productos primarios en todo el mundo."],"correcta":1,"explicacion":"Marichal señala tres factores decisivos: los controles de guerra sobre comercio y producción se levantaron con una prisa exagerada (en EE.UU., en apenas seis meses), miles de empresas demandaron bienes para relanzarse en tiempos de paz y, en Europa continental, circulaba la enorme masa de dinero emitida durante la guerra y la posguerra. Así, las materias primas llegaron a valer un 200% más que en 1914.","por_que_no":["Marichal no menciona las reparaciones entre las causas de esa inflación: sus tres factores son la desregulación apresurada, la demanda de posguerra y la emisión.","","Invierte el argumento: los controles no se prolongaron, se desmantelaron con prisa excesiva, y eso fue lo que disparó los precios.","Anacronismo: la racha de préstamos de Wall Street a Europa y América Latina es posterior (desde 1922-1924)."],"pag":"p. 89"},{"id":"mar2-n2","tema":"P1","nivel":"normal","enunciado":"Según Marichal, ¿en qué se diferenciaba el patrón oro restablecido a mediados de los años 20 del régimen vigente antes de 1914?","opciones":["Las monedas dejaron de tener una paridad fija y pasaron a flotar con libertad, usando el oro solo como una unidad de referencia contable.","Solo podían adherir los países acreedores, de modo que los deudores latinoamericanos quedaron fuera del sistema y sin acceso a préstamos.","Los bancos centrales se comprometían a no acumular oro y a fijar sus paridades de común acuerdo para no presionar a otros países.","Los bancos centrales podían respaldar su moneda no solo con oro sino también con divisas convertibles, sobre todo dólares y libras."],"correcta":3,"explicacion":"Hacia fines de la década casi cincuenta países habían vuelto al «club del oro», pero el régimen no era idéntico al previo a 1914: las reservas de los bancos centrales podían estar en oro o en monedas extranjeras convertibles, sobre todo dólares y libras esterlinas. Por eso se lo llama **patrón de cambio oro** (gold exchange standard).","por_que_no":["Describe los regímenes de libre flotación adoptados en 1919 en Europa central, que Marichal califica de desastre; el patrón de los años 20 mantenía la convertibilidad.","Falso: la mayoría de los gobiernos latinoamericanos adoptó el patrón de cambio oro gracias a las reservas en divisas que obtuvieron con préstamos de Nueva York.","Contradice el texto: los bancos centrales más ortodoxos insistieron en acumular oro, y EE.UU. y Francia llegaron a concentrar más del 60% de las reservas mundiales.",""],"pag":"pp. 97-98"},{"id":"mar2-n3","tema":"P2","nivel":"normal","enunciado":"Según Marichal, ¿por qué el gobierno alemán y el Reichsbank toleraron una fuerte depreciación del marco a comienzos de los años 20?","opciones":["Porque el derrumbe del marco les servía para alegar que pagar en oro a los aliados hundiría las finanzas del país.","Porque buscaban abaratar las exportaciones alemanas para reconquistar los mercados que Gran Bretaña les había quitado durante la guerra.","Porque el plan Dawes exigía devaluar como condición para otorgar el gran empréstito que colocaron los banqueros de Nueva York.","Porque Francia ya había ocupado el Ruhr, y la pérdida del carbón obligó al gobierno a emitir para importar combustible y otras materias primas."],"correcta":0,"explicacion":"Para Marichal, el gobierno y el banco central aceptaron la depreciación para evitar el pago de las reparaciones: el derrumbe del marco funcionaba como argumento de que no se podía pagar en oro a Francia y Gran Bretaña sin provocar el hundimiento financiero del país. Esa negativa tuvo como respuesta la ocupación francesa del Ruhr en 1923.","por_que_no":["","Es una explicación de «sentido común» que el texto no plantea: Marichal vincula la depreciación con la estrategia frente a las reparaciones, no con la competitividad.","Anacronismo: el plan Dawes es de 1924, posterior a la hiperinflación, y lo que hizo fue reducir los pagos, no exigir una devaluación.","Invierte causa y consecuencia: según el texto, la ocupación del Ruhr (1923) fue la respuesta francesa a la negativa alemana a pagar."],"pag":"pp. 91-92"},{"id":"mar2-n4","tema":"P2","nivel":"normal","enunciado":"¿Qué estableció el plan Dawes de 1924, según la descripción de Marichal?","opciones":["La fijación de una deuda total de 132 mil millones de marcos, con un calendario de cuotas anuales algo menos oneroso que el de Versalles.","La cancelación de los créditos de guerra que Estados Unidos había dado a sus aliados, a cambio de que estos dejaran de cobrar reparaciones a Alemania.","Una fuerte rebaja de las cuotas anuales alemanas, el control aliado sobre el Reichsbank y un gran préstamo colocado en Nueva York para reanudar los pagos.","Una moratoria de un año sobre todas las deudas entre gobiernos, decidida por Washington para aliviar la presión financiera sobre Alemania."],"correcta":2,"explicacion":"El plan, preparado por la comisión que encabezó el general Charles Dawes, redujo drásticamente el servicio anual (según Marichal, a cerca de un décimo de lo fijado en Londres en 1921), puso al Reichsbank bajo supervisión de los aliados y se acompañó de un gran empréstito colocado por banqueros neoyorquinos, con el que el Tesoro alemán pudo retomar los pagos en metálico.","por_que_no":["Describe el acuerdo de Londres de 1921, que el plan Dawes vino a aliviar con una reducción drástica de las cuotas.","Es la solución que había propuesto Keynes en Versalles y que Washington rechazó; el plan Dawes no tocó las deudas interaliadas.","","Es la moratoria Hoover de junio de 1931, en plena crisis bancaria alemana, no el plan de 1924."],"pag":"pp. 96-97"},{"id":"mar2-n5","tema":"P3","nivel":"normal","enunciado":"Según Marichal, ¿qué rasgo de la economía de los años 20 alimentó la confianza en las inversiones bursátiles?","opciones":["La recuperación sostenida de los precios agrícolas, que enriqueció durante toda la década a la mitad rural de la población estadounidense.","El auge de ramas nuevas (electricidad, química, petróleo, automotores), de los bienes durables y de la radio y el cine.","El boom de la construcción de viviendas en la segunda mitad de la década, que arrastró a la siderurgia y a la banca hipotecaria.","La reconstrucción de la industria pesada europea, financiada con las reparaciones que pagaba Alemania, que absorbió buena parte de las exportaciones estadounidenses."],"correcta":1,"explicacion":"Marichal describe los años 20 como una etapa de fuerte crecimiento e innovación en las industrias eléctrica, química, petrolera y automotriz (más de cuatro millones de autos vendidos por año en 1927-1928), con bienes de consumo durable que dependían de la expansión de las redes eléctricas y el despegue de la radio y el cine. Ese impulso industrial y comercial es el que dio confianza a los inversores en la bolsa.","por_que_no":["Contradice el texto: hubo una crisis agrícola prolongada en los años 20, con baja de precios, que incluso debilitó a muchos bancos rurales.","","Trampa: Marichal (siguiendo a Temin) dice lo contrario, que la construcción de viviendas cayó en la segunda mitad de la década y debilitó la economía.","No figura en el texto: las reparaciones no financiaron un auge europeo; más bien fueron los préstamos estadounidenses los que financiaron los pagos alemanes."],"pag":"pp. 102-103"},{"id":"mar2-n6","tema":"P3","nivel":"normal","enunciado":"En el debate sobre si el auge de Wall Street fue especulativo o se apoyó en la economía real, ¿qué postura de Eugene White recoge Marichal?","opciones":["Que fue una burbuja puramente psicológica y sin respaldo productivo, ya que la economía norteamericana estaba estancada desde mediados de la década.","Que se apoyó por completo en la solidez de la economía y que el derrumbe posterior se explica solo por los errores de la Reserva Federal.","Que lo motorizó la entrada masiva de asalariados a la bolsa, que volcaron sus ahorros en las acciones de las grandes corporaciones.","Que había motivos sensatos para invertir, pero la fe en una innovación ilimitada y el crédito de los fondos de inversión lo llevaron a niveles que no podían durar."],"correcta":3,"explicacion":"White muestra que la economía norteamericana crecía más del 4% anual, con desempleo cercano al 3,7% y muy poca inflación, así que había factores racionales para comprar acciones. Pero dos elementos llevaron la bolsa a niveles insostenibles: la ilusión de que la ola de innovaciones no terminaría nunca y la multiplicación de los fondos de inversión (de 40 en 1921 a 750 en 1929), que expandió el crédito para especular.","por_que_no":["Contradice a White: la economía crecía a más del 4% anual, con desempleo cercano al 3,7% e inflación muy baja, así que había bases reales.","Mitad bien, mitad mal: White reconoce bases reales, pero también factores que volvieron insostenible el auge; culpar a la Reserva Federal es la tesis de Friedman y Schwartz.","Contradice un dato del texto: en 1929 solo el 2% de la población norteamericana invertía en la bolsa.",""],"pag":"p. 105"},{"id":"mar2-n7","tema":"P4","nivel":"normal","enunciado":"Según la interpretación de Milton Friedman y Anna Schwartz que presenta Marichal, ¿dónde estuvo la principal responsabilidad por el colapso de 1929-1932?","opciones":["En la Reserva Federal, que no volcó liquidez abundante al sistema bancario cuando ya había señales de una recesión seria.","En la caída del consumo norteamericano, que venía de antes del crac por la baja de la construcción y de los precios agrícolas.","En la incertidumbre que provocó la volatilidad bursátil, que llevó a empresarios y consumidores a postergar inversiones y compras.","En el patrón oro, que obligó a los bancos centrales de casi todo el mundo a subir sus tasas para defender las reservas."],"correcta":0,"explicacion":"Para Friedman y Schwartz, los directivos de la Reserva Federal fueron los mayores culpables: no comprendieron la naturaleza del boom y, sobre todo, no expandieron el dinero y el crédito a los bancos cuando aparecieron indicios de recesión. Al no aplicar medidas anticíclicas, demostraron no saber qué debe hacer un banco central ante una crisis sistémica.","por_que_no":["","Es la línea que sintetiza Peter Temin, que respondió a Friedman subrayando el consumo y las debilidades de la economía real.","Es el argumento de Christina Romer sobre el efecto del desplome bursátil en las expectativas de empresarios y consumidores.","Se acerca a la tesis de Barry Eichengreen sobre la rigidez del patrón oro, no a la de Friedman y Schwartz."],"pag":"pp. 111-112"},{"id":"mar2-n8","tema":"P4","nivel":"normal","enunciado":"Según Marichal, ¿qué ocurrió con los países que abandonaron tempranamente el patrón oro durante la Gran Depresión?","opciones":["Sufrieron fugas de capital e inflación, como habían anticipado los críticos, y su salida de la recesión se demoró hasta fines de la década.","Recién pudieron recuperarse después de la conferencia de Londres de 1933, cuando se acordaron nuevas paridades entre las principales monedas.","Contra lo que se vaticinaba, salieron de la recesión antes que quienes siguieron atados al oro, como Estados Unidos, Francia o Bélgica.","Quedaron aislados del crédito internacional porque Estados Unidos y Francia les prohibieron colocar bonos en sus mercados financieros."],"correcta":2,"explicacion":"Marichal, siguiendo a Eichengreen, afirma que los pronósticos de desastre se equivocaron: los países que dejaron pronto el oro lograron una recuperación más temprana (varios latinoamericanos desde 1932, los escandinavos), mientras que los que siguieron atados a él, como EE.UU., Francia y Bélgica, tuvieron una recuperación menor y más lenta.","por_que_no":["Invierte el argumento: Marichal, con Eichengreen, sostiene que ocurrió lo contrario de las predicciones de desastre.","Falso: la conferencia de Londres de 1933 fracasó y no fijó paridades; varios países que habían salido del oro ya se recuperaban desde 1932.","","Mezcla datos: la ley Johnson (1934) limitó la venta de bonos extranjeros en EE.UU. por el conflicto de las deudas de guerra, no para castigar a quienes dejaron el oro."],"pag":"p. 118"},{"id":"mar2-d1","tema":"P1","nivel":"dificil","enunciado":"Marichal afirma que la hiperinflación alemana terminó dándole la razón a Keynes. ¿Qué había propuesto Keynes en Versalles como mejor salida?","opciones":["Que Alemania saldara las reparaciones en especie, entregando carbón y acero a Francia, para no tener que transferir oro.","Que los bancos de Nueva York prestaran a Alemania todo lo necesario para cumplir con los pagos y sostener así la cadena de deudas entre aliados.","Que Estados Unidos condonara lo prestado a sus aliados en la guerra y que Gran Bretaña resignara gran parte de lo que les había suministrado.","Que el monto total de las reparaciones se fijara en unos 31 mil millones de dólares, pagaderos en cuotas anuales más livianas que las de Versalles."],"correcta":2,"explicacion":"La hiperinflación mostró que pagar en metálico era casi imposible y que, sin pagos alemanes, se cortaba toda la cadena: Francia no podía pagar a Gran Bretaña ni Europa a EE.UU. Por eso Keynes tenía razón al proponer que EE.UU. cancelara los cerca de 10 mil millones de dólares adelantados a sus aliados y que Gran Bretaña renunciara a buena parte de los 4 mil millones que había suministrado. Washington no aceptó ese sacrificio.","por_que_no":["Confunde: el pago en especie (carbón y acero) fue lo que Francia buscó al ocupar el Ruhr y una parte de lo que Alemania siguió entregando, no la propuesta de Keynes.","Describe el mecanismo posterior al plan Dawes (el argumento de Schuker sobre los préstamos estadounidenses), no la solución que Keynes planteó en 1919.","","Es el monto fijado en Londres en 1921; Keynes, en cambio, proponía cortar la cadena de deudas interaliadas desde su origen."],"pag":"p. 96"},{"id":"mar2-d2","tema":"P2","nivel":"dificil","enunciado":"Según Marichal, ¿qué explica que la estabilización alemana de noviembre de 1923 lograra frenar la hiperinflación?","opciones":["Junto con el fin del crédito del banco central al Tesoro, un consenso político y social le dio credibilidad al ajuste.","La llegada del empréstito colocado en Nueva York en el marco del plan Dawes, que dio al Reichsbank las divisas necesarias para sostener el valor del nuevo marco.","La renuncia de Francia a cobrar reparaciones en metálico, que eliminó de golpe la principal fuente del déficit del gobierno alemán.","El regreso inmediato al patrón oro clásico, que estableció la convertibilidad plena del nuevo marco a partir de noviembre de 1923."],"correcta":0,"explicacion":"En noviembre de 1923 se fijaron nuevas normas de reservas y una nueva paridad, y se cerró el grifo de préstamos del banco central al gobierno; además, la inflación ya había destruido la deuda flotante, con lo que el déficit cayó. Pero Marichal, citando a Eichengreen, subraya que no bastaban las razones técnicas: el plan funcionó porque existía un acuerdo político-social que hacía factible y creíble la reforma fiscal.","por_que_no":["","Error cronológico: el plan Dawes y su empréstito son de 1924, posteriores a la estabilización de noviembre de 1923.","Falso: Francia no renunció a las reparaciones en 1923 (incluso ocupó el Ruhr); la renuncia mayoritaria recién llegó en Lausana, en 1932.","No coincide con el texto: en 1923 se fijaron un tipo de cambio y normas de reservas; Alemania adoptó el patrón oro recién al año siguiente."],"pag":"p. 95"},{"id":"mar2-d3","tema":"P3","nivel":"dificil","enunciado":"Según Marichal, ¿por qué la forma en que se manejó la crisis de 1920-1921 en Estados Unidos influyó negativamente en la respuesta al crac de 1929?","opciones":["Porque en 1920-1921 la Reserva Federal bajó las tasas con fuerza, y ese crédito barato alimentó la especulación que estalló en 1929.","Porque los pánicos bancarios de 1921 destruyeron a muchos bancos rurales y dejaron al sistema sin capacidad de prestar en 1929.","Porque la deflación de 1920-1921 obligó a Estados Unidos a abandonar el patrón oro, lo que le quitó margen de acción en 1929.","Porque la recesión fue corta pese a las tasas altas, los banqueros centrales no vieron su error y la idea de no intervenir se mantuvo toda la década."],"correcta":3,"explicacion":"En 1920-1921 la Reserva Federal no bajó las tasas y provocó una intensa deflación y recesión. Como la crisis fue breve y desde fines de 1921 la economía volvió a crecer, sus directivos no advirtieron el error. Así, paradójicamente, la visión ortodoxa —que los bancos centrales no deben intervenir— siguió en pie durante los años 20 y volvió a aplicarse después del crac, con consecuencias mucho más graves.","por_que_no":["Invierte el texto: el error de 1920-1921 fue justamente no bajar las tasas de interés, lo que provocó deflación y recesión.","Contradice el texto: la estrategia de la Reserva Federal en 1920 evitó los pánicos bancarios, aunque no la deflación.","Falso: Estados Unidos estaba en el patrón oro a comienzos de los años 20 y siguió aferrado a él incluso después de 1931.",""],"pag":"pp. 90-91"},{"id":"mar2-d4","tema":"P3","nivel":"dificil","enunciado":"¿Qué efecto atribuye Marichal a la suba de las tasas de interés de la Reserva Federal en la etapa final del auge bursátil (1928-1929)?","opciones":["Consiguió desinflar de a poco la burbuja bursátil, pero la llegada de capitales que huían de las bolsas europeas deprimidas volvió a encenderla en 1929.","No logró enfriar la especulación y, en cambio, empezó a restringir el crédito para la producción, un efecto contraproducente que preparó la recesión.","Formó parte del acuerdo impulsado por Strong y Norman con otros bancos centrales para sostener el crédito tras la caída de la bolsa de Berlín.","Fue, según Friedman y Schwartz, la causa directa del jueves negro, porque cortó de un día para otro el financiamiento a los especuladores."],"correcta":1,"explicacion":"La Reserva Federal subió las tasas para moderar la especulación, pero fracasó de forma rotunda: Wall Street siguió en alza, alimentada incluso por capitales que escapaban de Europa. Al mismo tiempo, la medida empezó a contraer el crédito para la economía real, y los historiadores financieros consideran que ese efecto contradictorio ayudó a propiciar la recesión posterior al crac.","por_que_no":["Mitad bien, mitad mal: es cierto que hubo fuga de capitales europeos hacia Nueva York, pero la suba de tasas fracasó por completo en moderar la especulación.","","Confunde dos momentos: el acuerdo de 1927, tras la caída de Berlín, fue para bajar tasas y ampliar el crédito, lo opuesto a esta suba.","Atribución equivocada: Friedman y Schwartz culpan a la Reserva Federal por no dar liquidez a los bancos ante la recesión, no por provocar el jueves negro."],"pag":"pp. 105-106"},{"id":"mar2-d5","tema":"P4","nivel":"dificil","enunciado":"Según Marichal, Peter Temin sintetizó los argumentos de quienes respondieron a la tesis de Friedman y Schwartz. ¿Cuál de los siguientes elementos NO forma parte de esa síntesis?","opciones":["La caída de la construcción de viviendas durante la segunda mitad de los años 20, que fue socavando la economía norteamericana.","La baja de los precios agrícolas, que golpeó a mucha gente en un país donde casi la mitad de la población todavía vivía en pueblos rurales.","La incertidumbre que desató el desplome bursátil, que frenó la inversión de las empresas y las compras de los hogares.","El retroceso de algunas industrias, que recortó salarios, ganancias y consumo y volvió casi imposible la recuperación tras el estallido financiero."],"correcta":2,"explicacion":"La síntesis de Temin reúne debilidades de la economía real: la caída de la construcción de viviendas, la baja de los precios agrícolas en un país casi mitad rural y el retroceso de algunas industrias antes del crac, que redujeron ingresos y consumo y, cuando estallaron los problemas financieros, hicieron casi imposible la recuperación. La incertidumbre provocada por el desplome bursátil, que llevó a empresarios y consumidores a recortar inversiones y compras, es en cambio el argumento de Christina Romer.","por_que_no":["Sí forma parte: Temin señala la caída de la construcción de viviendas como un factor que socavó la economía.","Sí forma parte: la baja de los precios agrícolas golpeó a una enorme población rural.","","Sí forma parte: según esa interpretación, la caída de ingresos y consumo hizo casi imposible la recuperación cuando estallaron los problemas financieros."],"pag":"pp. 112-113"},{"id":"mar2-d6","tema":"P4","nivel":"dificil","enunciado":"¿Cuál de las siguientes afirmaciones sobre las crisis bancarias de 1930-1931 NO coincide con lo que expone Marichal?","opciones":["En Estados Unidos, los grandes bancos neoyorquinos fueron los primeros en caer y luego arrastraron a las pequeñas entidades del interior.","El sistema bancario estadounidense era el mayor del mundo, pero estaba muy fragmentado en miles de pequeños bancos de pueblos rurales.","Muchos bancos locales de Estados Unidos llegaron debilitados a 1930 por la prolongada crisis agrícola de los años 20.","La quiebra del Creditanstalt, con participaciones en buena parte de la gran industria austríaca, propagó la desconfianza hacia Alemania."],"correcta":0,"explicacion":"Esa afirmación es falsa: las primeras señales vinieron del colapso de unos 600 bancos del sur y del medio oeste a fines de 1930, y al final sobrevivieron dos tercios de las entidades, entre ellas casi todas las grandes firmas de Nueva York. Las otras tres coinciden con el texto: un sistema enorme pero muy desconcentrado, bancos rurales debilitados por la crisis agrícola y el contagio que provocó la caída del Creditanstalt.","por_que_no":["","Sí coincide: había casi 24.000 bancos, en su inmensa mayoría pequeños y rurales; era el sistema más grande y más desconcentrado del mundo.","Sí coincide: los historiadores muestran que la crisis agrícola de los años 20 ya había debilitado a muchos bancos locales.","Sí coincide: el Creditanstalt tenía acciones en dos tercios de las mayores empresas industriales austríacas y su caída llevó el pánico a Alemania."],"pag":"pp. 114-115"},{"id":"mar2-d7","tema":"P4","nivel":"dificil","enunciado":"Según Marichal, ¿cuál fue el resultado principal de la conferencia de Lausana de 1932?","opciones":["Estados Unidos condonó las deudas interaliadas y, en compensación, los europeos aceptaron reducir lo que le exigían a Alemania.","Se fijó un nuevo calendario de pagos alemanes, más liviano que el anterior, respaldado por un préstamo colocado por los banqueros de Nueva York.","Las potencias acordaron volver de manera coordinada al patrón oro para estabilizar los tipos de cambio y reactivar el comercio.","Los acreedores de Alemania resignaron casi todas las reparaciones y luego reclamaron a EE.UU. alivio por sus propias deudas de guerra."],"correcta":3,"explicacion":"Tras el pánico bancario alemán de 1931 y la moratoria Hoover, en Lausana los acreedores de Alemania renunciaron a la mayor parte de las reparaciones, cuyo valor nominal bajó de 31 mil millones a menos de mil millones de dólares. Entonces los europeos exigieron a EE.UU. que los liberara de las «deudas aliadas» (más de 10 mil millones), pero Washington solo concedió un año de gracia.","por_que_no":["Invierte actores y orden: fueron los europeos quienes renunciaron primero; Estados Unidos solo concedió un año de gracia y no condonó.","Describe el plan Dawes de 1924; en Lausana las reparaciones bajaron de 31 mil millones a menos de mil millones de dólares.","Falso: no hubo acuerdo monetario; la conferencia de Londres de 1933 fracasó y el mundo se dividió en bloques monetarios.",""],"pag":"p. 120"},{"id":"mar2-d8","tema":"P4","nivel":"dificil","enunciado":"Según Marichal, Bradford DeLong subrayó la influencia de la escuela «liquidacionista» en Europa y Estados Unidos después del crac. ¿Qué sostenía esa corriente?","opciones":["Que el banco central debía comprar activos y prestar sin límite a los bancos para evitar una liquidación en cadena de empresas.","Que intervenir podía agravar la situación: había que tener paciencia y dejar que cayeran las empresas ineficientes.","Que había que liquidar cuanto antes las deudas de guerra entre los aliados para normalizar el comercio entre Europa y Estados Unidos.","Que no hacía falta intervenir porque el crac golpeaba solo a una minoría de inversores y no afectaba a la economía real."],"correcta":1,"explicacion":"DeLong atribuye la parálisis de la Reserva Federal y del Tesoro a la influencia de los «liquidacionistas»: economistas como Schumpeter, Hayek o Robbins, y el secretario del Tesoro Andrew Mellon, creían que la intervención podía ser contraproducente y que había que dejar que la crisis siguiera su curso, con la liquidación de muchas empresas supuestamente ineficientes, como si la economía debiera pasar por la fiebre para curarse.","por_que_no":["Es la receta anticíclica que Friedman y Schwartz reprochan no haber aplicado; los liquidacionistas pedían justamente lo contrario.","","Trampa de palabras: «liquidar» no alude acá a las deudas interaliadas, sino a dejar que quiebren las empresas.","Inventa la razón: los liquidacionistas no minimizaban el crac; creían que la economía debía «sufrir intensas fiebres» y que la quiebra de las empresas ineficientes era parte de la cura."],"pag":"pp. 122-123"},{"id":"mar2-m1","tema":"P4","nivel":"muy_dificil","enunciado":"Considere las siguientes atribuciones sobre las causas de la Gran Depresión, tal como las presenta Marichal:\nI. Friedman y Schwartz: la Reserva Federal no expandió el dinero ni el crédito a los bancos cuando asomaba la recesión.\nII. Temin: la contracción monetaria fue la única causa; el consumo y la producción se mantuvieron firmes hasta el crac.\nIII. Bernanke: la fragilidad financiera achicó el crédito, eso comprimió la demanda y una recesión severa se volvió una depresión duradera.\nIV. Romer: el derrumbe bursátil disparó la incertidumbre y llevó a los empresarios a invertir menos y a los consumidores a comprar menos.\n¿Cuáles son correctas?","opciones":["Solo I, III y IV.","Solo I y II.","Solo II, III y IV.","Solo I y III."],"correcta":0,"explicacion":"I resume la tesis de Friedman y Schwartz (la Reserva Federal no dio liquidez ni aplicó medidas anticíclicas). III corresponde a Bernanke, que busca conciliar la caída de la demanda con los problemas de la oferta de dinero a través del crédito. IV es el argumento de Romer sobre la incertidumbre. II es falsa: Temin sintetiza justamente el enfoque que respondió a Friedman destacando la caída del consumo y debilidades reales previas al crac.","por_que_no":["","Incluye II, que es falsa (Temin destaca la caída del consumo y debilidades reales previas, no una causa monetaria única), y omite III y IV.","Incluye II, que es falsa, y deja afuera I, que resume bien la tesis de Friedman y Schwartz.","Deja afuera IV, que describe correctamente el argumento de Christina Romer sobre la incertidumbre."],"pag":"pp. 111-113"},{"id":"mar2-m2","tema":"P4","nivel":"muy_dificil","enunciado":"Si alguien sostuviera que la Gran Depresión se habría evitado con una mayor cooperación entre bancos centrales dentro de las reglas del patrón oro, ¿qué objeción le haría Marichal apoyándose en Eichengreen?","opciones":["Que la cooperación era innecesaria, porque la crisis fue un fenómeno norteamericano que apenas se transmitió a las demás economías.","Que la cooperación sí se logró con la moratoria Hoover de 1931, que resolvió la crisis bancaria europea y permitió reabrir el crecimiento mundial.","Que el apego al oro y a la ortodoxia ataba las manos de casi todos los países: el margen para reaccionar llegó recién al abandonarlo y devaluar.","Que el problema fue la salida prematura de Gran Bretaña del patrón oro en 1931, que rompió el sistema justo cuando la cooperación empezaba a funcionar."],"correcta":2,"explicacion":"Frente a quienes creen que m
