,"ganancia garantizada","textil","zanahoria","autonom"]]},{"id":"e","punto":"Propuesta de Gross: capitalismo dirigista híbrido","detalle":"Concluye con la caracterización de Gross: economía capitalista fuertemente dirigista, híbrido de mercado y directivas estatales, orientada al rearme, el imperio y el despojo.","peso":3,"indicios":[["hibrid","dirigis","mezcla","combina"],["capitalis"]]},{"id":"f","punto":"Amiguismo e inseparabilidad Estado-economía","detalle":"Agrega que Estado y economía eran inseparables y que la corrupción y el amiguismo fueron constitutivos (Bajohr, Flick).","peso":2,"indicios":[["amigu","corrup","nepot","flick","inseparab","contactos"]]},{"id":"g","punto":"Maleabilidad del capitalismo","detalle":"Cierra con la idea de que el caso nazi muestra la maleabilidad del capitalismo, capaz de prosperar bajo instituciones perversas.","peso":1,"indicios":[["maleab","adapta","flexib"]]}],"respuesta_modelo":"La afirmación es incorrecta según Gross, porque el autor rechaza ambas caracterizaciones. La lectura protokeynesiana surgió temprano: hacia 1936 unos cinco millones de hombres habían vuelto a trabajar, y se destacaban los programas de empleo con crédito, las autopistas, Volkswagen, los préstamos matrimoniales y el financiamiento con déficit y emisión. Gross, siguiendo a Buchheim, la corrige: la inversión privada ya repuntaba a fines de 1932, los programas de empleo se heredaron de Weimar y el clima de negocios mejoró sobre todo por la destrucción de los sindicatos. Además, en 1934 el gasto militar ya triplicaba al civil, las autopistas se aceleraron recién en 1936, con pleno empleo, y hasta entonces déficit, emisión y deuda eran comparables a los de otros países. Alemania no fue más keynesiana que el resto: se recuperó antes porque militarizó su economía antes. La segunda opción tampoco lo convence. Es cierto que la propiedad privada quedó condicionada (expropiación de Junkers, Reichswerke Hermann Göring), que el Estado asignaba divisas, materias primas y capital y que congeló salarios (1933) y precios (1936). Pero una economía planificada requiere que alguien esté al mando, y entre 1937 y 1942 no estaba claro quién mandaba: la economía era un ejemplo de policracia, y las empresas aprovechaban los choques entre organismos. Además, el régimen incentivó a producir con excepciones de precios, ganancias garantizadas y competencia por contratos; las ganancias subieron y, en el caso textil, los incentivos funcionaron mejor que las órdenes. Gross propone entonces ver a la economía nazi como un capitalismo fuertemente dirigista, un híbrido de mercado y directivas estatales orientado al rearme, la expansión imperial y el despojo de los judíos, en el que Estado y economía eran inseparables y el amiguismo era constitutivo, como muestra Flick. Para el autor, el caso revela la maleabilidad del capitalismo, capaz de prosperar bajo instituciones perversas.","errores_comunes":["Aceptar la imagen de un «milagro keynesiano» basado en las autopistas: el gasto fue militar y las autopistas se aceleraron con pleno empleo.","Confundir el congelamiento de precios y salarios con planificación central: hubo excepciones, incentivos y ningún mando único claro.","Atribuir a Gross la tesis de que la economía nazi fue anticapitalista o socialista: él la define como capitalismo dirigista."],"pag":"PDF pp. 1, 5-8"}]},{"id":"palazuelos","autor":"Enrique Palazuelos","obra":"El sistema económico y su reforma","temas":["P7"],"resumen":[{"titulo":"De la revolución al comunismo de guerra (1917-1921)","puntos":["Tras tomar el poder, los **objetivos estratégicos** bolcheviques chocan con las **urgencias** (atraso heredado del zarismo, país agotado por la guerra, aislamiento y hostigamiento exterior), que terminan imponiéndose.","Primeras medidas: **nacionalización** de grandes industrias y bancos, **control obrero** de la producción y **reforma agraria** que da la tierra a los campesinos.","Con la guerra civil (desde 1918) llega el **comunismo de guerra**: control estatal absoluto para abastecer al frente, nacionalización de toda la industria y el comercio, fin del control obrero y presión sobre el campo. En 1921 la economía colapsa: el campesino no produce porque no hay productos industriales que comprar."],"pags":"pp. 1-2"},{"titulo":"La NEP y el “gran viraje” (1921-1929)","puntos":["En 1921 llega la **Nueva Política Económica (NEP)**: resistir el aislamiento, recomponer la alianza **Estado-campesinos** y recuperar la economía **desde el agro**, con **mercado** (libre compraventa de productos agrarios, tierra y fuerza de trabajo).","Estrategia **gradual** que **renunciaba a industrializar rápido**: agro → industria ligada al agro → a mediano plazo, industria pesada.","A mediados de los veinte el agro daba **buenos resultados**, pero crecía la **desigualdad entre campesinos** y no había mejora técnica ni ingresos estatales para la industria. Desde 1926-1927 ya avanzaban la industria planificada, la inversión en la pesada y el control estatal.","Tesis del autor: el **“gran viraje”** no lo determinó la economía (que servía de justificación) sino la **lucha política** en el Partido. En los debates, la mayoría se inclinaba por la NEP; pero en 1928 la lucha ya era desigual: la mayor parte del aparato, en manos del grupo de **Stalin**, había decidido eliminar a sus adversarios e imponer tres premisas: **colectivización del agro**, **industrialización acelerada a gran escala** y **planes impuestos desde el Estado**."],"pags":"pp. 2-3"},{"titulo":"El sistema estalinista (I): gestión estatal y planificación","puntos":["El viraje de 1929 es una **ruptura**: nace una nueva **formación social** capaz de **autorreproducirse**, con un **marco de gestión estatal** y un **modelo de acumulación** de crecimiento rápido.","El Estado domina la economía: es **dueño de los principales medios de producción** y decide cuánto de la renta se consume y cuánto se acumula. La **planificación** del **Gosplan** es el vehículo de ese dominio, y el **plan** funciona como una **relación social**: al fijar prioridades, reproduce las relaciones del sistema.","Los criterios **administrativos** reemplazan a los económicos. Un **poder despótico** concentra las decisiones en el vértice del **Partido-Estado** y asegura la **sumisión** de empresas, granjas, comercios y transportes.","Paradoja: cada escalón de la **burocracia** tiene **intereses particulares** que distorsionan la ejecución; la cúspide recibe información pobre y lenta, se traba el **cálculo económico** y crecen la irracionalidad y la ineficiencia.","Las empresas, último eslabón, solo cumplen **cifras de producción**. La renta la controla la **clase dominante**: los trabajadores no controlan los medios de producción, no deciden y sus salarios no siguen al crecimiento."],"pags":"pp. 3-4"},{"titulo":"El sistema estalinista (II): industria pesada y crecimiento extensivo","puntos":["Objetivo: una **base industrial a gran escala** inmediata, por vía no capitalista, y en lo posible resolver desempleo, pobreza, salud y educación.","**Prioridad absoluta a las ramas pesadas**: cerca de **un tercio de la renta anual** se invertía en metalurgia, siderurgia, energía, mecánica y química, y el crecimiento permitía acumular e invertir todavía más.","Con los **planes quinquenales** la URSS se industrializa en diez años: la industria pasa de un tercio de la producción total (1928) al **60% en 1937** (fin del 2º plan) y la pesada, del 40% al 60% de la producción industrial.","Ritmo alto en la renta, mayor en la industria y máximo en la pesada. **Cuadro I** (1927/28-1940, miles de millones de rublos): bienes de producción de 6 a 85, de consumo de 12,3 a 54 y agro de 13,1 a 23: los números del **desequilibrio**. Otros autores corrigieron a la baja esas cifras oficiales, pero el crecimiento de los planes 1º, 2º, 4º y 5º siguió siendo muy alto.","Fue un **crecimiento extensivo**: abundantes **recursos naturales** (tierra, minerales), **mano de obra** del campo y del **trabajo femenino**, y **recursos financieros** que el Estado sacaba gracias a su dominio sobre la sociedad, en un **contexto externo hostil** (restricciones comerciales y financieras).","La **agricultura** fue la fuente decisiva de recursos: materias primas, alimentos, mano de obra, algo de divisas y, sobre todo, **financiamiento de la industria vía impuestos y precios**.","El **excedente** crecía rápido: cerca de un tercio iba a acumulación, algo menos de la mitad al consumo privado y el resto a gasto social y estatal (burocracia, **gasto militar**, despilfarro)."],"pags":"pp. 4-6"},{"titulo":"Límites: desequilibrios, ineficiencia y control del trabajo","puntos":["**Desequilibrios entre ramas**: agro y **bienes de consumo** rezagados (pocos recursos, precios desfavorables frente a la pesada), con un nivel de vida frenado y tensiones de precios.","**Productividad baja** por tres factores: **atraso tecnológico** (técnicas de la revolución industrial del siglo XIX, empresas aisladas de la investigación), **inversiones** que preferían equipos nuevos a mejorar los existentes (**cantidad sobre calidad**) y un **abastecimiento técnico-material** gigantesco y burocrático.","Corregir esos problemas traía **más centralización y más recursos**: se cumplía el plan, pero se agravaban las causas de la ineficiencia.","Se producía **sin mirar la demanda**: el **Gossnab** repartía los bienes de producción y en consumo el plan fijaba cantidades, precios e ingresos; la oferta era escasa, mala y poco variada.","**Control del trabajo**: asignación por criterios administrativos, con **traslados obligatorios** de empresa, rama o región; el salario no decidía dónde iba cada trabajador.","Balance, contra el discurso oficial: capacidad productiva récord, pero baja eficiencia y una **brecha creciente entre capacidad y nivel de vida**, aunque el Estado garantizaba a toda la población una cobertura mínima de subsistencia."],"pags":"pp. 5-7"},{"titulo":"Guerra y reconstrucción (1938-1955)","puntos":["El **tercer plan (1938-1942)** se interrumpe por los preparativos militares.","La **invasión alemana (1941)** se lleva en semanas zonas con la mitad de la tierra cultivada, casi la mitad de los habitantes y un tercio de la producción; cuesta un tercio de la riqueza nacional y cerca de **veinte millones de víctimas**.","Los **planes de 1946-1955** reconstruyen con el mismo modelo (gestión piramidal, prioridad a la pesada): en 1955 las ramas prioritarias duplicaban o triplicaban su capacidad de 1940 a fuerza de absorber recursos; otra vez **crecimiento “extensivo”**.","Contracara: consumo lento, agro apenas en los niveles de diez años antes y baja productividad: persiste la **descompensación entre el esfuerzo de la población y su bajo nivel de vida**."],"pags":"pp. 7-8"},{"titulo":"El ensayo de reforma de Jrushov (1953-1964)","puntos":["Muerto Stalin (1953), **Jrushov** (en la cúspide desde 1956) busca crecer rápido y a la vez ganar eficiencia, sacar al agro del atraso, dar más bienes de consumo, cambiar la planificación y atender la carrera armamentista.","Con el **plan septenal (1959-1965)** sigue el viejo modelo: la baja productividad se compensa con **más inversión y trabajadores del campo** y la pesada conserva seis séptimas partes de la inversión industrial. El **extensivo** se **agota** y no se logra el **intensivo**.","Hay avances en el agro (**tierras vírgenes**, mejores precios) y en lo social (salario mínimo, **menos Código Penal para disciplinar**), pero la reforma de la gestión (**consejos regionales** en vez de ministerios) trae **caos administrativo**; Jrushov cae en **1964**."],"pags":"pp. 8-12"},{"titulo":"La crisis del sistema (1966-1985) y sus raíces","puntos":["Con **Brézhnev** la capacidad de crecimiento cae a menos de la mitad; en 1981-1985, casi **estancamiento**.","Frente a los reformistas de **Gorbachov**, que culpan al equipo de Brézhnev, el autor **admite** que la parálisis de los setenta fue de una gravedad inusitada y **aceleró** el deterioro, pero sostiene que muchos problemas venían **desde hacía medio siglo**: del sistema formado en los años treinta.","Causas: **profundización de los desequilibrios tradicionales** (ineficiencia, escasez de bienes de consumo, atraso agrario) y **relativo agotamiento de los recursos extensivos** (menos mano de obra e inversión, recursos naturales más caros), más la **degeneración burocrática** y el **contexto internacional**."],"pags":"pp. 12-19"}],"conceptos":[{"termino":"Comunismo de guerra","def":"Política de 1918-1921, durante la guerra civil: control absoluto del Estado sobre la economía para abastecer al frente, nacionalización de toda la industria y el comercio, fin del control obrero y presión sobre los campesinos. Terminó en colapso económico."},{"termino":"NEP (Nueva Política Económica)","def":"Estrategia adoptada en 1921: restablece el mercado (libre compraventa de productos agrarios, tierra y fuerza de trabajo), recompone la alianza con los campesinos y busca recuperar la economía desde la agricultura, dejando la industria pesada para el mediano plazo."},{"termino":"Gran viraje (1928-1929)","def":"Ruptura con la NEP impuesta por el grupo de Stalin: colectivización agraria, industrialización acelerada a gran escala y planes dictados por el Estado. Para el autor lo decidió la lucha política dentro del Partido, no la evolución de la economía."},{"termino":"Marco de gestión estatal","def":"Forma de dirigir la economía en la que el Estado, dueño de los medios de producción, regula producción, intercambio y consumo con criterios administrativos y no económicos; las decisiones se centralizan en la cúspide y los niveles inferiores obedecen."},{"termino":"Partido-Estado","def":"Poder unificado del Partido Comunista y el aparato estatal: su vértice (la dirección comunista) fija las prioridades económicas y la cadena administrativa las ejecuta y controla."},{"termino":"Gosplan","def":"Órgano estatal que dirigía la planificación, el vehículo del dominio del Estado sobre la economía. Con Jrushov perdió funciones y la autoridad sobre los consejos regionales; luego obtuvo el reparto de los recursos materiales entre empresas, pero perdió la elaboración de los planes a largo plazo."},{"termino":"El plan como relación social","def":"Para el autor, el plan no era solo una técnica: al fijar los objetivos económicos prioritarios, hacía posible que se reprodujeran las relaciones sociales del nuevo sistema."},{"termino":"Gossnab","def":"Comité Estatal para el Abastecimiento Técnico-Material: organismo único que repartía los bienes de producción entre las empresas según el plan; lento, burocrático y sin criterios de calidad ni eficiencia."},{"termino":"Modelo de acumulación","def":"Manera de repartir el excedente y de relacionar las ramas productivas: alrededor de un tercio de la renta se reinvertía, con prioridad absoluta a la industria pesada, y ese crecimiento ampliaba a su vez la capacidad de invertir."},{"termino":"Excedente económico","def":"Producción neta generada cada año. El Estado la distribuía: cerca de un tercio a acumulación, algo menos de la mitad al consumo privado y el resto a gastos sociales y del aparato estatal (burocracia, gasto militar, despilfarro)."},{"termino":"Crecimiento extensivo","def":"Crecimiento logrado incorporando cada vez más recursos (mano de obra del campo y femenina, recursos naturales, inversión) y no mejorando la eficiencia. Caracterizó a los años treinta y a la reconstrucción de posguerra."},{"termino":"Crecimiento intensivo","def":"Crecimiento basado en el aumento de la eficiencia y la productividad, no en sumar recursos. La economía soviética no logró pasar a él, ni siquiera con la reforma de Jrushov."},{"termino":"Desequilibrios interramales","def":"Brecha entre la industria pesada, privilegiada, y la agricultura y las industrias de bienes de consumo, que recibían pocos recursos y precios desfavorables; frenaba el nivel de vida y generaba tensiones de precios."},{"termino":"Subordinación del agro a la industria","def":"Trasvase de recursos del campo a la industria que el Estado lograba con impuestos, precios bajos para los productos agrícolas y precios altos para los bienes industriales que compraba el campo."},{"termino":"Consejos regionales","def":"Órganos territoriales creados por Jrushov en 1957-1958 al suprimir los ministerios por rama; mantuvieron la lógica piramidal, sumaron descoordinación y produjeron un “baile departamental”."}],"cronologia":[{"fecha":"Octubre de 1917","hecho":"Revolución bolchevique. Primeras medidas: órgano estatal de dirección económica, nacionalización de grandes industrias y bancos, control obrero y reforma agraria que da la tierra a los campesinos."},{"fecha":"1918-1921","hecho":"Guerra civil apoyada por potencias occidentales y “comunismo de guerra”: control estatal absoluto de la economía, que termina en colapso."},{"fecha":"Primavera de 1921","hecho":"Victoria militar bolchevique y lanzamiento de la NEP."},{"fecha":"1926-1927","hecho":"Dentro de la NEP crecen la industria planificada y la inversión en la pesada; el comercio vuelve al control estatal y aumenta la presión sobre el campo."},{"fecha":"1928-1929","hecho":"“Gran viraje”: el grupo de Stalin impone colectivización, industrialización acelerada y planes estatales; arrancan los planes quinquenales."},{"fecha":"1937","hecho":"Fin del segundo plan quinquenal: la industria aporta el 60% de la producción total (un tercio en 1928)."},{"fecha":"1938-1942","hecho":"Tercer plan quinquenal, interrumpido para priorizar los preparativos militares."},{"fecha":"Junio de 1941","hecho":"Invasión alemana: en semanas se pierde un territorio con la mitad de las tierras cultivadas, casi la mitad de la población y un tercio de la producción."},{"fecha":"1946-1955","hecho":"Cuarto y quinto planes quinquenales: reconstrucción con el mismo modelo de los años treinta; crecimiento extensivo."},{"fecha":"1953","hecho":"Muere Stalin. En noviembre, Jrushov presenta ante el Comité Central un programa de reforma agraria con una crítica demoledora del atraso del campo."},{"fecha":"1956","hecho":"Jrushov queda en la cúspide del poder como secretario general del Partido (según el texto)."},{"fecha":"1957-1958","hecho":"Se suspende el sexto plan quinquenal y se reforma la gestión: supresión de los ministerios por rama y creación de consejos regionales."},{"fecha":"1959-1965","hecho":"Plan septenal: busca compatibilizar crecimiento alto con eficiencia, agro y consumo, pero mantiene el viejo modelo."},{"fecha":"1964","hecho":"Destitución de Jrushov; nueva dirección de Podgorni, Kosiguin y Brézhnev, liderada por este último."},{"fecha":"1966-1985","hecho":"Desaceleración y crisis: la capacidad de crecimiento cae a menos de la mitad; en 1981-1985, estancamiento práctico."}],"guia":[{"tema":"P7","pregunta":"Caracterice la economía de la URSS bajo Stalin según Palazuelos: planes quinquenales, prioridad de la industria pesada, planificación centralizada, control del trabajo y crecimiento extensivo.","puntos":["**Contexto breve**: comunismo de guerra (1918-1921, control estatal absoluto) y **NEP** (1921): mercado, recuperación desde el agro, industrialización gradual. A mediados de los veinte el agro andaba bien, pero con desigualdad campesina, sin mejora técnica y sin fondos para la industria.","**Gran viraje 1928-1929**: según el autor no lo decidió la economía sino la **lucha política** en el Partido, ya desigual en 1928 porque el grupo de **Stalin** controlaba la mayoría del aparato; impuso tres premisas: **colectivización** del agro, **industrialización acelerada** a gran escala y **planes impuestos desde el Estado**.","**Marco de gestión estatal**: Estado dueño de los medios de producción; **planificación centralizada (Gosplan)**; criterios administrativos en vez de económicos; la cúpula del **Partido-Estado** decide y las empresas solo cumplen cifras de producción.","**Distorsión burocrática**: cada escalón de la burocracia tiene intereses propios que deforman la ejecución y la información que sube; resultado: irracionalidad e ineficiencia.","**Modelo de acumulación**: cerca de **un tercio de la renta** va a inversión, con **prioridad absoluta a la industria pesada** (metalurgia, siderurgia, energía, mecánica, química).","**Reparto del excedente**: cerca de un tercio a acumulación, algo menos de la mitad al consumo y una parte significativa para el aparato burocrático (personal, gasto militar, despilfarro): por eso el nivel de vida casi no mejora.","**Resultados**: la industria pasa de un tercio al **60%** de la producción total (1928-1937); la pesada, del 40% al 60% de la industrial. Gran capacidad productiva en tiempo récord.","**Crecimiento extensivo**: más recursos, no más eficiencia. Recursos naturales abundantes, **mano de obra del campo y femenina**, fondos que el Estado extrae por su dominio sobre la sociedad; todo con un contexto externo hostil.","**El agro paga la industrialización**: impuestos y precios (bajos para lo agrícola, altos para lo industrial). Agro y bienes de consumo quedan rezagados: pocos recursos y precios desfavorables frente a la pesada.","**Disciplina y control del trabajo**: asignación administrativa con **traslados obligatorios**; el salario no es decisivo; los trabajadores no controlan ni deciden y sus salarios no siguen al crecimiento; el Código Penal se usaba para disciplinar en las empresas (Jrushov lo atenúa).","**Límites y costos**: baja productividad (técnica del siglo XIX, cantidad sobre calidad, abastecimiento burocrático); corregir trae más centralización; bienes de consumo escasos y malos; brecha creciente entre capacidad productiva y nivel de vida, aunque el Estado garantizaba a toda la población una cobertura mínima de subsistencia.","**Guerra y reconstrucción**: 3er plan interrumpido; invasión de 1941 (un tercio de la riqueza y cerca de 20 millones de víctimas); planes 1946-1955 con el **mismo modelo**, otra vez extensivo.","**Cierre**: el modelo industrializó, pero tenía límites; con Jrushov ya muestra agotamiento, y para el autor la crisis de 1966-1985 tiene raíces en el sistema de los años treinta."],"ojo":"No mezclar NEP y planes quinquenales: la NEP (1921-1928) es mercado, agro primero e industrialización gradual; los planes (desde 1928-1929) son planificación central, industria pesada primero y agro colectivizado usado como fuente de recursos. El viraje no fue “porque la NEP fracasó” (el agro daba buenos resultados): el autor lo explica por la lucha política en el Partido. Sobre los apuntes (“aumentan los recursos: personas, no maquinaria/innovación”): hay que matizarlo; el crecimiento extensivo sumó trabajadores, pero también recursos naturales y muchísima inversión en equipos nuevos (un tercio de la renta). Lo que no hubo fue mejora de la eficiencia ni tecnología moderna (se usaron técnicas del siglo XIX). Sobre “más disciplina”: el texto no habla de Gulag, stajanovismo ni hambrunas; lo que dice es control administrativo del trabajo (traslados obligatorios), sumisión al poder despótico del Partido-Estado y uso del Código Penal en las empresas (dato que aparece cuando Jrushov lo reduce). La colectivización figura como premisa del viraje, pero el texto no describe cómo se hizo: lo que desarrolla es el papel del agro como fuente de recursos."}],"mc":[{"id":"pal-n1","tema":"P7","nivel":"normal","enunciado":"Según Palazuelos, ¿sobre qué tres premisas se apoyó el cambio radical de la economía que impuso el grupo de Stalin hacia 1928-1929?","opciones":["Libre comercio de productos agrarios, industrialización gradual y prioridad para las industrias más rentables.","Nacionalización de la banca, control obrero de la producción y entrega de la tierra a los campesinos.","Agro colectivizado, industrialización a marcha forzada y en gran escala, y planes dictados por la conducción estatal.","Colectivización del agro, impulso prioritario a los bienes de consumo y planes descentralizados en consejos regionales."],"correcta":2,"explicacion":"Palazuelos sostiene que hacia 1928 el aparato partidario, en manos del grupo de Stalin, decidió eliminar a sus adversarios e imponer un giro radical con tres premisas: colectivizar la agricultura, industrializar en forma acelerada y en gran escala, y aplicar planes fijados por la conducción del Estado. La opción correcta reformula esas tres premisas.","por_que_no":["Es la lógica de la NEP (mercado agrario, industrialización gradual, recursos hacia lo más rentable), justo lo que el viraje abandonó.","Son las primeras medidas revolucionarias de 1917-1918, no las premisas del viraje de 1928-1929.","","Empieza bien (colectivización), pero agrega la atención a los bienes de consumo y los consejos regionales, que son objetivos y medidas de la reforma de Jrushov en los años cincuenta."],"pag":"p. 3"},{"id":"pal-n2","tema":"P7","nivel":"normal","enunciado":"De acuerdo con Palazuelos, ¿cómo se orientaba la inversión en la estrategia de crecimiento impuesta a partir del viraje de 1929?","opciones":["Alrededor de un tercio del ingreso anual iba a inversión en acero, metales, energía, maquinaria y química.","Los escasos fondos estatales se dirigían al agro y a las industrias más rentables, postergando la industria pesada.","La inversión se repartía de modo equilibrado entre bienes de producción y de consumo para elevar el nivel de vida.","La industrialización se financiaba principalmente con créditos y capitales aportados por las potencias occidentales."],"correcta":0,"explicacion":"Según el autor, la estrategia fijada por la cúspide del Partido-Estado privilegiaba de modo absoluto a las ramas pesadas: alrededor de un tercio de la renta de cada año se transformaba en inversión en metalurgia, siderurgia, energía, mecánica y química. Ese crecimiento ampliaba a su vez la capacidad de acumular y volver a invertir.","por_que_no":["","Describe la estrategia gradual de la NEP, que canalizaba los recursos hacia la agricultura y lo más rentable; el viraje hizo lo opuesto.","Contradice el texto: el modelo generó fuertes desequilibrios en perjuicio de los bienes de consumo y del agro.","El autor subraya lo contrario: un contexto externo hostil, con restricciones comerciales y financieras y hostigamiento de las potencias occidentales."],"pag":"p. 4"},{"id":"pal-n3","tema":"P7","nivel":"normal","enunciado":"¿Qué quiere decir Palazuelos cuando califica de “extensivo” al crecimiento económico soviético de la etapa estalinista?","opciones":["Que el producto crecía principalmente gracias a mejoras sostenidas de productividad y a la incorporación de tecnología moderna.","Que el producto crecía principalmente por sumar más trabajo, recursos naturales y capital, y no por usarlos con más eficiencia.","Que la industria se expandió sustituyendo la inversión en maquinaria por el empleo masivo de mano de obra barata del campo.","Que el crecimiento se distribuyó de manera pareja entre las distintas ramas productivas y las distintas regiones del país."],"correcta":1,"explicacion":"Para el autor, el crecimiento fue “extensivo” porque se apoyó en contar con muchos recursos disponibles: tierra y minerales, mano de obra que venía del campo y del trabajo femenino, y fondos que el Estado extraía de la sociedad. Lo opuesto es el crecimiento “intensivo”, basado en aumentar la eficiencia, que la URSS no logró alcanzar.","por_que_no":["Describe el crecimiento intensivo, justo el que el sistema soviético no pudo alcanzar: la productividad era baja y la técnica, atrasada.","","Trampa: el modelo invertía muchísimo en equipos nuevos (cerca de un tercio de la renta); lo que faltaba era eficiencia y tecnología moderna, no máquinas.","Confunde “extensivo” con “extendido”: el texto destaca, al contrario, fuertes desequilibrios entre ramas."],"pag":"pp. 5, 8 y 10"},{"id":"pal-n4","tema":"P7","nivel":"normal","enunciado":"Según Palazuelos, ¿cuál era el aporte fundamental del sector agrario a la industrialización durante los planes de los años treinta?","opciones":["Generar abundantes divisas mediante exportaciones, con las que se compraba maquinaria en el exterior.","Ofrecer a la industria ligera un mercado en expansión donde colocar sus bienes de consumo.","Liberar recursos mediante la libre compraventa de tierras y cosechas entre los propios campesinos.","Financiar a la industria, sobre todo con impuestos y con los precios que fijaba el Estado."],"correcta":3,"explicacion":"El autor explica que el Estado usó al campo como fuente decisiva de recursos (insumos, comida, trabajadores y algo de cobertura exterior), pero que lo fundamental fue el financiamiento de la industria mediante los impuestos y una política de precios desfavorable para lo agrario.","por_que_no":["Exagera un aporte menor: el texto habla de una “pequeña” cobertura exterior para comprar artículos industriales, no de abundantes divisas.","Contradice el modelo: la industria de bienes de consumo quedó rezagada y al campo se le extraían recursos en lugar de ampliar su capacidad de compra.","Es el mecanismo de la NEP (libre compraventa de productos, tierra y trabajo), que el viraje de 1929 dejó atrás.",""],"pag":"p. 5"},{"id":"pal-n5","tema":"P7","nivel":"normal","enunciado":"En el marco de gestión estatal que describe Palazuelos para el sistema formado en los años treinta, ¿qué lugar ocupaban las empresas?","opciones":["Decidían qué fabricar según los pedidos de otras empresas y de los consumidores, dentro de los márgenes del plan.","Estaban dirigidas por las organizaciones obreras, que fijaban en cada fábrica las metas de producción y los salarios.","Ocupaban la base de la pirámide de mando y se limitaban a cumplir las cuotas de producción asignadas desde arriba.","Negociaban sus metas con los consejos regionales, que habían reemplazado a los ministerios de cada rama."],"correcta":2,"explicacion":"Para el autor, la cúspide del Partido-Estado fijaba las prioridades y la cadena administrativa las ejecutaba; las empresas quedaban abajo de todo, reducidas a cumplir las cifras de producción que les imponían los organismos superiores. Por eso producían sin atender a la demanda real de otras empresas o de la población.","por_que_no":["Contradice el texto: las empresas producían sin considerar la demanda y entregaban su producción a los organismos comerciales del Estado.","El control obrero fue una medida inicial de 1917 que desapareció con el comunismo de guerra; en el sistema, los trabajadores no participaban de las decisiones.","","Trampa de período: los consejos regionales los creó Jrushov en 1957-1958 al suprimir los ministerios; no son parte del sistema estalinista."],"pag":"pp. 3-4"},{"id":"pal-n6","tema":"P7","nivel":"normal","enunciado":"Según Palazuelos, ¿qué dato ilustra la transformación estructural que vivió la economía soviética entre 1928 y el fin del segundo plan quinquenal (1937)?","opciones":["La industria ligera pasó de representar el 40% del valor industrial a superar el 60% diez años más tarde.","El peso de la industria en la producción global pasó de más o menos un tercio a cerca de tres quintos.","La agricultura colectivizada pasó de aportar un tercio de la producción global a cerca de tres quintos.","Los bienes de consumo duplicaron su participación en el valor industrial gracias a la prioridad del plan."],"correcta":1,"explicacion":"El autor sostiene que en una década la estructura soviética cambió de raíz: la industria pasó de generar alrededor de un tercio de la producción total en 1928 al 60% en 1937, y dentro de ella la pesada subió del 40% al 60%. Es la prueba de que el crecimiento fue alto en la renta, mayor en la industria y máximo en las ramas pesadas.","por_que_no":["Trampa de palabras: el salto del 40% al 60% del valor industrial corresponde a la industria pesada, no a la ligera.","","Atribuye el salto al agro, que fue justamente uno de los sectores rezagados por el modelo.","Contradice la prioridad del modelo: los bienes de consumo perdieron peso frente a los bienes de producción."],"pag":"pp. 4-5"},{"id":"pal-n7","tema":"P7","nivel":"normal","enunciado":"Según Palazuelos, ¿cuál era la lógica económica de la Nueva Política Económica (NEP) lanzada en 1921?","opciones":["Colectivizar la agricultura para obtener del campo los fondos necesarios para una industrialización inmediata.","Someter la producción y el comercio al control absoluto del Estado para garantizar los suministros del frente.","Planificar la economía desde el Gosplan, con precios fijados y prioridad para la siderurgia y la energía.","Reactivar la economía desde el agro y con mercado, dejando la industria pesada para más adelante."],"correcta":3,"explicacion":"La NEP buscaba resistir el aislamiento, recomponer la colaboración con los campesinos y recuperar la economía apoyándose en la agricultura. Restablecía el mercado (libre compraventa de productos agrarios, tierra y fuerza de trabajo) y renunciaba a industrializar rápido: la industria pesada llegaría a mediano plazo, como fruto del crecimiento.","por_que_no":["Es la lógica del viraje estalinista de 1928-1929, no de la NEP: confunde las dos etapas.","Describe el comunismo de guerra (1918-1921), cuyo colapso dio origen a la NEP.","Corresponde al sistema de planificación centralizada con prioridad a la industria pesada que se impuso desde 1929.",""],"pag":"p. 2"},{"id":"pal-d1","tema":"P7","nivel":"dificil","enunciado":"Según Palazuelos, ¿qué fue lo que en última instancia determinó el “gran viraje” de 1928-1929?","opciones":["El derrumbe de la producción agraria durante la NEP, que volvía imposible seguir abasteciendo a las ciudades.","La inminencia de una guerra con Occidente, que obligaba a volcar la economía a la preparación militar.","El consenso de la mayoría de los dirigentes bolcheviques, convencidos de que la NEP ya estaba agotada.","La puja por el poder en la cúpula del Partido, donde los argumentos económicos servían como justificación."],"correcta":3,"explicacion":"El autor afirma que el viraje no lo decidió el curso de la economía sino la dura lucha política en la conducción del Partido: cada bando usaba la situación económica para justificar su posición. Hacia 1928 el aparato, en manos del grupo de Stalin, ya había optado por eliminar a sus rivales e imponer el cambio.","por_que_no":["Versión de sentido común que el texto desmiente: a mediados de los veinte el agro crecía y aumentaba la renta campesina.","Cambia de período: la preparación militar llevó a interrumpir el tercer plan (1938-1942), no al viraje de 1929.","No hubo consenso ni convicción económica, sino una lucha desigual por el poder en la que la economía servía de justificación. Además, en los debates la mayoría se inclinaba por mantener la NEP.",""],"pag":"pp. 2-3"},{"id":"pal-d2","tema":"P7","nivel":"dificil","enunciado":"Según el autor, ¿por qué la agricultura y la producción de bienes de consumo quedaron rezagadas durante la industrialización de los años treinta?","opciones":["Porque la guerra civil había destruido esas ramas y el Estado no llegó a tiempo para reconstruirlas.","Porque se les asignaban pocos fondos y los precios relativos las perjudicaban frente a las ramas pesadas.","Porque la población demandaba poco, dado que el Estado le garantizaba la cobertura de sus necesidades básicas.","Porque el Estado prefirió importar alimentos y bienes de consumo antes que producirlos dentro del país."],"correcta":1,"explicacion":"Palazuelos explica que el fuerte crecimiento generó desequilibrios entre ramas: el agro y los bienes de consumo recibían recursos insuficientes y, además, los precios relativos los dejaban en clara desventaja frente a la industria pesada. Ese atraso frenaba la mejora de las condiciones de vida y creaba tensiones de precios.","por_que_no":["Cambia de período y de causa: el rezago se explica por la asignación de recursos y los precios del modelo de los treinta, no por la guerra civil.","","Mezcla un dato cierto (el Estado garantizaba una subsistencia mínima) con una causa falsa: el problema era la oferta escasa, no la falta de demanda.","Inventa una causa: el autor explica el rezago por la escasa asignación de recursos y los precios; incluso menciona la negativa del sistema a importar bienes de consumo."],"pag":"p. 5"},{"id":"pal-d3","tema":"P7","nivel":"dificil","enunciado":"¿Cuál de los siguientes factores NO forma parte de la explicación de Palazuelos sobre la baja productividad del trabajo y de los equipos en el sistema formado en los años treinta?","opciones":["Haber levantado la industria con técnicas de la revolución industrial del siglo XIX, muy rezagadas frente a las capitalistas.","Una política inversora que privilegiaba sumar equipos nuevos antes que mejorar el rendimiento de los existentes.","Un abastecimiento de insumos tan gigantesco y burocrático que sus fallas se propagaban en cadena.","La falta de inversión, porque la mayor parte del excedente se destinaba al consumo de la población."],"correcta":3,"explicacion":"El autor atribuye la baja productividad a tres factores: el atraso tecnológico (incluido el uso de técnicas del siglo XIX), una política de inversiones que priorizaba los equipos nuevos sobre la eficiencia de los existentes y los problemas del abastecimiento técnico-material. No hubo falta de inversión: cerca de un tercio del excedente iba a acumulación y algo menos de la mitad al consumo privado.","por_que_no":["Sí figura: es parte del atraso tecnológico, ya que la industria pesada se levantó con tecnologías de la revolución industrial del siglo XIX.","Sí figura: es la política de inversiones, que ponía la cantidad por encima de la calidad.","Sí figura: es el problema del abastecimiento técnico-material, cuyas fallas repercutían entre empresas, ramas y territorios.",""],"pag":"pp. 5-6"},{"id":"pal-d4","tema":"P7","nivel":"dificil","enunciado":"Según Palazuelos, ¿cómo se distribuía la fuerza de trabajo en el sistema económico consolidado durante los años treinta?","opciones":["Mediante diferencias salariales que atraían a los obreros más calificados hacia las ramas que el plan priorizaba.","Por decisión de los comités obreros de cada fábrica, que controlaban la producción y las contrataciones.","A través de un mercado libre de fuerza de trabajo, como el que se había restablecido en los años veinte.","Por vía administrativa, con traslados forzosos entre empresas, ramas o regiones; el salario no era decisivo."],"correcta":3,"explicacion":"El autor señala que el mercado de trabajo también estaba sometido a criterios administrativos, incluido el traslado obligatorio de los trabajadores entre empresas, ramas o zonas. Por eso el salario no cumplía un papel determinante en la asignación de la mano de obra: es una de las formas de control y disciplina del sistema.","por_que_no":["Es lo que ocurriría en un mercado de trabajo; el texto aclara que el salario no era determinante en la asignación.","El control obrero fue una medida de 1917 que desapareció con el comunismo de guerra; en el sistema los trabajadores no participaban de las decisiones.","La libre compraventa de fuerza de trabajo era propia de la NEP; el viraje la reemplazó por criterios administrativos.",""],"pag":"p. 7"},{"id":"pal-d5","tema":"P7","nivel":"dificil","enunciado":"Tras una guerra que destruyó cerca de un tercio de la riqueza nacional, ¿cómo encaró la URSS la reconstrucción con los planes de 1946-1955, según Palazuelos?","opciones":["Repitiendo el esquema de los treinta: gestión piramidal, prioridad a la industria pesada y crecimiento extensivo.","Abriendo nuevas tierras de cultivo, subiendo los precios agrarios y condonando deudas para sacar al campo del atraso.","Dando prioridad a los bienes de consumo para compensar a la población por los enormes sacrificios de la guerra.","Descentralizando la gestión en consejos regionales y reduciendo la cantidad de indicadores obligatorios de cada plan."],"correcta":0,"explicacion":"Según el autor, los planes de posguerra se parecieron mucho a los dos primeros: la misma gestión estatal, piramidal y rígida, y el mismo modelo de acumulación, que daba a la industria pesada prioridad absoluta. En 1955 las ramas prioritarias tenían dos o tres veces la capacidad de 1940 porque absorbieron gran parte de los recursos disponibles: otra vez un crecimiento “extensivo”.","por_que_no":["","Son medidas agrarias de la reforma de Jrushov iniciada a fines de 1953; en la posguerra estalinista el agro apenas recuperó los niveles de diez años antes.","Contradice el texto: los bienes de consumo crecieron con lentitud y el nivel de vida siguió siendo bajo.","Son las reformas de la gestión de Jrushov de 1957-1958, no la reconstrucción de posguerra."],"pag":"pp. 7-8"},{"id":"pal-d6","tema":"P7","nivel":"dificil","enunciado":"En el sistema formado en los años treinta, ¿por qué, según Palazuelos, la máxima centralización de las decisiones no garantizaba que las prioridades de la cúspide se ejecutaran con racionalidad?","opciones":["Porque las empresas fijaban libremente sus precios y desviaban parte de la producción hacia el mercado privado.","Porque cada nivel burocrático tenía intereses propios que deformaban la ejecución y la información que subía.","Porque los consejos obreros de las fábricas podían vetar las órdenes del Gosplan cuando las juzgaban injustas.","Porque el Gosplan no tenía autoridad jerárquica sobre los consejos regionales que dirigían cada territorio."],"correcta":1,"explicacion":"El autor muestra que en cada nivel del aparato burocrático surgían intereses particulares que distorsionaban cómo se ejecutaban y controlaban las prioridades. Así, los centros de decisión recibían información insuficiente y lenta, se dificultaba el cálculo económico y crecían la irracionalidad, los desequilibrios y la ineficiencia.","por_que_no":["Contradice el sistema descripto: precios, cantidades e ingresos los fijaba el plan, y las empresas solo cumplían cifras de producción.","","Los trabajadores no ejercían ningún control ni participaban en las decisiones; el control obrero había desaparecido con el comunismo de guerra.","Trampa de período: la falta de relación jerárquica del Gosplan con los consejos regionales es de la reforma de Jrushov (1957-1958)."],"pag":"pp. 3-4"},{"id":"pal-d7","tema":"P7","nivel":"dificil","enunciado":"Según Palazuelos, ¿por qué el plan septenal de Jrushov (1959-1965) no logró transformar en esencia el modelo heredado?","opciones":["Porque abandonó la industria pesada para volcar la inversión a los bienes de consumo, y el crecimiento se desplomó.","Porque restableció el mercado libre de tierras y de trabajo, lo que reavivó la desigualdad entre los campesinos.","Porque, para crecer rápido, siguió compensando la baja productividad con más inversión y más trabajadores del agro.","Porque reforzó los ministerios de cada rama y las atribuciones del Gosplan, lo que acentuó la centralización."],"correcta":2,"explicacion":"El autor sostiene que Jrushov conservó como meta central un crecimiento muy alto (cerca del 7% anual) y, para lograrlo, suplió la dificultad de elevar la productividad con grandes inversiones y nuevos trabajadores llegados del campo; la pesada siguió absorbiendo seis séptimas partes de la inversión industrial. Así mantuvo las prioridades del modelo de acumulación y reforzó la ineficiencia y el desequilibrio.","por_que_no":["Invierte el texto: la industria pesada siguió absorbiendo seis séptimas partes de la inversión industrial.","Atribuye a Jrushov medidas de la NEP; su política agraria subió precios e inversiones, no liberalizó la tierra.","","Es lo contrario de lo que hizo: suprimió los ministerios por rama y recortó funciones del Gosplan."],"pag":"pp. 9-10"},{"id":"pal-m1","tema":"P7","nivel":"muy_dificil","enunciado":"Según Palazuelos, ¿cuáles de las siguientes afirmaciones sobre el crecimiento soviético de los años treinta son correctas? I. Se apoyó en la incorporación de trabajadores que llegaban del campo y de mujeres que se sumaban a la producción. II. Se sostuvo en la rápida adopción de las tecnologías más avanzadas de los países capitalistas. III. El Estado pudo financiarlo porque controlaba a la sociedad y podía extraerle recursos. IV. Se vio favorecido por un comercio exterior fluido y por créditos de las potencias occidentales.","opciones":["Solo I y III","Solo I, II y III","Solo II y IV","Solo I, III y IV"],"correcta":0,"explicacion":"El autor dice que el crecimiento fue extensivo: contó con abundantes recursos naturales, con mano de obra procedente de la agricultura y del trabajo femenino (I) y con fondos que el Estado podía extraer porque dominaba a la sociedad (III). En cambio, la industria se levantó con tecnologías de la revolución industrial del siglo XIX (II es falsa) y en un contexto externo hostil, con restricciones comerciales y financieras (IV es falsa).","por_que_no":["","Incluye II, que contradice el texto: se industrializó con técnicas del siglo XIX, con fuerte retraso respecto de los países capitalistas.","Elige justo las dos falsas: no hubo tecnología de punta ni apoyo externo, sino atraso técnico y hostigamiento occidental.","Incluye IV: el autor destaca relaciones exteriores muy desfavorables, con restricciones comerciales y financieras."],"pag":"pp. 5-6"},{"id":"pal-m2","tema":"P7","nivel":"muy_dificil","enunciado":"Si alguien sostuviera que el sistema económico formado bajo Stalin fracasó porque no logró hacer crecer la economía, ¿qué le objetaría Palazuelos?","opciones":["Que el crecimiento fue muy alto, aunque dependió de la tecnología y de los créditos que llegaban de las potencias occidentales.","Que creó una gran capacidad productiva, y que sus problemas recién surgieron con el desorden que introdujo la reforma de Jrushov.","Que levantó en muy poco tiempo un enorme aparato industrial, aunque desequilibrado, poco eficiente y con el consumo postergado.","Que el crecimiento fue alto y bastante parejo entre la industria y el agro, aunque el nivel de vida tardó en acompañarlo."],"correcta":2,"explicacion":"Palazuelos no discute que hubo crecimiento: el sistema aseguró un aumento del excedente y levantó en muy poco tiempo una enorme capacidad productiva, pese a adversidades internas y externas. Su crítica apunta a la calidad de ese crecimiento: desequilibrios entre industria y agro y entre ramas pesadas y ligeras, débil eficiencia y un consumo de la población que quedaba muy por detrás de lo que se podía producir.","por_que_no":["Mitad bien, mitad mal: el crecimiento fue alto, pero en un contexto externo hostil, con restricciones comerciales y financieras, y con técnicas del siglo XIX.","Mitad bien, mitad mal: los desequilibrios y la baja eficiencia venían de los años treinta; la reforma de Jrushov intentó corregirlos.","","Mitad bien, mitad mal: el autor subraya que el crecimiento fue muy desparejo, con el agro y los bienes de consumo rezagados frente a la industria pesada."],"pag":"pp. 4-7"},{"id":"pal-m3","tema":"P7","nivel":"muy_dificil","enunciado":"¿Cuál de las siguientes comparaciones entre la NEP y el modelo surgido del viraje de 1929 es correcta según Palazuelos?","opciones":["La NEP priorizaba la industria pesada con mercado libre; el viraje, en cambio, dio prioridad al agro bajo planificación central.","Ambas se apoyaban en planes obligatorios del Gosplan; la diferencia es que la NEP los limitaba a la producción agrícola.","La NEP hundió la producción agraria; el viraje logró que el agro creciera más rápido que la industria durante los treinta.","La NEP partía del agro y dejaba la pesada para después; el viraje invirtió el orden y usó al agro para financiarla."],"correcta":3,"explicacion":"Según el autor, la NEP era una estrategia gradual: recuperar primero la agricultura con mercado, luego desarrollar la industria vinculada al agro y, a mediano plazo, la pesada. El viraje de 1929 rompió con eso: prioridad absoluta e inmediata a las ramas pesadas y un agro colectivizado convertido en fuente de recursos (impuestos y precios) para la industria.","por_que_no":["Invierte las prioridades: la NEP partía del agro y el viraje priorizó la industria pesada.","La NEP se basaba en relaciones de mercado; los planes impuestos desde el Estado son una premisa del viraje.","Falla en las dos partes: bajo la NEP el agro daba buenos resultados, y en los treinta quedó rezagado frente a la industria.",""],"pag":"pp. 2-5"},{"id":"pal-m4","tema":"P7","nivel":"muy_dificil","enunciado":"Durante los planes estalinistas el excedente crecía con rapidez, pero el nivel de vida casi no mejoraba. ¿Cuál es la explicación más completa de esa paradoja según Palazuelos?","opciones":["La mayor parte del excedente iba al consumo privado, pero la inflación de los precios libres de mercado anulaba esa mejora.","Buena parte de la renta se reinvertía y otra la absorbía el Estado, mientras el agro y las ramas de consumo recibían poco.","El bloqueo occidental impedía importar bienes de consumo, y eso explicaba la escasez a pesar de una buena producción interna.","Las secuelas de la guerra civil obligaron a destinar el grueso del excedente a reparar la infraestructura que había quedado destruida."],"correcta":1,"explicacion":"El autor explica que el Estado destinaba alrededor de un tercio del excedente a nuevas inversiones, que el aparato estatal absorbía una parte significativa (más burocracia, gasto militar, despilfarro) y que la población recibía algo menos de la mitad. A eso se sumaba el rezago del agro y de los bienes de consumo, que limitaba la oferta: de ahí la distancia entre el esfuerzo de la población y su bajo nivel de vida.","por_que_no":["Falla dos veces: el consumo privado recibía algo menos de la mitad de la renta y los precios no eran libres, los fijaba el plan.","","El autor no atribuye la escasez a un bloqueo: la producción interna de bienes de consumo era insuficiente y de mala calidad.","Cambia de período: la guerra civil terminó en 1921; el autor explica la paradoja por el reparto del excedente que hacía el Estado."],"pag":"pp. 5-8"},{"id":"pal-m5","tema":"P7","nivel":"muy_dificil","enunciado":"Los reformistas encabezados por Gorbachov atribuían la crisis de la economía soviética a la inacción del equipo de Brézhnev. ¿Qué posición adopta Palazuelos frente a ese diagnóstico?","opciones":["Coincide con ellos: hasta los años setenta el sistema había funcionado sin desequilibrios graves ni problemas serios de eficiencia.","Admite que la parálisis de los setenta agravó el deterioro, pero afirma que muchos problemas venían de la formación del sistema.","Lo rechaza y atribuye la crisis sobre todo a la crisis del capitalismo internacional y al deterioro del comercio exterior.","Lo rechaza y ubica el origen de la crisis en la reforma de Jrushov, que desorganizó un sistema que hasta entonces era eficiente."],"correcta":1,"explicacion":"El autor no niega que la parálisis de los setenta tuviera una gravedad inusitada y acelerara el deterioro, pero sostiene que, si se estudia con más rigor cómo se formó el sistema, muchos problemas venían arrastrándose desde hacía medio siglo, es decir, desde el modelo construido en los años treinta.","por_que_no":["El autor muestra desequilibrios e ineficiencia desde los años treinta, y límites patentes ya a fines de los cincuenta.","","El autor aclara que no puede responsabilizarse a los factores externos de la crisis interna; solo la agravaron.","La reforma de Jrushov intentó corregir problemas que ya existían; según el texto, el sistema previo no era eficiente."],"pag":"p. 14"},{"id":"pal-m6","tema":"P7","nivel":"muy_dificil","enunciado":"Según Palazuelos, ¿cuáles de las siguientes afirmaciones describen la situación de los trabajadores en el sistema económico consolidado bajo Stalin? I. No tenían ningún poder sobre los medios de producción ni voz en las decisiones económicas. II. Sus salarios aumentaban al mismo ritmo que el crecimiento que generaban. III. Podían ser trasladados por vía administrativa a otra empresa, rama o región. IV. Como al resto de la población, el Estado les aseguraba un piso mínimo de subsistencia.","opciones":["Solo I y II","Solo I, III y IV","Solo II, III y IV","Solo I y III"],"correcta":1,"explicacion":"Según el autor, los trabajadores carecían de poder sobre los medios de producción y de voz en las decisiones (I), y sus salarios no mejoraban en proporción al crecimiento, por eso II es falsa. El trabajo se asignaba con criterios administrativos, incluso con traslados obligatorios (III), y el Estado garantizaba a toda la población, trabajadores incluidos, una cobertura mínima de subsistencia (IV).","por_que_no":["Incluye II, que el texto niega: los salarios no mejoraban acorde con el crecimiento; además deja afuera III y IV, que son correctas.","","Incluye II, falsa según el autor, y deja afuera I, que es correcta.","Omite IV: el autor dice que el Estado garantizaba una cobertura mínima de subsistencia a toda la población, trabajadores incluidos."],"pag":"pp. 4 y 7"},{"id":"pal-m7","tema":"P7","nivel":"muy_dificil","enunciado":"Supóngase una fábrica soviética de los años treinta que cumple con holgura su meta de producción de calzado, mientras en las tiendas faltan los talles y modelos que la gente busca. ¿Cómo explicaría Palazuelos esa situación?","opciones":["La fábrica tenía autonomía para elegir su producción y prefirió los modelos más rentables, aunque no fueran los demandados.","La caída de los precios libres por exceso de oferta llevó a la fábrica a recortar los modelos que menos se vendían.","El Gossnab asignaba tantos recursos a la industria ligera que se producía más calzado del que podía distribuirse.","La fábrica cumplía cifras fijadas desde arriba y entregaba su producción al Estado, sin mirar qué pedía la gente."],"correcta":3,"explicacion":"Para el autor, las empresas eran meras ejecutoras de cifras de producción impuestas por los organismos superiores y producían sin considerar la demanda: terminada la fabricación, entregaban todo a los organismos estatales de comercio, que repartían por redes burocráticas. De ahí los desajustes entre lo fabricado y lo que necesitaba la gente, y una oferta pobre en calidad y surtido.","por_que_no":["Las empresas no tenían autonomía ni buscaban rentabilidad: solo cumplían las cifras de producción impuestas.","En el sistema estalinista los precios no eran libres: cantidades, precios e ingresos los fijaba el plan.","El Gossnab distribuía bienes de producción y la industria ligera recibía pocos recursos; el problema era el desajuste, no el exceso.",""],"pag":"pp. 4, 6 y 7"}],"desarrollo":[{"id":"pal-d-n1","tema":"P7","nivel":"normal","consigna":"Según Palazuelos, ¿qué características tuvo la economía de la URSS bajo Stalin a partir del “gran viraje” de 1928-1929? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Viraje de 1928-1929 y sus tres premisas","detalle":"Ubica el viraje impuesto por el grupo de Stalin y nombra sus tres premisas: colectivización del agro, industrialización acelerada a gran escala y planes impuestos desde el Estado.","peso":3,"indicios":[["colectiv"],["industrializ"],["plan"]]},{"id":"b","punto":"Estado propietario y planificación centralizada","detalle":"Explica que el Estado era dueño de los medios de producción y dirigía la economía con la planificación del Gosplan, con decisiones centralizadas en la cúpula del Partido-Estado y empresas que solo cumplían cifras.","peso":3,"indicios":[["gosplan","centraliz","planificacion central"],["propiet","dueno","medios de produccion","cifras","metas","cupula"]]},{"id":"c","punto":"Prioridad absoluta a la industria pesada","detalle":"Señala que cerca de un tercio de la renta anual se invertía, con prioridad absoluta para las ramas pesadas (metalurgia, siderurgia, energía, mecánica, química).","peso":3,"indicios":[["pesada","bienes de produccion","siderur","metalur"],["invers","invert","tercio","priori"]]},{"id":"d","punto":"Crecimiento extensivo","detalle":"Caracteriza el crecimiento como extensivo: basado en sumar recursos (mano de obra del campo y femenina, recursos naturales, fondos extraídos por el Estado) y no en mejorar la eficiencia.","peso":3,"indicios":[["extensiv","mas recursos","aumento de recursos","sumar recursos","incorporacion de recursos"],["recurso","eficien","ineficien","insumo","factor"]]},{"id":"e","punto":"Resultados: industrialización en diez años","detalle":"Muestra el resultado con datos: la industria pasó de un tercio de la producción total (1928) al 60% (1937) y la pesada del 40% al 60% de la industrial.","peso":2,"indicios":[["al 60","el 60","tres quintos","record","diez anos","fuertemente industrializ"]]},{"id":"f","punto":"Costos: desequilibrios y nivel de vida","detalle":"Indica que el agro y los bienes de consumo quedaron rezagados, con baja productividad y un nivel de vida muy por debajo de la capacidad productiva alcanzada.","peso":2,"indicios":[["rezag","desequilib","nivel de vida","condiciones de vida","escasez","escasos","postergad","relegad"]]}],"respuesta_modelo":"Para Palazuelos, el “gran viraje” de 1928-1929 rompió con la NEP y dio origen a un nuevo sistema económico. El grupo de Stalin, que controlaba el aparato del Partido, impuso tres premisas: colectivizar la agricultura, industrializar en forma acelerada y a gran escala, y aplicar planes fijados desde la dirección del Estado. El Estado era dueño de los principales medios de producción y, mediante la planificación del Gosplan, decidía qué producir y cómo repartir la renta entre consumo y acumulación; las empresas solo cumplían las cifras ordenadas desde arriba. Cerca de un tercio de la renta anual se invertía, con prioridad absoluta en la industria pesada. El resultado fue una industrialización rapidísima: la industria pasó de un tercio de la producción total en 1928 al 60% en 1937. Pero el crecimiento fue extensivo, porque se apoyó en sumar trabajadores, recursos naturales y fondos extraídos por el Estado, no en mejorar la eficiencia, y dejó rezagados al agro y a los bienes de consumo, con un nivel de vida bajo.","errores_comunes":["Atribuir a los planes quinquenales rasgos de la NEP (mercado libre, prioridad del agro, industrialización gradual).","Decir que el viraje ocurrió porque la NEP había fracasado en el agro: el autor lo atribuye a la lucha política dentro del Partido.","Definir el crecimiento extensivo como crecimiento “sin máquinas”: hubo una enorme inversión en equipos; lo que faltó fue eficiencia y tecnología moderna.","Afirmar que la industrialización mejoró rápidamente el nivel de vida de la población."],"pag":"pp. 3-7"},{"id":"pal-d-n2","tema":"P7","nivel":"normal","consigna":"Según Palazuelos, ¿por qué el crecimiento de la economía soviética bajo Stalin fue un crecimiento “extensivo”? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Qué es el crecimiento extensivo","detalle":"Define extensivo como crecimiento obtenido por la incorporación de más recursos (trabajo, recursos naturales, capital) y no por el aumento de la eficiencia; lo contrapone al intensivo.","peso":3,"indicios":[["extensiv"],["recurso","insumo","factores"],["eficien","ineficien","productiv","intensiv"]]},{"id":"b","punto":"Mano de obra del campo y de las mujeres","detalle":"Menciona que la fuerza de trabajo creció con trabajadores que venían de la agricultura y con la incorporación del trabajo femenino.","peso":3,"indicios":[["mano de obra","trabajador","fuerza de trabajo","laboral"],["campo","campesin","agricult","rural"],["mujer","femenin"]]},{"id":"c","punto":"Abundantes recursos naturales","detalle":"Señala la abundante dotación de recursos naturales (tierra, minerales) que se explotaba.","peso":2,"indicios":[["recursos natural","mineral","tierra"]]},{"id":"d","punto":"Recursos financieros extraídos por el Estado","detalle":"Explica que el Estado obtenía fondos usando su dominio sobre la sociedad (sobre todo del agro, con impuestos y precios) y volcaba cerca de un tercio de la renta a la inversión.","peso":2,"indicios":[["financ","fondos","invers","tercio","acumul"],["impuest","precio","domin","extra","sacaba","obtenia"]]},{"id":"e","punto":"Baja productividad y atraso técnico","detalle":"Indica que la productividad era baja por atraso tecnológico (técnicas del siglo XIX), una inversión que priorizaba equipos nuevos sobre la eficiencia (cantidad sobre calidad) y fallas de abastecimiento.","peso":2,"indicios":[["productiv","eficien","ineficien","rendimiento"],["tecnolog","tecnic","siglo xix","siglo 19","cantidad sobre","abastec"]]},{"id":"f","punto":"Se repite en la posguerra y se agota","detalle":"Agrega que la reconstrucción de 1946-1955 volvió a ser extensiva y que en los años cincuenta el modelo ya mostraba signos de agotamiento.","peso":1,"indicios":[["posguerra","reconstru","1946","1955","jrus","krus","khrus","agot"]]}],"respuesta_modelo":"Palazuelos llama “extensivo” al crecimiento que se logra incorporando cada vez más recursos productivos, y no usando mejor los que ya existen, que sería el crecimiento “intensivo”, basado en la eficiencia. Así creció la URSS desde el viraje de 1929. Contó con abundantes recursos naturales, como tierra y minerales; con mano de obra que llegaba desde el campo y con la incorporación del trabajo femenino; y con recursos financieros que el Estado obtenía gracias a su dominio sobre la sociedad, sobre todo extrayéndolos del agro con impuestos y precios. Cerca de un tercio de la renta se invertía en las ramas pesadas. Sin embargo, la productividad era baja, tanto la del trabajo como la de los equipos: se usaban técnicas del siglo XIX, la inversión privilegiaba levantar equipos nuevos antes que mejorar los existentes (la cantidad sobre la calidad) y el abastecimiento era burocrático. La reconstrucción de posguerra repitió el mismo patrón, y ya en los años cincuenta el modelo mostraba signos de agotamiento.","errores_comunes":["Decir que el crecimiento extensivo prescindió de maquinaria: la inversión en equipos nuevos fue enorme; lo que faltó fue eficiencia y tecnología moderna.","Confundir extensivo con intensivo, o afirmar que la URSS de Stalin creció gracias a la innovación tecnológica.","Atribuir el crecimiento a créditos o comercio con Occidente: el autor describe un contexto externo hostil.","Limitar la noción a los años treinta, olvidando que la reconstrucción de posguerra repitió el mismo patrón."],"pag":"pp. 5-6, 8 y 10"},{"id":"pal-d-d1","tema":"P7","nivel":"dificil","consigna":"Explique por qué, según Palazuelos, la agricultura fue al mismo tiempo sostén y víctima de la industrialización estalinista.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Colectivización como premisa del viraje","detalle":"Ubica la colectivización de la agricultura como una de las tres premisas del viraje de 1928-1929, que rompió con la NEP (estrategia que partía del agro y del mercado).","peso":2,"indicios":[["colectiv"],["viraje","1928","1929","nep","stalin"]]},{"id":"b","punto":"El agro como fuente de recursos","detalle":"Explica que el Estado usó al agro como fuente decisiva de recursos: materias primas, alimentos, mano de obra y algo de divisas.","peso":2,"indicios":[["materia","aliment","mano de obra","trabajador","divisa","export"],["fuente","aport","proporcion","provei","suministr"]]},{"id":"c","punto":"Financiamiento vía impuestos y precios","detalle":"Señala que el aporte fundamental fue financiero: impuestos y una política de precios bajos para lo agrícola y altos para lo industrial que compraba el campo.","peso":3,"indicios":[["impuest","precio","tribut"],["financ","fondos","transfer","traslad","extra"]]},{"id":"d","punto":"Rezago por pocos recursos y precios desfavorables","detalle":"Explica que el agro quedó rezagado porque recibía recursos insuficientes y su relación de precios con la industria pesada era desfavorable.","peso":3,"indicios":[["rezag","atras","estanc","desequilib"],["insuficien","pocos recursos","escas","precio","desfavorab"]]},{"id":"e","punto":"Consecuencias sobre nivel de vida y precios","detalle":"Relaciona el rezago agrario con el bajo nivel de vida y con tensiones de precios que afectaban a toda la economía; en los cincuenta el agro apenas igualaba los niveles de diez años antes.","peso":2,"indicios":[["nivel de vida","condiciones de vida","tension","diez anos"]]},{"id":"f","punto":"El diagnóstico de 1953 como prueba","detalle":"Usa la crítica de Jrushov de 1953 (precios mínimos, impuestos altos, presión sobre los campesinos, poca inversión, nula autonomía) como muestra de lo que dejó el modelo.","peso":1,"indicios":[["1953","jrus","krus","khrus"]]}],"respuesta_modelo":"Para Palazuelos, la agricultura fue la gran financista de la industrialización estalinista y, a la vez, una de sus principales perjudicadas. Con el viraje de 1928-1929, el grupo de Stalin abandonó la estrategia de la NEP, que partía de la recuperación agraria con mercado y dejaba la industria pesada para después, e impuso la colectivización del agro junto con la industrialización acelerada y los planes estatales. Desde entonces el Estado usó al campo como fuente decisiva de recursos: materias primas, alimentos, mano de obra para las fábricas y una pequeña cobertura exterior. Pero su aporte principal fue financiero: mediante impuestos y una política de precios que pagaba poco por lo agrícola y cobraba caro lo industrial, el Estado trasladaba a la industria pesada el ingreso generado en el campo. Ese mismo mecanismo explica que el agro quedara rezagado: recibía recursos insuficientes y los precios relativos frente a la industria pesada le eran claramente desfavorables. Las consecuencias alcanzaron a toda la economía: la escasa oferta agrícola frenó la mejora del nivel de vida y generó tensiones de precios; en los años cincuenta la producción agraria apenas alcanzaba las cifras de diez años antes. La prueba es el diagnóstico que presentó Jrushov en 1953: precios mínimos pagados por el Estado, impuestos elevados, presión sobre los campesinos, poca inversión y nula autonomía de las granjas. En suma, el campo sostuvo la industrialización al precio de su propio atraso.","errores_comunes":["Decir que bajo la NEP la agricultura fracasó: el autor dice que daba buenos resultados, aunque con desigualdad entre campesinos y sin mejora técnica.","Afirmar que el agro financió la industria sobre todo con exportaciones: el texto habla de una pequeña cobertura exterior; lo central fueron impuestos y precios.","Confundir la colectivización del viraje con la reforma agraria de 1917, que entregó la tierra a los campesinos.","Atribuir a la etapa de Stalin las tierras vírgenes y la suba de precios agrarios, que son medidas de la reforma de Jrushov."],"pag":"pp. 3, 5, 8, 10 y 17"},{"id":"pal-d-d2","tema":"P7","nivel":"dificil","consigna":"¿Cómo logró el Estado soviético, según Palazuelos, movilizar trabajo y recursos para la industrialización acelerada bajo Stalin, y qué costos tuvo ese control para la población?","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Estado propietario y poder despótico","detalle":"Explica que el Estado, dueño de los medios de producción, centralizaba al máximo las decisiones en la cúpula del Partido-Estado y aseguraba la sumisión de empresas y granjas.","peso":3,"indicios":[["centraliz","despot","sumision","jerarqu","piramid","cupula"]]},{"id":"b","punto":"Control del excedente: un tercio a acumulación","detalle":"Señala que el Estado decidía el reparto de la renta: cerca de un tercio a inversión, algo menos de la mitad al consumo y una parte significativa absorbida por la burocracia, el gasto militar y el despilfarro.","peso":2,"indicios":[["tercio","acumul","excedente","reparto de la renta"]]},{"id":"c","punto":"Trabajo asignado administrativamente","detalle":"Indica que el mercado de trabajo se regía por criterios administrativos, con traslados obligatorios entre empresas, ramas o regiones, y que el salario no determinaba la asignación.","peso":3,"indicios":[["traslad","reubica","forzos","obligatori","criterios administrativ","asignacion administrativ","via administrativ","decision administrativ","orden administrativ"],["trabaj","mano de obra","salari","empleo"]]},{"id":"d","punto":"Trabajadores sin control ni participación","detalle":"Afirma que los trabajadores no controlaban los medios de producción, no participaban en las decisiones y sus salarios no crecían acorde con el crecimiento; la renta la controlaba la clase dominante.","peso":2,"indicios":[["no particip","sin particip","no control","sin control","no tenian control","ningun control","ningun poder","no decid","sin decid","sin voz","ni voz","excluid","clase dominante","salarios no crec","salarios no aument","salarios no mejor","salarios no acomp","salarios no sub"]]},{"id":"e","punto":"Disciplina por vía penal","detalle":"Menciona que la disciplina laboral se imponía incluso con el Código Penal, cuyo uso recién moderó la reforma de Jrushov.","peso":1,"indicios":[["penal","castig","sancion","coerc"]]},{"id":"f","punto":"Costos para la población","detalle":"Señala la escasez y mala calidad de los bienes de consumo, el rezago del agro y la brecha creciente entre capacidad productiva y nivel de vida, aunque el Estado garantizaba a toda la población una cobertura mínima de subsistencia.","peso":3,"indicios":[["nivel de vida","condiciones de vida","escasez","subsistencia","bienes de consumo"]]}],"respuesta_modelo":"Según Palazuelos, la clave de la movilización fue el control casi total que el Estado ejercía sobre la economía y la sociedad. Desde el viraje de 1929 el Estado era dueño de los principales medios de producción y, a través de la planificación del Gosplan, decidía qué se producía y cómo se repartía la renta. Ese poder, que el autor califica de despótico, centralizaba las decisiones en la cúpula del Partido-Estado y garantizaba la sumisión de empresas, granjas y demás organismos. Gracias a ese dominio el Estado obtenía recursos financieros, sobre todo del agro vía impuestos y precios, y destinaba cerca de un tercio de la renta a nuevas inversiones en la industria pesada. El trabajo también se movilizaba por vía administrativa: los trabajadores podían ser trasladados obligatoriamente de empresa, rama o región, y el salario no cumplía un papel decisivo en su asignación. Además, la disciplina en las empresas se imponía incluso con el Código Penal, cuyo uso recién moderó Jrushov. Los trabajadores no tenían control sobre los medios de producción ni voz en las decisiones, y sus salarios no mejoraban al ritmo del crecimiento. Los costos fueron altos: a la población le quedaba menos de la mitad de la renta para consumir, los bienes de consumo eran escasos y de mala calidad, el agro quedó rezagado y se ensanchó la brecha entre la enorme capacidad productiva y un nivel de vida bajo, aunque el Estado aseguraba una subsistencia mínima para todos.","errores_comunes":["Explicar la asignación del trabajo por diferencias salariales: el texto dice que el salario no era determinante.","Atribuir al sistema estalinista el control obrero de la producción, que fue una medida de 1917 y desapareció con el comunismo de guerra.","Presentar la menor aplicación del Código Penal como medida de Stalin: fue parte de las reformas de Jrushov, que muestran por contraste la situación anterior.","Presentar como argumentos de Palazuelos datos que el texto no trae (Gulag, stajanovismo, hambrunas)."],"pag":"pp. 3-7 y 11"},{"id":"pal-d-m1","tema":"P7","nivel":"muy_dificil","consigna":"Compare la estrategia de la NEP con el modelo impuesto a partir del “gran viraje” de 1928-1929 (objetivos, papel de la agricultura, mecanismo de asignación de recursos y ritmo de industrialización). ¿Por qué se pasó de una a otro, según Palazuelos?","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"NEP: objetivos y lógica gradual","detalle":"Explica que la NEP (1921) buscaba resistir el aislamiento, recomponer la alianza con los campesinos y recuperar la economía desde el agro, renunciando a la industrialización rápida.","peso":3,"indicios":[["nep","nueva politica"],["agro","agricult","campesin"],["gradual","renunci","mediano plazo","paso a paso","de a poco","lentamente","por etapas"]]},{"id":"b","punto":"NEP: el mercado como mecanismo","detalle":"Señala que la NEP usaba relaciones de mercado: libre compraventa de productos agrarios, tierra y fuerza de trabajo.","peso":2,"indicios":[["mercado","compraventa","compra venta","compra y venta"]]},{"id":"c","punto":"Viraje: tres premisas y prioridad a la pesada","detalle":"Presenta el viraje: colectivización, industrialización acelerada con prioridad absoluta a la pesada (cerca de un tercio de la renta invertida) y planes impuestos desde el Estado.","peso":3,"indicios":[["colectiv"],["pesada","acelerad","planes","planific"]]},{"id":"d","punto":"Cambio en el papel del agro","detalle":"Contrasta el papel del agro: en la NEP era el motor a estimular; con el viraje pasó a ser fuente de recursos para la industria (impuestos y precios) y quedó rezagado.","peso":3,"indicios":[["agro","agricult","campo","campesin"],["fuente de recursos","fuente de financ","financ","impuestos","tribut","subordin","extraia","extraer","extraid","extrajo","extraccion","transfer","traslad"]]},{"id":"e","punto":"Balance de la NEP a mediados de los veinte","detalle":"Señala que el agro daba buenos resultados, pero crecía la desigualdad campesina, no había mejora técnica ni ingresos estatales para la industria, y desde 1926-1927 ya había cambios hacia la industria planificada.","peso":2,"indicios":[["desigual","diferencias sociales","diferenciacion","minoria","kulak","mejora tecnica","mejora tecnolog","1926","1927"]]},{"id":"f","punto":"Causa del viraje: la lucha política","detalle":"Sostiene, con el autor, que el viraje no lo determinó la evolución económica sino la lucha política en la dirección del Partido, ganada por el grupo de Stalin que controlaba el aparato.","peso":3,"indicios":[["lucha polit","luchas polit","lucha intern","luchas intern","lucha de poder","luchas de poder","lucha por el poder","luchas por el poder","lucha en el partido","lucha dentro del partido","pugna","puja","disputa","adversari","rival","razones polit","motivos polit","causas polit","factores polit","decision polit","politica intern","interna del partido","internas del partido","conflicto polit","conflictos polit"]]}],"respuesta_modelo":"Palazuelos presenta la NEP y el modelo surgido del viraje de 1928-1929 como dos estrategias opuestas. La NEP, lanzada en 1921 tras el colapso del comunismo de guerra, buscaba resistir el aislamiento internacional, recomponer la alianza del Estado con los campesinos, que eran más de cuatro quintos de la población, y recuperar la economía a partir de la agricultura. Su mecanismo era el mercado: libre compraventa de productos agrarios, tierra y fuerza de trabajo. Su ritmo era gradual: se renunciaba a industrializar rápido; primero crecería el agro, luego la industria ligada a él y, a mediano plazo, la pesada. El viraje invirtió esa lógica. El grupo de Stalin impuso la colectivización del agro, la industrialización acelerada a gran escala y planes dictados por el Estado. El mecanismo dejó de ser el mercado y pasó a ser la planificación centralizada; el ritmo se volvió forzado, con cerca de un tercio de la renta invertida y prioridad absoluta para la industria pesada. También cambió el papel del agro: de motor a estimular pasó a ser fuente de recursos para la industria, vía impuestos y precios desfavorables, y por eso quedó rezagado. ¿Por qué el cambio? La NEP tenía problemas: a mediados de los veinte el agro crecía, pero aumentaba la desigualdad entre campesinos, no había mejora técnica y el Estado no obtenía recursos para la industria; desde 1926-1927 ya crecían la industria planificada y la inversión en la pesada. Sin embargo, el autor subraya que el viraje no lo determinó la economía, sino la lucha política dentro de la dirección del Partido, donde la situación económica servía de justificación. En los debates, la mayoría de los dirigentes se inclinaba por mantener la NEP; pero hacia 1928 la lucha ya era desigual, porque la mayor parte del aparato partidario, en manos del grupo de Stalin, había decidido terminar con sus adversarios e imponer el cambio radical.","errores_comunes":["Presentar el viraje como respuesta inevitable al fracaso económico de la NEP: el autor lo atribuye a la lucha política en el Partido.","Decir que la NEP fracasó en la agricultura: el agro daba buenos resultados, con problemas de desigualdad y sin mejora técnica.","Atribuir a la NEP planificación central o prioridad de la industria pesada, o a los planes quinquenales el mercado libre.","Confundir la NEP con el comunismo de guerra (control estatal absoluto para abastecer al frente)."],"pag":"pp. 2-5"},{"id":"pal-d-m2","tema":"P7","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: “La industrialización estalinista fue un éxito indiscutible: en pocos años convirtió a la URSS en una potencia industrial y su modelo podía seguir creciendo indefinidamente”. ¿Es correcta según Palazuelos? Justifique explicando los límites del crecimiento extensivo.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Lo que el autor reconoce como logro","detalle":"Admite el logro: gran capacidad productiva en tiempo récord pese a las adversidades; la industria pasó de un tercio al 60% de la producción (1928-1937) y la reconstrucción de 1946-1955 volvió a mostrar ese potencial.","peso":2,"indicios":[["record","al 60","el 60","tres quintos","gran capacidad","enorme capacidad","reconstru"]]},{"id":"b","punto":"El crecimiento fue extensivo","detalle":"Explica que el crecimiento fue extensivo: se logró sumando trabajo, recursos naturales e inversión, no mejorando la eficiencia.","peso":3,"indicios":[["extensiv"],["recurso","eficien","ineficien","insumo","factor"]]},{"id":"c","punto":"Baja eficiencia y círculo vicioso","detalle":"Muestra la baja productividad (técnica del siglo XIX, cantidad sobre calidad, abastecimiento burocrático) y que las correcciones traían más centralización y más recursos, agravando el problema.","peso":3,"indicios":[["productiv","eficien","ineficien"],["tecnolog","tecnic","siglo xix","siglo 19","cantidad sobre","abastec","mas centraliz"]]},{"id":"d","punto":"Desequilibrios y nivel de vida","detalle":"Señala los desequilibrios (agro y bienes de consumo rezagados) y la brecha entre el esfuerzo de la población y su bajo nivel de vida.","peso":2,"indicios":[["nivel de vida","condiciones de vida","bienes de consumo","desequilib"]]},{"id":"e","punto":"Por qué no podía crecer indefinidamente","detalle":"Explica que el modelo dependía de recursos abundantes que se agotan: con Jrushov la productividad crecía cada vez menos, no se pudo pasar al crecimiento intensivo y el extensivo mostró agotamiento.","peso":3,"indicios":[["agot","desaceler","cada vez menos","decrec","se acab","finit"]]},{"id":"f","punto":"Raíces de la crisis posterior","detalle":"Concluye, con el autor, que muchos problemas de la crisis de 1966-1985 venían de la formación del sistema en los años treinta y no solo de la gestión de Brézhnev.","peso":2,"indicios":[["brezh","brezn","brej","medio siglo","estanc","1966","1985"]]}],"respuesta_modelo":"La afirmación es correcta solo en parte. Palazuelos reconoce el logro: desde el viraje de 1929 el sistema creó una enorme capacidad productiva en tiempo récord y en medio de adversidades internas y externas. Entre 1928 y 1937 la industria pasó de generar un tercio de la producción total al 60%, y la pesada del 40% al 60% del valor industrial; después de la guerra, los planes de 1946-1955 volvieron a demostrar ese potencial. Pero el autor no lo considera un éxito “indiscutible” y, sobre todo, niega que pudiera crecer sin límites. Ese crecimiento fue extensivo: se apoyó en sumar recursos (mano de obra del campo y femenina, tierra y minerales, fondos extraídos por el Estado) y no en usarlos mejor. La productividad era baja, tanto la del trabajo como la de los equipos: se industrializó con técnicas del siglo XIX, la inversión privileg
