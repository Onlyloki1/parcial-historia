va: educación","detalle":"Explica que la mejora del sistema educativo elevó la formación y facilitó aplicar el progreso técnico; aunque ese impacto es difícil de medir, en general todos los países aumentaron su inversión en educación en los años 50 y 60.","peso":3,"indicios":[["formacion","ensenanza","escuel","capacita","sistema educativo","nivel educativo","nivel de educacion","gasto educativo","gasto en educacion","inversion en educacion"],["cualitativ","progreso tecnico","tecnic","gasto","inversion"]]},{"id":"f","punto":"Relación con capital y productividad","detalle":"Ubica la oferta de trabajo junto al capital (inversión de 15-20% del PBI) y a la productividad como bases del crecimiento.","peso":1,"indicios":[["capital","inversion"],["productividad"]]}],"respuesta_modelo":"Saborido explica el crecimiento de posguerra por el aumento de los factores trabajo y capital y por la mayor productividad. La oferta de trabajo creció por tres motivos. Primero, el crecimiento natural de la población, más rápido entre 1945 y 1970 que en los veinticinco años anteriores. Segundo, la mayor tasa de actividad, sobre todo por la incorporación masiva de las mujeres: la caída de la natalidad y las mejores oportunidades educativas les dieron un papel más importante en la economía (pasaron del 30,4% al 36,3% de la fuerza laboral entre 1950 y 1973). Tercero, las migraciones, en especial dentro de Europa (la CEE empleaba casi 6,5 millones de inmigrantes en 1973), y la absorción del desempleo encubierto al atraer trabajadores del agro. Además, la oferta tiene una dimensión cualitativa: un sistema educativo mejor eleva la formación y facilita aplicar el progreso técnico; aunque ese impacto es difícil de medir, en general todos los países aumentaron su gasto en educación en los años 50 y 60.","errores_comunes":["Confundir oferta de trabajo (trabajadores disponibles y su formación) con demanda (consumo e inversión que impulsan a contratar).","Decir que la natalidad aumentó para explicar la entrada de las mujeres: el texto dice que su descenso les permitió trabajar.","Olvidar la dimensión cualitativa (educación) o atribuir la formación de los trabajadores solo a las empresas."],"pag":"pp. 359-361 (PDF pp. 12-13)"},{"id":"sab-d-n3","tema":"P10","nivel":"normal","consigna":"Según Saborido, ¿cómo encararon económicamente la Segunda Guerra Mundial Alemania, Gran Bretaña, Estados Unidos y la Unión Soviética? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"La estrategia define la economía de guerra","detalle":"Las decisiones estratégicas determinaron cómo se encaró la guerra en lo económico; hacia 1943 la movilización superó a la de 1914-1918 (más de un tercio del producto mundial).","peso":2,"indicios":[["estrateg","decisiones"],["primera guerra","tercio","conflicto anterior","guerra anterior"]]},{"id":"b","punto":"Alemania: Blitzkrieg y luego Speer","detalle":"Blitzkrieg: poca reorientación económica y consumo sostenido con la explotación de los ocupados; desde 1942, con Speer, la producción de municiones se triplicó y en el último año se volcó a la producción masiva.","peso":3,"indicios":[["blitzkrieg","relampago"],["civil","consumo","ocupad","saque","speer"]]},{"id":"c","punto":"Gran Bretaña: guerra total","detalle":"Estrategia defensiva de largo plazo y «guerra total»: racionamiento, controles, casi la mitad del producto para la guerra, préstamo-arriendo y financiación keynesiana.","peso":3,"indicios":[["guerra total","racionam","prestamo","keynes"]]},{"id":"d","punto":"EE.UU.: expansión con concentración","detalle":"Crecimiento industrial de más del 15% anual y 19 millones de empleos; el beneficio fue para las grandes corporaciones y aumentó la concentración.","peso":2,"indicios":[["corporac","concentr","pymes","pequenas y medianas"]]},{"id":"e","punto":"URSS: traslado de fábricas y economía quebrada","detalle":"Pérdida de regiones industriales, traslado de 1.360 fábricas a los Urales y Siberia, solo crece la industria bélica, ahorro forzoso y salarios reales al 40%.","peso":3,"indicios":[["urales","siberia","traslad","ahorro forzoso","quebrad"]]}],"respuesta_modelo":"Saborido sostiene que las decisiones estratégicas de cada país determinaron cómo encaró la guerra en lo económico, y que hacia 1943 el mundo estaba más movilizado que en 1914-1918: más de un tercio del producto mundial iba a la guerra. Alemania apostó a la Blitzkrieg: campañas cortas que afectaran lo menos posible la vida civil, sin reconvertir a fondo la economía y sosteniendo el consumo con el saqueo de los ocupados; desde 1942, frenada en Rusia, con Speer triplicó las municiones y en el último año pasó a la producción masiva. Gran Bretaña eligió resistir a largo plazo con una «guerra total»: racionamiento, controles, casi la mitad del producto para fines bélicos, préstamo-arriendo norteamericano y financiación inspirada en Keynes. EE.UU. tuvo la mayor expansión (la industria creció más del 15% anual), aunque la aprovecharon sobre todo las grandes corporaciones. La URSS perdió sus regiones industriales, trasladó 1.360 fábricas a los Urales y Siberia y solo hizo crecer la producción bélica, con ahorro forzoso y salarios en caída: resistió, pero con una economía quebrada.","errores_comunes":["Decir que Alemania aplicó la «guerra total» desde 1939: hasta 1942 su estrategia fue la Blitzkrieg con poca movilización.","Afirmar que la expansión norteamericana benefició a las pequeñas empresas: fueron las grandes corporaciones.","Presentar el traslado soviético de fábricas como continuidad de los planes quinquenales: se hizo en los primeros meses de la invasión."],"pag":"pp. 339-345 (PDF pp. 2-5)"},{"id":"sab-d-d1","tema":"P8","nivel":"dificil","consigna":"«El factor demanda» fue clave en la expansión de posguerra. Explique, según Saborido, cómo se formó la sociedad de consumo y qué papel cumplió el Estado. Después, explique qué elementos ofrece el autor para entender la demanda de trabajo del período.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Origen de la sociedad de consumo en EE.UU.","detalle":"Nació en EE.UU. a fines del siglo XIX y comienzos del XX por la escasez de mano de obra (ingresos relativamente altos) y por mejoras técnicas que bajaron los costos.","peso":1,"indicios":[["estados unidos","ee uu","eeuu","norteameric"],["escasez","siglo xix","fines del siglo","costos"]]},{"id":"b","punto":"Europa y Japón: productividad y Estado redistribuidor","detalle":"Tras 1945 se afirmó en Europa occidental y Japón por la suba de la productividad y el Estado como redistribuidor de ingresos hacia los sectores de menores recursos (en Japón, también el paternalismo empresarial).","peso":3,"indicios":[["redistribu"],["productividad","pobres","menores","ingresos"]]},{"id":"c","punto":"Base: suba de los salarios reales","detalle":"La base de la sociedad de consumo fue el aumento de los salarios reales (cuadro 13.11: en Alemania, de 100 en 1953 a 276 en 1973).","peso":2,"indicios":[["salario","sueldo","poder adquisitivo","poder de compra"],["real","aument","suba","eleva","crec"]]},{"id":"d","punto":"La demanda impulsa la inversión, con apoyo estatal","detalle":"La demanda llevó a multiplicar inversiones (durables, construcción, ocio, moda) y el Estado invirtió en infraestructura y dio subsidios y créditos; las exportaciones crecieron más, aunque hoy se piensa que acompañaron la expansión.","peso":2,"indicios":[["inversion","invirt"],["infraestructura","subsidi","credito","empresari","durables"]]},{"id":"e","punto":"Perspectiva keynesiana y su límite","detalle":"Para los keynesianos el Estado consolida una demanda estable asegurando ingresos a desocupados, enfermos y jubilados; Saborido advierte que muchos países no aplicaron esas políticas.","peso":1,"indicios":[["keynes"],["demanda agregada","fiscal","monetari","desocupad","jubilad","estable"]]},{"id":"f","punto":"Demanda de mano de obra: trabajadores atraídos","detalle":"Señala que la demanda de mano de obra de las regiones más desarrolladas atrajo trabajadores de países vecinos atrasados (nota 69, p. 412) y que la atracción de trabajadores del agro absorbió el desempleo encubierto (p. 360).","peso":3,"indicios":[["pleno empleo","demanda de mano de obra","atrae","atraer","atrajo","atrai","atraccion","absorb","encubierto"],["migra","inmigra","campo","agro","agric","vecinos","mujer"]]},{"id":"g","punto":"Otros elementos: Lewis, Kindleberger, EE.UU.","detalle":"Agrega otros elementos del texto: Lewis (el sector avanzado atrae trabajadores) y Kindleberger (desempleo y subempleo contuvieron los salarios hasta absorberse), EE.UU. sin desempleo masivo pese a la desmovilización gracias a la reconversión y la demanda de consumo (p. 372), la inversión que crea empleo (p. 361) o los dos mercados de trabajo (p. 363).","peso":2,"indicios":[["lewis","kindleberger","remanentes","subempleo","desmoviliz","dos mercados","oportunidades de empleo"]]}],"respuesta_modelo":"Saborido asocia el crecimiento de posguerra con la expansión de la demanda y la sociedad de consumo. Esta nació en EE.UU. por la escasez de mano de obra, que daba ingresos relativamente altos, y por mejoras técnicas que bajaron los costos; en Europa occidental y Japón se afirmó después de 1945 por la mayor productividad y por el Estado como redistribuidor de ingresos hacia los sectores de menores recursos. Su base fue la suba de los salarios reales (en Alemania, de 100 en 1953 a 276 en 1973). La demanda multiplicó las inversiones, y el Estado invirtió en infraestructura y dio subsidios y créditos. Para los keynesianos, además, el Estado consolidaba una demanda estable asegurando ingresos a desocupados, enfermos y jubilados, aunque el autor advierte que muchos países no aplicaron esas políticas. Saborido no dedica un apartado a la demanda de trabajo, pero da elementos: la demanda de mano de obra de las regiones más desarrolladas atrajo trabajadores de países vecinos atrasados, como los españoles en el norte de Europa (nota 69); la atracción de trabajadores del agro absorbió el desempleo encubierto; según Lewis, el sector avanzado atrae trabajadores, y según Kindleberger el desempleo y el subempleo contuvieron los salarios hasta que se absorbieron; en EE.UU., la reconversión y la demanda de consumo evitaron el desempleo pese a la desmovilización de diez millones de soldados; la inversión crea oportunidades de empleo, y la automatización dividió el trabajo en dos mercados, uno calificado y otro sin formación especial.","errores_comunes":["Atribuirle a Saborido, como tesis general, que la demanda de bienes «se tradujo» en demanda de trabajo: el apartado «El factor demanda» no lo dice; solo el caso de EE.UU. de 1945-1948 vincula demanda de consumo y empleo (p. 372).","Atribuir el origen de la sociedad de consumo europea a la escasez de mano de obra: esa es la explicación del caso norteamericano.","Decir que las exportaciones fueron la causa independiente del crecimiento: Saborido recoge la visión más cauta de que crecieron dentro de una expansión general.","Afirmar que todos los países aplicaron políticas keynesianas: el autor marca que varios no lo hicieron o lo hicieron poco tiempo."],"pag":"pp. 360-361, 363-366, 369-372, 412 (PDF pp. 12-17, 38)"},{"id":"sab-d-d2","tema":"P8","nivel":"dificil","consigna":"Relacione, según Saborido, la expansión económica de posguerra con los cambios en la situación de las mujeres y con la masificación de la universidad. ¿Por qué estos cambios forman parte de la «edad de oro»?","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Mujeres en la oferta de trabajo","detalle":"La baja de la natalidad y la mejora educativa permitieron la incorporación masiva de las mujeres a la población activa (de 30,4% a 36,3% de la fuerza laboral entre 1950 y 1973).","peso":3,"indicios":[["mujer","femenin"],["natalidad","hijos","poblacion activa","fuerza laboral","fuerza de trabajo","tasa de actividad"]]},{"id":"b","punto":"Lo revolucionario: las casadas salen a trabajar","detalle":"Destaca que lo nuevo y revolucionario fue que las mujeres casadas dejaran el hogar para buscar empleo (servicios en el capitalismo avanzado, industria en la periferia).","peso":3,"indicios":[["casada"],["hogar","empleo","trabaj"]]},{"id":"c","punto":"Universidad y nuevos roles femeninos","detalle":"Las mujeres ampliaron su presencia en los estudios superiores, porque la universidad era la vía a empleos de responsabilidad; eso expresó un cambio en su papel público.","peso":2,"indicios":[["papel publico","nuevos roles","roles","empleos de responsabilidad","nuevo papel"]]},{"id":"d","punto":"Expansión universitaria por la innovación","detalle":"La innovación tecnológica multiplicó profesiones que exigían estudios universitarios; la matrícula creció en casi todo el mundo, incluso donde el desarrollo no lo explicaba (Ecuador).","peso":3,"indicios":[["universitari","estudios superiores","matricula","estudiantes","titulo"],["tecnolog","innova","profesion"]]},{"id":"e","punto":"El Estado y la educación","detalle":"Relaciona con el Estado: aumento del gasto educativo en los años 50 y 60 y, en la síntesis de Galbraith, papel estatal en la provisión de fuerza de trabajo educada.","peso":2,"indicios":[["gasto educ","inversion en educ","inversiones en educ","galbraith","educacion publica","ensenanza publica","mano de obra educada","fuerza de trabajo educada","sistema educativo"]]},{"id":"f","punto":"Límites en el bloque socialista","detalle":"Señala que en los países socialistas las mujeres avanzaron menos de lo que proclamaba la ideología y que la demanda de estudios se disparó, pero el sistema no pudo responder.","peso":1,"indicios":[["socialis","sovietic","bloque del este","europa del este","europa oriental"]]},{"id":"g","punto":"Estudiantes como actor nuevo","detalle":"Los estudiantes se convirtieron en un actor social y político (rebelión de los 60, Mayo de 1968), paradójicamente en plena prosperidad.","peso":1,"indicios":[["estudiant","jovenes","juventud"],["mayo","rebel","movimiento","protesta","tlatelolco"]]}],"respuesta_modelo":"Para Saborido, la «edad de oro» no fue solo crecimiento económico: trajo transformaciones sociales que marcaron el paso de la sociedad tradicional al mundo moderno, y las mujeres fueron parte central de ese cambio. Al analizar la oferta de trabajo, el autor muestra que la caída de la natalidad y las mejores posibilidades educativas permitieron su incorporación masiva a la población activa (del 30,4% al 36,3% de la fuerza laboral entre 1950 y 1973). Pero lo verdaderamente nuevo y «revolucionario» fue que las mujeres casadas dejaran el hogar para buscar empleo: en los países centrales se volcaron a los servicios y en la periferia, a la industria. Además ampliaron mucho su presencia en la universidad, puerta de los empleos de responsabilidad, lo que expresó un cambio en su papel público. La masificación universitaria también tiene una raíz económica: la innovación tecnológica multiplicó las profesiones que exigían título, y la matrícula creció en casi todo el mundo, incluso en países poco desarrollados, en un contexto en que los países aumentaron su gasto educativo y en que, según la síntesis de Galbraith, el Estado debía proveer fuerza de trabajo educada. Hubo límites: en los países socialistas las mujeres avanzaron menos de lo que proclamaba la ideología y el sistema no pudo responder a una demanda de estudios que se disparó. Finalmente, los estudiantes se volvieron un actor político nuevo y, en plena prosperidad, protagonizaron la rebelión de los años 60, simbolizada por el Mayo francés de 1968.","errores_comunes":["Explicar el trabajo femenino por el reemplazo de los hombres en la guerra: Saborido lo ubica en la expansión de posguerra y en las mujeres casadas.","Decir que en los países socialistas la igualdad fue mayor: el autor afirma que los avances fueron más modestos.","Ubicar el nuevo empleo femenino de los países ricos en la industria: allí fue sobre todo a los servicios.","Presentar la rebelión estudiantil como protesta por pobreza o desempleo, cuando surgió en plena prosperidad."],"pag":"pp. 359-361, 411-414 (PDF pp. 12-13, 38-39)"},{"id":"sab-d-m1","tema":"P8","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «Después de 1945, todos los países occidentales aplicaron el mismo modelo de Estado de bienestar keynesiano». ¿Es correcta según Saborido? Justifique comparando al menos tres casos nacionales.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Tesis: convergencia, pero no un modelo único","detalle":"Responde que la afirmación es incorrecta o exagerada: hubo un movimiento general hacia la economía mixta, pero con instrumentos, ritmos y resultados distintos.","peso":3,"indicios":[["no es correct","incorrect","falsa","exager","no todos","no aplicaron el mismo","no fue el mismo","no hubo un mismo","no hubo un unico","no hubo un solo"]]},{"id":"b","punto":"Gran Bretaña: bienestar, pleno empleo y nacionalizaciones","detalle":"Laboristas: Informe Beveridge y Libro Blanco (1944), desocupación máxima del 3%, beneficios de por vida y nacionalizaciones (el acero, de forma incompleta) sin planificación eficaz; luego stop and go y crecimiento modesto.","peso":2,"indicios":[["gran bretana","britan","inglaterra","laboris"],["nacionaliz","beveridge","pleno empleo","stop and go"]]},{"id":"c","punto":"Francia: planificación indicativa","detalle":"Uno de los casos más concretos de economía mixta: nacionalizaciones (el Estado, principal productor y empleador) y planificación indicativa de Monnet, con sectores prioritarios y crédito dirigido.","peso":2,"indicios":[["francia","frances"],["planific","monnet","nacionaliz"]]},{"id":"d","punto":"RFA: economía social de mercado y giro de 1966","detalle":"Partió de un liberalismo con cogestión y política antimonopolio (Erhard), priorizando precios sobre gasto social; desde 1966 la socialdemocracia aplicó el keynesianismo y convergió a la economía mixta (Bad Godesberg).","peso":2,"indicios":[["alemania","rfa","aleman"],["social de mercado","erhard","cogestion","socialdemocra","godesberg"]]},{"id":"e","punto":"EE.UU.: keynesianismo tardío e inflación","detalle":"Eisenhower aceptó el papel social del Estado sin política de demanda; Kennedy y Johnson aplicaron la New Economics (4,2% anual), que con Vietnam derivó en inflación.","peso":2,"indicios":[["estados unidos","eeuu","ee uu","norteameric"],["new economics","kennedy","johnson","eisenhower","vietnam","inflac"]]},{"id":"f","punto":"Otros caminos: Japón y España","detalle":"Menciona otros caminos: Japón (MITI, empleo de por vida, paternalismo de las grandes empresas, educación estatal al servicio de las empresas) o la España de Franco, con un «miserable» Estado de bienestar (apartado de Germán Ojeda).","peso":1,"indicios":[["japon","espana","franco","miti","ojeda"]]},{"id":"g","punto":"Límite de la explicación keynesiana","detalle":"Cita la advertencia de Saborido: la explicación keynesiana supone una aplicación generalizada de esas políticas, cuando muchos países no las aplicaron o lo hicieron poco tiempo.","peso":2,"indicios":[["no las aplic","no aplic","poco tiempo","periodo corto","periodo demasiado corto","no lo hicieron","no las pusieron en practica"]]}],"respuesta_modelo":"La afirmación es incorrecta, o al menos exagerada, según Saborido. Es cierto que en Occidente hubo un movimiento general hacia la «economía mixta» —relación entre empresas privadas, Estado y sindicatos— y que el Estado asumió funciones de bienestar y de regulación de la demanda; pero cada país lo hizo con instrumentos, tiempos y resultados distintos. En Gran Bretaña, el gobierno laborista, apoyado en el Informe Beveridge y el Libro Blanco sobre el empleo de 1944, consolidó el Estado de bienestar, se comprometió a una desocupación máxima del 3% y a beneficios para toda la vida, y nacionalizó el Banco de Inglaterra, el carbón, el gas, la electricidad, los ferrocarriles y, de manera incompleta, el acero. Sin embargo, la falta de planificación impidió usar ese poder, y la economía sufrió el stop and go y un crecimiento modesto. Francia, en cambio, es para el autor uno de los casos más concretos de economía mixta: además de nacionalizar, aplicó la planificación indicativa de Monnet, que orientaba la inversión hacia sectores prioritarios con créditos y subsidios. La RFA siguió otro camino: la «economía social de mercado» de Erhard era liberal, con cogestión y política antimonopolio, y sus gobiernos conservadores priorizaron precios y balanza de pagos sobre el gasto social; recién desde 1966 la socialdemocracia aplicó sistemáticamente instrumentos keynesianos y el país convergió hacia la economía mixta. En EE.UU., Eisenhower aceptó el papel social del Estado pero sin una política de demanda consistente; el keynesianismo llegó con la New Economics de Kennedy y Johnson, que logró un 4,2% anual pero terminó en inflación. Japón, con el MITI, el empleo de por vida y el paternalismo de las grandes empresas, y la España franquista (según el apartado de Germán Ojeda) muestran caminos todavía más distintos. Por eso Saborido advierte que la explicación keynesiana del crecimiento tiene un límite: supone que todos aplicaron esas políticas, cuando muchos no lo hicieron o lo hicieron por poco tiempo.","errores_comunes":["Aceptar la afirmación sin matices: Saborido muestra modelos distintos (planificación francesa, economía social de mercado alemana, keynesianismo tardío en EE.UU.).","Atribuir a la RFA políticas keynesianas desde 1949: llegaron recién con la socialdemocracia en 1966.","Decir que las nacionalizaciones británicas explicaron la recuperación: el texto dice que tuvo poca relación con el sector nacionalizado.","Confundir la planificación indicativa francesa con la planificación centralizada del Este."],"pag":"pp. 369, 372-377 (PDF pp. 17-21)"},{"id":"sab-d-m2","tema":"P8","nivel":"muy_dificil","consigna":"«Lo que comenzó como un acuerdo para evitar que se repitieran los años 30 terminó siendo algo mucho más ambicioso». Explique esta evolución según Saborido: relacione la crisis de entreguerras y la Segunda Guerra Mundial con el Estado de bienestar, muestre cómo se reforzaron entre sí bienestar, empleo y consumo hasta 1973 y qué límites aparecieron.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Antecedente: la crisis de los 30","detalle":"La intervención creciente del Estado fue la consecuencia de lo que se interpretó como una incapacidad del mercado para resolver la crisis de los 30: primero hubo decisiones pragmáticas y luego la teoría de Keynes les dio fundamento.","peso":2,"indicios":[["incapacidad","pragmatic","no podia resolver","no pudo resolver","falla del mercado","fallas del mercado"]]},{"id":"b","punto":"Antecedente: la guerra","detalle":"La guerra dejó más planificación y control estatal que en 1914-1918, financiación keynesiana, el Informe Beveridge (1942), programas de la resistencia que proponían nacionalizar las industrias básicas y, en Gran Bretaña, privaciones que volvieron a la sociedad más receptiva a los acuerdos sociales.","peso":2,"indicios":[["resistencia","privaciones","control estatal","economia de guerra","guerra total","esfuerzo belico","receptiv"]]},{"id":"c","punto":"Consenso y economía mixta","detalle":"En la posguerra, el consenso social y político (coaliciones con izquierda y sindicatos, apoyo empresarial) dio lugar a la economía mixta: nacionalizaciones, planificación, control de la demanda.","peso":2,"indicios":[["consenso","coalicion","mixta"]]},{"id":"d","punto":"El salto: garantizar crecimiento y distribución","detalle":"Si el Estado había «hecho desaparecer» las crisis, debía asegurar el crecimiento a largo plazo y que llegara a toda la sociedad: así surge el Estado de bienestar.","peso":3,"indicios":[["largo plazo","todos los sectores","toda la sociedad","llegara a todos","garantizar el crecimiento","asegurar el crecimiento"]]},{"id":"e","punto":"Círculo virtuoso: bienestar, salarios y consumo","detalle":"Seguridad social y redistribución consolidaron una demanda estable; la productividad permitió subir los salarios reales, base del consumo de masas; la demanda multiplicó la inversión, que abrió oportunidades de empleo.","peso":3,"indicios":[["salario","redistribu","demanda","ingresos"],["inversion","productividad","oportunidades de empleo"]]},{"id":"f","punto":"Una oferta de trabajo que acompañó","detalle":"La oferta de trabajo creció (población, mujeres, migrantes, ex campesinos, educación) y permitió sostener la expansión.","peso":1,"indicios":[["mujer","migra","campesin","agro","oferta de trabajo"]]},{"id":"g","punto":"Límites hacia 1973","detalle":"Señala límites: inflación (EE.UU. y Vietnam; para Mandel, mecanismo del capitalismo tardío), stop and go británico, «sociedad de los dos tercios», desigualdad Norte-Sur, crisis del dólar (1971) y del petróleo (1973).","peso":2,"indicios":[["inflac","dos tercios","desigualdad","petroleo","stop and go","convertibilidad"]]}],"respuesta_modelo":"Saborido explica que, tras los años 30, la intervención estatal había sido la consecuencia de lo que se interpretó como una incapacidad del mercado para salir de la crisis: primero hubo decisiones pragmáticas y luego la teoría de Keynes les dio fundamento. La Segunda Guerra reforzó esa tendencia: la planificación, el control estatal y la parte del producto destinada a la guerra fueron mayores que en 1914-1918; Gran Bretaña financió la guerra según las recetas keynesianas y las privaciones volvieron a su sociedad más receptiva a pensar la comunidad como una totalidad, lo que permitió acuerdos entre partidos en temas sociales; en 1942 apareció el Informe Beveridge, y los programas de la resistencia proponían nacionalizar las industrias básicas. En la posguerra, la búsqueda de consenso llevó a gobiernos de coalición con la izquierda y los sindicatos, y nació la «economía mixta»: nacionalizaciones, organismos de planificación y un Estado que controlaba la demanda con el gasto público, aceptado también por el centro, la derecha y los empresarios. El salto llegó cuando ese acuerdo defensivo se volvió ambicioso: si el Estado había «hecho desaparecer» las crisis, debía garantizar el crecimiento a largo plazo y que llegara a todos. Sus piezas se reforzaron entre sí: los ingresos asegurados a desocupados, enfermos y jubilados consolidaban una demanda estable; la productividad (4,5% anual) permitió subir los salarios reales, base de la sociedad de consumo; la demanda multiplicó las inversiones, y la inversión abrió nuevas oportunidades de empleo, mientras la oferta de trabajo crecía con mujeres, migrantes y trabajadores del agro. Pero aparecieron límites: la inflación (en EE.UU., la New Economics y Vietnam; para Mandel, el mecanismo propio del capitalismo tardío), el stop and go británico, una «sociedad de los dos tercios» con sectores marginados y la desigualdad con el Sur. La suspensión de la convertibilidad del dólar (1971) y la crisis del petróleo (1973) cerraron la etapa.","errores_comunes":["Presentar el Estado de bienestar como una creación espontánea de 1945, sin relacionarlo con la crisis de los 30 y la experiencia de la guerra.","Decir que el Estado de bienestar eliminó para siempre las crisis: Saborido pone entre comillas que las crisis «desaparecieron» y muestra recesiones, inflación y el final de 1973.","Olvidar los límites: inflación, sectores marginados (sociedad de los dos tercios) y desigualdad Norte-Sur."],"pag":"pp. 341, 351-353, 358-359, 361, 364-365, 369, 371-373, 412 (PDF pp. 3-19, 38)"}]},{"id":"marichal4","autor":"Carlos Marichal","obra":"Nueva historia de las grandes crisis financieras, cap. 4: “Orígenes de la globalización contemporánea, 1973-1990: ¿Por qué hubo auge y crisis de la deuda externa de los países en desarrollo?”","temas":["P9"],"resumen":[{"titulo":"Planteo: petróleo, petrodólares y la pregunta del capítulo","pags":"pp. 179-181","puntos":["Abre con la **guerra de Yom Kippur** (octubre de 1973), que desata una **guerra económica** con el petróleo como arma.","Paradoja: con el centro en recesión, desde 1974 se disparan los **flujos de capital** hacia **deudas soberanas** de países en desarrollo (sobre todo América Latina), por el **reciclaje de petrodólares** de los grandes bancos.","**Hipótesis** del autor: los verdaderos **antecedentes de la globalización financiera moderna** están en esos flujos de **1970-1982**.","Explica ese auge y la **crisis de las deudas soberanas** que arranca en **1982** con la virtual suspensión de pagos de **México**: moratorias y “**década perdida**”."]},{"titulo":"Post mórtem de Bretton Woods (1971-1974) y estanflación","pags":"pp. 178, 181-187","puntos":["1971: Nixon abandona la **paridad dólar-oro** (**New Economic Program**) y suma recargo a las importaciones, control de precios y salarios y tasas bajas que le dan la reelección.","El dólar sigue débil (déficit comercial, guerra de **Vietnam**); tras el **Smithsonian** (dólar −10%), la inflación y el shock de 1973 imponen la **libre flotación**.","Los **monetaristas** (**Milton Friedman**) celebran la desregulación y atacan al **neokeynesianismo**. En **1974** EE.UU. levanta los últimos **controles de capitales**: caen las **últimas barreras a la globalización financiera**. Ganan multinacionales, bancos e inversores ricos (**paraísos fiscales**).","Vuelven las burbujas de deuda, como antes de 1929: lo advierten **Minsky** (inestabilidad inherente de los mercados) y **Kindleberger**.","**Estanflación**: la Fed de Burns prioriza el crédito sobre la lucha contra la inflación y EE.UU. **exporta sus problemas**: emite dólares para sus déficits sin respaldo ni responsabilidad global, mientras el **FMI** exige ajuste a los pobres (**hegemonía monetaria** basada en su poder político y militar)."]},{"titulo":"La crisis del petróleo de 1973 (y el pico de 1979)","pags":"pp. 180, 187-191","puntos":["**Causas**: los países árabes de la **OPEP** usan el “oro negro” para presionar a EE.UU. por su apoyo a Israel y para controlar recursos explotados por las petroleras angloamericanas (estrategia **nacionalista**, anunciada en septiembre). El **16/10/1973** duplican el precio y luego **embargan** las ventas a EE.UU.","El barril pasa de unos **3** a **12 dólares**: se encarece la energía y se derrumba la bolsa de Nueva York.","**Respuestas**: EE.UU. (menos dependiente que Europa y Japón) congela precios internos y crea la Oficina Federal de Energía; Europa recorta el consumo y busca energías alternativas; Brasil lanza el **etanol**.","**Ganadores**: la OPEP suma más de **800 mil millones** extra (1974-1982): mucho va a gasto público y a **armas** (con comisiones y corrupción), y buena parte de las reservas se deposita a corto plazo en bancos globales.","En **1979** la caída del **Sha de Irán** provoca un pico mayor. También ganan exportadores ajenos a la OPEP (**México**), aunque la renta petrolera puede causar **enfermedad holandesa**."]},{"titulo":"La larga recesión del centro y la prosperidad de la periferia","pags":"pp. 180, 191-195","puntos":["El petróleo fue **decisivo pero no el único** factor: pesaron aún más causas **estructurales**, como el debilitamiento industrial del Oeste y del Este y el **agotamiento del modelo de posguerra** (PIB de la OCDE: de 4,8% a 2,6% anual).","**Mandel** y **Robert Brenner**: cae la **tasa de ganancia** industrial en EE.UU., Alemania y Japón (1973-comienzos de los 90) y con ella la reinversión.","Para la URSS el auge del petróleo **no fue negativo** (estimuló su producción), pero Europa del este quedó atada a Moscú (trueques en el **Comecon**) y sin renovación tecnológica; el agotamiento del modelo explica el derrumbe socialista.","**Paradoja**: muchos países de la **periferia** prosperaron por el auge del petróleo y de las materias primas y por los préstamos: un crecimiento alto pero **artificial**.","El **Tercer Mundo** (ni núcleo capitalista ni bloque socialista) se organizó (**G-77**, **UNCTAD**) sin regular sus materias primas, salvo el petróleo, y quedó expuesto a la presión de los bancos."]},{"titulo":"El “tobogán financiero”: los bancos se globalizan y los gobiernos se endeudan","pags":"pp. 190, 195-200","puntos":["**Reciclaje**: los gobiernos árabes depositan buena parte de sus reservas a corto plazo en bancos globales, que, sin negocios rentables en el centro, las prestan a países en desarrollo, exportadores **e importadores** de petróleo.","El gran flujo une **dos periferias** (Medio Oriente → América Latina), pero **no es directo**: lo intermedian bancos de EE.UU. y Europa, cuyos agentes se vuelven **vendedores de préstamos**.","En los 60 el crédito era moderado y multilateral (Banco Mundial, BID); desde 1973 se multiplican los bancos privados y en **1978-1981** se piden préstamos **para pagar préstamos**.","**Oferta vs. demanda** (debate abierto): los gobiernos querían crecer con crédito barato (tasas casi negativas), pero que casi todos se endeudaran **a la vez** sugiere el peso de los **bancos globales** (Wriston, del Citicorp: “los países no quiebran”).","Unos **300 bancos** prestaron más de **500 mil millones** en los 70 y retuvieron esa deuda en sus carteras: para el autor, los **primeros agentes de una fase temprana pero singular de globalización financiera**.","Cobraban tasas sobre lo habitual y, hacia 1979-1981 (nuevo auge del petróleo, revueltas en Polonia), acortaron los plazos. **Kuczynski** (ex ministro peruano, luego presidente del First Boston): acreedores y deudores “ganaban tiempo” esperando tasas más bajas."]},{"titulo":"Préstamos para dictaduras y empresas estatales (1973-1982)","pags":"pp. 200-205","puntos":["Los gobiernos buscan sostener el **gasto público y el crecimiento** de posguerra; con mercados financieros locales **estrechos**, el crédito externo barato financia déficits, empresas públicas y **dictaduras**.","Pocos créditos para Allende, muchos para **Pinochet**; las dictaduras de Argentina, Chile y Brasil se endeudan y se **militarizan**; bancos y multilaterales apoyan dictadores en todo el mundo.","Desde 1976 los bancos exigen una **carta de intención** con el FMI, pero el dinero fácil fomenta **corrupción**, laxitud presupuestaria y **fuga de capitales**.","Paradoja: la banca privada financia sobre todo **empresas estatales** y obras públicas (**capitalismo dirigido**), confiando en que los regímenes autoritarios garantizan el pago; **PEMEX** es el mayor cliente (1976-1981).","El esquema mexicano dependía de que no subieran las tasas ni hubiera devaluación: pasaron ambas."]},{"titulo":"El efecto Volcker y la crisis mexicana de 1982","pags":"pp. 205-211","puntos":["**Detonador**: la suba de tasas en EE.UU. **Volcker** (Fed, desde 1979) quiere “matar al dragón de la inflación” (más de 10% en 1980, por el déficit y el **segundo choque petrolero**): las tasas llegan a casi **20%**; baja la inflación, pero hay recesión y el comercio mundial cae en 1981.","**Reagan** agranda el déficit (más gasto militar); el dólar sube casi 40% y los bancos prefieren invertir en EE.UU.: la periferia solo consigue **créditos cortos y caros** para refinanciar. El servicio anual pasa de ~20 mil millones (1981) a casi **100 mil millones** (1982).","**20/8/1982**: Silva Herzog anuncia que México no puede pagar el servicio completo (tasas + **fuga de capitales**; quedaban 180 millones de reservas). El FMI, avisado, prefiere ser “**bombero y policía**” a prevenir; su rescate con ajuste fracasa por las medidas de López Portillo: devaluación, estatización de depósitos y **nacionalización de la banca**.","**Bordo** (1986) distingue crisis **cambiarias, bancarias, bursátiles y de deuda**, que pueden darse juntas o por separado; con Eichengreen habla de **crisis gemelas**: México 1982 combinó una crisis cambiaria y una de deuda."]},{"titulo":"Después de 1982: contagio, renegociación, década perdida y Plan Brady","pags":"pp. 212-224","puntos":["La deuda latinoamericana pasa de 68 a **318 mil millones** (1975-1982); también se endeudaron Europa del este, España, Corea y África, aunque Corea, Indonesia, Malasia, Colombia y Chile evitaron rescates onerosos.","La deuda periférica superaba el capital de grandes bancos (Citibank: 174%), que quebrarían sin pagos; pero fue una crisis de **deudas soberanas**, sin pánicos bursátiles ni hipotecarios.","Los acreedores actúan como un **cartel** (G-7, grandes bancos y FMI; el **MIPUI** de Altimir y Devlin): negociación **caso por caso** con comités de bancos y créditos caros que mantienen las deudas “operativas” y **capitalizan intereses**: el saldo crece.","**Década perdida**: ajuste fiscal, caída del salario real, renta petrolera para la deuda y fuga de capitales; devaluaciones y emisión disparan la **inflación** (más de 1000% en Argentina y Brasil en 1988-1989).","FMI, Banco Mundial y BID no alertaron (el FMI, en 1981, no veía “causa de alarma”) y la lógica del Fondo inducía a tener reservas escasas: un juego **perverso**.","**Plan Baker/Brady**: propuesto por Baker (1985) y aplicado por Brady a fines de los 80 (el libro dice “desde 1987”): canje de bonos viejos por nuevos con descuento, garantizados con bonos **cupón cero**; México primero; beneficios menores a lo esperado.","El **Consenso de Washington** (ajuste, privatizaciones, desregulación, apertura) prepara la **fase más fuerte de la globalización financiera** de los 90, mientras América Latina sigue estancada y Asia crece."]}],"conceptos":[{"termino":"Globalización financiera (según Marichal)","def":"Integración mundial de los mercados de capital. Marichal sostiene que puede argumentarse que sus antecedentes están en los flujos de 1970-1982, cuando unos 300 bancos de EE.UU., Europa y Japón reciclaron petrodólares en préstamos a países en desarrollo y retuvieron esa deuda en sus carteras: una fase “temprana pero singular”, posible tras el fin de Bretton Woods y de los controles de capitales (1974)."},{"termino":"Petrodólares y su reciclaje","def":"Petrodólares: ingresos extraordinarios de los exportadores de petróleo por vender a precios elevados desde 1973. Reciclaje: buena parte de las reservas árabes se depositó a corto plazo en bancos globales, que las prestaron a gobiernos de países en desarrollo porque en el centro en recesión no encontraban colocaciones rentables."},{"termino":"OPEP","def":"Organización de Países Exportadores de Petróleo. Sus miembros árabes forzaron en octubre de 1973 la suba del precio y el embargo a EE.UU.; para Marichal fue el único cartel de materias primas que el Tercer Mundo logró sostener."},{"termino":"Estanflación","def":"Combinación de estancamiento económico e inflación que se instala en EE.UU., Europa y Japón en los años 70, tras la breve recuperación de 1972."},{"termino":"Hegemonía monetaria de EE.UU.","def":"Privilegio de EE.UU. de emitir dólares para cubrir su déficit fiscal y de balanza de pagos sin respaldo ni responsabilidad por sus efectos globales, apoyado en buena medida en su poder político y militar; el FMI, en cambio, exige ajuste a los países pobres."},{"termino":"Enfermedad holandesa","def":"Metáfora para economías con enormes rentas de recursos naturales (aquí, petroleras): incentivan el consumo de importados y desalientan la inversión industrial interna, dificultando un desarrollo equilibrado."},{"termino":"Capitalismo dirigido (state-led capitalism)","def":"Etapa de los 70 en América Latina en la que los préstamos de bancos privados financiaron sobre todo empresas estatales y grandes obras públicas, porque los banqueros confiaban en que los regímenes autoritarios garantizarían el pago."},{"termino":"Carta de intención / acuerdo stand-by","def":"Compromisos con el FMI que, desde 1976, los bancos exigían para conceder grandes préstamos; los stand-by (acuerdos de contingencia) incluían programas de ajuste más rigurosos."},{"termino":"Efecto Volcker","def":"Consecuencias de la suba de tasas de interés dispuesta por Paul Volcker (Fed) desde 1979 para frenar la inflación: las tasas llegaron a casi 20%, hubo recesión y se dispararon los pagos de los deudores; fue el detonador principal de la crisis de la deuda."},{"termino":"Tipos de crisis (Bordo) y crisis gemelas","def":"Bordo (1986) propone distinguir crisis cambiarias, bancarias, bursátiles y de deuda, que pueden darse por separado o juntas. Con Eichengreen llama “crisis gemelas” (twin crises) al entrelazamiento de dos de ellas, como la cambiaria y la de deuda de México en 1982."},{"termino":"Década perdida","def":"Nombre de los años 80 en América Latina: estancamiento por la dureza del ajuste fiscal, la caída de los salarios reales, la transferencia de la renta petrolera al pago de la deuda y la fuga de capitales."},{"termino":"MIPUI y cartel de acreedores","def":"Para Altimir y Devlin, el “mecanismo internacional de préstamos de última instancia” fue una novedad que aplazó incumplimientos y moratorias y evitó a los acreedores pérdidas desestabilizadoras. Marichal lo describe como una especie de cartel de la banca, promovido por acuerdos informales entre los gobiernos del G-7, grandes bancos y los multilaterales, sobre todo el FMI."},{"termino":"Negociación caso por caso","def":"Estrategia de los acreedores después de 1982: aislar a cada país deudor y obligarlo a negociar por separado con comités de bancos, a cambio de nuevos créditos caros y ajuste."},{"termino":"Plan Brady (bonos Brady)","def":"Plan propuesto por Baker a fines de 1985 y aplicado por su sucesor Brady a fines de los 80 (el libro dice “desde 1987”): canje de bonos viejos de deuda por títulos nuevos con descuento, garantizados con bonos cupón cero del Tesoro de EE.UU.; permitió a los bancos aliviar sus carteras. México fue el primero."},{"termino":"Consenso de Washington","def":"Recomendaciones para los países endeudados: disciplina fiscal, reforma tributaria, tipos de cambio y tasas flexibles, apertura comercial y a la inversión, privatizaciones y desregulación financiera. Para Marichal implicó un fuerte ajuste y preparó la fase más fuerte de la globalización financiera de los 90."}],"cronologia":[{"fecha":"Agosto de 1971","hecho":"Nixon anuncia el New Economic Program y abandona la paridad dólar-oro."},{"fecha":"Diciembre de 1971","hecho":"Acuerdos del Smithsonian: el dólar se devalúa 10% y se revalúan el yen y el marco."},{"fecha":"6 de octubre de 1973","hecho":"Egipto y Siria atacan a Israel: guerra de Yom Kippur."},{"fecha":"16 de octubre de 1973","hecho":"Los miembros árabes de la OPEP duplican el precio del petróleo y luego embargan a EE.UU.: primer choque petrolero."},{"fecha":"1974","hecho":"EE.UU. levanta los últimos controles de capitales; las principales monedas ya flotan."},{"fecha":"1976","hecho":"Los bancos empiezan a exigir cartas de intención con el FMI; golpe militar en la Argentina (marzo)."},{"fecha":"1979","hecho":"Caída del Sha de Irán: segundo choque petrolero, con un pico de precios mayor que el de 1973."},{"fecha":"6 de octubre de 1979","hecho":"Volcker sube la tasa de descuento: comienza el “efecto Volcker”."},{"fecha":"Noviembre de 1980","hecho":"Reagan derrota a Carter; luego crece el déficit estadounidense."},{"fecha":"1981-1982","hecho":"El servicio anual de la deuda del Tercer Mundo salta de unos 20 mil a casi 100 mil millones de dólares."},{"fecha":"20 de agosto de 1982","hecho":"México (Silva Herzog) anuncia que no puede pagar el servicio completo de su deuda: estalla la crisis."},{"fecha":"1982-1987","hecho":"Rondas de reprogramación caso por caso con comités de bancos acreedores."},{"fecha":"Fines de 1985","hecho":"James Baker, secretario del Tesoro, propone un plan para la deuda; lo aplicará su sucesor, Nicholas Brady."},{"fecha":"Fines de los 80","hecho":"Plan Brady: canje de bonos viejos por nuevos con garantía cupón cero; México es el primero (el libro lo fecha en 1988)."},{"fecha":"1994","hecho":"Nueva crisis mexicana: el problema de la deuda no estaba superado."}],"guia":[{"tema":"P9","pregunta":"Según Marichal, ¿qué fue la globalización financiera de 1973-1990 y qué papel tuvo en ella la crisis del petróleo? ¿Por qué hubo auge y crisis de la deuda externa de los países en desarrollo?","puntos":["**Marco**: fin de Bretton Woods (paridad dólar-oro abandonada en 1971, flotación desde 1973, fin de los controles de capitales en EE.UU. en 1974) + ofensiva monetarista (Friedman): caen las barreras a la globalización financiera.","**Crisis del petróleo — causas**: guerra de Yom Kippur (octubre de 1973); los países árabes de la OPEP usan el petróleo como arma contra EE.UU. por apoyar a Israel y para controlar sus recursos frente a las petroleras angloamericanas. El 16/10/1973 duplican el precio y embargan a EE.UU.; el barril va de unos 3 a 12 dólares.","**Crisis del petróleo — efectos**: encarece la energía, derrumba la bolsa y agrava la estanflación; respuestas: EE.UU. congela precios y crea la Oficina Federal de Energía, Europa ahorra y busca energías alternativas, Brasil lanza el etanol. Matiz del autor: fue decisivo pero no la única causa; pesaron aún más factores estructurales: el debilitamiento industrial de EE.UU., Europa occidental, la URSS y Europa del este (agotamiento del modelo de posguerra; según Mandel y Brenner, caída de la tasa de ganancia) y el fin de Bretton Woods.","**Petrodólares**: la OPEP gana más de 800 mil millones extra (1974-1982); una parte importante va a gasto público y armas, y buena parte de sus reservas se deposita a corto plazo en bancos globales.","**Reciclaje**: con el centro en recesión, los bancos prestan esos fondos a países en desarrollo (sobre todo América Latina), que pagan tasas más altas: un flujo Medio Oriente → América Latina intermediado por la banca del centro.","**Tesis**: unos 300 bancos de EE.UU., Europa y Japón, que prestaron más de 500 mil millones en los 70 y retuvieron esa deuda en sus carteras, fueron los primeros agentes de una globalización financiera temprana pero singular: allí estarían los antecedentes de la globalización moderna.","**Por qué se endeudaron los gobiernos**: sostener el gasto y el crecimiento de posguerra; mercados locales estrechos; crédito barato (tasas casi negativas); dictaduras y gasto militar; empresas estatales (capitalismo dirigido, PEMEX). La simultaneidad del endeudamiento sugiere el peso de los bancos; el FMI no alertó.","**Del auge a la crisis**: los plazos se acortan (1979-1981); segundo choque (Irán, 1979) → inflación de más de 10% en EE.UU. → efecto Volcker (tasas de casi 20%) + déficit de Reagan y dólar en alza → créditos cortos y caros; el servicio pasa de ~20 a ~100 mil millones (1981-1982).","**Estallido**: 20/8/1982, México no puede pagar el servicio completo (tasas + fuga de capitales); crisis gemela (cambiaria y de deuda, según Bordo y Eichengreen); el FMI actúa como “bombero y policía”, y su primer rescate fracasa por las medidas de López Portillo.","**Consecuencias**: contagio a casi toda América Latina y a otras periferias (aunque Corea, Indonesia, Malasia, Colombia y Chile evitaron rescates onerosos); bancos expuestos por encima de su capital; cartel de acreedores (MIPUI), negociación caso por caso y capitalización de intereses; ajuste, salarios en baja, inflación: década perdida.","**Salida y legado**: Plan Baker/Brady (canje de bonos con descuento, a fines de los 80) y Consenso de Washington, que preparan la fase más fuerte de la globalización financiera de los 90; la deuda sigue creciendo."],"ojo":"No presentes el petróleo como causa única de la recesión de los 70: Marichal lo considera decisivo, pero dice que hubo factores estructurales “aún más importantes”. No mezcles los dos choques: 1973 = guerra de Yom Kippur y OPEP árabe; 1979 = caída del Sha de Irán (es el que alimenta la inflación que lleva a Volcker). Los petrodólares no se prestaron de país a país: pasaron por los bancos de EE.UU., Europa y Japón; y no todo el dinero de la OPEP fue a los bancos (mucho se gastó en obras y armas). En el debate oferta/demanda el autor es cauto: la simultaneidad del endeudamiento “sugiere” el peso de los bancos. Marichal no usa la palabra “euromercados”: habla de “bancos globales” (y menciona petrodólares depositados en sucursales de Londres); si la usás, aclarala. Para “especificar la crisis del petróleo” (lo que anotó Magui) conviene dar causas (guerra, estrategia de la OPEP), medidas (precio duplicado, embargo, barril de 3 a 12 dólares) y efectos (recesión/estanflación, petrodólares, deuda). La crisis de 1982 fue de deudas soberanas, no un pánico bursátil. Fechas del libro que no coinciden con los hechos (mejor no citarlas): Plan Brady “instrumentado desde 1987” y primer canje en México “en 1988” (en realidad el plan es de 1989; escribí “propuesto por Baker en 1985 y aplicado por Brady a fines de los 80; México fue el primero”); la asunción de Reagan en 1980 (fue en enero de 1981); la caída del muro de Berlín en “octubre” de 1989 (fue en noviembre); el anuncio de Nixon el 16/8/1971 (fue la noche del 15). Tampoco conviene listar los “tigres” asiáticos: el libro incluye a Filipinas, que en otra página aparece entre los deudores más débiles."}],"mc":[{"id":"mar4-n1","tema":"P9","nivel":"normal","enunciado":"Según Marichal, ¿qué hicieron los países árabes de la OPEP en octubre de 1973 y con qué propósito?","opciones":["En plena guerra con Israel, duplicaron el precio del crudo y cortaron las ventas a Estados Unidos, para presionarlo y ganar control sobre su recurso.","Tras la caída del Sha de Irán, coordinaron un alza que llevó el barril a su pico más alto, para financiar la reconstrucción del nuevo régimen iraní.","Fundaron la OPEP para negociar con las petroleras angloamericanas un reparto más equitativo de la renta, sin recurrir a embargos ni a subas.","Embargaron el crudo destinado a Europa y Japón por haber abandonado la paridad con el dólar, mientras seguían abasteciendo con normalidad a Estados Unidos."],"correcta":0,"explicacion":"Marichal cuenta que, desatada la guerra de Yom Kippur, la coalición árabe de la OPEP usó el petróleo como instrumento de presión contra Estados Unidos por su apoyo a Israel y para reforzar el control de recursos explotados por las petroleras angloamericanas. El 16 de octubre de 1973 duplicaron el precio y poco después embargaron las exportaciones a Estados Unidos; era una estrategia nacionalista anunciada desde septiembre.","por_que_no":["","Confunde los dos choques: la caída del Sha explica el pico de 1979, no la medida de octubre de 1973.","La OPEP ya existía (los países que anunciaron el plan eran sus miembros) y la medida fue justamente una suba de precio con embargo.","Invierte el blanco: el embargo fue contra Estados Unidos por apoyar a Israel; quien abandonó la paridad dólar-oro fue Estados Unidos en 1971."],"pag":"pp. 179-180, 187-188"},{"id":"mar4-n2","tema":"P9","nivel":"normal","enunciado":"¿Cómo se produjo, según Marichal, el “reciclaje” de los petrodólares en los años 70?","opciones":["Los gobiernos árabes los prestaron en forma directa a los gobiernos latinoamericanos, mediante acuerdos bilaterales de cooperación entre países del Tercer Mundo.","Buena parte de las reservas árabes se depositaba a corto plazo en grandes bancos del centro, que, sin colocaciones rentables en casa, las prestaron a la periferia.","El FMI y el Banco Mundial captaron esos fondos y los otorgaron como créditos blandos a la periferia, como ya venían haciendo durante la década de 1960.","Los bancos los volcaron sobre todo a las bolsas de los países industriales, que crecían impulsadas por la suba de los precios de la energía."],"correcta":1,"explicacion":"Para Marichal, buena parte de los gobiernos árabes depositaba sus reservas en cuentas de corto plazo de bancos globales de Estados Unidos y Europa. Como la recesión y el estancamiento bursátil del centro impedían invertirlas con buena rentabilidad, los bancos las prestaron a países en desarrollo, que pagaban tasas relativamente altas. Por eso el flujo entre Medio Oriente y América Latina no fue directo sino a través de la banca.","por_que_no":["Marichal subraya que el flujo entre las dos regiones periféricas no fue directo: pasaba por la banca estadounidense y europea.","","Mezcla períodos: los organismos multilaterales dominaban el crédito en los 60; desde 1973 lo que se multiplicó fue el crédito de bancos privados.","Contradice el texto: el centro estaba en recesión y sus bolsas, estancadas; por eso los bancos buscaron clientes en la periferia."],"pag":"pp. 190, 195-196"},{"id":"mar4-n3","tema":"P9","nivel":"normal","enunciado":"¿Qué sostiene Marichal sobre los orígenes de la globalización financiera contemporánea?","opciones":["Que nació recién en los años 90, cuando el Consenso de Washington abrió por primera vez las economías periféricas a la entrada de capitales externos.","Que se originó en el sistema de Bretton Woods, cuyos tipos de cambio fijos favorecieron la libre circulación internacional de capitales.","Que sus antecedentes están en los flujos de 1970-1982, cuando unos trescientos bancos del centro prestaron masivamente a países en desarrollo.","Que surgió de la expansión de las multinacionales industriales, que en los 70 invirtieron directamente en fábricas de América Latina y Asia."],"correcta":2,"explicacion":"El autor plantea que los verdaderos antecedentes de la globalización financiera moderna están en los grandes flujos de capitales de 1970-1982. Los bancos de Estados Unidos, Europa occidental y Japón, que en los 70 prestaron más de 500 mil millones de dólares a países en desarrollo, fueron para él los primeros agentes de una fase temprana pero singular de globalización financiera.","por_que_no":["Confunde la etapa: el Consenso de Washington preparó la fase “más fuerte” de los 90, pero los antecedentes están antes, en 1970-1982.","Invierte la relación: fue el derrumbe de Bretton Woods (flotación y fin de los controles de capitales en 1974) lo que hizo caer las barreras.","","Cambia el actor y el mecanismo: el texto se centra en préstamos bancarios a gobiernos y empresas estatales, no en inversión directa industrial."],"pag":"pp. 181, 183, 199"},{"id":"mar4-n4","tema":"P9","nivel":"normal","enunciado":"Según Marichal, ¿cuál de los siguientes motivos explica que los gobiernos latinoamericanos contrataran tantos préstamos en los años 70?","opciones":["Que todos ellos eran importadores de petróleo y necesitaban conseguir divisas para pagar una factura energética que se había multiplicado tras 1973.","Que buscaban sostener el gasto público y el crecimiento de posguerra, con crédito externo abundante y barato ante mercados locales estrechos.","Que el FMI les exigía endeudarse con la banca privada como condición para acceder a sus propios programas de asistencia financiera.","Que necesitaban refinanciar las deudas atrasadas de los años 60, contraídas con el Banco Mundial y el Banco Interamericano de Desarrollo."],"correcta":1,"explicacion":"El autor menciona como primer motivo el deseo de mantener un fuerte gasto público para sostener las altas tasas de crecimiento que la región tenía desde mediados de siglo; como segundo, que ante la estrechez de los mercados financieros locales resultaba atractivo conseguir fondos internacionales abundantes y con tasas relativamente bajas. Esos préstamos cubrieron déficits, impulsaron empresas públicas y sostuvieron dictaduras.","por_que_no":["Trampa de sentido común: entre los nuevos deudores había importadores y también exportadores de petróleo (México, Venezuela, Ecuador), algo que el autor llama paradójico.","","Cambia el papel del FMI: desde 1976 eran los bancos los que pedían una carta de intención con el Fondo; el FMI no obligaba a endeudarse.","Invierte la cronología: en los 60 el endeudamiento fue moderado; los préstamos para pagar préstamos aparecen en 1978-1981."],"pag":"pp. 190, 196, 200"},{"id":"mar4-n5","tema":"P9","nivel":"normal","enunciado":"¿En qué consistió el “efecto Volcker” que Marichal señala como detonador principal de la crisis de la deuda?","opciones":["En una baja de las tasas de interés de la Reserva Federal para estimular la economía estadounidense antes de las elecciones presidenciales.","En la devaluación del dólar acordada con Europa y Japón, que redujo el valor de las reservas en dólares de los países deudores.","En la exigencia del FMI a Estados Unidos de recortar su déficit, que obligó a cortar los créditos a los gobiernos latinoamericanos.","En un endurecimiento monetario contra la inflación que llevó las tasas estadounidenses a casi 20% y encareció de golpe las deudas."],"correcta":3,"explicacion":"Paul Volcker, al frente de la Reserva Federal desde 1979, se propuso “matar al dragón de la inflación”: subió la tasa de descuento, impuso más encajes a los bancos y frenó la especulación. Las tasas en Estados Unidos treparon a casi 20% anual y entre 1980 y 1982 se dispararon los pagos de los deudores; la inflación bajó, pero hubo una fuerte recesión.","por_que_no":["Describe lo que hizo Arthur Burns en 1971-1972 a pedido de Nixon (tasas bajas antes de las elecciones), no la política de Volcker.","Remite a los acuerdos del Smithsonian de 1971; con Volcker y Reagan el dólar, al contrario, se fortaleció casi 40%.","Actor equivocado: Marichal señala que el FMI pide ajuste a los países pobres mientras Estados Unidos no cuida sus finanzas; la suba la decidió la Reserva Federal.",""],"pag":"pp. 182, 205-208"},{"id":"mar4-n6","tema":"P9","nivel":"normal","enunciado":"¿Qué anunció México el 20 de agosto de 1982 y a qué causas lo atribuyó su secretario de Hacienda?","opciones":["Que ya no podía cubrir todo el servicio de su deuda, por la súbita suba de las tasas y una masiva salida de capitales privados.","Que desconocía la deuda contraída por gobiernos anteriores por considerarla ilegítima, y que solo pagaría la que había tomado PEMEX.","Que suspendía los pagos porque la caída del precio del petróleo había reducido a la mitad los ingresos de PEMEX desde 1979.","Que nacionalizaba la banca privada para obligarla a absorber la deuda externa del Estado, siguiendo un acuerdo previo con el FMI."],"correcta":0,"explicacion":"Jesús Silva Herzog comunicó a la comunidad financiera internacional que México ya no estaba en condiciones de cubrir el servicio completo de su deuda, y lo atribuyó al aumento súbito de las tasas de interés y a la enorme fuga de capitales privados. Las reservas del Banco de México eran mínimas frente a los vencimientos de esos días.","por_que_no":["","Marichal no habla de repudio: México anunció que no podía pagar el servicio completo, no que desconocía la deuda.","No es la causa que expuso Silva Herzog; además, el texto presenta 1979 como un nuevo pico del precio del petróleo, no como una caída.","Mezcla hechos: la nacionalización bancaria fue una medida sorpresiva posterior de López Portillo, que hizo fracasar el plan del FMI."],"pag":"pp. 209-211"},{"id":"mar4-n7","tema":"P9","nivel":"normal","enunciado":"Según Marichal, ¿qué factores explican el estancamiento de América Latina en la llamada “década perdida”?","opciones":["El aumento del gasto en empresas estatales, la carrera armamentista de las dictaduras y la ola de importaciones financiada con petrodólares.","Un ajuste fiscal muy duro, la baja de los salarios reales, el destino de la renta petrolera a la deuda y la salida continua de capitales.","La sobrevaluación de las monedas locales, el proteccionismo de los países ricos y la caída de los precios internacionales de las materias primas.","La negativa de los bancos a renegociar, que llevó a moratorias totales y a la exclusión de la región de los organismos multilaterales."],"correcta":1,"explicacion":"Marichal enumera varias razones que se reforzaron mutuamente: la dureza del ajuste fiscal, las políticas de reducción de salarios reales, la transferencia de los recursos petroleros al pago de la deuda y la continua fuga de capitales. Todo eso respondía a la necesidad de sostener el servicio de la deuda después de 1982.","por_que_no":["Describe rasgos del auge de los 70 (gasto en empresas estatales, armas), no las causas del estancamiento de los 80.","","No son los factores que señala el autor; además, en los 80 hubo devaluaciones sucesivas, no sobrevaluación.","Contradice el texto: los bancos renegociaron caso por caso para evitar moratorias prolongadas, con el FMI y el Banco Mundial como aliados."],"pag":"pp. 217-218"},{"id":"mar4-n8","tema":"P9","nivel":"normal","enunciado":"¿En qué consistió el Plan Brady, según Marichal?","opciones":["En la condonación total de las deudas latinoamericanas por parte de los bancos, a cambio de que los países privatizaran sus empresas estatales.","En la formación de comités de bancos acreedores, encabezados por el Citibank, para negociar con cada país por separado nuevos créditos.","En cambiar la deuda vieja por nuevos bonos con descuento, cuyo pago quedaba asegurado por bonos cupón cero del Tesoro de EE.UU.","En un préstamo jumbo del FMI y del BIS a México, otorgado a cambio de un ajuste fiscal drástico tras la suspensión de pagos de 1982."],"correcta":2,"explicacion":"El plan, propuesto por Baker a fines de 1985 y aplicado por su sucesor Brady a fines de los 80, consistía en canjear los viejos bonos de deuda externa por títulos nuevos respaldados por bonos “cupón cero” del Tesoro estadounidense, con un fondo de garantía aportado por el FMI, el Banco Mundial, Japón y cada deudor. A los bancos les permitía vender sus tenencias y aliviar sus carteras; México fue el primero en aplicarlo.","por_que_no":["Exagera: el canje se hizo con descuento sobre el precio, no fue una condonación total, y el texto no lo condiciona a privatizaciones.","Describe la renegociación “caso por caso” de los años inmediatamente posteriores a 1982, anterior al Plan Brady.","","Se refiere al paquete de rescate de México de 1982, no al plan de canje de bonos de fines de los 80."],"pag":"pp. 215, 219-221"},{"id":"mar4-d1","tema":"P9","nivel":"dificil","enunciado":"¿Qué peso le asigna Marichal al choque petrolero de 1973 en la larga recesión de los países industriales?","opciones":["Lo considera la causa única: sin el alza del crudo, el crecimiento sostenido de la posguerra se habría prolongado durante los años 70.","Lo ve como un agravante decisivo, aunque cree que pesaron más factores de fondo, como el agotamiento del modelo industrial de posguerra.","Lo juzga secundario, porque la recesión comenzó recién en 1980 con la suba de las tasas de interés dispuesta por la Reserva Federal.","Lo considera decisivo sobre todo para Estados Unidos, que era la economía más dependiente del petróleo importado entre los países industriales."],"correcta":1,"explicacion":"Marichal admite que muchos analistas ven el choque de 1973 como una de las principales causas de la recesión, y lo califica de decisivo entre los factores que la agudizaron. Pero aclara que no fue el único: hubo variables estructurales “aún más importantes”, como el debilitamiento industrial de los países capitalistas y socialistas, el agotamiento del modelo de posguerra (el PIB de la OCDE bajó de 4,8% a 2,6% anual) y la volatilidad tras el fin de Bretton Woods.","por_que_no":["Es la versión escolar que el autor relativiza: el pico del petróleo “no fue el único factor”.","","Confunde el efecto Volcker (1980-1982) con la larga recesión, que el autor ubica desde 1973-1974.","Error de hecho según el texto: Estados Unidos dependía menos del petróleo importado que Japón o Europa, que fueron los más golpeados."],"pag":"pp. 180, 187, 191-192"},{"id":"mar4-d2","tema":"P9","nivel":"dificil","enunciado":"¿Cuál es la paradoja que Marichal destaca para la década de 1970 respecto de la periferia?","opciones":["Que los países periféricos sufrieron una recesión más profunda que el centro, porque casi todos eran importadores netos de petróleo.","Que los países socialistas crecieron gracias al petróleo soviético mientras las economías capitalistas se hundían en la estanflación de los 70.","Que el Tercer Mundo logró regular los precios de casi todas sus materias primas en la UNCTAD, aunque eso no evitó su endeudamiento.","Que con el centro en recesión, muchos países periféricos prosperaban por la suba de sus exportaciones y la llegada de crédito externo."],"correcta":3,"explicacion":"El autor contrasta la recesión de los países industrializados con la notable prosperidad de muchos países de la periferia entre 1970 y 1980. La explica por el auge de las exportaciones petroleras, la fuerte suba de precios de otros productos primarios (café, algodón, estaño, cacao) y los préstamos externos, que sostuvieron un crecimiento alto pero artificial.","por_que_no":["Contradice el texto: hubo prosperidad periférica, e incluso importadores como Brasil crecieron cerca de 7% pese al shock.","Falso según el autor: en la URSS y sobre todo en Europa del este la caída industrial fue aún peor que en Occidente.","Mitad bien, mitad mal: el Tercer Mundo se organizó en el G-77 y la UNCTAD, pero no logró regular las materias primas, salvo el petróleo.",""],"pag":"pp. 192-195"},{"id":"mar4-d3","tema":"P9","nivel":"dificil","enunciado":"En el debate sobre si el endeudamiento latinoamericano lo impulsó más la oferta de los bancos o la demanda de los gobiernos, ¿qué argumento usa Marichal para remarcar el papel de los bancos?","opciones":["Que las tasas de interés eran muy altas en los 70, por lo que solo una presión bancaria intensa explica que los gobiernos aceptaran endeudarse.","Que naciones muy diferentes tomaran deuda casi en simultáneo indica que una causa externa compartida las empujaba en la misma dirección.","Que los gobiernos de la región eran democráticos y debían rendir cuentas, de modo que no podían haber buscado deuda por iniciativa propia.","Que los créditos los otorgaban sobre todo el Banco Mundial y el BID, que imponían a los países los proyectos a financiar con esos fondos."],"correcta":1,"explicacion":"Marichal reconoce que los gobernantes querían crecer con crédito barato, pero señala que el endeudamiento simultáneo de casi todos los Estados sugiere factores externos que inducían una conducta parecida en países muy diversos. Ese factor fueron los bancos globales, que se internacionalizaron y obtenían una parte creciente de sus ganancias de los préstamos externos.","por_que_no":["Error de hecho: a mediados de los 70 las tasas llegaron a ser casi negativas; por eso el crédito era tan atractivo.","","Contradice el texto: la región estaba dominada por dictaduras y gobiernos autoritarios que justamente no rendían cuentas.","Período equivocado: el peso del Banco Mundial y del BID corresponde a los 60; desde 1973 se multiplicaron los bancos privados."],"pag":"pp. 196-197, 200-201"},{"id":"mar4-d4","tema":"P9","nivel":"dificil","enunciado":"¿Por qué Marichal califica de paradójico el destino de buena parte de los préstamos bancarios a América Latina en los 70?","opciones":["Porque bancos privados terminaron financiando sobre todo empresas estatales y obras públicas, alentando un capitalismo conducido por el Estado.","Porque los préstamos se dirigieron a empresas exportadoras privadas, lo que debilitó a los Estados justo cuando más necesitaban recursos externos.","Porque los bancos prestaron más a gobiernos de izquierda, como el de Allende, que a las dictaduras que les ofrecían garantías de pago.","Porque los fondos se usaron para comprar petróleo a la OPEP, devolviendo a los países árabes los mismos dólares que estos habían depositado."],"correcta":0,"explicacion":"Para el autor, una de las mayores paradojas es que los créditos de la banca internacional se destinaron en gran parte a empresas estatales y grandes obras públicas: los bancos alentaron una etapa de “capitalismo dirigido” (state-led capitalism). Lo explica la confianza de los banqueros en dictaduras y regímenes autoritarios, que consideraban capaces de garantizar el servicio de la deuda; PEMEX fue el mayor cliente entre 1976 y 1981.","por_que_no":["","Invierte el destino: los mayores deudores fueron las grandes empresas estatales (petróleo, energía, acero, aviación).","Al revés: la banca prestó poco al gobierno de Allende y mucho al régimen de Pinochet después del golpe de 1973.","No es la paradoja que plantea el autor: los préstamos servían para comprar bienes de capital y tecnología para las empresas estatales."],"pag":"pp. 201, 203-204"},{"id":"mar4-d5","tema":"P9","nivel":"dificil","enunciado":"¿Qué crítica le formula Marichal al FMI en relación con la crisis de la deuda?","opciones":["Que fue demasiado severo antes de 1982 y que sus ajustes preventivos asfixiaron a las economías latinoamericanas hasta provocar la crisis.","Que se negó a intervenir en el rescate de México y dejó que los bancos privados resolvieran solos la suspensión de pagos de 1982.","Que no alertó a tiempo sobre el endeudamiento y prefirió intervenir recién con los países ya quebrados, cuando eso aumentaba su poder.","Que impidió que los bancos exigieran cartas de intención, lo que permitió préstamos sin control a dictaduras de todo el mundo."],"correcta":2,"explicacion":"Para Marichal, el FMI (igual que el Banco Mundial y el BID) no dio cuenta de los peligros del endeudamiento: todavía en mayo de 1981 decía que no había motivos de alarma. Su lógica operativa hasta alentaba reservas escasas, y le resultaba más atractivo intervenir como “bombero y policía” de los gobiernos ya quebrados, porque así se realzaban su poder y su influencia.","por_que_no":["Invierte la crítica: el autor le reprocha complacencia antes de 1982, no exceso de rigor.","Contradice el texto: desde septiembre de 1982 el FMI negoció con la Reserva Federal y el Tesoro un paquete de rescate para México (que luego fracasó por las medidas de López Portillo).","","Al revés: desde 1976 los propios bancos exigían que el país solicitante firmara una carta de intención con el FMI."],"pag":"pp. 202-203, 209-210, 218-219"},{"id":"mar4-d6","tema":"P9","nivel":"dificil","enunciado":"¿Por qué la política monetaria de Volcker, sumada a la de Reagan, golpeó tan rápido a los países deudores, según Marichal?","opciones":["Porque el alza de tasas obligó a los países deudores a depositar en la Reserva Federal el 8% del valor de los préstamos que habían recibido.","Porque encareció enseguida el servicio de la deuda y, como convenía más invertir en EE.UU., la periferia quedó con créditos cortos y caros.","Porque el dólar perdió casi 40% de su valor, lo que licuó las reservas de los deudores y los obligó a devaluar sus monedas en cadena.","Porque Reagan prohibió a los bancos estadounidenses prestar a gobiernos extranjeros hasta que se redujera el déficit fiscal de su país."],"correcta":1,"explicacion":"La suba de tasas disparó los pagos anuales de los deudores. Además, el programa de Reagan (rebaja de impuestos y más gasto militar) agrandó el déficit y la emisión de deuda pública; los papeles del Tesoro se volvieron muy atractivos, más aún con un dólar que subió casi 40% entre 1980 y 1981, y los bancos de Nueva York redujeron los préstamos de mediano y largo plazo a la periferia. Entre 1980 y 1982 los gobiernos solo conseguían crédito corto y caro para refinanciar, y el servicio pasó de unos 20 mil a casi 100 mil millones de dólares.","por_que_no":["Trampa de palabras: el encaje del 8% se aplicó a los bancos comerciales sobre préstamos internos financiados con fondos del exterior, no a los países deudores.","","Invierte el dato: entre 1980 y 1981 el dólar subió casi 40% frente a otras monedas.","El texto no habla de prohibición: los bancos redujeron los préstamos largos porque invertir en Estados Unidos rendía más."],"pag":"pp. 206-209"},{"id":"mar4-d7","tema":"P9","nivel":"dificil","enunciado":"¿Qué concepto toma Marichal de Bordo y Eichengreen para caracterizar la crisis mexicana de 1982?","opciones":["El de “contagio”, porque la moratoria mexicana se trasladó en pocas semanas a la Argentina y a Brasil por la desconfianza de los inversores.","El de “crisis gemelas”, porque en México se combinaron una crisis cambiaria (devaluación) y una crisis de deuda (suspensión de pagos).","El de “crisis gemelas”, porque en 1982 coincidieron una crisis de deuda en la periferia y un pánico bursátil en la bolsa de Nueva York.","El de “crisis sistémica”, porque toda crisis de deuda desemboca necesariamente en una crisis bancaria dentro del país acreedor."],"correcta":1,"explicacion":"Marichal retoma de Bordo la distinción entre crisis cambiarias, bancarias, bursátiles y de deuda, que pueden darse juntas o por separado, y de Bordo y Eichengreen la idea de “crisis gemelas” (twin crises): el entrelazamiento de, por ejemplo, una crisis cambiaria y una de deuda. México en 1982 (devaluación y suspensión de pagos) era claramente ese tipo de cataclismo y mostraba que podía haber varias crisis dentro de una mayor.","por_que_no":["No es la categoría que toma de esos autores; el texto no describe un traslado de la moratoria a la Argentina y a Brasil en semanas.","","Usa el término correcto con un contenido falso: Marichal aclara que en 1982 no hubo pánicos bursátiles ni hipotecarios en Estados Unidos ni en Europa.","Contradice a Bordo: los distintos tipos de crisis podían desarrollarse o no de manera independiente."],"pag":"pp. 211, 214"},{"id":"mar4-d8","tema":"P9","nivel":"dificil","enunciado":"¿Cuál de las siguientes acciones NO formó parte de la estrategia de los acreedores después de 1982, según Marichal?","opciones":["Negociar con cada país deudor por separado, mediante comités que representaban a cientos de bancos estadounidenses, europeos y japoneses.","Otorgar nuevos créditos con tasas y comisiones elevadas, para que las deudas pendientes siguieran figurando como operativas en sus balances.","Pedir el respaldo del FMI y del Banco Mundial, que condicionaban su apoyo a ajustes fiscales destinados a cubrir el servicio de la deuda.","Promover una negociación conjunta de todos los deudores latinoamericanos, para repartir las pérdidas entre acreedores y deudores."],"correcta":3,"explicacion":"Según el autor, la mecánica de bancos y gobiernos acreedores consistía en aislar a los deudores y obligar a cada país a negociar por separado (“caso por caso”) con comités bancarios. Se daban nuevos créditos caros para que las deudas siguieran figurando como operativas y se sumaba al FMI y al Banco Mundial para imponer ajustes. El objetivo era evitar moratorias prolongadas y cobrar el servicio, no repartir pérdidas: el mecanismo permitió justamente que los acreedores las evitaran.","por_que_no":["Sí formó parte: es la negociación “caso por caso” con comités de bancos, a menudo encabezados por William Rhodes, del Citibank.","Sí formó parte: así los bancos evitaban tener que declararse en bancarrota y, además, cobraban comisiones.","Sí formó parte: los banqueros buscaron el concurso del FMI y del Banco Mundial, que exigían programas de contingencia con ajuste fiscal.",""],"pag":"pp. 214-217"},{"id":"mar4-m1","tema":"P9","nivel":"muy_dificil","enunciado":"Considere las siguientes afirmaciones sobre los choques petroleros según Marichal:\nI. El alza de 1973 tenía antecedentes: un mes antes de la guerra, países árabes de la OPEP ya habían anunciado un plan para aumentar su participación en el negocio petrolero.\nII. Estados Unidos, por ser el país industrial más dependiente del crudo importado, fue el más golpeado y por eso creó la Oficina Federal de Energía.\nIII. Además de la OPEP, se beneficiaron exportadores ajenos a ella, como México, aunque una renta petrolera tan alta podía provocar “enfermedad holandesa”.\nIV. La suba del petróleo perjudicó a la Unión Soviética y fue la causa principal del derrumbe del socialismo real.\n¿Cuáles son correctas?","opciones":["Solo I y III","Solo I, II y III","Solo II y IV","Solo III y IV"],"correcta":0,"explicacion":"I es correcta: el 15 de septiembre de 1973 seis países árabes de la OPEP anunciaron ese plan, por lo que la estrategia “no era una sorpresa”. III también: México se benefició sin ser miembro, y algunos economistas describen las distorsiones de la renta petrolera con el modelo de la enfermedad holandesa. II es falsa porque Estados Unidos dependía menos del petróleo importado que Japón o Europa (aunque sí creó la Oficina Federal de Energía), y IV porque para la economía rusa el auge petrolero no fue negativo: el derrumbe se explica por el agotamiento del modelo de desarrollo y la larga recesión.","por_que_no":["","Incluye II, que es mitad bien y mitad mal: la oficina existió, pero Estados Unidos era menos dependiente que Japón y Europa.","II y IV son falsas: una invierte la dependencia petrolera de Estados Unidos y la otra el efecto del petróleo sobre la URSS.","Incluye IV: para Marichal el petróleo estimuló la producción soviética; quien sufrió fue Europa del este, dependiente de Moscú."],"pag":"pp. 180, 188, 190, 192-193"},{"id":"mar4-m2","tema":"P9","nivel":"muy_dificil","enunciado":"Si alguien sostuviera que la crisis de la deuda de 1982 se explica solo por la irresponsabilidad de los gobiernos latinoamericanos, ¿qué le objetaría Marichal?","opciones":["Que la responsabilidad fue compartida: los bancos empujaron los créditos y los multilaterales no alertaron, y el detonador fue la caída del precio del petróleo.","Que la responsabilidad fue compartida: los bancos empujaron los créditos y los multilaterales no alertaron, y el detonador fue el alza de tasas en EE.UU..","Que la responsabilidad fue compartida: el FMI forzó los préstamos con sus cartas de intención, y el detonador fue el alza de tasas en EE.UU..","Que la responsabilidad fue compartida: el FMI forzó los préstamos con sus cartas de intención, y el detonador fue la caída del precio del petróleo."],"correcta":1,"explicacion":"Marichal no exime a los gobiernos (habla de endeudamiento desordenado, corrupción y fuga de capitales), pero reparte responsabilidades: el endeudamiento casi simultáneo sugiere el peso de los bancos globales, que vendían préstamos agresivamente; el FMI, el Banco Mundial y el BID no enviaron señales de alarma; y el detonador principal fue externo: la suba de tasas en Estados Unidos entre 1980 y 1982. Las otras opciones aciertan en parte, pero fallan en el papel del FMI o en el detonador.","por_que_no":["Mitad bien, mitad mal: el reparto de responsabilidades es correcto, pero para Marichal el detonador principal fue la suba de tasas en EE.UU. entre 1980 y 1982 (p. 205), no el petróleo.","","Mitad bien, mitad mal: el detonador es correcto, pero el FMI no forzó los préstamos; eran los bancos los que pedían la carta de intención como garantía.","Doble error: el FMI no forzó los préstamos (los bancos pedían la carta de intención como garantía) y el detonador principal fue la suba de tasas en EE.UU., no el petróleo."],"pag":"pp. 196, 200, 205, 214, 218-219"},{"id":"mar4-m3","tema":"P9","nivel":"muy_dificil","enunciado":"¿Cuál es la explicación más completa, según Marichal, de por qué a comienzos de los 80 se multiplicaron los préstamos de corto plazo a los países en desarrollo?","opciones":["El FMI empezó a exigir plazos cortos en las cartas de intención, como forma de imponer disciplina fiscal a los gobiernos deudores.","Los gobiernos preferían plazos cortos porque las tasas reales eran negativas y esperaban cancelar todo pronto con el auge exportador.","Los bancos temían un giro del ciclo y luego preferían invertir en EE.UU.; deudores y acreedores ganaban tiempo esperando tasas más bajas.","El Plan Brady reemplazó los viejos bonos de largo plazo por bonos cupón cero, que vencían en pocos meses y debían renovarse en forma continua."],"correcta":2,"explicacion":"Marichal combina varias razones. Hacia 1979-1981 los banqueros acortaron plazos por temor a que el ciclo dejara de favorecerlos (nuevo auge del petróleo en 1979, revueltas en Polonia en 1980-1981). Desde 1980, con tasas altas y dólar fuerte, los bancos de Nueva York redujeron los préstamos de mediano y largo plazo, y los gobiernos solo conseguían crédito corto para refinanciar. Según Kuczynski, prestamistas y prestatarios trataban de ganar tiempo esperando que bajaran las tasas y se recuperaran las exp
