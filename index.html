iaba la cantidad sobre la calidad y el abastecimiento era burocrático; además, cada intento de corrección traía más centralización y más recursos, lo que agravaba las causas de la ineficiencia. A eso se sumaban los desequilibrios: el agro y los bienes de consumo quedaron rezagados, y crecía la brecha entre el esfuerzo de la población y su bajo nivel de vida. Un modelo así depende de que sigan existiendo recursos para incorporar. Ya en los años cincuenta, con Jrushov, el empleo industrial seguía creciendo, pero la productividad crecía cada vez menos y el rendimiento del capital y de las nuevas inversiones caía: no se pudo pasar al crecimiento intensivo y el extensivo mostraba agotamiento. Entre 1966 y 1985 llegó la crisis, con menos mano de obra disponible, menor capacidad de inversión y recursos naturales cada vez más lejanos y caros, y para Palazuelos muchos de esos problemas se arrastraban desde la formación del sistema en los años treinta. Fue, entonces, un éxito industrializador real, pero ni indiscutible ni ilimitado.","errores_comunes":["Aceptar la afirmación sin matices o rechazarla negando el fuerte crecimiento: el autor reconoce el logro y a la vez sus límites.","Explicar el agotamiento solo por la conducción de Brézhnev: el autor ubica las raíces en el sistema formado en los años treinta.","Confundir crecimiento extensivo con intensivo, o decir que la URSS de Stalin se modernizó tecnológicamente.","Atribuir los límites solo a la destrucción de la guerra: el autor los explica por el modelo de gestión y de acumulación."],"pag":"pp. 4-8, 10 y 14"}]},{"id":"saborido","autor":"Jorge Saborido","obra":"Historia económica mundial — cap. 12 «La Segunda Guerra Mundial» y cap. 13 «Expansión de la segunda posguerra»","temas":["P8","P10"],"resumen":[{"titulo":"Cap. 12: la economía de la Segunda Guerra Mundial","puntos":["La **Blitzkrieg** («guerra relámpago») suponía **alterar lo menos posible la vida civil**: hasta 1942 Alemania casi no reorientó su economía y sostuvo el consumo **explotando a los ocupados**, porque temía una guerra larga y carecía de materias primas.","Para Saborido, **las decisiones estratégicas definieron la economía de guerra** (Gran Bretaña eligió resistir a largo plazo). Hacia 1943 la planificación, el control estatal y el gasto bélico superaban a los de 1914-1918: gasto militar del 70% del PBI en Alemania, 61% en la URSS, 55% en Gran Bretaña y 43% en EE.UU. (cuadro 12.1).","**EE.UU.**: industria +15% anual y PBI casi duplicado (1939-1944), en beneficio de las **grandes corporaciones**. **Gran Bretaña**: **«guerra total»** (racionamiento, controles, consumo civil −20%), **préstamo-arriendo** y financiación según **Keynes** (interés bajo, subsidios, déficit).","**Alemania**, con **Speer** desde 1942, triplicó las municiones; en el último año, la producción masiva sacrificó calidad por cantidad. La **URSS** trasladó **1.360 fábricas** a los Urales y Siberia y solo creció lo bélico (armamentos en 251 en 1944; renta nacional en 66 en 1942, con 1940 = 100), con **ahorro forzoso** y salarios reales al 40% de 1940.","Efectos: términos de intercambio contra Europa; industrialización periférica limitada (la **Argentina** exportó manufacturas a la región); el progreso técnico se **reorientó** sin acelerarse en general y el **Estado controló la innovación**.","**Sociedad (12.7)**: casi la mitad de los muertos fueron civiles; racionamiento y mercado negro; guerra popular en Gran Bretaña y «patriótica» en la URSS; en EE.UU., fin del desempleo y redistribución hacia los asalariados. La resistencia proponía **nacionalizar las industrias básicas**."],"pags":"pp. 339-349 (PDF pp. 2-7)"},{"titulo":"Cap. 13: crecimiento sin precedentes (1945-1973)","puntos":["La posguerra unió un **crecimiento nunca visto** y la **Guerra Fría**; entre otras razones por el desafío socialista, la expansión capitalista trajo una **creciente presencia del Estado**: el **Welfare State**.","En 16 países desarrollados el PBI creció 4,8% anual (1950-1973), contra 2,55% y 1,96% en los períodos previos; la **productividad por hora**, 4,5% anual (menos del 2% antes). El empleo pasó del agro a los **servicios**.","Los países atrasados crecieron algo más en PBI, pero **menos por habitante**: **aumentó la desigualdad** Norte-Sur.","**Bretton Woods** (1944): tipos de cambio fijos pero ajustables, control de capitales y **FMI**; los británicos, keynesianos, priorizaban el **pleno empleo**."],"pags":"pp. 351-355 (PDF pp. 8-10)"},{"titulo":"Pérdidas, reconstrucción, integración y moneda","puntos":["**Pérdidas (13.3)**: entre 45 y 60 millones de muertos, más civiles que militares; vivienda y transporte arrasados (en Francia quedaban 3.000 de 17.000 locomotoras); la industria sufrió menos y el agro, mucho.","**Reconstrucción (13.4)**: reparaciones para la URSS (Potsdam, 1945), inflación y **escasez de dólares**. El **Plan Marshall** (1947-1951), aplicación de la Doctrina Truman, frenó al comunismo y abrió Europa a las empresas de EE.UU.; según una opinión que el autor recoge, llegó a economías que en general ya se recuperaban (no Alemania ni Gran Bretaña, cuadro 13.5). El Este respondió con el COMECON (1949).","**Integración y moneda (13.5.5-13.5.6)**: GATT (1947-1948); CECA (1951) y **CEE** (1957), cuyo comercio interno se cuadruplicó; EFTA (1959). El **dólar**, a 35 la onza, fue «tan bueno como el oro» hasta que su abundancia, con el despegue europeo y japonés, cuestionó el sistema."],"pags":"pp. 355-358, 366-368 (PDF pp. 10-11, 15-16)"},{"titulo":"Economía mixta y Estado de bienestar","puntos":["Los gobiernos siguieron el **Informe Beveridge** (1942): **seguridad social** amplia contra desempleo, enfermedad, accidentes y vejez. Además, el Estado debía actuar sobre el **empleo, la demanda y la inversión** para asegurar la reproducción del capitalismo.","La **economía mixta** articulaba **empresas privadas, Estado y sindicatos**. Venía de los años 30, cuando la intervención fue consecuencia de lo que se interpretó como una incapacidad del mercado, y tuvo en **Keynes** su fundamento teórico.","El **consenso** de posguerra (coaliciones con izquierda y sindicatos) trajo **nacionalizaciones de industrias básicas**, **planificación** y participación obrera; centro, derecha y empresarios aceptaban que el Estado **controlara la demanda** con gasto público e impuestos.","De evitar otra crisis como la del 30 se pasó a algo más ambicioso: **garantizar el crecimiento a largo plazo y que llegara a todos**. Ese es el **Estado de bienestar**, que fue mucho más allá de su planteo inicial.","**Galbraith**: producción a gran escala, **planificación en lugar del mercado**, regulación estatal de precios y salarios y el **Estado como proveedor de fuerza de trabajo educada**."],"pags":"pp. 351, 358-359 (PDF pp. 8, 11-12)"},{"titulo":"Oferta de trabajo y capital (13.5.2)","puntos":["El crecimiento se explica por **más trabajo y capital** (la tierra casi no aportó) y por **más productividad** (técnica, escala, organización).","La **oferta de trabajo** creció por: a) una **población** que aumentó más rápido que en 1920-1945 (Francia +28% contra +2%; EE.UU. +45% contra +31%); b) la **incorporación masiva de mujeres**, por la **baja de la natalidad** y **más educación** (del 30,4% al 36,3% de la fuerza laboral en el promedio de 16 países; en EE.UU., del 28,8% al 38%); c) **migraciones** y absorción del **desempleo encubierto** del agro.","La CEE tenía casi 6,5 millones de inmigrantes en 1973 (menos de 2 millones quince años antes), más del 10% de los activos en Alemania y Francia. El agro se vació: en Francia pasó del 33% al 12,2% de los activos (1950-1973).","**Dimensión cualitativa**: más educación ayuda a aplicar el progreso técnico; su efecto es difícil de medir, pero se asocia a la distancia económica entre naciones. En general, todos **aumentaron el gasto educativo** (EE.UU. del 4,1% al 6,2% del PBI; Gran Bretaña del 3,2% al 4,9%, 1955-1964).","La **inversión** (15-20% del PBI, contra 10% en entreguerras) elevó la productividad y creó empleo, aunque su vínculo con el crecimiento **no es uniforme**."],"pags":"pp. 359-362 (PDF pp. 12-13)"},{"titulo":"Técnica, factor demanda y comercio","puntos":["La **revolución tecnológica** sostuvo la **producción en masa** fordista y la **automatización**; la fragmentación de tareas creó **dos mercados de trabajo**: pocos puestos calificados y muchos sin formación especial.","**El factor demanda**: la **sociedad de consumo**, nacida en EE.UU., se afirmó en Europa y Japón por la **mayor productividad** y el **Estado redistribuidor**; su base fue la **suba de los salarios reales** (Alemania: de 100 en 1953 a 276 en 1973).","La demanda multiplicó las inversiones, con apoyo estatal (infraestructura, subsidios, créditos). Las **exportaciones** crecieron aún más, aunque hoy se piensa que **acompañaron** la expansión más que causarla."],"pags":"pp. 362-366 (PDF pp. 13-15)"},{"titulo":"Las explicaciones del crecimiento","puntos":["**Neoclásica** (Denison): 23 fuentes del crecimiento; limitada a la oferta.","**Keynesiana**: una **demanda agregada alta** sostiene la inversión; el Estado evita depresiones y asegura ingresos a desocupados, enfermos y jubilados. Límite: supone un keynesianismo que muchos no aplicaron o aplicaron poco tiempo.","**Cambio estructural** (Lewis, Kindleberger): el sector avanzado atrae trabajadores y las reservas de desempleo contuvieron los salarios; no explica qué lo vuelve dinámico. **Catching up**: imitación de EE.UU.","**Marxista** (Mandel): **políticas anticíclicas** para «administrar la crisis» e **inflación permanente** para sostener la demanda."],"pags":"pp. 368-372 (PDF pp. 16-18)"},{"titulo":"Diferencias entre países","puntos":["**EE.UU.**: Eisenhower aceptó el papel social del Estado sin manejar la demanda; la **New Economics** de Kennedy y Johnson (déficit sistemático) logró 4,2% anual pero, con Vietnam, terminó en **inflación**.","**Gran Bretaña** (laboristas): **Estado de bienestar**, **pleno empleo** (desocupación máxima del 3%) y **nacionalizaciones** (Banco de Inglaterra, carbón, gas, electricidad, ferrocarriles y, en parte, acero) sin planificación eficaz; luego **stop and go** y crecimiento modesto.","**Francia**: uno de los casos más concretos de economía mixta, con nacionalizaciones y **planificación indicativa** (Monnet). **RFA**: **economía social de mercado** (Erhard: liberalismo con cogestión y política antimonopolio); desde 1966, keynesianismo socialdemócrata y convergencia hacia la economía mixta.","**Japón**: mano de obra barata del agro, empleo de por vida, alto ahorro, el MITI y una **educación estatal** al servicio de las grandes empresas. **España** (apartado 13.7, de Germán Ojeda): gran crecimiento en 1959-1974 con un **«miserable» Estado de bienestar**, ampliado en democracia.","**Europa del Este**: planificación centralizada y **crecimiento extensivo** (más trabajo y capital, poca productividad). **Periferia**: sustitución de importaciones (CEPAL), salvo los «tigres» asiáticos."],"pags":"pp. 372-411 (PDF pp. 18-38)"},{"titulo":"Los cambios sociales de la «edad de oro» (13.10)","puntos":["El cambio **más importante**: la **desaparición relativa del campesinado** (7% de los activos de los países desarrollados en 1980).","La **clase obrera**, con pleno empleo y consumo de masas, vivió una «crisis de conciencia»; surgió la **«sociedad de los dos tercios»**, con una franja que vive de seguros de desempleo y vivienda pública.","**Mujeres**: lo **revolucionario** fue que **las casadas salieran a buscar empleo** (servicios en los países ricos, industria en la periferia). Además ganaron lugar en la **universidad**, vía a los empleos de responsabilidad: una manifestación de sus nuevos roles (según la cita de Hobsbawm, cambiaron también las ideas sobre su papel público). En el bloque socialista los avances fueron modestos por el tradicionalismo.","**Universidad**: la innovación multiplicó las **profesiones con título** y la matrícula creció en casi todo el mundo; en el Este, con menos fuerza, porque el sistema no pudo responder a una demanda que se disparó. Los estudiantes, **actor político nuevo**, encabezaron la rebelión de los 60 (**Mayo de 1968**) contra el rumbo de una sociedad que los beneficiaba."],"pags":"pp. 411-414 (PDF pp. 38-39)"}],"conceptos":[{"termino":"Blitzkrieg (guerra relámpago)","def":"Estrategia de Hitler basada en campañas cortas y aplastantes. En lo económico implicaba no alterar la vida civil: poca reconversión productiva y consumo sostenido con la explotación de los territorios ocupados. Se abandonó a comienzos de 1942."},{"termino":"Guerra total","def":"Política británica de volcar rápidamente los recursos a fines militares con fuerte intervención estatal: racionamiento, control de la vida civil, reparto estatal de materias primas y reasignación de la mano de obra."},{"termino":"Estado de bienestar (Welfare State)","def":"Estructura intervencionista de posguerra que, además de evitar crisis como las de los 30, buscó asegurar el crecimiento a largo plazo y que llegara a toda la sociedad: seguridad social, pleno empleo, redistribución y manejo de la demanda."},{"termino":"Informe Beveridge (1942)","def":"Informe británico que propuso un amplio sistema de seguridad social frente al desempleo, la enfermedad, los accidentes y la vejez; con el Libro Blanco sobre el empleo (1944) fundamentó la política laborista."},{"termino":"Economía mixta","def":"Rasgo novedoso de la posguerra: relación entre sector privado, Estado y sindicatos, con nacionalizaciones, organismos de planificación y control estatal de la demanda dentro del capitalismo."},{"termino":"Oferta de trabajo","def":"Mano de obra disponible para producir. En la posguerra creció por el aumento natural de la población, la mayor tasa de actividad (sobre todo femenina), las migraciones y la absorción del desempleo encubierto del agro; su dimensión cualitativa depende de la educación."},{"termino":"Factor demanda","def":"Explicación del crecimiento por la expansión del consumo y de las exportaciones: suba de salarios reales, Estado redistribuidor e inversiones empresariales y públicas que respondían a esa demanda."},{"termino":"Sociedad de consumo de masas","def":"Sociedad que absorbe una producción enorme y barata gracias a la publicidad y a la suba de los salarios reales; nació en EE.UU. y se afirmó en Europa occidental y Japón después de 1945."},{"termino":"Dos mercados de trabajo","def":"División del empleo producida por la automatización y la organización fordista: una minoría de tareas especializadas con trabajadores calificados y una mayoría de tareas que no requieren preparación especial."},{"termino":"Planificación indicativa","def":"Planificación francesa impulsada por Jean Monnet: orientaba la producción sin imponerla, priorizaba unos pocos sectores básicos y dirigía la inversión con subsidios y créditos preferenciales."},{"termino":"Economía social de mercado","def":"Variante del liberalismo aplicada en la RFA por Ludwig Erhard, que sumaba la cogestión obrero-empresaria y una política activa contra la concentración."},{"termino":"Stop and go («freno y arranque»)","def":"Alternancia de medidas fiscales, monetarias y cambiarias para impulsar la economía y luego frenarla cuando se recalentaba y subían los precios; marcó la inestabilidad británica."},{"termino":"Crecimiento extensivo","def":"Crecimiento basado en sumar más trabajo, capital y recursos antes que en elevar la productividad; caracterizó a las economías planificadas de Europa del Este y ayuda a entender su crisis posterior."},{"termino":"Sociedad de los dos tercios","def":"Sociedad en la que unos dos tercios tienen una inserción estable en la economía de mercado y el resto (the residuum) sobrevive con seguros de desempleo, vivienda pública y trabajos ocasionales o informales."},{"termino":"Catching up","def":"Explicación del rápido crecimiento de Europa occidental y Japón por la imitación del líder (EE.UU.); requiere deseo de imitar, flexibilidad para el cambio y capacidad para organizarlo (empresa, sistema educativo, control de conflictos)."}],"cronologia":[{"fecha":"septiembre de 1939","hecho":"Alemania invade Polonia: culmina la estrategia agresiva de Hitler y empieza la guerra."},{"fecha":"1940","hecho":"Keynes publica «Cómo pagar el costo de la guerra», base de la financiación británica."},{"fecha":"junio de 1941","hecho":"Alemania invade la URSS; entre julio y noviembre se trasladan 1.360 fábricas a los Urales y Siberia."},{"fecha":"1942","hecho":"Alemania abandona la Blitzkrieg y Speer, ministro de Armamentos, acelera la producción; en Gran Bretaña se publica el Informe Beveridge."},{"fecha":"1944","hecho":"Libro Blanco sobre el empleo en Gran Bretaña; conferencia de Bretton Woods (julio): patrón de cambios oro y FMI."},{"fecha":"julio de 1945","hecho":"Conferencia de Potsdam: Stalin obtiene reparaciones a costa de instalaciones industriales alemanas."},{"fecha":"1947","hecho":"Anuncio del Plan Marshall (ERP, 1947-1951, más de 20.000 millones de dólares); en La Habana (1947-1948) se acuerda el GATT."},{"fecha":"1948","hecho":"Reforma monetaria en Alemania occidental: arranca el «milagro alemán»; se crea la OECE."},{"fecha":"1949","hecho":"El bloque soviético crea el COMECON; Gran Bretaña devalúa la libra."},{"fecha":"1951-1957","hecho":"Tratado de la CECA (1951) y Tratado de Roma (1957), que crea la Comunidad Económica Europea."},{"fecha":"1959","hecho":"Congreso de Bad Godesberg: la socialdemocracia alemana acepta el capitalismo bajo control estatal; nace la EFTA."},{"fecha":"1961-1969","hecho":"New Economics de Kennedy y Johnson: déficit sistemático y 4,2% anual de crecimiento."},{"fecha":"1966","hecho":"La socialdemocracia llega al gobierno de la RFA y aplica instrumentos keynesianos."},{"fecha":"1968","hecho":"Mayo francés, la expresión más conocida de la rebelión estudiantil mundial."},{"fecha":"1971-1973","hecho":"Nixon suspende la convertibilidad del dólar en oro (1971) y estalla la crisis del petróleo (1973): termina la expansión de posguerra."}],"guia":[{"tema":"P8","pregunta":"¿Qué hace el Estado de bienestar? ¿Cuáles son sus características? Desarrolle oferta de trabajo, demanda de trabajo, universidades públicas y el papel de las mujeres.","puntos":["**Contexto**: 1945-1973 = crecimiento sin precedentes + Guerra Fría. Tras la crisis de los 30 y, entre otras razones, por el desafío socialista, el capitalismo se expandió con **más Estado**: nace el **Welfare State**.","**Qué hace (1), protege**: sigue el **Informe Beveridge** (1942): seguridad social frente a desempleo, enfermedad, accidentes y vejez. En Gran Bretaña, beneficios «de por vida» financiados con aportes patronales.","**Qué hace (2), interviene**: actúa sobre **empleo, demanda e inversión**; controla la demanda con **gasto público y medidas fiscales** (Keynes); busca el **pleno empleo** (Gran Bretaña: desocupación máxima del 3%); redistribuye ingresos; invierte en infraestructura y da subsidios y créditos; para Mandel, aplica **políticas anticíclicas** para «administrar la crisis».","**Características: economía mixta** = empresas privadas + Estado + sindicatos, con amplio consenso (coaliciones con izquierda y sindicatos, pero también apoyo de centro, derecha y empresarios): **nacionalizaciones** de industrias básicas, **planificación** (indicativa en Francia), participación obrera.","**Evolución**: de evitar otra crisis como la del 30 a **garantizar el crecimiento a largo plazo y repartirlo** entre todos. Galbraith: gran escala, planificación, regulación de precios y salarios, Estado que provee fuerza de trabajo educada.","**Oferta de trabajo** (13.5.2, pp. 359-361): a) población que crece más rápido en 1945-1970 que en 1920-1945 (Francia +28% contra +2%; EE.UU. +45% contra +31%; Gran Bretaña +13% contra +5%); b) **mujeres** que entran en masa (menos hijos, más educación); c) **migraciones** (casi 6,5 millones de inmigrantes en la CEE en 1973; más del 10% de los activos en Alemania y Francia) y **desempleo encubierto** del agro absorbido (Francia: del 33% al 12,2% de los activos). Dimensión cualitativa: **educación** (en general, todos aumentan el gasto educativo; EE.UU. del 4,1% al 6,2% del PBI). Sumar el capital: inversión de 15-20% del PBI.","**Demanda** (en Saborido: «El factor demanda», pp. 364-366): sociedad de consumo basada en la **suba de salarios reales** y en el **Estado redistribuidor**; la demanda multiplicó las inversiones, con apoyo estatal (infraestructura, subsidios, créditos). Las exportaciones crecieron más que la demanda interna, por decisiones políticas (liberalización, apoyo impositivo y crediticio) y fletes baratos; hoy se piensa que crecen dentro de una expansión general, con una competitividad que viene de la inversión interior.","**Demanda de trabajo** (sin apartado propio: hay que reunirla). Nota 69 (p. 412): la **«demanda de mano de obra»** de las regiones más desarrolladas atrajo trabajadores de países vecinos atrasados (españoles en el norte de Europa en los 60). P. 360: la atracción de trabajadores del agro absorbió el desempleo encubierto. P. 361: la inversión crea nuevas oportunidades de empleo. P. 370: Lewis (el sector avanzado atrae trabajadores) y Kindleberger (desempleo y subempleo contuvieron los salarios hasta que se absorbieron; en Italia los sindicatos anularon antes ese beneficio). P. 372: en EE.UU., la reconversión y la demanda de consumo evitaron el desempleo pese a 10 millones de desmovilizados. Pp. 377 y 381: en la RFA y en Japón la mano de obra abundante moderó los salarios. P. 363: dos mercados de trabajo. P. 413: el trabajo femenino fue a los servicios (países ricos) y a la industria (periferia), y crecieron las profesiones con título. Pp. 374 y 412: el pleno empleo fortaleció a los sindicatos británicos y cambió la vida obrera.","**Universidades (y educación pública)**: la innovación multiplicó las profesiones universitarias y la matrícula creció en casi todo el mundo, aun donde faltaba alfabetizar (Ecuador, 3,2% de la población; Europa occidental, más del 2,5%); en el Este creció con menos fuerza porque el sistema no pudo responder a la demanda. Lo más cercano a «pública»: en la síntesis de **Galbraith** el Estado provee fuerza de trabajo educada; los países aumentaron el gasto educativo; en Japón el Estado armó un sistema educativo de alta calidad al servicio de las grandes empresas; en España (apartado de Ojeda) la ley de 1970 garantizó la escolarización pública. La mayoría de los estudiantes buscaba un título, pero una minoría militante de izquierda encabezó la rebelión de los 60 (Mayo de 1968, Tlatelolco); su impacto en los obreros fue limitado.","**Mujeres**: del 30,4% al 36,3% de la fuerza laboral en el promedio de 16 países (EE.UU. del 28,8% al 38%; Gran Bretaña del 30,8% al 36,6%; Alemania y Francia ya rondaban el 35-36%), por **menor natalidad** y **más educación**. Lo **revolucionario**: las **casadas** salen a trabajar (servicios en los países ricos, industria en la periferia). Además, más mujeres en la universidad, manifestación de sus **nuevos roles** y de un nuevo papel público. En el bloque socialista: logros (igualdad de derechos políticos, acceso a la enseñanza), pero avances modestos por el tradicionalismo, que se expresó en una «falta de cooperación».","**Diferencias entre países**: Gran Bretaña (bienestar + pleno empleo + nacionalizaciones, sin planificación), Francia (uno de los casos más concretos: planificación indicativa), RFA (economía social de mercado → keynesianismo desde 1966), EE.UU. (New Economics → inflación), España (apartado de Germán Ojeda: bienestar «miserable» bajo Franco).","**Resultados y límites**: PBI +4,8% y productividad +4,5% anual (1950-1973), consumo de masas; pero inflación, «sociedad de los dos tercios» y desigualdad Norte-Sur; la etapa cierra con 1971 (dólar) y 1973 (petróleo)."],"ojo":"Saborido **no tiene un apartado llamado «demanda de trabajo»**: el apartado es **«El factor demanda»** (13.5.4) y trata la demanda de bienes (consumo, salarios reales, inversión, exportaciones) sin conectarla con el empleo. La expresión literal **«demanda de mano de obra»** aparece solo en la **nota 69 (p. 412)**. Es del texto: los elementos de la viñeta «Demanda de trabajo», con sus páginas, y el caso de EE.UU. en 1945-1948, donde la demanda de consumo evitó el desempleo (p. 372). NO es del texto: afirmar como tesis general que «la demanda de bienes se tradujo en demanda de trabajo». Tampoco habla de «universidades públicas» con esas palabras. No confundir **oferta** (cuántos trabajadores hay y qué formación tienen) con **demanda** (qué impulsa a contratarlos). El Estado de bienestar NO es la planificación centralizada del Este ni se aplicó igual en todos lados: muchos países no aplicaron el keynesianismo o lo hicieron poco tiempo. El apartado sobre España (13.7) es de Germán Ojeda, no de Saborido."},{"tema":"P10","pregunta":"¿Cómo se organizaron las economías durante la Segunda Guerra Mundial? Compare Alemania, Gran Bretaña, Estados Unidos y la URSS.","puntos":["**Idea central**: las **decisiones estratégicas** de cada país definieron cómo encaró la guerra en lo económico. Hacia 1943 la economía mundial estaba **más movilizada que en 1914-1918** (más planificación y control estatal; más de un tercio del producto mundial para la guerra), con más producción, menos consumo y uso máximo del capital.","**Alemania**: rearme desde 1936; **Blitzkrieg** = campañas cortas y **mínimo impacto sobre la vida civil** (consigna: economía de guerra parecida a la de paz), con el nivel de vida sostenido por la explotación de los ocupados. Desde 1942, frenada en Rusia y con EE.UU. en guerra, **Speer**: municiones ×3 en 1942-1944; en el último año, producción masiva y cantidad sobre calidad (el reclutamiento se llevaba a los obreros calificados), mientras los bombardeos golpeaban la industria. La explotación de los ocupados siguió toda la guerra: en 1943 Francia transfirió cerca del 9% del PBI alemán.","**Gran Bretaña**: estrategia defensiva de largo plazo; **«guerra total»**: racionamiento, controles (hasta el auto privado), reparto estatal de materias primas, mano de obra reorientada; casi la mitad del producto para la guerra, consumo civil −20% (1943); **préstamo-arriendo** de EE.UU.; financiación según **Keynes** (interés del 3%, subsidios, déficit; inflación contenida por los controles). En el haber: inversión en aeronáutica, máquinas herramienta y automotores.","**EE.UU.**: la mayor expansión (industria +15% anual en 1940-1944; 19 millones de empleos; casi 40% de las armas del mundo en 1944, aunque solo el 21,5% de los ocupados trabajaba en actividades bélicas), pero la aprovecharon las **grandes corporaciones** (concentración); el Estado amplió su control con nuevos organismos; la industrialización llegó al sur y al este.","**URSS**: invadida en 1941 con una industrialización incompleta; perdió sus regiones industriales y el 40% del grano; **trasladó 1.360 fábricas** a los Urales y Siberia; solo creció la industria bélica (cerca del 20% del material aliado); los ocupados en actividades bélicas pasaron del 15% al 32% (1940-1944) y hubo 25 millones de muertos; impuestos y empréstitos = **ahorro forzoso**; salarios reales de 1945 = 40% de 1940; **economía quebrada**.","**Cuadros**: gasto militar en 1943 (% del PBI): Alemania 70, URSS 61, Gran Bretaña 55, EE.UU. 43 (Japón, 76 en 1944). PBI con 1939 = 100: EE.UU. 198 en 1944; Gran Bretaña 126 en 1943. URSS (1940 = 100): renta nacional 66 en 1942, armamentos 251 en 1944, agro 37-38; ingresos del Estado soviético (cuadro 12.5): los impuestos directos pasaron de 7 a 39,6 miles de millones de rublos y los empréstitos de 7,6 a 26,7 entre 1939 y 1945 (ahorro forzoso).","**Efectos generales**: términos de intercambio contra Europa occidental y pérdida de sus ingresos «invisibles»; industrialización sustitutiva limitada (irreversible solo en Canadá y Australia); EE.UU. desplaza a Europa en América Latina y la **Argentina** exporta manufacturas a la región; la técnica se **reorienta** (no se acelera en general) y el **Estado controla la innovación**.","**Sociedad (12.7)**: casi la mitad de los muertos fueron civiles (20% en 1914-1918); más mortalidad infantil; el campo, relativamente privilegiado; racionamiento y mercado negro (en Francia, también forma de resistir); guerra «profundamente popular» en Gran Bretaña y «guerra patriótica nacional» en la URSS; en EE.UU., fin del desempleo y redistribución hacia los asalariados, pero escasez de viviendas y delincuencia juvenil; en Alemania, sin oposición visible; en Italia, oposición creciente."],"ojo":"No decir que Alemania hizo «guerra total» desde 1939: hasta 1942 hizo lo contrario (Blitzkrieg con poca movilización); la «guerra total» es la británica. El reemplazo de la calidad por la cantidad es del **último año** de guerra, no de todo el período de Speer. No afirmar que la guerra aceleró en general el progreso técnico: Saborido dice que lo reorientó, aunque sin la guerra muchos avances no se habrían logrado. El traslado soviético de fábricas no continuaba una tendencia previa: se hizo en los primeros meses de la invasión (julio-noviembre de 1941). Conexión con P8: la financiación keynesiana, los controles de guerra y los programas de la resistencia (nacionalizar las industrias básicas) anticipan la economía mixta de posguerra."}],"mc":[{"id":"sab-n1","tema":"P8","nivel":"normal","enunciado":"Según Saborido, ¿qué distingue al «Estado de bienestar» del acuerdo intervencionista con que comenzó la posguerra?","opciones":["Que, además de prevenir otra crisis como la del 30, se propuso garantizar el crecimiento duradero y repartirlo entre todos.","Que sustituyó la propiedad privada de las grandes industrias por una planificación central con metas obligatorias.","Que surgió como un régimen transitorio de reconstrucción, pensado para desarmarse cuando terminara el Plan Marshall.","Que subordinó el gasto social al equilibrio del presupuesto para sostener la estabilidad de los precios y las monedas."],"correcta":0,"explicacion":"Saborido describe una evolución: el acuerdo inicial buscaba impedir que volvieran situaciones como las de los años 30; luego, como la presencia activa del Estado parecía haber «hecho desaparecer» las crisis, se le pidió asegurar el crecimiento a largo plazo y que sus frutos llegaran a todos los sectores. Esa estructura intervencionista ampliada, que fue mucho más allá de sus planteos iniciales, es el Estado de bienestar.","por_que_no":["","Confunde con las economías del Este: la planificación central con propiedad estatal es el modelo soviético; el Estado de bienestar occidental convivió con la empresa privada.","Falso: no fue un régimen transitorio atado al Plan Marshall; el texto lo presenta como una estructura intervencionista que fue mucho más allá de sus planteos iniciales.","Se parece a la orientación de los conservadores de la RFA, que privilegiaron precios y balanza de pagos sobre el gasto social; es lo contrario de lo que define al Estado de bienestar."],"pag":"p. 359 (PDF p. 12)"},{"id":"sab-n2","tema":"P8","nivel":"normal","enunciado":"¿Qué impulsaba el Informe Beveridge (1942), cuyas recomendaciones los gobiernos de posguerra se mostraron dispuestos a seguir?","opciones":["La nacionalización del Banco de Inglaterra, del carbón y de los ferrocarriles para sostener la reconstrucción.","Un régimen de tipos de cambio fijos pero ajustables, con un fondo internacional para asistir a países en problemas.","Una red amplia de seguridad social frente a la vejez, los accidentes, la enfermedad y la falta de trabajo.","Una planificación indicativa que concentrara la inversión pública en un puñado de industrias prioritarias."],"correcta":2,"explicacion":"Según Saborido, el Informe Beveridge proponía crear un sistema de seguridad social de gran alcance que protegiera a los ciudadanos frente a los riesgos de quedarse sin trabajo, enfermarse, accidentarse o envejecer. Es la base de la función protectora del Estado de bienestar; en Gran Bretaña se complementó con el Libro Blanco sobre el empleo (1944).","por_que_no":["Las nacionalizaciones existieron, pero el texto las presenta como el aporte específico de los laboristas, no como contenido del Informe Beveridge.","Describe lo acordado en Bretton Woods (1944) sobre el sistema monetario y el FMI, no el informe sobre seguridad social.","","Corresponde a la planificación francesa impulsada por Jean Monnet, no al informe británico."],"pag":"p. 351 (PDF p. 8)"},{"id":"sab-n3","tema":"P8","nivel":"normal","enunciado":"Según Saborido, ¿cuál de los siguientes procesos contribuyó a ampliar la oferta de trabajo en Occidente entre 1945 y 1970?","opciones":["La postergación de la edad jubilatoria, que alargó la vida laboral para sostener los sistemas de pensiones.","El acortamiento de la escolaridad obligatoria, que adelantó la entrada de los jóvenes al mercado laboral.","La extensión de la jornada de trabajo, pactada por los sindicatos a cambio de aumentos de salario.","La llegada de trabajadores de otros países y el pase de mano de obra del campo hacia otras actividades."],"correcta":3,"explicacion":"Saborido señala tres causas del aumento de la oferta de trabajo: el crecimiento natural de la población, la mayor tasa de actividad (sobre todo por la entrada masiva de mujeres) y el aumento de la población activa por las migraciones internacionales y por la absorción del desempleo encubierto, al atraer trabajadores del sector agrícola. La opción correcta resume esta última causa.","por_que_no":["El texto no menciona cambios en la edad de retiro; la seguridad social aparece como protección frente a la vejez, no como forma de alargar la vida laboral.","Es al revés: Saborido destaca la mejora del sistema educativo y de las posibilidades de estudiar, no un recorte de la escolaridad.","No figura en el texto; los sindicatos británicos, por ejemplo, luchaban por aumentos salariales y por conservar su poder monopólico, frenando mejoras técnicas que afectaran el empleo.",""],"pag":"p. 360 (PDF p. 12)"},{"id":"sab-n4","tema":"P8","nivel":"normal","enunciado":"¿Qué rasgo del trabajo femenino de posguerra considera Saborido realmente nuevo y de alcance «revolucionario»?","opciones":["Que las mujeres casadas dejaran el ámbito doméstico para salir a buscar un empleo.","Que las mujeres reemplazaran a los hombres movilizados en las fábricas durante la guerra.","Que las jóvenes solteras ingresaran por primera vez en el trabajo industrial asalariado.","Que las trabajadoras inmigrantes ocuparan los puestos de servicio doméstico en Europa."],"correcta":0,"explicacion":"En el apartado sobre los cambios sociales, Saborido afirma que las mujeres ganaron un lugar cada vez más importante gracias a su incorporación masiva al mercado de trabajo, y que lo verdaderamente nuevo fue que las casadas abandonaran el hogar para buscar empleo. Con eso cambiaron también las expectativas sobre el papel público de la mujer.","por_que_no":["","Es la imagen escolar de las guerras mundiales; Saborido habla de un fenómeno de la expansión de posguerra, no del reemplazo temporal de los hombres movilizados.","El trabajo de las solteras no era una novedad; lo que el texto subraya es que salieran a trabajar las casadas.","El texto habla de migraciones masivas y de los conflictos étnicos que generaron, pero no ubica allí la novedad del trabajo femenino."],"pag":"pp. 412-413 (PDF pp. 38-39)"},{"id":"sab-n5","tema":"P8","nivel":"normal","enunciado":"Según Saborido, ¿qué impulsó la fuerte expansión de los estudios universitarios durante el crecimiento de posguerra?","opciones":["La crisis del empleo industrial, que empujó a los jóvenes a prolongar sus estudios para no quedar desocupados.","La exigencia legal de un título superior para ingresar en la administración pública de los Estados de bienestar.","Los avances técnicos, que hicieron crecer las profesiones que solo podían ejercerse con estudios universitarios.","La alfabetización completa de la población mundial, que amplió la base de jóvenes en condiciones de ingresar."],"correcta":2,"explicacion":"Saborido relaciona la masificación universitaria con el cambio técnico: la innovación propia del período impulsó la expansión de profesiones que requerían formación superior. Por eso la cantidad de estudiantes creció en casi todo el mundo, incluso en países donde la alfabetización masiva todavía no estaba resuelta.","por_que_no":["Contradice el contexto: la posguerra fue una etapa de pleno empleo y expansión, no de crisis del empleo industrial.","El texto no menciona ningún requisito legal de títulos para el empleo público.","","Falso según el texto: en muchos países todavía estaba pendiente la alfabetización masiva, aunque la matrícula superior creció igual."],"pag":"p. 413 (PDF p. 39)"},{"id":"sab-n6","tema":"P8","nivel":"normal","enunciado":"¿Qué señala Saborido como la base sobre la que se apoyó la sociedad de consumo de posguerra?","opciones":["El abaratamiento de los alimentos por la sobreproducción agrícola de los países atrasados.","La expansión del crédito personal otorgado por las grandes empresas multinacionales.","El ingreso masivo de bienes norteamericanos baratos gracias a la ayuda del Plan Marshall.","El crecimiento sostenido del poder adquisitivo de los salarios a lo largo del período."],"correcta":3,"explicacion":"Para Saborido, la base de la sociedad de consumo fue la elevación de los salarios reales, visible en el cuadro 13.11: por ejemplo, en Alemania el índice pasó de 100 en 1953 a 276 en 1973. Con más poder de compra, los trabajadores sostuvieron una demanda creciente de bienes de consumo masivo.","por_que_no":["El texto no explica el consumo por los precios agrícolas; sobre la periferia remarca su dependencia de las materias primas y el aumento de la desigualdad.","Las multinacionales aparecen por su expansión, su papel en la innovación y sus abusos en países atrasados, no como proveedoras de crédito al consumo.","El Plan Marshall aportó sobre todo materias primas, alimentos y combustibles para la reconstrucción; no es la base que el texto da para el consumo de masas.",""],"pag":"p. 364 (PDF p. 14)"},{"id":"sab-n7","tema":"P8","nivel":"normal","enunciado":"La «economía mixta» que surgió en la posguerra se basaba, según Saborido, en la relación entre:","opciones":["un sector exportador moderno y un sector agrario tradicional de baja productividad.","la propiedad estatal de la industria y la propiedad privada de la tierra cultivable.","las empresas privadas, los poderes públicos y las organizaciones de los trabajadores.","los bancos centrales nacionales, el FMI y las grandes empresas multinacionales."],"correcta":2,"explicacion":"Saborido define la economía mixta como una relación entre empresas privadas, Estado y sindicatos. La intervención estatal había sido la consecuencia de lo que en los años 30 se interpretó como una incapacidad de la economía de mercado para resolver la crisis, y en la posguerra se reforzó con gobiernos de coalición en los que participaban partidos de izquierda y sindicatos.","por_que_no":["Se parece al modelo dual de Lewis (sector avanzado y sector atrasado), una de las explicaciones del crecimiento, no a la economía mixta.","Recuerda al caso de Polonia, donde bajo el socialismo subsistió la propiedad privada de la tierra; no es la definición de economía mixta.","","Mezcla actores del sistema monetario internacional y de la expansión de las empresas; no son los tres pilares que nombra el texto."],"pag":"p. 358 (PDF p. 11)"},{"id":"sab-n8","tema":"P8","nivel":"normal","enunciado":"¿Cuáles fueron, según Saborido, los componentes principales de la política económica del laborismo británico al terminar la guerra?","opciones":["Consolidar el Estado de bienestar, buscar el pleno empleo y nacionalizar una parte importante de la industria.","Combinar la cogestión entre obreros y empresarios con una política activa contra la concentración de empresas.","Orientar la inversión mediante planes cuatrienales centrados en seis industrias consideradas prioritarias.","Reducir el sector público, privatizar las empresas estatales y liberalizar el funcionamiento del mercado laboral."],"correcta":0,"explicacion":"Los laboristas aplicaron una política de base keynesiana con tres componentes: consolidar el Estado de bienestar, perseguir el pleno empleo y nacionalizar un sector significativo de la industria. Los dos primeros se fundaron en el Informe Beveridge y en el Libro Blanco sobre el empleo de 1944; las nacionalizaciones fueron su aporte específico.","por_que_no":["","Es la «economía social de mercado» de Ludwig Erhard en la RFA, no la política británica.","Corresponde a la planificación francesa de Jean Monnet; en Gran Bretaña, justamente, faltó una política de planificación eficaz.","Es lo contrario: describe el liberalismo que llegó con Thatcher en los años 80 como reacción contra ese modelo."],"pag":"pp. 373-374 (PDF p. 19)"},{"id":"sab-n9","tema":"P10","nivel":"normal","enunciado":"Según Saborido, ¿qué implicaba en el plano económico la estrategia alemana de la Blitzkrieg?","opciones":["Movilizar toda la economía desde 1939, con racionamiento estricto y control estatal de la mano de obra.","Basar el esfuerzo en grandes importaciones de materias primas para sostener una guerra prolongada.","Ganar tiempo para un rearme naval y aéreo de largo plazo, apoyado en el abastecimiento mundial.","Alterar al mínimo la vida cotidiana de la población, sin una reconversión profunda de la economía al comienzo."],"correcta":3,"explicacion":"Más allá de su sentido táctico (campañas cortas para aplastar al enemigo), la Blitzkrieg suponía que las decisiones económicas de los primeros años afectaran lo menos posible la vida civil. Por eso desde septiembre de 1939 no hubo una reorientación radical de la economía alemana, y el nivel de vida se sostuvo con la explotación de los territorios ocupados.","por_que_no":["Describe la «guerra total» británica, no la estrategia alemana hasta 1942.","Es al revés: Alemania carecía de materias primas esenciales y por eso buscaba evitar una estrategia que dependiera de importaciones.","Es la estrategia defensiva británica, basada en resistir y aprovechar su capacidad productiva y el abastecimiento mundial.",""],"pag":"p. 340 (PDF p. 2)"},{"id":"sab-n10","tema":"P10","nivel":"normal","enunciado":"¿Qué elemento destaca Saborido como fundamental en la respuesta económica soviética a la invasión alemana?","opciones":["La continuidad de un desplazamiento industrial hacia el este que los planes quinquenales venían haciendo desde los 30.","El traslado de más de mil grandes fábricas hacia los Urales y Siberia apenas comenzada la ocupación alemana.","La rebaja de los impuestos directos, que permitió sostener los salarios reales de los trabajadores urbanos.","La concentración de la producción en bienes de consumo para sostener la moral de la población civil."],"correcta":1,"explicacion":"Saborido destaca el traslado de 1.360 grandes fábricas desde el oeste hacia los Urales y Siberia entre julio y noviembre de 1941, con la participación de diez millones de personas. No continuaba una tendencia previa: fue una respuesta a la invasión, y convirtió a los Urales en la región más industrializada del país, de donde salía el 40% de la producción bélica.","por_que_no":["Trampa que el propio texto descarta: el traslado no continuaba una tendencia anterior, sino que se hizo en los primeros meses de la invasión.","","Es lo contrario: se aumentaron los impuestos directos y los empréstitos (ahorro forzoso) y los salarios reales de 1945 fueron apenas el 40% de los de 1940.","Falso: la producción de bienes de consumo cayó (índice de 100 en 1940 a 54 en 1943) mientras solo crecía la industria bélica."],"pag":"pp. 344-345 (PDF pp. 4-5)"},{"id":"sab-d1","tema":"P8","nivel":"dificil","enunciado":"Al comparar el crecimiento de 1950-1973 de los países desarrollados con el de un grupo de países atrasados, ¿qué concluye Saborido?","opciones":["Los atrasados crecieron más tanto en producto total como por habitante, de modo que la brecha empezó a cerrarse.","Los atrasados crecieron algo más en producto total, pero menos por habitante, de modo que la desigualdad aumentó.","Los atrasados crecieron menos en producto total por la caída de sus exportaciones, aunque más por habitante.","Ambos grupos crecieron a tasas similares, de modo que las diferencias de partida se mantuvieron estables."],"correcta":1,"explicacion":"Los países atrasados del cuadro 13.2 crecieron a una tasa algo superior en PBI (5,3% contra 4,8% anual), pero su crecimiento demográfico más acelerado hizo que el producto por habitante aumentara menos (2,7% contra 3,8%). Como además partían de niveles mucho más bajos, Saborido concluye que crecieron las desigualdades entre desarrollados y no desarrollados.","por_que_no":["Mitad bien, mitad mal: crecieron más en producto total, pero no por habitante, y el texto concluye lo contrario: la brecha se amplió.","","Invierte los datos: el producto total de los atrasados creció más y el producto por habitante, menos; además, sus exportaciones crecieron.","El texto marca diferencias claras en ambas tasas y concluye que la desigualdad aumentó, no que se mantuvo."],"pag":"pp. 352-353 (PDF pp. 8-9)"},{"id":"sab-d2","tema":"P8","nivel":"dificil","enunciado":"Según Saborido, ¿a qué se asoció la consolidación de la sociedad de consumo en Europa occidental y Japón después de 1945?","opciones":["A la mayor productividad laboral y a un Estado que redistribuía ingresos hacia los sectores más pobres.","A la escasez de mano de obra en todos los sectores, que elevó los ingresos obreros desde fines del siglo XIX.","A la reducción de los impuestos al consumo, decidida por gobiernos conservadores para estimular la demanda.","A la llegada de capitales norteamericanos, que financiaron con crédito la compra de bienes durables."],"correcta":0,"explicacion":"Saborido distingue dos trayectorias. En EE.UU. la sociedad de consumo nació a fines del siglo XIX por la escasez de mano de obra (ingresos relativamente altos) y la baja de costos; en Europa occidental y Japón se afirmó después de 1945 por el aumento de la productividad y por el papel del Estado como redistribuidor de ingresos a favor de los sectores de menores ganancias (en Japón, también por el paternalismo de las grandes empresas).","por_que_no":["","Es verdadero, pero para otro caso: la escasez de mano de obra explica el origen de la sociedad de consumo en EE.UU., no su consolidación europea y japonesa.","El texto no menciona rebajas de impuestos al consumo; destaca la redistribución estatal y la suba de los salarios reales.","Las inversiones norteamericanas aparecen ligadas al dinamismo de la CEE y a la transferencia de tecnología, no como crédito al consumo de los hogares."],"pag":"p. 364 (PDF p. 14)"},{"id":"sab-d3","tema":"P8","nivel":"dificil","enunciado":"¿En qué consiste, para Saborido, la dimensión «cualitativa» de la oferta de trabajo en la posguerra?","opciones":["En la selección y capacitación de obreros por las grandes empresas, que a cambio les aseguraban empleo de por vida.","En la participación de los trabajadores en la dirección de las empresas, que mejoró su motivación y su rendimiento.","En la especialización de una minoría de operarios en tareas de control y mantenimiento de máquinas automáticas.","En mejorar la educación, porque una población más instruida asimila y aplica mejor los avances técnicos."],"correcta":3,"explicacion":"Además de cuántos trabajadores hay, Saborido destaca qué formación tienen: la mejora del sistema educativo eleva el nivel de la población, y cuanto mayor es la educación media, más fácil les resulta a los trabajadores comprender y aplicar el progreso técnico. Aunque ese impacto sobre la productividad es difícil de medir, el nivel educativo se relaciona estrechamente con la distancia económica entre naciones; en general, todos los países aumentaron su inversión en educación en los años 50 y 60 (cuadro 13.9).","por_que_no":["Es verdadero para las grandes empresas japonesas (empleo de por vida), pero no es lo que el texto llama dimensión cualitativa de la oferta de trabajo.","La participación obrera en la dirección aparece entre las reformas de la economía mixta (y la cogestión en la RFA), no como dimensión cualitativa de la oferta.","Describe uno de los dos mercados de trabajo creados por la automatización, un efecto de la técnica sobre la organización del trabajo, no la mejora educativa.",""],"pag":"p. 361 (PDF p. 13)"},{"id":"sab-d4","tema":"P8","nivel":"dificil","enunciado":"¿Qué observa Saborido sobre la situación de las mujeres en los países socialistas durante este período?","opciones":["Que lograron una igualdad efectiva superior a la de Occidente, porque el Estado garantizó su emancipación.","Que su ingreso al trabajo fue escaso, porque la planificación reservó la industria pesada a los varones.","Que, pese a la ideología oficial y a su casi total inserción laboral, los avances reales fueron modestos.","Que su acceso a la universidad superó al de Occidente, ya que la oferta educativa estatal no tenía límites."],"correcta":2,"explicacion":"Saborido señala una paradoja: en el bloque socialista la ideología dominante defendía la liberación femenina y casi todas las mujeres trabajaban, pero la realidad mostró avances mucho más modestos. Hubo logros (igualdad de derechos políticos, acceso a la enseñanza), aunque el tradicionalismo de esas sociedades se expresó en una falta de cooperación, abierta o disimulada.","por_que_no":["Es lo que proclamaba la ideología oficial; el texto dice lo contrario: en la realidad los avances fueron más modestos.","Falso: el texto afirma que casi la totalidad de las mujeres estaba incorporada al mercado laboral.","","Contradice el texto: en los países socialistas el sistema no pudo responder a una demanda de estudios superiores que creció más de lo previsto."],"pag":"p. 413 (PDF p. 39)"},{"id":"sab-d5","tema":"P8","nivel":"dificil","enunciado":"Según Saborido, la expansión de la matrícula universitaria en la posguerra:","opciones":["se limitó a los países desarrollados, porque en el resto la alfabetización masiva seguía pendiente.","fue mayor en los países socialistas, cuyo sistema estatal absorbió toda la demanda de estudios.","acompañó una reducción del empleo calificado, provocada por la automatización de las fábricas.","fue generalizada y se dio incluso en países cuyo nivel de desarrollo no parecía justificarla."],"correcta":3,"explicacion":"El texto sostiene que el aumento de estudiantes superiores fue generalizado y, a veces, sin relación con el desarrollo del país: no sorprende que en Europa occidental superaran el 2,5% de la población en los años 70, pero sí que en Ecuador llegaran al 3,2%. En los países socialistas el fenómeno fue más débil: la demanda de estudios también se disparó, pero el sistema no pudo atenderla.","por_que_no":["Mitad bien, mitad mal: la alfabetización seguía pendiente en muchos países, pero aun así la matrícula superior creció en casi todas partes (el ejemplo es Ecuador).","Es al revés: en los países socialistas el fenómeno fue más débil porque el sistema no pudo atender la demanda.","El texto liga la expansión universitaria a la multiplicación de profesiones que exigían título, no a una caída del empleo calificado.",""],"pag":"p. 413 (PDF p. 39)"},{"id":"sab-d6","tema":"P8","nivel":"dificil","enunciado":"¿Qué caracterizó a la planificación francesa de posguerra impulsada por Jean Monnet?","opciones":["Pretendía orientar la producción sin imponerla, concentrando la inversión en unos pocos sectores básicos.","Fijó metas obligatorias para todas las empresas, que perdieron su autonomía frente a los organismos del Estado.","Promovió un crecimiento equilibrado de todas las ramas para evitar los estrangulamientos de la industria pesada.","Se lanzó en 1964 para corregir el stop and go, pero se abandonó un par de años después por la inestabilidad."],"correcta":0,"explicacion":"La planificación francesa fue indicativa: buscaba guiar la producción y no controlarla, y seguía un modelo de crecimiento desequilibrado centrado en seis industrias prioritarias (carbón, cemento, acero, electricidad, transportes y maquinaria agrícola). Aunque no era obligatoria, se crearon instituciones financieras que dirigían la inversión con subsidios y créditos preferenciales.","por_que_no":["","Describe una planificación centralizada de tipo soviético; en Francia, además, la mayoría de las empresas conservó su autonomía.","Es lo contrario: el modelo francés era de crecimiento desequilibrado, concentrado en unos pocos sectores prioritarios.","Corresponde al intento laborista británico de 1964, no a la planificación francesa, que encadenó cinco planes hasta 1972."],"pag":"p. 375 (PDF p. 20)"},{"id":"sab-d7","tema":"P8","nivel":"dificil","enunciado":"¿Cómo caracteriza Saborido la «economía social de mercado» adoptada por la República Federal Alemana?","opciones":["Como la economía planificada, con un fuerte sector estatal, que reclamaba la mayoría de la sociedad alemana.","Como un programa keynesiano de déficit fiscal aplicado por la democracia cristiana desde la reforma de 1948.","Como un liberalismo que incluía la gestión compartida con los obreros y medidas contra los monopolios.","Como un modelo que antepuso el gasto social al control de los precios y del equilibrio de la balanza de pagos."],"correcta":2,"explicacion":"La Unión Demócrata Cristiana aceptó parte del ideario neoliberal, pero con la variante que el ministro Ludwig Erhard llamó «economía social de mercado»: incorporaba la cogestión obrero-empresaria y una política activa contra la concentración (que, de todos modos, siguió siendo un rasgo alemán). Los instrumentos keynesianos llegaron recién con la socialdemocracia, en 1966.","por_que_no":["Trampa de palabras: el texto dice que la sociedad alemana prefería una economía planificada, pero triunfaron las ideas liberales.","Error de período y de actor: la financiación deficitaria se aplicó sistemáticamente recién desde 1966, con los socialdemócratas.","","Invierte la prioridad: los gobiernos conservadores privilegiaron el control de precios y de la balanza de pagos en detrimento del gasto social."],"pag":"pp. 376-377 (PDF pp. 20-21)"},{"id":"sab-d8","tema":"P8","nivel":"dificil","enunciado":"Según Saborido, ¿qué efecto tuvo sobre el trabajo la difusión de procesos automáticos y de la organización fordista?","opciones":["Eliminó la mayoría de los puestos sin calificación y volvió necesario un título técnico para casi todos los obreros.","Generó un desempleo industrial masivo que solo pudo compensarse con los seguros de paro del Estado de bienestar.","Fraccionó las tareas y partió el empleo entre unos pocos puestos especializados y muchos que no requerían capacitación.","Igualó las calificaciones de los operarios, por lo que se redujeron las diferencias salariales dentro de las fábricas."],"correcta":2,"explicacion":"La automatización y los procesos continuos simplificaron y fraccionaron las tareas, y desplazaron la actividad humana hacia el control, el mantenimiento y la regulación. Según Saborido, esa fragmentación originó dos mercados de trabajo: uno minoritario de tareas especializadas con mano de obra calificada y otro mayoritario de tareas sin formación especial.","por_que_no":["Es lo contrario: el segmento mayoritario era justamente el de las tareas que no necesitaban formación especial.","El texto no habla de desempleo masivo en la posguerra; la etapa se caracterizó por el pleno empleo.","","El texto describe una división del empleo en dos segmentos, no una igualación de calificaciones."],"pag":"p. 363 (PDF p. 14)"},{"id":"sab-d9","tema":"P10","nivel":"dificil","enunciado":"¿Qué cambió en la economía de guerra alemana a partir de comienzos de 1942, según Saborido?","opciones":["Comenzó el rearme, que hasta entonces había sido frenado por la necesidad de atender el desempleo.","Se adoptó la consigna de una economía de guerra lo más parecida posible a una economía de paz.","Se abandonó la explotación de los territorios ocupados para obtener la colaboración de sus poblaciones.","Se dejó atrás la Blitzkrieg y Speer multiplicó la producción, que en el último año resignó calidad por cantidad."],"correcta":3,"explicacion":"Los contraataques soviéticos y la entrada de EE.UU. llevaron a Hitler a abandonar la Blitzkrieg. Desde comienzos de 1942, el ministro de Armamentos Albert Speer orientó el esfuerzo a aumentar la producción (las municiones se triplicaron entre 1942 y 1944) y, en el último año de guerra, como el reclutamiento absorbía a los obreros calificados, la producción masiva obligó a reemplazar la calidad por la cantidad.","por_que_no":["Error de cronología: el rearme empezó con Hitler en el poder y sobre todo desde 1936, mucho antes de la guerra.","Es la consigna de la etapa anterior (la de la Blitzkrieg), no del cambio de 1942.","Falso: la explotación de los ocupados siguió (en 1943 Francia transfirió cerca del 9% del PBI alemán); el «Orden Nuevo» se redujo a extraer recursos.",""],"pag":"p. 343 (PDF p. 4)"},{"id":"sab-d10","tema":"P10","nivel":"dificil","enunciado":"¿Qué recomendaciones de Keynes orientaron la financiación británica de la guerra y con qué resultado, según Saborido?","opciones":["Interés bajo, precios estabilizados con subsidios y aceptación del déficit; deuda razonable e inflación contenida.","Presupuesto equilibrado, impuestos al consumo altos y tasas elevadas; sin inflación, pero con la producción frenada.","Emisión ilimitada de moneda sin controles de precios; una inflación mayor que la de la Primera Guerra Mundial.","Préstamos externos a largo plazo con EE.UU.; una deuda tan pesada que impidió la reconstrucción de posguerra."],"correcta":0,"explicacion":"En «Cómo pagar el costo de la guerra» (1940), Keynes propuso tasas de interés bajas a largo plazo, precios estables mediante subvenciones y aceptar presupuestos con déficit. El interés del 3% permitió una deuda pública razonable que facilitó la reconstrucción y, aunque se duplicó el dinero en manos del público, la inflación no habría superado el 50% gracias a los controles de precios.","por_que_no":["","Es la receta ortodoxa opuesta a la de Keynes, que aceptaba el déficit y buscaba tasas bajas.","Falso: hubo controles de precios, cuyo papel el texto considera significativo para contener la inflación.","Confunde con el préstamo-arriendo, por el que EE.UU. entregó bienes en forma gratuita mientras durara la guerra; y la deuda facilitó, no impidió, la reconstrucción."],"pag":"pp. 342-343 (PDF pp. 3-4)"},{"id":"sab-m1","tema":"P8","nivel":"muy_dificil","enunciado":"Sobre las mujeres en la expansión de posguerra, considere: I. La baja de la natalidad y las mejores posibilidades educativas favorecieron su ingreso a la población activa. II. En el capitalismo avanzado, el nuevo empleo femenino se dirigió sobre todo a la industria. III. Su creciente presencia en la universidad expresaba nuevos roles, porque los estudios superiores eran la vía a empleos de responsabilidad. IV. Según la cita de Hobsbawm que retoma el autor, cambiaron las tareas de las mujeres, pero no las ideas sobre su papel público. ¿Cuáles son correctas según Saborido?","opciones":["Solo I y III","Solo I, II y III","Solo III y IV","Solo I y IV"],"correcta":0,"explicacion":"I es correcta: Saborido vincula la mayor actividad femenina con la caída de la natalidad y la mejora educativa. III también: la universidad era la preparación indispensable para empleos de responsabilidad, y la presencia femenina allí mostraba nuevos roles. II es falsa porque en el capitalismo avanzado el trabajo femenino fue hacia los servicios (la industria lo recibió en la periferia), y IV es falsa porque la cita sostiene que cambiaron también el papel de la mujer y las expectativas sobre su papel público.","por_que_no":["","Incluye II, que confunde los sectores: la industria recibió mano de obra femenina en los países periféricos; en el capitalismo avanzado, los servicios.","Incluye IV, que invierte la cita de Hobsbawm: no cambió solo el carácter de las actividades femeninas, sino también las ideas sobre el papel público de la mujer.","Deja afuera III, que es correcta, e incluye IV, que es falsa."],"pag":"pp. 360, 412-413 (PDF pp. 12, 38-39)"},{"id":"sab-m2","tema":"P8","nivel":"muy_dificil","enunciado":"Si alguien sostuviera que la rebelión estudiantil de los años 60 fue, ante todo, una reacción contra la pobreza y la falta de empleo, ¿qué objetaría Saborido?","opciones":["Que sus causas fueron sobre todo salariales, igual que las de las huelgas obreras de 1968 en Francia e Italia.","Que fue un fenómeno solo europeo occidental, sin repercusión en América Latina ni en el bloque socialista.","Que la impulsaron los partidos comunistas oficiales para debilitar a los gobiernos aliados de EE.UU.","Que surgió en pleno auge, entre los más favorecidos, como rechazo al rumbo social y cultural de la posguerra."],"correcta":3,"explicacion":"Saborido subraya una paradoja: en el momento de mayor expansión y difusión del bienestar, un sector de los más beneficiados cuestionó radicalmente esa sociedad. Lo explica, como hipótesis plausible, por el rechazo al rumbo que tomaba la sociedad aunque garantizara un nivel de vida nunca alcanzado: los estudiantes habrían sido los primeros en reaccionar contra los cambios sociales y culturales del capitalismo de posguerra.","por_que_no":["Trampa de actores: el texto dice que las huelgas obreras de 1968 solo buscaban mejoras salariales, justamente para contrastarlas con la protesta estudiantil.","Falso: la rebelión se extendió desde EE.UU. hasta Polonia y Checoslovaquia, pasando por México (Tlatelolco).","El texto ubica la militancia en agrupaciones de izquierda o ultraizquierda y muestra que la protesta llegó también a países socialistas; no habla de una maniobra comunista.",""],"pag":"pp. 413-414 (PDF p. 39)"},{"id":"sab-m3","tema":"P8","nivel":"muy_dificil","enunciado":"Saborido revisa varias explicaciones del crecimiento de posguerra. ¿Cuál es la objeción que le plantea específicamente a la explicación keynesiana?","opciones":["Que se limita al lado de la oferta y atiende más a la causalidad inmediata que a la última.","Que no identifica el motor del desarrollo, es decir, por qué el sector avanzado se vuelve dinámico.","Que supone un uso generalizado de políticas que muchos países no aplicaron o aplicaron poco tiempo.","Que no explica qué ocurre con el crecimiento cuando se agota el impulso de imitar al país líder."],"correcta":2,"explicacion":"Para los keynesianos, una demanda agregada alta, sostenida con política fiscal y monetaria activa, explica el crecimiento, y el Estado es clave para evitar depresiones. Saborido marca una limitación empírica: se da por sentado que esas políticas se aplicaron en todas partes, cuando varios países no las pusieron en práctica o lo hicieron durante muy poco tiempo. Aun así, reconoce que sin la presencia activa del Estado es difícil entender la etapa.","por_que_no":["Es el límite que el texto atribuye a la explicación neoclásica de Denison, centrada en las fuentes de la oferta.","Es la debilidad que el texto señala en el enfoque del cambio estructural (el modelo de Lewis aplicado por Kindleberger).","","Es el problema que plantea la escuela del catching up cuando ya no queda nada que imitar."],"pag":"pp. 368-371 (PDF pp. 16-18)"},{"id":"sab-m4","tema":"P8","nivel":"muy_dificil","enunciado":"Saborido retoma la síntesis de Galbraith sobre la nueva realidad de posguerra. Considere: I. La producción se organiza a gran escala. II. La planificación reemplaza al mercado. III. El Estado orienta la demanda mediante el control de precios y salarios. IV. La capacitación de los trabajadores queda a cargo de las grandes empresas privadas. ¿Cuáles forman parte de esa síntesis?","opciones":["Solo I y II","Solo I, II y III","Solo II, III y IV","Solo I, III y IV"],"correcta":1,"explicacion":"Galbraith, que imaginaba una convergencia entre los mundos capitalista y comunista, describió cuatro rasgos: producción en gran escala, planificación en lugar del mercado, regulación estatal de la demanda mediante el control de precios y salarios, y un papel preponderante del Estado —no de las empresas— en la provisión de fuerza de trabajo educada y entrenada. Por eso IV es falsa; ese rasgo es justamente el que liga al Estado de bienestar con la educación.","por_que_no":["Omite III, que también forma parte de la síntesis de Galbraith.","","Omite I e incluye IV, que asigna a las empresas una tarea que Galbraith atribuye al Estado.","Omite II e incluye IV, que es falsa."],"pag":"p. 359 (PDF p. 12)"},{"id":"sab-m5","tema":"P8","nivel":"muy_dificil","enunciado":"Al comparar las nacionalizaciones británicas y francesas de posguerra, ¿qué conclusión es compatible con Saborido?","opciones":["En Gran Bretaña explicaron la recuperación exportadora; en Francia, en cambio, no alteraron la estructura fabril.","En ambos países el Estado ganó gran peso como empleador, pero las empresas conservaron autonomía para decidir.","En Francia se profundizaron después de que comunistas y socialistas dejaran el gobierno, a diferencia de Gran Bretaña.","En ambos países se combinaron con una planificación central que fijaba la estrategia de cada empresa nacionalizada."],"correcta":1,"explicacion":"En Gran Bretaña el Estado pasó a controlar una cuarta parte de la fuerza de trabajo, y en Francia se convirtió en el principal productor y empleador. Pero en los dos casos las empresas mantuvieron su autonomía: en Gran Bretaña, la falta de planificación impidió usar ese poder económico; en Francia, las intervenciones directas fueron marginales y no cambió la estructura fabril.","por_que_no":["Mitad bien, mitad mal: en Francia no cambiaron la estructura fabril, pero la recuperación británica tuvo poca relación con el sector nacionalizado (se apoyó en exportaciones y controles).","","Invierte el texto: el proceso francés se detuvo tras la salida de los comunistas (1947) y de los socialistas (1949).","En Gran Bretaña faltó una política de planificación, y en Francia el plan era indicativo, no una dirección de cada empresa."],"pag":"pp. 374-375 (PDF pp. 19-20)"},{"id":"sab-m6","tema":"P8","nivel":"muy_dificil","enunciado":"Analice: «La aplicación sistemática del keynesianismo en EE.UU. durante los años 60 fue un éxito completo». ¿Qué respondería Saborido?","opciones":["Que logró un 4,2% anual, pero a mediano plazo, potenciada por Vietnam, derivó en una inflación persistente.","Que fracasó desde el comienzo, porque los republicanos se negaron a usar el déficit para dinamizar la economía.","Que fue exitosa hasta 1973, ya que la inflación norteamericana apareció recién con la suba del petróleo.","Que su gran problema fue el desempleo provocado por la desmovilización de millones de soldados."],"correcta":0,"explicacion":"Con Kennedy y Johnson se aplicaron los principios keynesianos (política fiscal activa y uso sistemático del déficit, la «New Economics»): el crecimiento del 4,2% anual entre 1961 y 1969 fue la parte exitosa. Pero la consecuencia a mediano plazo, acelerada por la guerra de Vietnam, fue una inflación persistente que, para Saborido, selló el fracaso de esas técnicas; Nixon terminó suspendiendo la convertibilidad del dólar en 1971.","por_que_no":["","Confunde períodos: fueron los gobiernos republicanos de Eisenhower (años 50) los que no tuvieron una política consistente sobre la demanda; la New Economics fue demócrata.","Falso: cuando estalló la crisis del petróleo en 1973 la economía norteamericana ya estaba en serios problemas por la inflación.","Confunde períodos: la desmovilización fue en 1945-1946 y el desempleo no superó el 3,9% de la población activa."],"pag":"p. 373 (PDF p. 19)"},{"id":"sab-m7","tema":"P8","nivel":"muy_dificil","enunciado":"Considere estas afirmaciones sobre el bienestar y la intervención estatal en distintos países: I. En Gran Bretaña, el Estado se comprometió a que la desocupación no superara el 3% y a proteger a los ciudadanos durante toda su vida. II. En la RFA, los gobiernos conservadores antepusieron el gasto social al control de precios. III. En Francia, algunos planes se propusieron consolidar beneficios sociales para jubilados y asalariados de bajos ingresos. IV. En EE.UU., Eisenhower aceptó el papel social del gobierno federal, pero sin una política consistente sobre la demanda. ¿Cuáles son correctas según Saborido?","opciones":["Solo I y III","Solo I, III y IV","Solo II y IV","Solo I, II y III"],"correcta":1,"explicacion":"I es correcta: con fuertes aportes patronales, el Estado británico financió beneficios que protegían a los ciudadanos toda la vida y se comprometió a una desocupación máxima del 3%. III también: los planes franceses fueron desde la industria pesada hasta beneficios para jubilados y asalariados de bajos ingresos. IV describe la conducta «contradictoria» de Eisenhower. II es falsa: los conservadores alemanes privilegiaron precios y balanza de pagos en detrimento del gasto social.","por_que_no":["Omite IV, que también es correcta: así describe el texto la conducta de las administraciones de Eisenhower.","","Incluye II, que invierte la prioridad de los conservadores alemanes, y omite I y III.","Incluye II, que es falsa, y omite IV, que es correcta."],"pag":"pp. 373, 375, 377 (PDF pp. 19-21)"},{"id":"sab-m8","tema":"P8","nivel":"muy_dificil","enunciado":"Desde el enfoque marxista de Mandel, ¿qué consecuencia tuvo el creciente intervencionismo del Estado en el «capitalismo tardío»?","opciones":["La desaparición definitiva de las crisis, gracias a la planificación indicativa de la inversión privada.","Una caída de la tasa de ganancia, provocada por el peso de los impuestos destinados al gasto social.","Una inflación persistente, convertida en el mecanismo para sostener la demanda y ampliar la acumulación.","Una baja del valor de la fuerza de trabajo, causada por las prestaciones del Estado de bienestar."],"correcta":2,"explicacion":"Para Mandel, la extensión de las funciones del Estado y la tendencia a la inflación permanente están unidas. El Estado asume la «administración de la crisis» con políticas anticíclicas, y la consecuencia es un proceso inflacionario que se vuelve el mecanismo específico para sostener la demanda y facilitar la reproducción ampliada del capital, además de afrontar el aumento del gasto público.","por_que_no":["Mandel habla de una creciente propensión a crisis explosivas que el Estado debe administrar, no de su desaparición.","Contradice el planteo: la onda larga de posguerra se caracterizó por un aumento a largo plazo de la tasa de ganancia.","","Trampa de causas: la baja del valor de la fuerza de trabajo la atribuye a la dictadura nazi y a la coyuntura bélica, no al Estado de bienestar."],"pag":"pp. 371-372 (PDF p. 18)"},{"id":"sab-m9","tema":"P10","nivel":"muy_dificil","enunciado":"Si alguien afirmara que la Segunda Guerra Mundial aceleró el ritmo general del progreso técnico, ¿qué objetaría Saborido?","opciones":["Que los inventos bélicos casi no tuvieron aplicación civil, porque la economía de posguerra se apoyó en técnicas de entreguerras.","Que esos avances se habrían conseguido igual sin la guerra, porque la investigación privada ya los había puesto en marcha antes.","Que el progreso técnico se aceleró solo en el bando del Eje, gracias a sus sustitutos sintéticos del caucho y del petróleo.","Que el progreso se redirigió a ciertos campos, sin acelerarse en general, aunque la guerra fue clave para varios avances."],"correcta":3,"explicacion":"Saborido reconoce que la guerra afianzó la creencia de que los conflictos estimulan inventos (radar, cohetes, motores a reacción, penicilina), pero sostiene que no puede afirmarse que el ritmo general del progreso técnico aumentara: hubo una reorientación hacia ciertas áreas, como la aeronáutica, y la investigación de largo plazo quedó relegada. A la vez aclara que no es cierto que esos subproductos civiles se habrían obtenido igual sin la presión bélica.","por_que_no":["Falso: el texto destaca innovaciones, sobre todo las menos espectaculares (organización de plantas, automatización, gestión), que fueron importantes para la producción en tiempos de paz.","Es justamente lo que Saborido niega: no es cierto que esos subproductos civiles se habrían conseguido igual sin la presión de la guerra.","El texto no limita el avance al Eje: el esfuerzo de productividad se dio en los principales países combatientes de ambos bandos.",""],"pag":"pp. 346-347 (PDF pp. 5-6)"},{"id":"sab-m10","tema":"P10","nivel":"muy_dificil","enunciado":"Sobre las economías durante la Segunda Guerra Mundial, considere: I. Durante la Blitzkrieg, Alemania mantuvo casi sin cambios su producción de bienes de consumo. II. En Gran Bretaña, la intervención estatal llegó a suprimir el uso privado del automóvil. III. En EE.UU., la expansión benefició sobre todo a las pequeñas y medianas empresas. IV. En América Latina, EE.UU. desplazó a los europeos y la Argentina ganó mercados regionales para sus manufacturas. ¿Cuáles son correctas según Saborido?","opciones":["Solo I y II","Solo I, II y IV","Solo II, III y IV","Solo III y IV"],"correcta":1,"explicacion":"I es correcta: durante la Blitzkrieg Alemania conquistó casi toda Europa sin variaciones significativas en la producción de bienes de consumo y de armamentos. II también: la «guerra total» británica incluyó controles como la supresión del uso privado del auto. IV es correcta: EE.UU. ganó mercados latinoamericanos y la Argentina, por su mayor desarrollo, colocó exportaciones industriales en la región. III es falsa: los contratos de guerra favorecieron a las grandes corporaciones y marginaron a las pymes, lo que aumentó la concentración.","por_que_no":["Omite IV, que también es correcta según el apartado sobre la guerra y el mundo.","","Incluye III, que invierte el texto (las pymes quedaron marginadas), y omite I.","Incluye III, que es falsa, y deja afuera I y II, que son correctas."],"pag":"pp. 341-346 (PDF pp. 3-5)"}],"desarrollo":[{"id":"sab-d-n1","tema":"P8","nivel":"normal","consigna":"Según Saborido, ¿qué es el Estado de bienestar y qué funciones cumple? Desarrolle sus principales características.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Origen: más Estado tras los 30 y Guerra Fría","detalle":"Explica que la expansión capitalista de posguerra fue acompañada por una creciente presencia del Estado (ya visible en los años 30), en parte por el desafío del socialismo en la Guerra Fría.","peso":2,"indicios":[["guerra fria","socialis","comunis","depresion","entreguerras","crisis de los treinta","anos treinta"],["presencia","interven","welfare"]]},{"id":"b","punto":"Informe Beveridge y seguridad social","detalle":"Menciona el Informe Beveridge (1942) y su propuesta de un amplio sistema de seguridad social frente al desempleo, la enfermedad, los accidentes y la vejez.","peso":3,"indicios":[["beveridge","seguridad social"],["desemple","desocup","enfermedad","vejez","jubil","accidente"]]},{"id":"c","punto":"Intervención sobre empleo, demanda e inversión","detalle":"Señala que el Estado asumió tareas activas sobre los niveles de empleo, demanda e inversión (gasto público, medidas fiscales, pleno empleo), en la línea de Keynes.","peso":3,"indicios":[["empleo","ocupacion"],["demanda","inversion","gasto public","fiscal","keynes"]]},{"id":"d","punto":"Economía mixta: privados, Estado y sindicatos","detalle":"Define la economía mixta como relación entre sector privado, Estado y sindicatos, con nacionalizaciones de industrias básicas, organismos de planificación y participación obrera, apoyada en un amplio consenso.","peso":3,"indicios":[["mixta","sindicat","consenso"],["nacionaliz","planific","privad"]]},{"id":"e","punto":"De prevenir crisis a garantizar crecimiento","detalle":"Explica la evolución: de un acuerdo para evitar otra crisis como la del 30 a una estructura más ambiciosa que debía asegurar el crecimiento a largo plazo y que llegara a todos los sectores.","peso":2,"indicios":[["crecimiento","crecer"],["largo plazo","todos los sectores","toda la sociedad","distribu","llegara a todos","ambicios"]]},{"id":"f","punto":"Otros rasgos: Galbraith y redistribución","detalle":"Agrega rasgos como la planificación en lugar del mercado, la regulación de precios y salarios, la redistribución de ingresos o el Estado que forma mano de obra educada (Galbraith).","peso":1,"indicios":[["galbraith","planificacion en lugar","precios y salarios","redistribu","mano de obra educada","fuerza de trabajo educada","educacion"]]}],"respuesta_modelo":"Para Jorge Saborido, la gran expansión capitalista de 1945-1973 vino acompañada por una presencia creciente del Estado, ya visible en los años 30 y reforzada por la competencia con el socialismo en la Guerra Fría: de allí surge la expresión «Welfare State». En primer lugar, el Estado de bienestar protege: los gobiernos siguieron el Informe Beveridge (1942) y crearon amplios sistemas de seguridad social frente al desempleo, la enfermedad, los accidentes y la vejez. En segundo lugar, interviene en la economía: actúa sobre el empleo, la demanda y la inversión con gasto público y medidas fiscales, en la línea de Keynes, y persigue el pleno empleo. Se organiza como una «economía mixta» entre empresas privadas, Estado y sindicatos, con nacionalizaciones de industrias básicas, organismos de planificación y participación obrera, sostenida por un amplio consenso; además, redistribuye ingresos hacia los sectores más pobres. Por último, lo que empezó como un acuerdo para evitar otra crisis como la del 30 se volvió más ambicioso: asegurar el crecimiento a largo plazo y que llegara a todos los sectores.","errores_comunes":["Confundir el Estado de bienestar con la planificación centralizada del bloque soviético (allí no hay economía mixta con empresa privada).","Atribuir las nacionalizaciones al Informe Beveridge: en Gran Bretaña fueron el aporte específico de los laboristas.","Presentarlo como una medida transitoria de reconstrucción o del Plan Marshall, cuando Saborido lo describe como una estructura intervencionista que fue mucho más allá de sus planteos iniciales."],"pag":"pp. 351, 358-359 (PDF pp. 8, 11-12)"},{"id":"sab-d-n2","tema":"P8","nivel":"normal","consigna":"Según Saborido, ¿por qué aumentó la oferta de trabajo en los países occidentales después de 1945? Incluya el papel de las mujeres y de la educación.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Crecimiento natural de la población","detalle":"La población creció más rápido entre 1945 y 1970 que en los veinticinco años anteriores.","peso":2,"indicios":[["crecimiento natural","crecimiento de la poblacion","aumento de la poblacion","poblacion crec","poblacion aument","demograf"]]},{"id":"b","punto":"Incorporación masiva de las mujeres","detalle":"Explica que subió la tasa de actividad por la entrada masiva de mujeres al trabajo, favorecida por la baja de la natalidad y las mejores posibilidades educativas (de 30,4% a 36,3% de la fuerza laboral).","peso":3,"indicios":[["mujer","femenin"],["natalidad","hijos","tasa de actividad","poblacion activa","fuerza laboral","fuerza de trabajo"]]},{"id":"c","punto":"Migraciones internacionales","detalle":"Menciona las migraciones, sobre todo intraeuropeas (casi 6,5 millones de inmigrantes en la CEE en 1973; más del 10% de la población activa en Alemania y Francia).","peso":2,"indicios":[["migra","inmigra","extranjer"]]},{"id":"d","punto":"Absorción del desempleo encubierto del agro","detalle":"Señala el traspaso de trabajadores desde la agricultura (desempleo encubierto) hacia la industria y los servicios.","peso":2,"indicios":[["agro","agric","campo","rural","campesin"],["encubierto","traspas","atrae","atraer","salida","industria","servicios"]]},{"id":"e","punto":"Dimensión cualitati
