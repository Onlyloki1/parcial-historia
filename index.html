<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Segundo Parcial de Historia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: hoja de cuaderno cuadriculado (como los apuntes de Magui) con resaltador lila y rosa.
   Una sola columna de lectura (~48rem). Tarjetas solo donde hay algo para responder o corregir. */
:root{
  --paper:#F4F5FA; --grid:#E2E5EF; --card:#FFFFFF; --ink:#1B1F31; --ink2:#525971; --line:#D6DAE6;
  --lila:#6A45D6; --lila-ink:#FFFFFF; --lila-soft:#EEE8FF; --mark:rgba(150,110,255,.30);
  --rosa:#C42D6C; --rosa-soft:#FFE6F1; --rosa-mark:rgba(255,105,165,.30);
  --ok:#147548; --ok-soft:#DDF3E7; --warn:#8F5C00; --warn-soft:#FFF0D2; --bad:#BC2E37; --bad-soft:#FFE3E4;
  --shadow:0 1px 0 rgba(27,31,49,.04),0 10px 28px -18px rgba(27,31,49,.35);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --renglon:1.75rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11131B; --grid:#1B1F2C; --card:#191C28; --ink:#E8E9F1; --ink2:#A4AAC3; --line:#2B3146;
    --lila:#A98CFF; --lila-ink:#160F2E; --lila-soft:#2A2347; --mark:rgba(150,110,255,.34);
    --rosa:#FF7DB1; --rosa-soft:#3A1D2B; --rosa-mark:rgba(255,105,165,.26);
    --ok:#52CC8E; --ok-soft:#15301F; --warn:#F2B451; --warn-soft:#382A10; --bad:#FF7C83; --bad-soft:#3B1A1E;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 28px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11131B; --grid:#1B1F2C; --card:#191C28; --ink:#E8E9F1; --ink2:#A4AAC3; --line:#2B3146;
  --lila:#A98CFF; --lila-ink:#160F2E; --lila-soft:#2A2347; --mark:rgba(150,110,255,.34);
  --rosa:#FF7DB1; --rosa-soft:#3A1D2B; --rosa-mark:rgba(255,105,165,.26);
  --ok:#52CC8E; --ok-soft:#15301F; --warn:#F2B451; --warn-soft:#382A10; --bad:#FF7C83; --bad-soft:#3B1A1E;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16.5px; line-height:1.55;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--lila);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--line)}
@supports ((backdrop-filter:blur(6px)) or (-webkit-backdrop-filter:blur(6px))){
  .top{background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
}
.top-in,.wrap{max-width:48rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;padding-block:9px}
.marca{font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.01em;white-space:nowrap;background:none;border:0;padding:4px 0;cursor:pointer}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0;padding:2px}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:7px 11px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--ink2);white-space:nowrap;cursor:pointer}
.nav button:hover{color:var(--ink);background:var(--lila-soft)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}

.wrap{padding-block:22px 80px}
#app:focus{outline:none}

/* tipografía */
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.95rem,6vw,2.75rem);line-height:1.05;letter-spacing:-.025em;margin:.15em 0 .3em;text-wrap:balance}
.h-tema{font-size:clamp(1.6rem,5vw,2.25rem)}
h2,h3{text-wrap:balance}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:0}
.lead{font-size:1.04rem;color:var(--ink2);max-width:40rem;margin:.2em 0 .6em}
.hl{background:linear-gradient(100deg,transparent 1%,var(--mark) 3%,var(--mark) 97%,transparent 99%) 0 78%/100% 52% no-repeat;padding:0 .12em}
strong{font-weight:700;background:linear-gradient(transparent 60%,var(--mark) 60%);padding:0 .06em}
.nota-mano{font-family:var(--f-hand);font-size:1.5rem;line-height:1.15;color:var(--rosa);margin:.1em 0 0;display:inline-block;transform:rotate(-1.2deg);background:linear-gradient(transparent 58%,var(--rosa-mark) 58%);padding:0 .25em}
.sec{font-family:var(--f-display);font-size:1.15rem;font-weight:750;letter-spacing:-.01em;margin:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-meta{font-size:.85rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.bloque{margin-top:30px}
.bloque > .sec{margin-bottom:12px}
.pista{font-size:.88rem;color:var(--ink2);margin:.4em 0 0}
.pag{font-size:.82rem;color:var(--ink2);font-weight:400;white-space:nowrap}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.95rem;padding:10px 18px;min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:center}
.btn:hover{border-color:var(--lila)}
.btn.primario{background:var(--lila);border-color:var(--lila);color:var(--lila-ink)}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primario{color:var(--lila-ink)}
.btn.primario:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:default}
.link{border:0;background:none;padding:4px 0;color:var(--lila);font-weight:700;font-size:.9rem;cursor:pointer}
.link:hover{text-decoration:underline}
.volver{border:0;background:none;padding:6px 0;color:var(--ink2);font-weight:700;font-size:.92rem;cursor:pointer}
.volver:hover{color:var(--ink)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--lila-soft);color:var(--lila);line-height:1.5}
.chip.suave{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.dots{letter-spacing:1px;font-size:.7rem}
.chip-btn{font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.chip-btn:hover,.chip-btn[aria-pressed="true"]{border-color:var(--lila);background:var(--lila-soft);color:var(--lila)}

/* inicio */
.hero{padding-block:6px 4px}
.temas{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.tema{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:6px 14px;width:100%;text-align:left;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
.tema:hover{border-color:var(--lila)}
.tema-per{font-family:var(--f-display);font-weight:700;font-size:.95rem;color:var(--lila);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.tema-txt{min-width:0}
.tema-txt b{display:block;font-family:var(--f-display);font-weight:680;font-size:1.08rem;line-height:1.22;letter-spacing:-.005em}
.tema-txt small{display:block;color:var(--ink2);font-size:.86rem;margin-top:2px}
.tema-pie{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tag-seguro{font-family:var(--f-hand);font-size:1.2rem;line-height:1;color:var(--rosa);background:linear-gradient(transparent 55%,var(--rosa-mark) 55%);padding:0 4px}
.tag-menor{font-size:.74rem;font-weight:700;color:var(--ink2);border:1px dashed var(--line);border-radius:999px;padding:1px 8px}
.minis{display:flex;gap:10px}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.trk{display:inline-block;width:38px;height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.trk i{display:block;height:100%;background:var(--ok);border-radius:inherit}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:10px}
.tile{text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;gap:3px;align-content:start;cursor:pointer}
.tile:hover{border-color:var(--lila)}
.tile b{font-family:var(--f-display);font-size:1.06rem;font-weight:720}
.tile span{color:var(--ink2);font-size:.88rem;line-height:1.35}
.ia-linea{margin-top:28px;font-size:.88rem;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.ia-dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:.45em;background:var(--line)}
.ia-dot.on{background:var(--ok)}

/* niveles */
.niveles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nivel{display:grid;gap:2px;align-content:start;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;min-width:0}
.nivel:hover:not([disabled]){border-color:var(--lila)}
.nivel[disabled]{opacity:.45;cursor:default}
.nivel-lab{font-family:var(--f-display);font-weight:750;font-size:1.02rem}
.nivel-n{font-size:.84rem;color:var(--ink2)}
.nivel-meta{font-size:.8rem;font-weight:700;color:var(--ok)}
.nivel-meta.sin{color:var(--ink2);font-weight:400}

/* guía y resúmenes */
.guia{padding:14px 0 6px;border-top:1px dashed var(--line)}
.guia:first-of-type{border-top:0;padding-top:0}
.guia h3{font-family:var(--f-display);font-size:1.05rem;font-weight:700;margin:6px 0 6px;line-height:1.3}
.guia ul,.res-sec ul{margin:0;padding-left:1.15em}
.guia li,.res-sec li{margin:5px 0}
.ojo{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--rosa-soft);font-size:.93rem}
.ojo b{color:var(--rosa)}
.res-sec h3{font-family:var(--f-display);font-size:1.08rem;font-weight:720;margin:22px 0 6px;line-height:1.3}
.res-sec:first-of-type h3{margin-top:4px}
.indice{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.conceptos{display:grid;gap:12px;margin:0}
.conceptos dt{font-family:var(--f-display);font-weight:720;font-size:1rem}
.conceptos dd{margin:2px 0 0;color:var(--ink2)}
.crono{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.crono li{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:12px}
.crono b{font-family:var(--f-display);color:var(--lila);font-variant-numeric:tabular-nums}
.ex-card{display:grid;gap:6px;width:100%;text-align:left;padding:18px 20px;border-radius:18px;border:1.5px solid var(--lila);background:var(--lila-soft);cursor:pointer;box-shadow:var(--shadow)}
.ex-card:hover{border-width:2px;padding:17.5px 19.5px}
.ex-card b{font-family:var(--f-display);font-size:1.5rem;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.ex-card span{color:var(--ink)}
.ex-card .ex-card-eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--lila)}
.ex-card .ex-card-cta{margin-top:4px;font-weight:800;color:var(--lila)}
.ex-banner{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;padding:14px 16px;border-radius:14px;margin-bottom:14px}
.ex-banner b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.ex-banner span{font-family:var(--f-display);font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.resp[readonly]{opacity:.85}
.ex-cta{display:grid;gap:10px;justify-items:start;margin:-4px 0 14px;padding:14px 16px;border-radius:14px;border:1.5px dashed var(--lila);background:var(--card)}
.ex-cta p{margin:0}
.plan-lista li{padding:6px 10px;border-radius:10px}
.plan-lista li b{white-space:nowrap}
.plan-lista li span b{font-family:var(--f-body);color:var(--ink)}
.plan-lista li.hoy{background:var(--lila-soft)}
.hoy-tag{font-family:var(--f-hand);font-size:1.15rem;color:var(--rosa);font-weight:700;margin-left:2px}
.autores{display:grid;gap:10px}
.autor-card{display:grid;gap:3px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;box-shadow:var(--shadow)}
.autor-card:hover{border-color:var(--lila)}
.autor-card b{font-family:var(--f-display);font-size:1.12rem;font-weight:750}
.autor-card span{font-size:.92rem}
.autor-card small{color:var(--ink2);font-size:.84rem}

/* preguntas */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.quiz-cont{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.barra{height:6px;border-radius:99px;background:var(--grid);overflow:hidden;margin-bottom:16px}
.barra i{display:block;height:100%;background:var(--lila);border-radius:inherit;transition:width .25s ease}
.enunciado{font-family:var(--f-body);font-size:1.1rem;font-weight:700;line-height:1.45;margin:12px 0 16px}
.ops{display:grid;gap:9px}
.op{display:grid;grid-template-columns:1.9rem minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;padding:12px 14px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;line-height:1.45;transition:border-color .12s,background-color .12s}
.op:hover:not([disabled]){border-color:var(--lila)}
.op[disabled]{cursor:default}
.op-l{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-display);font-weight:750;font-size:.9rem;margin-top:-1px}
.op-t{min-width:0}
.op-i{font-weight:800;font-size:1.05rem;padding-top:1px}
.op-sel{border-color:var(--lila);background:var(--lila-soft)}
.op-sel .op-l{background:var(--lila);border-color:var(--lila);color:var(--lila-ink)}
.op-ok{border-color:var(--ok);background:var(--ok-soft)}
.op-ok .op-l{background:var(--ok);border-color:var(--ok);color:var(--card)}
.op-ok .op-i{color:var(--ok)}
.op-mal{border-color:var(--bad);background:var(--bad-soft)}
.op-mal .op-l{background:var(--bad);border-color:var(--bad);color:var(--card)}
.op-mal .op-i{color:var(--bad)}
.op-off{opacity:.6}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--line);animation:entra .18s ease-out}
.fb p{margin:.35em 0}
.fb-tit{font-family:var(--f-display);font-weight:780;font-size:1.08rem;margin:0 0 4px!important}
.fb-tit span{font-family:var(--f-body);font-weight:400;font-size:.95rem;color:var(--ink2)}
.fb-ok .fb-tit{color:var(--ok)}
.fb-mal .fb-tit{color:var(--bad)}
.pqn{margin-top:8px}
.pqn summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--lila)}
.pqn ul{margin:6px 0 0;padding-left:1.1em;font-size:.94rem}
.pqn li{margin:5px 0}
.pqn li.tuya{color:var(--bad)}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.quiz-nav .btn.primario{margin-left:auto}
.crono-sim{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* resultado */
.resultado{padding:4px 0 8px}
.score{font-family:var(--f-display);margin:.1em 0 0;line-height:1}
.score b{font-size:4.2rem;font-weight:800;letter-spacing:-.03em}
.score span{font-size:1.6rem;color:var(--ink2);font-weight:700;margin-left:4px}
.score-pct{font-size:1.02rem;margin:.5em 0 0}
.rev{border-top:1px solid var(--line);padding:10px 0}
.rev summary{cursor:pointer;display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:8px;align-items:start;font-weight:700;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev .ic{font-weight:800}
.rev .ic.ok{color:var(--ok)} .rev .ic.mal{color:var(--bad)}
.rev-body{padding:8px 0 4px 2.2rem;font-size:.95rem}
.rev-body p{margin:.35em 0}
.rev-op{display:block;margin:3px 0;padding:6px 10px;border-radius:8px;background:var(--paper)}
.rev-op.ok{background:var(--ok-soft)} .rev-op.mal{background:var(--bad-soft)}
.tabla-wrap{overflow-x:auto}
.tabla{width:100%;border-collapse:collapse;font-size:.92rem}
.tabla th,.tabla td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tabla td.num,.tabla th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* desarrollo */
.consigna .enunciado{font-size:1.12rem}
.resp{display:block;width:100%;margin-top:16px;min-height:calc(var(--renglon)*10 + 1.2rem);padding:.6rem 16px;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:1.02rem;line-height:var(--renglon);resize:vertical;
  background-color:var(--card);
  background-image:repeating-linear-gradient(transparent 0,transparent calc(var(--renglon) - 1px),var(--grid) calc(var(--renglon) - 1px),var(--grid) var(--renglon));
  background-position:0 .6rem;background-attachment:local}
.resp:focus{outline:none;border-color:var(--lila)}
.resp-meta{font-size:.84rem;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.cargando{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--lila-soft);color:var(--ink)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--mark);border-top-color:var(--lila);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
.aviso{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:.95rem}
.corr{margin-top:18px;animation:entra .2s ease-out}
.corr-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.veredicto{font-family:var(--f-display);font-weight:800;font-size:1.1rem;padding:5px 14px;border-radius:999px}
.v-ok{background:var(--ok-soft);color:var(--ok)} .v-warn{background:var(--warn-soft);color:var(--warn)} .v-bad{background:var(--bad-soft);color:var(--bad)}
.nota{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink2)}
.nota b{font-size:1.7rem;color:var(--ink);font-weight:800}

<script type="application/json" id="banco">{"generado":"2026-10-28 13:28","autores":[{"id":"aldcroft","autor":"Derek H. Aldcroft","obra":"Las consecuencias económicas de la guerra y de la paz (1919-1929)","temas":["P1","P2"],"resumen":[{"titulo":"Introducción: una década de esperanzas frustradas","puntos":["Aldcroft analiza la década de 1920 en **cuatro temas**: la paz y el nuevo mapa europeo, Alemania y las **reparaciones**, el **restablecimiento del statu quo** y los **problemas estructurales**.","La década terminó en desesperación. Con **Keynes** —ingenuo en lo político, pero certero en lo económico—, Aldcroft lo explica porque los políticos no vieron que la guerra había destrozado un mecanismo internacional frágil ni que la economía anterior a 1914 ya era inestable.","Lo peor fue creer que bastaba con volver al **libre comercio y el patrón oro**: esa idea equivocada guió toda la década."],"pags":"p. 45"},{"titulo":"Los tratados de paz y el nuevo mapa de Europa","puntos":["Tesis central: lo que más trabó la reinserción económica de Europa no fueron la destrucción física ni las muertes, sino las **consecuencias de largo plazo de los tratados de paz** y las reacciones que provocaron.","Los tratados buscaron seguridad, castigaron a los vencidos y produjeron la mayor **remodelación territorial** de la historia europea. Ironía: el principio de **Wilson** (Estados para grupos étnicos homogéneos) dejó Estados con mezclas de nacionalidades y litigios fronterizos.","Más grave que lo étnico fue la **desintegración** de Europa central: el desmembramiento de **Austria-Hungría** y de su mercado común dejó Estados débiles y un **vacío de poder**, semilla de la próxima guerra.","Ese vacío lo ocupó **Alemania**, y no por accidente: pesaron el desastre de **Versalles**, su afán de recuperar territorios y expandirse al Este y la pasividad franco-británica (tras **Locarno, 1925**, Gran Bretaña se desentendió del Este)."],"pags":"pp. 45-47"},{"titulo":"Europa central y oriental: reconstruir sin ayuda","puntos":["Los **Estados sucesores** sumaron a su **«atraso gigantesco»** la pérdida del mercado imperial y fronteras sin criterio económico, y tuvieron que crear administraciones y economías nacionales desde cero.","Se cortaron **vías de comunicación** y lazos comerciales, los centros industriales quedaron separados de sus materias primas y mercados, y las rutas se llenaron de aranceles.","Sin plan de reconstrucción (los aliados se retiraron y **Estados Unidos** no ocupó el vacío), los países recurrieron a **inflación, depreciación y regulación del comercio exterior**, con aranceles más altos que antes de la guerra.","Para Aldcroft, la **financiación inflacionaria** de gobiernos débiles tuvo **costos mayores que sus beneficios**: estímulo inicial, luego empresas ineficientes y especulación; y al estabilizar (como en Alemania), recesión y desempleo.","En 1925 la producción industrial seguía bajo 1913 (Polonia –37%, Hungría –23%, Rumania –8%). Solo **Checoslovaquia** creció (un tercio sobre la preguerra): heredó valiosas industrias del Imperio y reformó pronto finanzas y moneda. La reconstrucción terminó haciéndose con **créditos extranjeros**, nueva amenaza para la estabilidad."],"pags":"p. 46"},{"titulo":"Alemania y la cuestión de las reparaciones","puntos":["Alemania, aunque vencida, conservaba un enorme potencial. **Sanciones**: pérdidas territoriales y de activos, control de seguridad (desmilitarización, ocupación de zonas clave) y **reparaciones**.","Aunque las exigencias luego se redujeron, la carga en apariencia imposible y la **cláusula de culpabilidad** generaron desde el inicio un fuerte **resentimiento** contra los vencedores.","Con **Fischer**: el problema de las reparaciones se sobrevaloró; no faltaba capacidad productiva sino **disposición política y psicológica** para aceptar la culpa y pagar. Los pagos del **Plan Dawes (1924)** no superaban, en promedio, el 2% de la renta nacional.","Lo decisivo fue lo previo a Dawes: una carga muy pesada (20.000 millones de marcos-oro antes de mayo de 1921, más del 10% de la renta; luego, con el **calendario de Londres**, 3.000 millones anuales, el 5-6%). **Holtfrerich** calcula 13.200 millones pagados en 1919-1922 (cerca del 10% de la renta), cifra que Aldcroft cree exagerada aunque igual muy alta.","Los aliados no tenían un plan común: **Francia** quería seguridad y compensación; **Gran Bretaña**, duras exacciones en privado y moderación en público (temía la competencia alemana); **Estados Unidos** vacilaba y no quiso vincular reparaciones y **deudas de guerra**."],"pags":"p. 47"},{"titulo":"Reparaciones, inflación y crisis de Weimar","puntos":["La resistencia a pagar tomó la forma de mostrar que era imposible hacerlo **emitiendo dinero** (idea de comienzos de 1919); según Holtfrerich, ningún gobierno podía pagar sin inflación. El marco se derrumbó en **1923**, con el **Ruhr ocupado** por Francia y Bélgica.","Sobre los efectos económicos hay debate (algunos la ven como estímulo frente a la deflación anglosajona), pero Aldcroft prefiere la **visión convencional**: con la crisis que siguió al estabilizar y el estancamiento, retrasó años la normalización.","Hay más acuerdo sobre lo político: la inflación borró los **ahorros de la clase media** (casi 31 millones de cuentas en **bonos, pensiones, bancos y seguros**) y, sin compensación justa para los acreedores, ese sector rompió con los partidos burgueses de centro y derecha.","Resultado: escisión de partidos, inestabilidad de **Weimar** y beneficio para la **extrema derecha**: el **Mittelstand** aportó probablemente más de la mitad del voto nazi."],"pags":"pp. 47-48"},{"titulo":"El restablecimiento del statu quo: el patrón oro","puntos":["La reconstrucción se descuidó porque la prioridad era restaurar el **orden liberal del siglo XIX** (sin controles, libre comercio y **patrón oro**, objeto de una fe «casi mística»), no por simple falta de cooperación ni por total incompetencia, como cree Silverman.","Aldcroft duda de que el oro de preguerra fuera tan estabilizador: su aparente éxito dependía de la armonía entre países y del **liderazgo británico**, y se ignoraron los cambios de 1914-1920 (costos y precios, debilidad británica, Estados Unidos acreedor).","Se buscaba salir del caos de los **tipos de cambio flotantes** de comienzos de los veinte, asociado a la inflación y visto como el mayor obstáculo para la recuperación.","Pero se restauró mal: sin plan (a diferencia de la segunda posguerra), cada país por separado y sin mirar costos y precios relativos → **paridades desequilibradas** (francos francés y belga subvaluados; libra, lira y corona sueca sobrevaluadas). Para la Sociedad de Naciones, esa improvisación sembró la desintegración posterior.","Para Condliffe fue un «gesto inútil»: faltaban las condiciones. Pocos aceptaban las **reglas del juego** (sacrificar la estabilidad interna al equilibrio externo) y no hubo **líder hegemónico**: París miraba sus intereses, Nueva York estaba ausente y Londres, débil.","El sistema fue **fuente de inestabilidad**: no explica por sí solo la caída de 1929, pero **propagó la depresión** mediante la deflación hasta su abandono a comienzos de los años treinta."],"pags":"pp. 48-49"},{"titulo":"La respuesta a los problemas estructurales","puntos":["Más trascendentes fueron los problemas estructurales: para **Svennilson**, entreguerras fue una larga **crisis de transformación estructural**, la «arteriosclerosis» de una economía vieja e inflexible.","En el Este pesaba una agricultura ineficiente; en el Oeste, la concentración en **industrias básicas** y la lenta aparición de sectores nuevos.","La guerra lo agravó: amplió sectores tradicionales por encima de las necesidades de paz (la capacidad mundial de construcción naval casi se duplicó) y sumó pérdida de mercados y **sustitución de importaciones** → **exceso de capacidad**, desempleo y mercados en decadencia.","En **Alemania**, bancos, agrarios e industria pesada, con apoyo estatal, prefirieron cárteles, aranceles y subsidios a reestructurarse; el país perdió competitividad y sus exportaciones de maquinaria cayeron.","Según el **Cuadro 1**, **Suecia y EE.UU.** reorientaron sus exportaciones a maquinaria (44% de las estadounidenses hacia 1929); en el resto de Europa los cambios fueron marginales. Había **dos influencias adversas**: Europa no competía en los sectores en expansión de los países ricos y perdía ventas de los sectores en declive por la sustitución de importaciones en los más pobres.","Gran Bretaña fue la más golpeada (textiles, ineficiencia, libra cara desde 1925); Francia zafó más por su moneda subvaluada que por dinamismo."],"pags":"pp. 49-50"},{"titulo":"La decadencia de Europa","puntos":["La guerra quebró la supremacía europea: el **centro de gravedad económico** pasó al oeste y Europa tardaría medio siglo en reafirmarse. Entre 1913 y 1929 bajó del 58,9% al 48% de las exportaciones mundiales (manufacturas: del 81,5% al 67,3%), y Alemania, Reino Unido, Francia y Bélgica, del 37,5% al 29,5% de la producción manufacturera mundial.","La guerra en sí explica solo una parte: pesaron más sus **secuelas** y las **políticas** (tratados, reparaciones y deudas, estabilización monetaria, falta de un plan coordinado), que frenaron el crecimiento y el cambio estructural.","La estabilidad de fines de los veinte fue una **«armonía superficial»** (Sally Marks): muchos países vivían de **capital prestado** y eran vulnerables a los shocks externos; de ahí los traumas de las dos décadas siguientes."],"pags":"p. 50"}],"conceptos":[{"termino":"Vacío de poder","def":"Situación de Europa central y oriental tras el desmembramiento de Austria-Hungría: una zona de Estados débiles que, según Aldcroft, tarde o temprano ocuparía una potencia depredadora (Alemania). Allí ubica la semilla de la Segunda Guerra."},{"termino":"Estados sucesores","def":"Estados nuevos o reconstituidos sobre los restos del Imperio austro-húngaro (Polonia, Checoslovaquia, Austria, Hungría, Yugoslavia). Heredaron atraso, minorías y fronteras sin lógica económica, y debieron crear administraciones y economías nacionales desde cero."},{"termino":"Cláusula de culpabilidad","def":"Disposición de la paz que cargó a Alemania con la responsabilidad de la guerra. Junto con una carga que parecía imposible, generó desde el principio un vivo resentimiento alemán contra los vencedores."},{"termino":"Reparaciones","def":"Pagos impuestos a Alemania por los daños de la guerra. Para Aldcroft, con Fischer, su aparente insolubilidad era un problema de disposición política y psicológica más que de capacidad de pago, aunque antes del Plan Dawes la carga fue muy pesada."},{"termino":"Plan Dawes (1924)","def":"Arreglo de las reparaciones cuyos pagos, cumplidos sobre todo desde 1925, eran modestos: no superaban, en promedio, el 2% de la renta nacional y estaban al alcance de Alemania. Para el autor, lo decisivo fue lo ocurrido antes de este plan."},{"termino":"Financiación inflacionaria","def":"Recurso de gobiernos débiles a la emisión y la depreciación de la moneda para cubrir déficits y licuar las demandas privadas sobre los recursos. Estimuló al principio, pero según Aldcroft sus costos superaron a sus beneficios."},{"termino":"Mittelstand","def":"La clase media alemana, donde se concentraba la mayor parte de los acreedores y ahorristas. Perdió sus ahorros con la inflación, no fue compensada, rompió con los partidos burgueses y probablemente aportó más de la mitad del voto nazi."},{"termino":"Restablecimiento del statu quo","def":"Prioridad de los gobiernos de los años veinte: volver cuanto antes al orden liberal del siglo XIX (sin controles, libre comercio y patrón oro). Para Aldcroft, por eso se descuidaron la reconstrucción y el cambio estructural."},{"termino":"Patrón oro de posguerra","def":"Sistema de tipos de cambio fijos basados en el oro, objeto de una fe «casi mística». Restaurado en los años veinte sin coordinación y con paridades desequilibradas, fue más fuente de inestabilidad que de estabilidad y propagó la depresión."},{"termino":"Tipos de cambio flotantes","def":"Régimen caótico de comienzos de los años veinte, asociado a la inflación, que dificultaba el comercio y la planificación. La creencia de que era el principal obstáculo para la recuperación impulsó la vuelta a los tipos fijos."},{"termino":"Reglas del juego","def":"Lógica del patrón oro de preguerra: sacrificar la estabilidad interna (precios, empleo) para sostener el equilibrio externo. En los años veinte pocos países estaban dispuestos a aceptarlas."},{"termino":"Líder hegemónico","def":"País capaz de conducir el sistema monetario internacional, como Gran Bretaña antes de 1914. En los años veinte faltó: París defendía sus intereses, Nueva York era un líder ausente y Londres estaba demasiado débil."},{"termino":"Crisis de transformación estructural","def":"Idea de Svennilson que Aldcroft adopta: el período de entreguerras como una larga crisis de adaptación de una economía europea vieja, muy capitalizada e inflexible ante cambios bruscos (la «arteriosclerosis» europea)."},{"termino":"Exceso de capacidad productiva","def":"Herencia de la guerra: siderurgia, construcción naval, carbón, ingeniería y agricultura se expandieron por encima de las necesidades de la paz, lo que dejó capacidad ociosa, desempleo y mercados en decadencia (en el carbón pesaron además la caída de la demanda y los combustibles sustitutos)."},{"termino":"Sustitución de importaciones","def":"Producción local, tanto en países nuevos como viejos, de bienes que antes se compraban a Europa; en textiles, sobre todo en los países en desarrollo (Asia y América latina). Golpeó sobre todo a Gran Bretaña, pero también a Alemania, Francia y los países más pequeños."}],"cronologia":[{"fecha":"1914-1918","hecho":"Primera Guerra Mundial: se expanden sectores tradicionales (la capacidad mundial de construcción naval casi se duplica), origen del exceso de capacidad de posguerra."},{"fecha":"1917","hecho":"Alemania tiene casi 31 millones de cuentas de ahorro (más de 25.000 millones de marcos), que la inflación posterior borrará en su mayor parte."},{"fecha":"Comienzos de 1919","hecho":"En Alemania se propone protestar contra las reparaciones demostrando, mediante la emisión de dinero, que es imposible pagarlas."},{"fecha":"1919","hecho":"Tratados de paz: mayor remodelación del mapa europeo; sanciones a Alemania (territorios, desmilitarización, reparaciones, cláusula de culpabilidad)."},{"fecha":"1919-1921","hecho":"Fuertes fases de auge y depresión en los países anglosajones agravan las dificultades de Europa."},{"fecha":"1919-1922","hecho":"Según Holtfrerich, Alemania paga 13.200 millones de marcos-oro, cerca del 10% de su renta (Aldcroft cree exagerada la cifra, aunque igual era una suma muy alta)."},{"fecha":"Mayo de 1921","hecho":"Vence el plazo inicial para pagar 20.000 millones de marcos-oro (más del 10% de la renta); el calendario de Londres reduce la carga a una anualidad de 3.000 millones (5-6% de la renta)."},{"fecha":"1922","hecho":"Se hunde el pacto aliado; la cooperación aliada ya se había esfumado poco después del fin de la guerra. Aldcroft aclara que eso no alcanza para explicar el descuido de la reconstrucción."},{"fecha":"1923","hecho":"Ocupación del Ruhr por Francia y Bélgica (pretexto: incumplimiento de pagos); hundimiento definitivo del marco."},{"fecha":"1924","hecho":"Plan Dawes: pagos de reparaciones modestos, que no superaban en promedio el 2% de la renta nacional; se cumplieron sobre todo desde 1925."},{"fecha":"1925","hecho":"Locarno: Gran Bretaña cree contenidas las ambiciones alemanas y se desentiende del Este. La producción de Europa central y oriental sigue bajo 1913; desde ese año, la libra cara perjudica las exportaciones británicas."},{"fecha":"1929","hecho":"Balance de la década: Europa cae del 58,9% (1913) al 48% de las exportaciones mundiales. Comienza la depresión; el patrón oro no es su único culpable, pero la propaga."},{"fecha":"Comienzos de los años treinta","hecho":"Hundimiento general del patrón oro; algunos países apenas se habían estabilizado formalmente poco antes."}],"guia":[{"tema":"P1","pregunta":"Según Aldcroft, ¿cuáles fueron las consecuencias económicas de la Primera Guerra Mundial (y de la paz) en Europa?","puntos":["**Tesis**: lo más grave no fue la destrucción física ni la pérdida de población, sino los efectos de largo plazo de los **tratados de paz** y de las políticas de posguerra (la guerra en sí explica solo una parte del retroceso).","**Nuevo mapa**: mayor remodelación territorial de la historia; desmembramiento de **Austria-Hungría** y de su mercado común → Estados débiles y heterogéneos, fronteras sin lógica económica, comunicaciones y comercio cortados, aranceles.","**Vacío de poder** en Europa central y oriental → lo termina ocupando Alemania → semilla de la Segunda Guerra.","**Sin plan de reconstrucción** (aliados retirados, EE.UU. no ocupa el vacío): los países recurren a **inflación, depreciación y control del comercio exterior**; aranceles más altos (autarquía). Costos > beneficios: en 1925 la producción sigue bajo 1913 (Polonia –37%, Hungría –23%, Rumania –8%). Excepción: **Checoslovaquia** (un tercio más que en la preguerra), porque heredó industria del Imperio y reformó pronto finanzas y moneda. Reconstrucción final con créditos extranjeros (nueva amenaza).","**Alemania y reparaciones** (ver P2): resentimiento por Versalles, emisión de dinero e hiperinflación en 1923.","**Restablecimiento del statu quo**: prioridad de volver al orden liberal del siglo XIX y al **patrón oro** (fe «casi mística»), para salir del caos de los **tipos de cambio flotantes** y la inflación. Pero se restauró sin plan (al revés que tras la Segunda Guerra), país por país y sin mirar costos y precios → paridades desequilibradas (libra sobrevaluada; francos francés y belga subvaluados); solo seis países recuperaron su paridad de preguerra (Reino Unido, Suecia, Países Bajos, Suiza, Dinamarca, Noruega). Sin **líder hegemónico** ni **reglas del juego** → fuente de inestabilidad; propagó la depresión de 1929. Condliffe: «gesto inútil»; Sociedad de Naciones: la improvisación sembró la desintegración posterior.","**Problemas estructurales** (Svennilson): exceso de capacidad (naval, siderurgia, ingeniería, carbón, agricultura); en el textil, el golpe fue la sustitución de importaciones (Asia, América latina) y la competencia japonesa. **Dos influencias adversas**: no poder competir en los sectores en expansión de los países ricos + sustitución de importaciones en los sectores en declive de los países más pobres. **Cuadro 1**: Suecia y EE.UU. se pasan a maquinaria y equipos (44% de las exportaciones de EE.UU., un tercio de las suecas); en el resto de Europa los cambios son marginales. Resistencia de grupos de interés (Alemania).","**Decadencia de Europa**: exportaciones mundiales 58,9% → 48% (1913-1929); producción manufacturera de Alemania, Reino Unido, Francia y Bélgica 37,5% → 29,5%; el centro de gravedad pasa al oeste; prosperidad de fines de los veinte superficial (capital prestado, vulnerabilidad) → traumas de las dos décadas siguientes."],"ojo":"Tus apuntes dicen «inflación, patrón oro»: está bien, pero en Aldcroft la inflación de P1 es sobre todo la de Europa central y oriental (Checoslovaquia fue la excepción), y el patrón oro no es una consecuencia directa de la guerra sino la respuesta equivocada: el intento de volver al statu quo de preguerra. No digas que lo principal fue la destrucción material, ni que la vuelta al oro estabilizó Europa, ni que el patrón oro causó por sí solo la crisis de 1929 (sí la propagó). Los tipos de cambio flotantes son el problema de comienzos de los veinte que motivó la vuelta al oro, no la solución. El textil no sufrió por exceso de capacidad sino por la sustitución de importaciones. Y ojo con el Cuadro 1: para Alemania da 49,5% de exportaciones en sectores en decadencia (1913), así que no afirmes que superaba la mitad."},{"tema":"P2","pregunta":"Según Aldcroft, ¿qué consecuencias políticas y económicas tuvieron para Alemania la guerra, el Tratado de Versalles y las reparaciones?","puntos":["**Sanciones de Versalles**: pérdidas territoriales y de activos, control de seguridad (desmilitarización, ocupación de zonas clave) y **reparaciones**. Aun así, Alemania conservaba un enorme potencial.","**Cláusula de culpabilidad** + carga que parecía imposible → **resentimiento** contra los vencedores desde el principio (aunque después las exigencias se redujeran).","**Reparaciones**: con Fischer, el problema se sobrevaloró; no faltaba capacidad productiva sino **disposición política y psicológica**. Los pagos del Plan Dawes (1924) no superaban en promedio el 2% de la renta. Pero antes de Dawes la carga era muy pesada: 20.000 millones de marcos-oro (más del 10% de la renta); Londres 1921: 3.000 millones anuales (5-6%); según Holtfrerich, en 1919-1922 se pagaron 13.200 millones (cerca del 10%), cifra que Aldcroft cree exagerada pero igual muy alta.","**Aliados divididos**: Francia (seguridad y compensación), Gran Bretaña (duras exacciones en privado, moderación en público; temía la competencia alemana), EE.UU. (vacilante, no liga reparaciones con deudas de guerra) → Alemania sin apoyo.","**Reparaciones → inflación**: la protesta se hace emitiendo dinero (idea propuesta ya a comienzos de 1919); con Holtfrerich, ningún gobierno podía pagar sin inflación, por las sanciones aliadas y el riesgo de desintegración del Reich; **1923**: ocupación del **Ruhr** y hundimiento del marco.","**Efectos económicos**: hay debate, pero Aldcroft adhiere a la visión convencional: crisis posterior a la estabilización, crecimiento débil, retraso de varios años; Alemania no fue «locomotora» de Europa.","**Efectos políticos**: destrucción de los ahorros de la clase media (31 millones de cuentas; bonos, **pensiones**, bancos, seguros), sin compensación → resentimiento → ruptura con los partidos burgueses → inestabilidad de **Weimar** → extrema derecha; el **Mittelstand** fue probablemente más de la mitad del voto nazi.","**Largo plazo**: Versalles + deseo de recuperar territorios y expandirse al Este + pasividad franco-británica (Locarno) → Alemania ocupa el vacío del Este. **Estructural**: cárteles, aranceles y subsidios en vez de reestructurar → pérdida de competitividad; cayeron sus exportaciones de maquinaria y no alcanzó los volúmenes exportados de preguerra; sufrió sustitución de importaciones y desventajas competitivas, con pérdidas en casi todos los mercados salvo los de países no industrializados."],"ojo":"Tus apuntes mezclan cosas. «Se dificultan los transportes»: en Aldcroft el corte de vías de comunicación y de comercio se refiere a los Estados surgidos de Austria-Hungría, no a Alemania. «Tipo de cambio flotante» y «patrón oro»: son problemas de toda Europa (el caos de los tipos flotantes de comienzos de los veinte motivó la vuelta al oro); para Alemania lo pertinente es la estabilización tras la hiperinflación y la crisis que le siguió. «Inflación (se desregulan los $)»: decí emisión de dinero o financiación inflacionaria ligada a las reparaciones, con colapso del marco en 1923. «Pensiones»: son parte de los ahorros destruidos de la clase media → resentimiento → voto a la extrema derecha. «Conflictos económicos»: usalo para las discrepancias entre aliados y la ocupación del Ruhr. NO digas que las reparaciones eran impagables (Aldcroft lo relativiza), ni que el Plan Dawes causó la hiperinflación (es posterior), ni que la inflación fue beneficiosa (es la mirada de otros historiadores)."}],"mc":[{"id":"ald-n1","tema":"P1","nivel":"normal","enunciado":"Según Aldcroft, ¿qué fue lo que más dificultó la reincorporación de Europa a la economía internacional después de la Primera Guerra Mundial?","opciones":["La destrucción física de fábricas, campos e infraestructura, que dejó al continente sin capacidad suficiente para producir.","Los efectos duraderos de las condiciones fijadas en la paz y de las reacciones que esas condiciones despertaron.","La pérdida de población, cuyos efectos de largo plazo redujeron la mano de obra disponible durante toda la década.","La Gran Depresión de 1929, que cortó de golpe una recuperación europea que para entonces estaba prácticamente consolidada."],"correcta":1,"explicacion":"Aldcroft admite que la destrucción material y las muertes fueron las consecuencias más visibles y graves, pero aclara que no fueron las más significativas. Lo que trabó el regreso de Europa al circuito económico internacional fueron los efectos de largo plazo de lo dispuesto en la paz y las reacciones que eso provocó.","por_que_no":["Es la versión de sentido común: el autor dice que la destrucción física, aunque grave y evidente, no fue lo más significativo.","","Trampa de palabras: usa «largo plazo», que el texto aplica a los tratados, para hablar de la pérdida de población, que Aldcroft no considera el factor principal.","Período equivocado: para Aldcroft la recuperación de los años veinte fue débil y la prosperidad de fines de la década, superficial."],"pag":"p. 45"},{"id":"ald-n2","tema":"P2","nivel":"normal","enunciado":"Alemania nunca terminó pagando lo que los aliados le exigieron al principio. ¿Por qué, según Aldcroft, eso no cambió demasiado las cosas?","opciones":["Porque en 1922, cuando se rompió la alianza entre los vencedores, estos le condonaron formalmente la deuda que quedaba pendiente.","Porque gracias a la inflación pudo cancelar la totalidad de las reparaciones con marcos que casi no tenían valor.","Porque las sumas reclamadas eran tan bajas que nunca llegaron a pesar de verdad sobre la renta nacional alemana.","Porque la carga en apariencia imposible y la atribución de la culpa ya habían generado un hondo rencor hacia los vencedores."],"correcta":3,"explicacion":"Los sucesivos gobiernos alemanes consiguieron reducir las reparaciones y nunca se pagó lo exigido al principio, pero para Aldcroft eso «carecía de importancia» porque el perjuicio ya se había producido. Haberle exigido a Alemania algo que parecía imposible y atribuirle la culpa de la guerra hizo que el pueblo alemán sintiera, desde el comienzo, un vivo resentimiento contra los vencedores.","por_que_no":["Trampa de fechas: 1922 es el año en que se hundió el pacto aliado, pero el texto no habla de ninguna condonación; las reparaciones siguieron (Plan Dawes, 1924).","Confunde la relación: la emisión de dinero fue una forma de resistirse a pagar y terminó en el hundimiento del marco en 1923, no en la cancelación de las reparaciones.","Contradice el texto: la exigencia inicial (20.000 millones de marcos-oro antes de mayo de 1921) equivalía a más del 10% de la renta, y aun el calendario de Londres suponía el 5-6%; solo los pagos de Dawes eran modestos.",""],"pag":"p. 47"},{"id":"ald-n3","tema":"P2","nivel":"normal","enunciado":"Según Aldcroft, ¿cuál fue la consecuencia política de largo plazo de la inflación alemana sobre la que existe mayor acuerdo entre los historiadores?","opciones":["Minó el apoyo burgués a Weimar: la clase media, sin sus ahorros, dejó a los partidos tradicionales y favoreció a la extrema derecha.","Fortaleció a los partidos de centro, que ganaron votos al compensar con un plan justo a los ahorristas perjudicados por la inflación.","Impulsó el crecimiento del comunismo, apoyado sobre todo por obreros industriales que habían perdido buena parte de sus salarios reales.","Consolidó la república, porque al licuar la deuda pública facilitó el pago de las reparaciones y alivió la carga de los contribuyentes."],"correcta":0,"explicacion":"Aunque los efectos económicos de la inflación siguen en discusión, Aldcroft señala mayor acuerdo sobre sus consecuencias políticas de largo plazo. Al borrar los ahorros de la clase media y media baja (bonos, pensiones, depósitos, seguros) y sin compensación justa para los acreedores, la inflación generó resentimiento, ruptura con los partidos burgueses de centro y derecha, escisión partidaria e inestabilidad; la gran beneficiaria fue la extrema derecha.","por_que_no":["","Invierte el texto: lo que hubo fue un fracaso en compensar a los acreedores, y eso alejó a la clase media de los partidos tradicionales.","Actor equivocado: el texto habla de la clase media (Mittelstand) y de la extrema derecha, no de obreros ni del comunismo.","Mitad bien, mitad mal: la inflación estuvo ligada a las reparaciones, pero Aldcroft la considera un factor de desintegración política de Weimar, no de consolidación."],"pag":"p. 48"},{"id":"ald-n4","tema":"P1","nivel":"normal","enunciado":"Según Aldcroft, ¿por qué los políticos de los años veinte descuidaron la verdadera tarea de reconstruir Europa?","opciones":["Porque, como sostiene Silverman, eran completamente incapaces de comprender los problemas económicos de su tiempo.","Porque tras el derrumbe del pacto aliado de 1922 desapareció cualquier posibilidad de cooperar entre los países.","Porque su prioridad era recomponer cuanto antes el orden liberal del siglo XIX, con libre comercio y patrón oro.","Porque preferían una reconstrucción dirigida por el Estado antes que confiar en los mecanismos del mercado."],"correcta":2,"explicacion":"Aldcroft descarta que el descuido de la reconstrucción se explique solo por la falta de cooperación internacional o por la incompetencia de los políticos (tesis de Silverman). La clave es que la prioridad política era restaurar lo antes posible el sistema económico liberal mundial del siglo XIX: ausencia de controles, libre comercio y, sobre todo, patrón oro, al que se le tenía una fe «casi mística».","por_que_no":["Atribución equivocada: esa es la explicación de Silverman, que Aldcroft menciona justamente para tomar distancia.","Aldcroft aclara que la falta de cooperación no alcanza como explicación, aunque el pacto aliado se hundiera en 1922.","","Lo contrario de lo que dice el texto: buscaban volver a un orden liberal, sin controles, no una reconstrucción estatal planificada."],"pag":"p. 48"},{"id":"ald-n5","tema":"P1","nivel":"normal","enunciado":"¿Qué balance hace Aldcroft de la inflación y la depreciación monetaria a las que recurrió la mayor parte de Europa central y oriental después de la guerra?","opciones":["Fueron dañinas desde el primer momento, porque frenaron de entrada la producción, las exportaciones y el empleo de la región.","Primero reactivaron la actividad, las ventas externas y el empleo, pero al descontrolarse sus costos superaron a sus beneficios.","Resultaron positivas, porque la industrialización que impulsaron elevó la producción de la zona por encima del nivel de 1913.","Eran casi inevitables y, además, permitieron resolver los problemas estructurales de fondo que arrastraba la región."],"correcta":1,"explicacion":"Aldcroft dice explícitamente que, en su opinión, los costos fueron superiores a los beneficios. Reconoce que en un primer momento la inflación y la depreciación dieron impulso a la producción, a las ventas al exterior y al empleo, pero una vez fuera de control generaron empresas ineficientes, exceso de capacidad y especulación, y la estabilización posterior trajo recesión y desempleo. En 1925 la producción de la zona seguía muy por debajo de 1913.","por_que_no":["Ignora el matiz del autor: reconoce que al principio la inflación estimuló la actividad, las exportaciones y el empleo.","","Contradice los datos: en 1925 la producción industrial de la zona seguía por debajo de 1913 (Polonia –37%, Hungría –23%) y la industrialización forzada dio empresas ineficientes.","Mitad bien, mitad mal: había pocas alternativas, pero Aldcroft dice que esas medidas apenas podían hacer algo contra los problemas estructurales."],"pag":"p. 46"},{"id":"ald-n6","tema":"P2","nivel":"normal","enunciado":"En el debate sobre si Alemania podía pagar las reparaciones, ¿qué postura adopta Aldcroft, apoyándose en Fischer?","opciones":["Que eran impagables, porque la guerra había dejado a Alemania sin capacidad productiva para generar esas sumas.","Que eran pagables desde el principio, porque lo exigido hasta 1921 no llegaba al 2% de la renta nacional alemana.","Que podían pagarse sin mayores dificultades hasta 1923, cuando la ocupación del Ruhr paralizó la economía alemana.","Que la traba era de actitud más que económica: faltaba voluntad política y psicológica de asumir la culpa y pagar."],"correcta":3,"explicacion":"Siguiendo a Fischer, Aldcroft afirma que el problema de las reparaciones se sobrevaloró: su aparente insolubilidad no venía de que Alemania careciera de potencial productivo, sino de que no había voluntad política ni psicológica de asumir la culpa de la guerra y pagar. Lo muestra el Plan Dawes: sus pagos no superaban en promedio el 2% de la renta y estaban dentro de las posibilidades del país.","por_que_no":["Es la versión escolar que Aldcroft corrige: Alemania conservaba un enorme potencial productivo; lo que faltaba era voluntad de pagar.","Trampa de cifras: el 2% corresponde a los pagos del Plan Dawes (1924); lo exigido al principio superaba el 10% de la renta nacional.","Contradice el texto: los alemanes resistieron desde el principio (ya a comienzos de 1919 se proponía mostrar con la emisión que no se podía pagar); 1923 es el hundimiento definitivo del marco, no el comienzo de los problemas.",""],"pag":"p. 47"},{"id":"ald-d1","tema":"P1","nivel":"dificil","enunciado":"Aldcroft describe que se cortaron las vías de comunicación y los lazos comerciales, que los centros industriales quedaron separados de sus materias primas y que las viejas rutas se llenaron de aranceles. ¿A qué caso se refiere?","opciones":["A Alemania, que tras las pérdidas territoriales de Versalles vio desarticulado su sistema de transportes y su comercio.","A la cuenca del Ruhr durante la ocupación franco-belga de 1923, que la aisló comercialmente del resto de Alemania.","A los Estados surgidos del reparto del Imperio austro-húngaro, que debían armar economías nacionales nuevas.","A Gran Bretaña, cuyas industrias básicas perdieron los mercados de exportación que abastecían antes de la guerra."],"correcta":2,"explicacion":"La descripción corresponde a los Estados sucesores del Imperio austro-húngaro, que además de reconstruirse tuvieron que crear administraciones y economías nacionales a partir de territorios heterogéneos. El desmembramiento del Imperio y de su mercado común cortó comunicaciones y vínculos comerciales, separó industrias de sus materias primas y mercados y llenó las rutas de aranceles. No es un argumento sobre Alemania.","por_que_no":["Trampa típica: el corte de comunicaciones y comercio no lo plantea para Alemania sino para la Europa central y oriental surgida de Austria-Hungría.","El Ruhr aparece en el texto por la ocupación de 1923 y el hundimiento del marco, no por la ruptura de rutas comerciales.","","Mezcla secciones: la pérdida de mercados británica pertenece a los problemas estructurales, no a la desintegración territorial."],"pag":"p. 46"},{"id":"ald-d2","tema":"P2","nivel":"dificil","enunciado":"Aldcroft sostiene que antes del Plan Dawes los aliados no tenían un criterio común sobre Alemania. ¿Cuál de las siguientes describe correctamente la postura de Estados Unidos?","opciones":["Veía útil reactivar a Alemania, pero, como no le era vital, evitó intervenir y rechazó vincular reparaciones y deudas de guerra.","Buscaba ante todo protegerse de Alemania y cobrar una compensación importante, por lo que no quería fomentar su reconstrucción.","Mantenía un doble discurso sobre las reparaciones: en privado exigía fuertes exacciones y en público se mostraba moderado.","Encabezó desde 1919 un plan coordinado de reconstrucción europea que incluía condonar buena parte de las reparaciones alemanas."],"correcta":0,"explicacion":"Según Aldcroft, Estados Unidos tuvo un papel vacilante: entendía la importancia de reactivar la economía alemana para el comercio mundial y el propio, pero como no era crucial para su economía se resistió a inmiscuirse en los asuntos europeos. Su postura sobre las reparaciones era moderada, casi indiferente, y lo más significativo fue su negativa a vincularlas con las deudas de guerra interaliadas.","por_que_no":["","Actor equivocado: esa es la postura que el texto atribuye a Francia.","Actor equivocado: el doble discurso (duro en privado, moderado en público) es el de Gran Bretaña.","Contradice el texto: no hubo ningún intento serio de planificar la reconstrucción y Estados Unidos no quiso ocupar el vacío político."],"pag":"p. 47"},{"id":"ald-d3","tema":"P2","nivel":"dificil","enunciado":"Sobre los efectos económicos de la inflación alemana hay un debate entre historiadores. ¿Qué posición toma Aldcroft?","opciones":["Se suma a la revisión reciente: la inflación sostuvo la actividad y el empleo mejor que la deflación anglosajona y su saldo fue positivo.","Coincide con Maier en que las pérdidas y las ganancias de bienestar se compensan, y por eso evita pronunciarse sobre el balance.","La juzga negativa sobre todo porque impidió a Alemania cumplir con los pagos fijados por el Plan Dawes a partir de 1924.","Cree más acertada la visión tradicional: por la crisis tras estabilizar la moneda y el estancamiento siguiente, retrasó la normalización."],"correcta":3,"explicacion":"Aldcroft expone tres posturas: historiadores recientes que valoran el estímulo de la inflación frente a la deflación anglosajona, Maier (balance ambiguo) y Hardach (versión pesimista). Concluye que la visión convencional se acerca más a la verdad si se tienen en cuenta la crisis que llegó tras estabilizar y el estancamiento relativo de los años veinte: la inflación retrasó varios años la normalidad y no mejoró la estabilidad.","por_que_no":["Atribución equivocada: esa es la mirada de algunos historiadores recientes, que Aldcroft expone pero no comparte.","Atribución equivocada: el balance ambiguo es el de Maier; Aldcroft sí toma posición, a favor de la visión convencional.","Mitad bien, mitad mal: la juzga negativa, pero no por el Plan Dawes, que es posterior a la hiperinflación y cuyos pagos (no más del 2% de la renta, en promedio) estaban al alcance del país.",""],"pag":"p. 47"},{"id":"ald-d4","tema":"P1","nivel":"dificil","enunciado":"Según Aldcroft, más allá de las cuestiones de prestigio, ¿cuál era la razón de mayor peso para querer volver a tipos de cambio fijos basados en el oro?","opciones":["Que Francia e Italia buscaban heredar la posición preeminente que la City de Londres había tenido en las finanzas.","La idea de que el desorden de los tipos flotantes, unido a la inflación, era la mayor traba para la recuperación.","Que los tipos fijos permitirían a cada país manejar su política monetaria para combatir el desempleo interno.","Que era una maniobra para asegurar la hegemonía angloamericana en las finanzas, tal como el propio Aldcroft sostiene."],"correcta":1,"explicacion":"Aldcroft enumera varios motivos: para Francia e Italia el patrón oro era un símbolo de prestigio y para Gran Bretaña una forma de preservar la posición de la City de Londres. Pero el motivo de más peso era una convicción muy extendida: que el desorden de los tipos de cambio flotantes de comienzos de los años veinte, unido a la inflación, era la principal barrera para la recuperación y la estabilidad internacional.","por_que_no":["Mezcla actores: para Francia e Italia el oro era un símbolo de prestigio; preservar la City de Londres era el interés británico.","","Lo contrario: los tipos fijos obligaban a subordinar la política interna al equilibrio externo, justamente lo que después pocos países quisieron aceptar.","Aldcroft menciona esa idea como una insinuación ajena y aclara que, aparte de ella, había razones fundadas; no es su tesis."],"pag":"p. 48"},{"id":"ald-d5","tema":"P1","nivel":"dificil","enunciado":"Según Aldcroft, ¿cuál de los siguientes factores NO contribuyó a las dificultades de las industrias básicas europeas en los años veinte?","opciones":["La destrucción de instalaciones durante la guerra, que dejó una capacidad de producción inferior a la que pedía el mercado.","La ampliación, durante el conflicto, de sectores como la construcción naval y la siderurgia más allá de lo que requería la paz.","La sustitución de importaciones en países nuevos y viejos, que achicó los mercados para las exportaciones europeas.","La resistencia al cambio de grupos de interés y las trabas institucionales, que demoraron la reestructuración."],"correcta":0,"explicacion":"Aldcroft describe lo contrario de una falta de capacidad: la guerra expandió sectores tradicionales por encima de las necesidades de paz (la capacidad mundial de construcción naval casi se duplicó, y a mediados de los veinte la capacidad siderúrgica europea era un 50% mayor que en 1913, aunque la producción siguió por debajo de la preguerra). A esa expansión se sumaron mercados perdidos, producción local que reemplazó importaciones europeas y la resistencia al cambio: el saldo fue exceso de capacidad, desempleo y mercados en decadencia.","por_que_no":["","Sí contribuyó: es el origen del exceso de capacidad productiva que Aldcroft describe.","Sí contribuyó: el texto la menciona entre las consecuencias de la guerra que golpearon a las industrias básicas.","Sí contribuyó: el autor dice que los intereses creados y las trabas institucionales frenaron el ritmo del cambio."],"pag":"p. 49"},{"id":"ald-d6","tema":"P2","nivel":"dificil","enunciado":"¿Cómo explica Aldcroft que Alemania no recuperara en los años veinte la competitividad internacional que tenía antes de la guerra?","opciones":["Por el peso de los pagos del Plan Dawes, que absorbieron la mayor parte de la renta que podía destinarse a invertir.","Porque sus bancos financiaron en exceso a las nuevas industrias de consumo, lo que generó sobreinversión y quiebras.","Porque bancos, agrarios e industria pesada, con apoyo oficial, eludieron reestructurarse con cárteles, aranceles y subsidios.","Porque sus mayores pérdidas se dieron en los mercados de los países no industrializados, que eran su destino más importante."],"correcta":2,"explicacion":"Para Aldcroft, en Alemania los bancos, los intereses agrarios y la gran industria pesada defendieron el statu quo con apoyo del gobierno. Industria y agricultura respondieron con medidas defensivas (cartelización, aranceles, subvenciones) para evitar una reestructuración a fondo, y los bancos prefirieron prestar a las industrias tradicionales; así, Alemania no se adaptó a los cambios provocados por la guerra y perdió competitividad.","por_que_no":["Contradice el texto: los pagos del Plan Dawes no superaban en promedio el 2% de la renta alemana.","Invierte el texto: los bancos prefirieron financiar a las industrias tradicionales antes que a las nuevas en expansión.","","Contradice el texto: Alemania perdió terreno en la mayoría de los mercados, excepto justamente en los de los países no industrializados."],"pag":"p. 49"},{"id":"ald-md1","tema":"P1","nivel":"muy_dificil","enunciado":"Aldcroft analiza la inflación de posguerra tanto en Europa central y oriental como en Alemania. ¿Cuál de las siguientes afirmaciones vale, según el texto, para los dos casos?","opciones":["Se originó en la obligación de pagar reparaciones a los vencedores, que llevó a financiar esos pagos con emisión.","Fue evitada gracias a una estabilización temprana, que después permitió un crecimiento industrial sostenido.","Según el autor, su saldo final fue favorable, porque sostuvo la actividad y el empleo mejor que la deflación.","Cuando por fin se estabilizó la moneda, siguió una etapa de freno de la actividad y aumento del desempleo."],"correcta":3,"explicacion":"Para Europa central y oriental, Aldcroft dice que cuando por fin se estabilizó y se recuperó el manejo financiero —«como en el caso de Alemania»— sobrevino una reacción: la actividad se frenó y aumentó el desempleo. Para Alemania, menciona la crisis que siguió a la estabilización monetaria y el estancamiento relativo de la década. Las demás opciones valen solo para uno de los casos o para ninguno.","por_que_no":["Vale solo para Alemania: en Europa central y oriental el autor vincula la inflación con dificultades presupuestarias, baja capacidad productiva y gobiernos débiles, no con reparaciones.","Vale solo para Checoslovaquia, la excepción de la región; no para el resto de Europa central y oriental ni para Alemania.","No vale para ninguno: en el Este los costos superaron a los beneficios y, para Alemania, Aldcroft prefiere la visión convencional negativa.",""],"pag":"pp. 46-47"},{"id":"ald-md2","tema":"P2","nivel":"muy_dificil","enunciado":"Según Aldcroft, el vacío de poder de Europa central y oriental podía haberlo ocupado cualquiera de las grandes potencias. ¿Cómo explica el autor que terminara ocupándolo Alemania?","opciones":["Confluyeron el golpe que significó Versalles, la ocupación del Ruhr en 1923 —germen directo de la nueva guerra— y la inacción de Francia y Gran Bretaña.","Confluyeron el golpe que significó Versalles, el afán alemán de recuperar territorios y avanzar hacia el Este, y la inacción de Francia y Gran Bretaña.","Confluyeron el afán alemán de avanzar hacia el Este, la debilidad de los nuevos Estados y el abandono francés, pese a que Gran Bretaña los respaldó tras Locarno.","Confluyeron el golpe que significó Versalles, la debilidad de los nuevos Estados y el ascenso de Hitler, sin el cual no habrían quedado como satélites alemanes."],"correcta":1,"explicacion":"Aldcroft dice que no fue un simple accidente: era casi inevitable que la potencia depredadora fuese Alemania por el desastre de Versalles, su deseo de recuperar los territorios perdidos y expandirse hacia el Este (visible ya en los años veinte) y la incapacidad o renuncia de Francia y Gran Bretaña a encarar la cuestión del Este. Tras Locarno, Gran Bretaña se desentendió de la región; y sus Estados eran tan débiles que serían satélites alemanes «con Hitler o sin él».","por_que_no":["Mete la tesis de Schmidt: Aldcroft ubica la semilla de la guerra en el vacío de poder del Este, no en el conflicto del Ruhr.","","Invierte el papel británico: tras Locarno, Gran Bretaña creyó contenidas las ambiciones alemanas y se desentendió del Este; no respaldó a esos Estados.","Contradice al autor: por su debilidad, esos Estados iban a ser satélites alemanes con Hitler o sin él; el factor decisivo no fue Hitler."],"pag":"pp. 45-47"},{"id":"ald-md3","tema":"P1","nivel":"muy_dificil","enunciado":"Considere estas afirmaciones sobre el patrón oro en el análisis de Aldcroft:\nI) El autor duda de que antes de 1914 fuera tan estabilizador como creían los contemporáneos, y atribuye su éxito a la armonía entre los principales países y a la conducción británica.\nII) En los años veinte, las paridades se fijaron país por país y en momentos distintos, sin considerar cómo habían cambiado los costos y precios relativos desde 1914.\nIII) En la posguerra, Nueva York reemplazó a Londres como líder efectivo del sistema y aseguró su funcionamiento.\nIV) Una vez iniciada la depresión, el patrón oro amortiguó su difusión, porque obligaba a los países adheridos a sostener sus precios.\n¿Cuáles son correctas según el autor?","opciones":["Solo I y II","Solo I, II y IV","Solo II y III","Solo I, III y IV"],"correcta":0,"explicacion":"I y II son correctas: Aldcroft duda de que el sistema de preguerra fuera tan estabilizador y atribuye su éxito a la armonía entre los países y al liderazgo británico; y critica que en los años veinte cada país estabilizara por separado, sin referencia a los cambios en costos y precios desde 1914. III es falsa porque el sistema quedó sin líder (Nueva York fue un líder «absentista»), y IV es falsa porque, según Friedman y Schwartz, el patrón oro reforzó la transmisión de la depresión mediante la deflación.","por_que_no":["","Incluye IV, que invierte el texto: el patrón oro no amortiguó sino que propagó la depresión a través de la deflación interna.","Incluye III, que es falsa (Nueva York fue un líder ausente), y deja afuera I, que es correcta.","Incluye III y IV, ambas falsas, y omite II, que es una de las críticas centrales del autor a la restauración."],"pag":"pp. 48-49"},{"id":"ald-md4","tema":"P1","nivel":"muy_dificil","enunciado":"Aldcroft conecta la forma en que se fijaron los tipos de cambio en los años veinte con el desempeño exportador de algunos países. ¿Cuál de las siguientes afirmaciones expresa correctamente esa conexión?","opciones":["El franco sobrevaluado frenó las ventas francesas, mientras que una libra barata permitió a Gran Bretaña sostener sus exportaciones textiles.","Para Aldcroft el valor de las monedas no influyó: el desempeño exportador dependió de la composición sectorial de cada economía.","La libra cara agravó las pérdidas británicas, mientras que Francia logró un resultado aceptable más por su franco barato que por dinamismo.","El franco subvaluado le permitió a Francia reorientar sus exportaciones hacia maquinaria y equipos, como habían hecho Suecia y EE.UU."],"correcta":2,"explicacion":"En la parte monetaria, Aldcroft señala que la estabilización dejó subvaluados los francos francés y belga y sobrevaluadas la libra, la lira y la corona sueca. En la parte estructural lo conecta con las exportaciones: Gran Bretaña fue la más perjudicada, entre otras cosas por el tipo de cambio elevado desde 1925, y Francia obtuvo un resultado aceptable, pero más por la subvaloración de su moneda que por el dinamismo de su economía.","por_que_no":["Invierte las valuaciones: el franco quedó subvaluado y la libra, sobrevaluada.","Contradice el texto: el autor menciona expresamente el tipo de cambio elevado británico desde 1925 y la moneda subvaluada francesa como factores.","","Mitad bien, mitad mal: el franco estaba subvaluado, pero la reorientación hacia maquinaria fue propia de Suecia y EE.UU.; en la mayoría de Europa los cambios fueron marginales."],"pag":"pp. 48 y 50"},{"id":"ald-md5","tema":"P1","nivel":"muy_dificil","enunciado":"Si alguien sostuviera que hacia 1929 Europa ya había completado su reconstrucción y que solo un shock externo inesperado, la Gran Depresión, la desvió de ese camino, ¿qué le objetaría Aldcroft?","opciones":["Que la reconstrucción ni siquiera había empezado, porque los países se negaron a estabilizar sus monedas en toda la década.","Que el shock no fue externo: la caída de 1929 se explica por la rigidez del patrón oro, verdadero origen de la Gran Depresión.","Que la recuperación fue sólida y que el retroceso europeo se explica sobre todo por la destrucción material de la guerra.","Que la estabilidad de esos años fue superficial: persistían problemas de fondo y muchos países vivían de préstamos."],"correcta":3,"explicacion":"Aldcroft, citando a Sally Marks, sostiene que la mayor estabilidad de los últimos años de la década fue poco más que una «armonía superficial» y una prosperidad aparente. Persistían problemas profundamente arraigados, muchos países vivían de capitales prestados (la reconstrucción se había hecho con créditos extranjeros) y Europa seguía muy vulnerable a las perturbaciones externas; por eso vincula los traumas de las dos décadas siguientes con lo ocurrido en los años veinte.","por_que_no":["Exagera en sentido contrario: hubo estabilización monetaria (tardía y desordenada) y una recuperación más sostenida al final de la década.","Aldcroft considera cuestionable atribuir la caída de 1929 solo al patrón oro y deja los orígenes de la depresión como otra historia.","Contradice la conclusión del autor: la guerra en sí explica solo una parte del retroceso; pesaron más sus secuelas y las políticas.",""],"pag":"p. 50"},{"id":"ald-md6","tema":"P2","nivel":"muy_dificil","enunciado":"¿Cuál de las siguientes es la descripción más fiel al texto de Aldcroft sobre el vínculo entre las reparaciones y la inflación alemana?","opciones":["Frente a una carga juzgada inaceptable, se pagó y se protestó emitiendo dinero, y el marco colapsó en 1923, con el Ruhr ocupado.","Alemania no tenía capacidad productiva para generar esas sumas, así que emitir era la vía técnica inevitable para cumplir con los pagos.","El marco se mantuvo estable hasta 1923: la inflación recién nació con la ocupación del Ruhr, que paralizó a la industria alemana.","Fueron los pagos elevados que fijó el Plan Dawes los que, al superar las posibilidades del país, desataron la hiperinflación."],"correcta":0,"explicacion":"Aldcroft explica que la suma exigida era muy elevada y los alemanes no estaban dispuestos a aceptarla: fracasada la protesta verbal, se buscó probar públicamente la imposibilidad de pagar mediante la emisión. Con Holtfrerich, afirma que, amenazado por las sanciones aliadas y por la desintegración del Reich, ningún gobierno podía pagar sin inflación. El hundimiento definitivo del marco llegó en 1923, durante la ocupación del Ruhr.","por_que_no":["","Mitad bien, mitad mal: Holtfrerich sí dice que ningún gobierno podía pagar sin inflación, pero por la presión política (sanciones aliadas y riesgo de desintegración del Reich), no por falta de capacidad productiva, que Aldcroft descarta con Fischer.","Error de cronología: la inflación venía de antes (ya a comienzos de 1919 se proponía resistir emitiendo dinero); en 1923 se produjo el hundimiento definitivo, no el comienzo.","Error de cronología y de magnitud: el Plan Dawes es de 1924, posterior a la hiperinflación, y sus pagos (no más del 2% de la renta, en promedio) eran modestos."],"pag":"p. 47"}],"desarrollo":[{"id":"ald-d-n1","tema":"P1","nivel":"normal","consigna":"Según Aldcroft, ¿cuáles fueron las principales consecuencias económicas de la Primera Guerra Mundial y de los tratados de paz para Europa en la década de 1920? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"No la destrucción física, sino la paz","detalle":"Aclarar que, para Aldcroft, lo que más trabó la recuperación no fue la destrucción material ni la pérdida de población, sino los efectos de largo plazo de los tratados de paz y de las respuestas que generaron.","peso":3,"indicios":[["largo plazo","respuestas","reacciones","duradera","duradero","disposiciones"],["no fue","no fueron","mas que","mas significativ","no tanto","menos grave"]]},{"id":"b","punto":"Nuevo mapa y desintegración de Europa central","detalle":"El desmembramiento de Austria-Hungría creó Estados débiles y heterogéneos, sin lógica económica: se perdió el mercado común, se cortaron comunicaciones y comercio y quedó un vacío de poder.","peso":3,"indicios":[["austro","austria","habsburgo","imperio","sucesor","nuevos estados"],["desmembr","fragment","mercado","comunicac","vacio","frontera","debil"]]},{"id":"c","punto":"Inflación y depreciación sin plan de reconstrucción","detalle":"Sin un plan aliado de reconstrucción, muchos países recurrieron a inflación, depreciación de la moneda, controles y aranceles; según el autor, los costos superaron a los beneficios.","peso":2,"indicios":[["inflac","depreci","emision"],["sin plan","ningun plan","no hubo un plan","abandon","arancel","costo","perjuic","checoslov"]]},{"id":"d","punto":"Vuelta desordenada al patrón oro","detalle":"Se priorizó restablecer el statu quo (libre comercio y patrón oro), pero con paridades fijadas sin coordinación y desequilibradas, sin líder hegemónico: el sistema fue fuente de inestabilidad.","peso":2,"indicios":[["patron oro","patron de oro","tipo de cambio","tipos de cambio","statu quo"],["desequilib","coordin","paridad","sobrevalu","subvalu","lider","sin plan","separado"]]},{"id":"e","punto":"Problemas estructurales y exceso de capacidad","detalle":"La guerra agravó problemas estructurales: exceso de capacidad en industrias tradicionales (naval, siderurgia, ingeniería, carbón, agricultura), desempleo y sustitución de importaciones, que golpeó sobre todo al textil.","peso":2,"indicios":[["estructur","capacidad","industrias basicas","tradicional","naval","siderur","carbon"],["exceso","desemple","sustituc","decaden","ineficien"]]},{"id":"f","punto":"Decadencia de Europa en el mundo","detalle":"Europa perdió peso (del 58,9% al 48% de las exportaciones mundiales entre 1913 y 1929) y el centro de gravedad se corrió hacia el oeste; la prosperidad de fines de los veinte fue superficial.","peso":1,"indicios":[["decaden","declive","supremac","perdio peso","retroce","cayo","descend"],["export","gravedad","superficial","oeste","medio siglo"]]}],"respuesta_modelo":"Para Aldcroft, la peor herencia de la Primera Guerra Mundial no fue la destrucción física ni la pérdida de población, sino las consecuencias de largo plazo de los tratados de paz y de las reacciones que provocaron. El nuevo mapa desmembró el Imperio austro-húngaro: surgieron Estados débiles y heterogéneos, con fronteras sin lógica económica, que perdieron su mercado común y vieron cortadas sus comunicaciones y rutas comerciales. Como no hubo un plan de reconstrucción, cada país se arregló con inflación, depreciación y aranceles, y para el autor los costos superaron a los beneficios. Los gobiernos priorizaron volver al statu quo de preguerra con el patrón oro, pero lo restauraron sin coordinación y con paridades desequilibradas, lo que generó inestabilidad. La guerra también agravó problemas estructurales: exceso de capacidad en industrias tradicionales, agricultura ineficiente y desempleo. El resultado fue la decadencia de Europa: su parte de las exportaciones mundiales cayó del 58,9% al 48% entre 1913 y 1929, y la prosperidad de fines de la década fue superficial.","errores_comunes":["Decir que lo principal fue la destrucción material de la guerra: Aldcroft dice expresamente que no fue lo más significativo.","Presentar la vuelta al patrón oro como la solución que estabilizó Europa: para el autor fue parte del problema (paridades desequilibradas, sin líder, fuente de inestabilidad).","Atribuir a Alemania los problemas de comunicaciones y de fronteras sin sentido económico, que el texto plantea para los Estados surgidos de Austria-Hungría.","Afirmar que la inflación fue beneficiosa en el balance: Aldcroft sostiene que sus costos superaron a los beneficios."],"pag":"pp. 45-50"},{"id":"ald-d-n2","tema":"P2","nivel":"normal","consigna":"Según Aldcroft, ¿qué consecuencias políticas y económicas tuvieron para Alemania el Tratado de Versalles y la cuestión de las reparaciones? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Sanciones del tratado","detalle":"Nombrar las sanciones: pérdidas territoriales y de activos, control de seguridad (desmilitarización y ocupación de zonas clave) y reparaciones por los daños de la guerra.","peso":2,"indicios":[["territor","activo"],["desmilitar","ocupacion de zonas","control de seguridad","sancion"]]},{"id":"b","punto":"Culpabilidad y resentimiento","detalle":"La cláusula de culpabilidad y una carga que parecía imposible generaron desde el inicio un fuerte resentimiento alemán contra los vencedores, aunque después las exigencias se redujeran.","peso":3,"indicios":[["clausula","culpabilidad","culpable","culpa"],["resentim","rencor","humill","odio","hostil","bronca","enojo"],["vencedor","clausula","imposib","aliad"]]},{"id":"c","punto":"Reparaciones: problema más político que de capacidad","detalle":"Siguiendo a Fischer, el problema no era la falta de potencial productivo sino la falta de disposición política y psicológica a pagar; los pagos del Plan Dawes (1924) no superaban en promedio el 2% de la renta.","peso":2,"indicios":[["voluntad","disposic","psicolog","dawes","fischer","sobrevalor"]]},{"id":"d","punto":"Reparaciones, emisión e hiperinflación","detalle":"La resistencia a pagar se tradujo en emisión de dinero: ningún gobierno podía pagar sin inflación, y el marco se hundió en 1923, con la ocupación del Ruhr.","peso":3,"indicios":[["inflac","emisi","emiti","imprimi","maquinita"],["ruhr","hiperinflac","hundimiento del marco","colapso del marco"]]},{"id":"e","punto":"Ahorros de la clase media destruidos","detalle":"La inflación borró los ahorros de la clase medi
