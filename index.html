ortaciones.","por_que_no":["Atribuye al FMI una decisión que el texto adjudica a los bancos y a las condiciones del mercado.","Mezcla etapas: las tasas casi negativas son de mediados de los 70; a comienzos de los 80 los préstamos cortos eran caros.","","Anacronismo: el Plan Brady es de fines de los 80, y los bonos cupón cero servían como garantía del nuevo servicio, no como préstamos cortos."],"pag":"pp. 199-200, 208-209"},{"id":"mar4-m4","tema":"P9","nivel":"muy_dificil","enunciado":"Marichal compara la fragilidad de los bancos globales en los años 80 con la crisis de 2008. ¿Qué distinción establece?","opciones":["Que en 1982, a diferencia de 2008, los gobiernos dejaron quebrar a los grandes bancos para no premiar su imprudencia al prestarles a los países deudores.","Que en ambos casos los gobiernos salieron a sostener a los bancos, pero 1982 fue una crisis de deudas soberanas, sin pánico bursátil ni hipotecario.","Que en 1982 el problema eran las hipotecas latinoamericanas en manos de bancos del centro, y en 2008, en cambio, las deudas de los Estados.","Que las dos fueron pánicos bursátiles, aunque el de 1982 se originó en la periferia y el de 2008 en el mercado inmobiliario estadounidense."],"correcta":1,"explicacion":"El autor advierte que la debilidad de los bancos globales en los 80 recuerda a la crisis contemporánea y que la intervención activa de los gobiernos para impedir su quiebra tiene similitudes con 2008. Pero subraya que en 1982 se trataba de una crisis de “deudas soberanas”, sin pánicos bursátiles ni hipotecarios en Estados Unidos ni en Europa; el paralelo con los bancos cargados de activos hipotecarios dudosos es solo parcial.","por_que_no":["Contradice el texto: fue esencial que los gobiernos intervinieran activamente para ayudar a los bancos e impedir su bancarrota.","","Invierte los términos: las deudas soberanas son las de 1982, y los activos hipotecarios dudosos, los de la crisis reciente.","Error: Marichal insiste en que en 1982 no hubo pánicos bursátiles; el problema eran las deudas de los Estados."],"pag":"pp. 214-215, 220"},{"id":"mar4-m5","tema":"P9","nivel":"muy_dificil","enunciado":"Según Marichal, apoyado en Altimir y Devlin, ¿qué explica el “éxito” de los acreedores en la renegociación de las deudas después de 1982?","opciones":["Un prestamista de última instancia informal (G-7, grandes bancos y FMI) que postergó moratorias y evitó pérdidas a los acreedores.","La unidad de los deudores latinoamericanos, que negociaron en bloque y lograron que los bancos aceptaran quitas desde la primera ronda.","La recuperación de los precios de las materias primas a mediados de los 80, que permitió pagar los intereses sin aplicar ajustes fiscales.","La decisión de los bancos de vender enseguida sus bonos a otros inversores, gracias a la garantía de los bonos cupón cero del Tesoro."],"correcta":0,"explicacion":"Altimir y Devlin hablan del surgimiento de un “mecanismo internacional de préstamos de última instancia” (MIPUI), una novedad en las finanzas internacionales que permitió aplazar incumplimientos y moratorias formales y que los acreedores evitaran las pérdidas típicas de las crisis sistémicas. Marichal lo describe como una especie de cartel de la banca, sostenido por acuerdos informales entre el G-7, los grandes bancos comerciales y los bancos multilaterales, sobre todo el FMI.","por_que_no":["","Invierte la lógica: los acreedores aislaron a los deudores y los obligaron a negociar caso por caso.","Contradice el texto: pagar el servicio exigió ajustes fiscales durísimos y la región vivió una década perdida.","Anacronismo: la venta de bonos con garantía cupón cero corresponde al Plan Brady (fines de los 80), no a la etapa inmediata a 1982."],"pag":"pp. 214-215, 220"},{"id":"mar4-m6","tema":"P9","nivel":"muy_dificil","enunciado":"¿Qué relación establece Marichal entre el derrumbe de Bretton Woods y el auge del crédito internacional a los países en desarrollo?","opciones":["Que el fin de Bretton Woods restableció el patrón oro, y la confianza en una moneda sólida animó a los bancos a prestar a largo plazo a la periferia.","Que el fin de Bretton Woods impuso controles de capitales en los países ricos, lo que obligó a los bancos a buscar clientes fuera de su país.","Que con la flotación y el fin de los controles de capitales cayeron las barreras a los flujos financieros, y los bancos crecieron con petrodólares.","Que los tipos de cambio fijados en el Smithsonian dieron estabilidad a las monedas periféricas y volvieron seguros los préstamos hasta 1982."],"correcta":2,"explicacion":"Tras el abandono de la paridad dólar-oro (1971) y el fracaso del Smithsonian, las monedas pasaron a flotar; en 1974 Estados Unidos levantó los últimos controles sobre los movimientos de capitales y, para Marichal, se derrumbaron las últimas barreras a la globalización financiera. La flexibilización reforzó los flujos internacionales y benefició a multinacionales y grandes bancos, que con el excedente de petrodólares se lanzaron a prestar a la periferia.","por_que_no":["Error de base: Bretton Woods terminó justamente con el abandono del vínculo dólar-oro; no hubo vuelta al patrón oro.","Invierte el sentido: en 1974 se levantaron los últimos controles de capitales, no se impusieron.","","Los acuerdos del Smithsonian no se sostuvieron: la inflación estadounidense y el shock de 1973 llevaron a la libre flotación."],"pag":"pp. 182-184, 195"},{"id":"mar4-m7","tema":"P9","nivel":"muy_dificil","enunciado":"Marichal señala una “contradicción de fondo” en el orden monetario posterior a 1971. ¿Cuál de estas afirmaciones la resume mejor?","opciones":["Que EE.UU. emite dólares sin respaldo para cubrir sus déficits, pero el FMI se lo reprocha con la misma dureza que a los países pobres.","Que EE.UU. emite dólares para cubrir sus déficits sin hacerse cargo de sus efectos globales, mientras el FMI pide austeridad a los pobres.","Que EE.UU. emite dólares para sus déficits y asume la responsabilidad por su circulación mundial, mientras el FMI pide ajuste a los pobres.","Que EE.UU. emite dólares para cubrir sus déficits, pero debe respaldarlos con oro o divisas fuertes como cualquier otra economía abierta."],"correcta":1,"explicacion":"Para el autor, en Washington suele considerarse que las políticas de la Reserva Federal son asunto interno, aunque afectan a otros países. Desde 1971, la Fed y el Tesoro emiten dólares para cubrir el déficit público y la balanza de pagos sin asumir responsabilidad por la circulación global de su moneda ni darle respaldo, y el FMI avala esa contradicción al pedir a los países menos desarrollados que se “ajusten los cinturones”. Esa ventaja se apoya en la hegemonía política y militar estadounidense.","por_que_no":["Invierte el papel del FMI: según el autor, el Fondo avala la contradicción al exigir ajuste solo a los países menos desarrollados.","","Mitad bien, mitad mal: Marichal dice justamente que EE.UU. emite sin asumir una responsabilidad adecuada por la circulación global de su moneda.","Contradice el texto: EE.UU. emite sin asegurar un respaldo equivalente en metal o divisas fuertes y no enfrenta las restricciones de las demás economías abiertas."],"pag":"pp. 182, 185-186"},{"id":"mar4-m8","tema":"P9","nivel":"muy_dificil","enunciado":"Considere las siguientes afirmaciones sobre las consecuencias de la crisis según Marichal:\nI. Las devaluaciones redujeron importaciones y permitieron captar divisas, pero también alimentaron la inflación al llevar a productores y comerciantes a remarcar precios por anticipado.\nII. Cada ronda de renegociación redujo el saldo total de la deuda, porque los bancos absorbieron parte de los intereses impagos.\nIII. Los bonos Brady dieron a México una ventaja para posicionarse en los mercados internacionales, aunque el ahorro logrado fue menor que el previsto.\nIV. El Consenso de Washington, con privatizaciones, desregulación financiera y apertura, preparó la fase más intensa de la globalización financiera de los 90.\n¿Cuáles son correctas?","opciones":["Solo I y III","Solo I, III y IV","Solo II, III y IV","Solo I y II"],"correcta":1,"explicacion":"I es correcta: las devaluaciones bajaron las importaciones y aumentaron la captación de divisas, pero reforzaron la monetización de los déficits y generaron remarcaciones anticipadas. III también: el canje mexicano posicionó a la administración de Salinas de Gortari, aunque la baja de tasas desde 1989 redujo los beneficios. IV es correcta: el Consenso implicó un fuerte ajuste y preparó la fase más fuerte de la globalización financiera. II es falsa: cada programa capitalizó intereses, por lo que el saldo total aumentó.","por_que_no":["Omite IV, que el texto sostiene: el Consenso de Washington preparó la globalización financiera de los 90.","","Incluye II, que invierte el efecto: la capitalización de intereses hizo crecer el saldo de la deuda.","Incluye II, que es falsa, y deja afuera III y IV, que son correctas."],"pag":"pp. 216-222"}],"desarrollo":[{"id":"mar4-d-n1","tema":"P9","nivel":"normal","consigna":"Según Marichal, ¿cuáles fueron las causas y las principales consecuencias de la crisis del petróleo de 1973? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Contexto: guerra de Yom Kippur","detalle":"Ubicar la crisis en la guerra árabe-israelí de octubre de 1973 (ataque de Egipto y Siria a Israel), que abrió una “guerra económica”.","peso":2,"indicios":[["yom kippur","kipur","arabe israeli","israel","egipto","siria"]]},{"id":"b","punto":"La OPEP usa el petróleo como arma","detalle":"Los países árabes de la OPEP usan el petróleo para presionar a EE.UU. por su apoyo a Israel y para controlar sus recursos frente a las petroleras angloamericanas (estrategia nacionalista).","peso":3,"indicios":[["opep","arabe"],["presion","como arma","arma politica","arma de presion","nacionalis","control sobre","control de sus recursos","sus recursos","angloamerican"]]},{"id":"c","punto":"Precio duplicado y embargo","detalle":"El 16/10/1973 duplican el precio y luego embargan las exportaciones a EE.UU.; el barril pasa de unos 3 a 12 dólares.","peso":3,"indicios":[["precio","barril"],["duplic","embargo","doce","cuadrupl","multiplico por","cuatro veces"]]},{"id":"d","punto":"Efectos en los países industriales","detalle":"Se encarece la energía para las industrias del centro y de la periferia, cae la bolsa de Nueva York y se agrava la recesión con inflación (estanflación).","peso":2,"indicios":[["recesi","estanflac","bolsa","costo de la energ","costos energ","energia mas cara","encarec"]]},{"id":"e","punto":"Respuestas de los consumidores","detalle":"EE.UU. congela precios internos y crea la Oficina Federal de Energía; Europa reduce el consumo y busca energías alternativas; Brasil impulsa el etanol.","peso":1,"indicios":[["etanol","oficina federal","alternativ","alcohol","congel","reducir el consumo","ahorr"]]},{"id":"f","punto":"Petrodólares reciclados por los bancos","detalle":"La OPEP obtiene enormes ingresos extra (más de 800 mil millones entre 1974 y 1982): una parte va a gasto público y armas, y buena parte de las reservas se deposita en bancos globales que las prestan a países en desarrollo: base del endeudamiento.","peso":3,"indicios":[["petrodolar","excedente","superavit"],["banco","recicl","prest"]]},{"id":"g","punto":"Matiz: no fue la única causa","detalle":"Para el autor el shock fue decisivo, pero pesaron todavía más causas estructurales (debilitamiento industrial en Occidente y en el bloque soviético, agotamiento del modelo de posguerra, fin de Bretton Woods).","peso":2,"indicios":[["unica causa","unico factor","no fue la unica","no fue el unico","estructural","agotamiento","otros factores","otras causas","no explica todo"]]}],"respuesta_modelo":"Para Marichal, la crisis del petróleo nace de la guerra de Yom Kippur: en octubre de 1973 Egipto y Siria atacaron a Israel y, aunque la lucha militar terminó pronto, empezó una guerra económica. Los países árabes de la OPEP usaron el petróleo como instrumento de presión contra Estados Unidos, que apoyaba a Israel, y para afirmar su control sobre recursos explotados por las petroleras angloamericanas. El 16 de octubre duplicaron el precio y luego embargaron las ventas a Estados Unidos; el barril pasó de unos 3 a 12 dólares. Subieron los costos energéticos, la bolsa de Nueva York se desplomó y se profundizó la estanflación; los consumidores respondieron con ahorro, energías alternativas o etanol. La OPEP ganó más de 800 mil millones de dólares extra: una parte fue a gasto público y armas, y buena parte de las reservas se depositó en bancos globales, que reciclaron esos petrodólares como préstamos a países en desarrollo. Pero, aclara el autor, el petróleo no fue la única causa de la larga recesión: pesaron aún más factores estructurales, como el agotamiento del modelo de posguerra.","errores_comunes":["Confundir el choque de 1973 (guerra de Yom Kippur, OPEP árabe) con el de 1979 (caída del Sha de Irán).","Presentar el petróleo como causa única de la recesión de los 70: Marichal destaca factores estructurales “aún más importantes”.","Decir que los países árabes prestaron directamente a América Latina: los petrodólares se reciclaron a través de bancos de EE.UU., Europa y Japón.","Afirmar que EE.UU. era el país más dependiente del petróleo importado: lo eran más Europa y Japón."],"pag":"pp. 179-180, 187-191"},{"id":"mar4-d-n2","tema":"P9","nivel":"normal","consigna":"¿Qué entiende Marichal por globalización financiera en el período 1973-1990 y cuáles fueron sus orígenes? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Antecedentes en los flujos de 1970-1982","detalle":"La hipótesis del autor: los verdaderos antecedentes de la globalización financiera moderna están en los grandes flujos internacionales de capitales de 1970-1982.","peso":3,"indicios":[["antecedente","temprana","primera fase","precursor","comienz","empez","arranc","nace","surg"],["flujo"]]},{"id":"b","punto":"Derrumbe de Bretton Woods y flotación","detalle":"El abandono de la paridad dólar-oro (1971) y la flotación de las monedas (1973) aumentan la volatilidad y abren el sistema.","peso":3,"indicios":[["bretton","dolar-oro","dolar oro","flota","flexib"]]},{"id":"c","punto":"Fin de los controles de capitales","detalle":"En 1974 EE.UU. levanta los últimos controles a los movimientos de capitales: caen las últimas barreras; los monetaristas (Friedman) impulsan la desregulación.","peso":2,"indicios":[["controles de capital","control de capital","controles a los movimientos","movimientos de capital","desregul","barrera","friedman","monetaris"]]},{"id":"d","punto":"Reciclaje de petrodólares","detalle":"Tras el shock de 1973, los excedentes de la OPEP depositados en bancos globales se prestan a países en desarrollo, sobre todo de América Latina.","peso":3,"indicios":[["petrodolar","opep","recicl"],["prest","credito","deuda"]]},{"id":"e","punto":"Bancos globales como primeros agentes","detalle":"Unos 300 bancos de EE.UU., Europa y Japón, que se internacionalizaron y prestaron más de 500 mil millones en los 70, fueron los primeros agentes de esa fase.","peso":2,"indicios":[["banco"],["trescientos","agente","internacionaliz","quinientos","se globaliz","cientos de bancos"]]},{"id":"f","punto":"Una fase singular","detalle":"Era un flujo entre dos periferias (Medio Oriente y América Latina) intermediado por la banca del centro y volcado a deuda soberana; terminó en la crisis de 1982.","peso":1,"indicios":[["dos periferias","medio oriente","soberan","intermedi","singular"]]}],"respuesta_modelo":"Marichal se pregunta si los verdaderos antecedentes de la globalización financiera moderna están en los flujos de capitales de 1970-1982, y sostiene que puede argumentarse que sí. El primer origen es el derrumbe de Bretton Woods: en 1971 Estados Unidos abandonó la paridad dólar-oro y en 1973 las monedas pasaron a flotar. En 1974 se levantaron los últimos controles a los movimientos de capitales y, con el impulso desregulador de monetaristas como Friedman, cayeron las últimas barreras a la globalización financiera. El segundo es la crisis del petróleo: buena parte de los excedentes de la OPEP se depositó en bancos de Estados Unidos, Europa y Japón, que, ante la recesión del centro, los reciclaron como préstamos a países en desarrollo. Unos 300 bancos, que prestaron más de 500 mil millones en los 70 y retuvieron esa deuda en sus carteras, fueron para el autor los primeros agentes de una fase temprana pero singular de globalización financiera. Tras la crisis de 1982, el Plan Brady volvió negociables esos bonos y el Consenso de Washington preparó la fase más fuerte, la de los 90.","errores_comunes":["Ubicar el inicio de la globalización financiera recién en los 90: para Marichal el Consenso de Washington preparó la fase “más fuerte”, pero los antecedentes son de 1970-1982.","Confundir el mecanismo: no se trata de inversión directa de multinacionales sino, sobre todo, de préstamos bancarios a gobiernos y empresas estatales.","Decir que Bretton Woods favoreció la libre circulación de capitales: fue su derrumbe (flotación y fin de los controles en 1974) lo que la abrió."],"pag":"pp. 181-184, 190, 195-199"},{"id":"mar4-d-d1","tema":"P9","nivel":"dificil","consigna":"Explique por qué, según Marichal, los países en desarrollo —en especial los latinoamericanos— se endeudaron masivamente entre 1973 y 1982. Considere tanto la oferta de crédito como la demanda de los gobiernos.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Oferta: petrodólares sin destino en el centro","detalle":"Los bancos globales recibían depósitos de petrodólares y, por la recesión y el estancamiento bursátil del centro, buscaron prestarlos a países que pagaban tasas más altas.","peso":3,"indicios":[["petrodolar","deposit","excedente"],["recesi","estanc","rentab","tasas mas altas"]]},{"id":"b","punto":"Bancos que se globalizan y venden préstamos","detalle":"Los bancos se internacionalizan y se vuelven vendedores agresivos de préstamos; crecen sus ganancias externas (Bank of America, Citicorp: “los países no quiebran”).","peso":2,"indicios":[["banco"],["internacionaliz","vendedor","ganancia","wriston","no quiebran","agresiv","citicorp","sucursal"]]},{"id":"c","punto":"Simultaneidad: factor externo","detalle":"Que casi todos los Estados se endeudaran a la vez sugiere que los bancos globales fueron decisivos en el debate entre oferta y demanda.","peso":2,"indicios":[["simultane","mismo tiempo","casi todos","conducta similar","factor externo","factores externos","paises muy divers"]]},{"id":"d","punto":"Demanda: crecimiento con crédito barato","detalle":"Los gobiernos querían sostener el gasto público y el alto crecimiento de posguerra; con mercados financieros locales estrechos, el crédito externo era abundante y barato (tasas casi negativas a mediados de los 70).","peso":3,"indicios":[["crecimiento","crecer","creciendo","gasto publico","gasto del estado"],["barat","negativ","tasas bajas","estrech","abundante"]]},{"id":"e","punto":"Dictaduras y armas","detalle":"Los préstamos sostuvieron dictaduras y gobiernos autoritarios (Chile de Pinochet, Argentina, Brasil) y su gasto militar; los banqueros los veían como garantes del pago.","peso":2,"indicios":[["dictadur","autoritari","militar","pinochet","armas"]]},{"id":"f","punto":"Empresas estatales: capitalismo dirigido","detalle":"La mayor parte financió empresas estatales y obras públicas (PEMEX, Petrobras, YPF): un capitalismo dirigido por el Estado.","peso":2,"indicios":[["empresa","obras publicas","capitalismo"],["estatal","pemex","petrobras","ypf","dirigido","publicas","del estado","capitalismo de estado"]]},{"id":"g","punto":"Falta de control y de alertas","detalle":"El FMI y los organismos multilaterales, informados de los riesgos, no alertaron; el dinero fácil fomentó corrupción, laxitud presupuestaria y fuga de capitales.","peso":1,"indicios":[["fmi","fondo monetario","multilateral"],["alert","complac","corrupc","fuga","advirt"]]}],"respuesta_modelo":"Marichal explica el endeudamiento como el encuentro de una oferta y una demanda que se potenciaron. Del lado de la oferta, el shock petrolero de 1973 dejó a los países árabes enormes excedentes, y buena parte de sus reservas se depositó a corto plazo en bancos de Estados Unidos y Europa. Como la recesión y el estancamiento de las bolsas impedían colocarlos con rentabilidad en el centro, los bancos los prestaron a países en desarrollo, que pagaban tasas relativamente altas. Los grandes bancos se internacionalizaron y sus agentes se volvieron vendedores de préstamos: el Bank of America pasó de obtener el 15% de sus ganancias de préstamos internacionales en 1970 a más del 60% en 1982, y Wriston, del Citicorp, sostenía que “los países no quiebran”. Para el autor, que casi todos los Estados se endeudaran a la vez sugiere el peso de este factor externo. Del lado de la demanda, los gobiernos querían sostener el gasto público y las altas tasas de crecimiento de posguerra, y ante mercados financieros locales estrechos el crédito externo resultaba abundante y barato, con tasas casi negativas a mediados de los 70. Los préstamos cubrieron déficits, compras de armas y dictaduras —los banqueros confiaban en que los regímenes autoritarios garantizaban el pago— y, sobre todo, empresas estatales como PEMEX o Petrobras, en un verdadero capitalismo dirigido. El FMI, bien informado de los riesgos, no alertó, y el dinero fácil fomentó corrupción y fuga de capitales.","errores_comunes":["Explicar el endeudamiento solo por la irresponsabilidad de los gobiernos, sin el papel de los bancos globales y del reciclaje de petrodólares.","Decir que solo se endeudaron los importadores de petróleo: también lo hicieron exportadores como México, Venezuela o Ecuador.","Atribuir los préstamos de los 70 al Banco Mundial o al BID: ese era el patrón de los 60; desde 1973 dominan los bancos privados.","Afirmar que los créditos fueron a empresas privadas: los mayores deudores fueron las empresas estatales."],"pag":"pp. 190, 195-205"},{"id":"mar4-d-d2","tema":"P9","nivel":"dificil","consigna":"Explique cómo se relacionan, según Marichal, los dos choques petroleros (1973 y 1979) con el auge del endeudamiento de los países en desarrollo y con el estallido de la crisis de la deuda en 1982.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"1973: excedentes de la OPEP","detalle":"El primer choque (guerra de Yom Kippur, OPEP árabe) multiplica el precio del barril y genera ingresos extraordinarios (petrodólares); buena parte de las reservas se deposita en bancos globales.","peso":3,"indicios":[["yom kippur","kipur","israel","primer choque","primer shock","embargo"],["petrodolar","excedente","superavit","ingresos extraordinarios"]]},{"id":"b","punto":"Reciclaje hacia la periferia","detalle":"Con el centro en recesión, los bancos prestan esos fondos a países en desarrollo, sobre todo de América Latina: un flujo Medio Oriente-América Latina intermediado por la banca del centro.","peso":3,"indicios":[["petrodolar","excedente","recicl"],["prest","credito","recicl"],["america latina","latinoamer","periferi","tercer mundo"]]},{"id":"c","punto":"Se endeudan importadores y exportadores","detalle":"Se endeudan tanto importadores de petróleo (su deuda pasa de 100 a casi 500 mil millones entre 1972 y 1982) como exportadores (México y PEMEX).","peso":2,"indicios":[["importador"],["exportador","pemex","mexico"]]},{"id":"d","punto":"1979: segundo choque e inflación","detalle":"La caída del Sha de Irán provoca un nuevo pico, los bancos acortan los plazos y la inflación de EE.UU. supera el 10% anual en 1980.","peso":3,"indicios":[["iran","sha","segundo choque","segundo shock"],["inflac","plazo"]]},{"id":"e","punto":"Efecto Volcker","detalle":"Volcker sube las tasas hasta casi 20%; con el déficit de Reagan y el dólar fuerte, la periferia solo consigue créditos cortos y caros, y el servicio pasa de unos 20 mil a casi 100 mil millones.","peso":3,"indicios":[["volcker","suba de tasas","alza de tasas","subida de tasas","suba de las tasas","alza de las tasas","aumento de las tasas","subieron las tasas","subio las tasas"],["servicio","corto","dolar fuerte","dolar en alza","reagan","encarec","casi veinte"]]},{"id":"f","punto":"México 1982","detalle":"El 20/8/1982 México anuncia que no puede pagar el servicio completo (tasas y fuga de capitales): comienza la crisis internacional de la deuda.","peso":2,"indicios":[["mexico","silva herzog"],["suspen","moratori","no pod","dejo de pagar","default","cesacion","servicio completo"]]}],"respuesta_modelo":"Para Marichal, los choques petroleros enmarcan todo el ciclo de auge y crisis de la deuda. El primero, en octubre de 1973, surgió de la guerra de Yom Kippur: los países árabes de la OPEP duplicaron el precio y embargaron a Estados Unidos. Así obtuvieron ingresos extraordinarios —más de 800 mil millones entre 1974 y 1982—: una parte fue a gasto público y armas, y buena parte de las reservas se depositó a corto plazo en bancos globales. Como el centro estaba en recesión y sus bolsas estancadas, los bancos reciclaron esos petrodólares prestándolos a países en desarrollo, en especial latinoamericanos: un flujo entre dos periferias, Medio Oriente y América Latina, intermediado por la banca de Estados Unidos y Europa. Paradójicamente se endeudaron tanto los importadores de petróleo, cuya deuda pasó de 100 a casi 500 mil millones de dólares, como los exportadores: México hizo de PEMEX un gran tomador de crédito. El segundo choque, en 1979, provocado por la caída del Sha de Irán, llevó el precio a un pico mayor, hizo que los bancos acortaran los plazos y contribuyó a que la inflación estadounidense superara el 10% en 1980. Para frenarla, Volcker subió las tasas hasta casi 20%; con el déficit de Reagan y el dólar fuerte se cortó el crédito largo para la periferia, y el servicio anual saltó de unos 20 mil a casi 100 mil millones de dólares en 1982. El 20 de agosto de ese año México anunció que no podía cubrir el servicio completo de su deuda: estallaba la crisis.","errores_comunes":["Atribuir el choque de 1979 a la guerra de Yom Kippur o el de 1973 a la revolución iraní.","Saltar del petróleo a la crisis de 1982 sin explicar el detonador: la suba de tasas de Volcker.","Decir que el encarecimiento del petróleo solo endeudó a los importadores: los exportadores también tomaron deuda masivamente."],"pag":"pp. 187-190, 199, 205-209, 212"},{"id":"mar4-d-m1","tema":"P9","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «La crisis de la deuda de 1982 fue un problema exclusivamente latinoamericano, causado por gobiernos derrochadores, que se resolvió cuando los países deudores pagaron lo que debían». ¿Es correcta según Marichal? Justifique con los argumentos del autor.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"No fue solo latinoamericana","detalle":"También se endeudaron Europa del este, el sur de Europa, Corea y África, y la crisis amenazó a los mayores bancos del mundo, cuya exposición superaba su capital (Citibank: 174%).","peso":3,"indicios":[["europa del este","polonia","corea","africa","filipinas","citibank","espana","sur de europa","bank of america","su capital","sistema bancario mundial","bancos mas poderosos"]]},{"id":"b","punto":"Responsabilidad compartida","detalle":"Los bancos globales empujaron los préstamos (endeudamiento simultáneo) y el FMI, el Banco Mundial y el BID no alertaron; los gobiernos (dictaduras, corrupción, fuga de capitales) también fueron responsables.","peso":3,"indicios":[["banco","fmi","fondo monetario","multilateral"],["empuj","simultane","vendedor","agresiv","casi todos","no alert","no advirt","alarma","complac","culpa compartida","responsabilidad compartida"]]},{"id":"c","punto":"Detonador externo: efecto Volcker","detalle":"La causa inmediata fue la suba de tasas en EE.UU. entre 1980 y 1982 (más el déficit de Reagan y un dólar en alza), que multiplicó el servicio de la deuda.","peso":3,"indicios":[["volcker","suba de tasas","alza de tasas","subida de tasas","suba de las tasas","alza de las tasas","aumento de las tasas","subieron las tasas","subio las tasas","reserva federal"]]},{"id":"d","punto":"No se resolvió pagando: cartel de acreedores","detalle":"Los acreedores se organizaron (G-7, bancos, FMI: un prestamista de última instancia), negociaron caso por caso, dieron créditos caros y capitalizaron intereses: la deuda creció en vez de bajar.","peso":2,"indicios":[["cartel","caso por caso","comite","mipui","capitaliz","ultima instancia"]]},{"id":"e","punto":"Costo social: década perdida","detalle":"El pago se sostuvo con ajuste fiscal, caída de salarios reales, renta petrolera y devaluaciones; hubo inflación altísima y estancamiento.","peso":2,"indicios":[["decada perdida","ajuste","salario","inflac","estancamiento"]]},{"id":"f","punto":"Salida parcial: Brady y después","detalle":"El Plan Brady dio beneficios menores a los esperados; la crisis mexicana de 1994 y una deuda de más de 2 billones en 2009 muestran que el problema no desapareció.","peso":2,"indicios":[["brady","cupon","canje","consenso de washington","dos billones","siguio creciendo","siguen creciendo"]]}],"respuesta_modelo":"La afirmación es incorrecta para Marichal en sus tres partes. En primer lugar, la crisis no fue solo latinoamericana: el endeudamiento externo también había crecido en Europa del este, en el sur de Europa —incluso en España—, en Corea del Sur y en África; la deuda de los países en desarrollo importadores de petróleo pasó de 100 a casi 500 mil millones de dólares entre 1972 y 1982. Además, el riesgo era sistémico: la deuda periférica en manos de los grandes bancos igualaba o superaba su capital (174% en el Citibank, 158% en el Bank of America), de modo que una suspensión general los habría dejado técnicamente en quiebra. Ni siquiera golpeó igual a todos: Corea, Indonesia, Malasia, Colombia y Chile no necesitaron rescates onerosos. En segundo lugar, no se explica solo por gobiernos derrochadores. Marichal reconoce el endeudamiento desordenado, la corrupción y la fuga de capitales, pero señala que el endeudamiento casi simultáneo de todos los Estados sugiere el peso de los bancos globales, que, cargados de petrodólares, vendían préstamos agresivamente, y que el FMI, el Banco Mundial y el BID no dieron señales de alarma. El detonador fue externo: la suba de tasas de Volcker, que llegaron a casi 20%, sumada al déficit de Reagan y a un dólar en alza, llevó el servicio de la deuda a casi 100 mil millones en 1982. En tercer lugar, la crisis no “se resolvió” pagando. Los acreedores formaron una especie de cartel —G-7, grandes bancos y FMI— que funcionó como prestamista de última instancia y aisló a cada deudor en negociaciones caso por caso. Los nuevos créditos, caros y con comisiones, mantuvieron las deudas como “operativas” y capitalizaron intereses, por lo que el saldo creció. El servicio se pagó con ajuste fiscal, recorte de salarios, la renta petrolera y devaluaciones que dispararon la inflación: fue la década perdida. Ni siquiera el Plan Brady cerró el problema: sus beneficios fueron menores que lo esperado, México volvió a estallar en 1994 y en 2009 la deuda de los países en desarrollo superaba los 2 billones de dólares.","errores_comunes":["Aceptar la afirmación por su parte verdadera (hubo gobiernos que se endeudaron de modo irresponsable) sin discutir el papel de los bancos, del FMI y de la política de tasas de EE.UU.","Presentar la crisis de 1982 como un pánico bursátil: Marichal insiste en que fue una crisis de deudas soberanas.","Creer que las renegociaciones redujeron la deuda: la capitalización de intereses aumentó el saldo.","Confundir el Plan Brady (canje de bonos de fines de los 80) con la negociación caso por caso que empezó en 1982."],"pag":"pp. 196-199, 205-222"},{"id":"mar4-d-m2","tema":"P9","nivel":"muy_dificil","consigna":"Marichal se pregunta si los verdaderos antecedentes de la globalización financiera moderna están en los flujos de capitales de 1970-1982. Evalúe esa hipótesis: ¿qué condiciones la hicieron posible tras el fin del orden económico de posguerra, qué tuvo de “temprana pero singular” esa fase y cómo se enlaza con la globalización de los años 90?","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Fin del orden de posguerra","detalle":"Agotamiento del modelo industrializador de posguerra (PIB de la OCDE de 4,8% a 2,6% anual), caída de la tasa de ganancia (Brenner) y estanflación: el centro en recesión ya no ofrece colocaciones rentables.","peso":2,"indicios":[["agot","modelo de posguerra","modelo industrializador","ocde","brenner","tasa de ganancia","estanflac"]]},{"id":"b","punto":"Derrumbe de Bretton Woods y desregulación","detalle":"Fin del dólar-oro (1971), flotación (1973), fin de los controles de capitales (1974) y ofensiva monetarista contra el neokeynesianismo: caen las barreras a la globalización.","peso":3,"indicios":[["bretton","flota","dolar oro","controles"],["friedman","monetaris","desregul","barrera","neokeynes"]]},{"id":"c","punto":"Petrodólares y bancos globales","detalle":"El shock petrolero genera excedentes que unos 300 bancos de EE.UU., Europa y Japón reciclan en préstamos (más de 500 mil millones en los 70): los primeros agentes de la globalización financiera.","peso":3,"indicios":[["petrodolar","opep","excedente"],["banco"]]},{"id":"d","punto":"Lo singular de esa fase","detalle":"El autor no define el adjetivo, pero el texto permite explicarlo: los bancos retuvieron en sus propias carteras la deuda de gobiernos y empresas estatales (capitalismo dirigido, dictaduras como clientes), y el gran flujo unía dos periferias (Medio Oriente → América Latina) a través de la banca del centro.","peso":3,"indicios":[["dos periferias","medio oriente","soberan","estatal","cartera","dictadur","dirigido"]]},{"id":"e","punto":"Inestabilidad y crisis de 1982","detalle":"Vuelven la especulación y las burbujas de deuda como antes de 1929 (Minsky, Kindleberger); el efecto Volcker hace estallar la crisis de 1982.","peso":2,"indicios":[["minsky","kindleberger","inestabil","especula","burbuja","volcker","crisis de la deuda","moratoria"]]},{"id":"f","punto":"Enlace con los años 90","detalle":"El Plan Brady convierte la deuda en bonos negociables y el Consenso de Washington (privatizaciones, desregulación financiera, apertura) prepara la fase más fuerte de la globalización financiera de los 90.","peso":2,"indicios":[["consenso de washington","brady","privatiz","desregulacion financiera","canje","bonos negociables"]]}],"respuesta_modelo":"La hipótesis de Marichal es sólida si se entiende que se trata de una globalización financiera distinta de la actual. Sus condiciones nacen del fin del orden de posguerra. Por un lado, el modelo industrializador que había durado casi un cuarto de siglo se agotó: el crecimiento de la OCDE cayó del 4,8% anual (1950-1970) al 2,6% (1970-1990), la tasa de ganancia industrial bajó (Brenner) y se instaló la estanflación, de modo que el centro dejó de ofrecer colocaciones rentables. Por otro, se derrumbó Bretton Woods: Nixon abandonó la paridad dólar-oro en 1971, las monedas pasaron a flotar en 1973 y en 1974 Estados Unidos levantó los últimos controles de capitales, mientras los monetaristas, con Friedman a la cabeza, desacreditaban al neokeynesianismo y promovían la desregulación. Así cayeron las últimas barreras a la globalización financiera. El shock petrolero de 1973 aportó la masa de fondos: la parte de los petrodólares que se depositó en bancos de Estados Unidos, Europa y Japón. Unos 300 bancos los reciclaron en préstamos por más de 500 mil millones de dólares en los 70 y fueron, según el autor, los primeros agentes de esta globalización. El autor no define esos adjetivos, pero el texto permite explicarlos: fue temprana porque anticipó la integración financiera mundial, y singular porque tomó la forma de préstamos a gobiernos y empresas estatales que los bancos retuvieron en sus propias carteras —lo que alentó un capitalismo dirigido por el Estado y sostuvo dictaduras— y porque el gran flujo unía a dos periferias, Medio Oriente y América Latina, a través de la banca del centro. Como advertían Minsky y Kindleberger, volvieron la especulación y las burbujas de deuda, y el efecto Volcker hizo estallar la crisis de 1982. La salida de esa crisis enlaza con los 90: el Plan Brady convirtió la deuda en bonos negociables y el Consenso de Washington —privatizaciones, desregulación financiera, apertura— preparó la fase más fuerte de la globalización financiera de esa década.","errores_comunes":["Presentar a Bretton Woods como un sistema de libre movilidad de capitales: su fin (flotación y eliminación de controles) fue lo que abrió la globalización.","Describir la fase 1970-1982 como inversión directa de multinacionales o como un flujo entre países ricos: lo singular fue el crédito bancario a la periferia, sobre todo a Estados.","Afirmar que la globalización financiera empieza con el Consenso de Washington: este preparó su fase más intensa, no su origen."],"pag":"pp. 181-185, 191-192, 195-199, 219-222"}]}]}</script>
<script>

/* ---------- utilidades ---------- */
function $(s){ return document.querySelector(s); }

function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' '); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function corto(id){ return CORTO[id] || (AUT[id] && AUT[id].autor) || id; }

function uniq(a){ return a.filter(function(x, i){ return a.indexOf(x) === i; }); }
function str(x){ return x == null ? '' : String(x); }

try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

function temasDeAutor(a){
  var t = [].concat(a.temas || [], (a.mc || []).map(function(q){ return q.tema; }), (a.desarrollo || []).map(function(d){ return d.tema; }), (a.guia || []).map(function(g){ return g.tema; }));
  return uniq(t.filter(function(x){ return TEMA[x]; })).sort(function(x, y){ return TEMAS.indexOf(TEMA[x]) - TEMAS.indexOf(TEMA[y]); });
}
function autoresDeTema(tid){

  return ids.length ? ids : (TEMA[tid] ? TEMA[tid].aut : []);

function tieneContenido(tid){

}

function statsTema(tid){
  var out = {};
  NIVELES.forEach(function(n){
    var qs = MC.filter(function(q){ return q.tema === tid && q.nivel === n.id; });
    var hechas = qs.filter(function(q){ return P.mc[q.id]; });

    out[n.id] = {total: qs.length, hechas: hechas.length, bien: bien.length};
  });
  return out;
}
function erradas(){ return MC.filter(function(q){ return P.mc[q.id] && P.mc[q.id].last === 0; }).map(function(q){ return q.id; }); }
function diasAlParcial(){
  var h = new Date(); var hoy = new Date(h.getFullYear(), h.getMonth(), h.getDate());
  return Math.round((new Date(2026, 9, 29) - hoy) / 86400000);

}

// Saca el primer objeto JSON completo de un texto (la IA a veces agrega texto alrededor).
function extraerJSON(t){
  t = String(t || '');
  var i = t.indexOf('{');
  while (i >= 0) {
    var prof = 0, enStr = false, barra = false;
    for (var j = i; j < t.length; j++) {
      var ch = t.charAt(j);
      if (enStr) { if (barra) barra = false; else if (ch === '\\') barra = true; else if (ch === '"') enStr = false; continue; }
      if (ch === '"') enStr = true;
      else if (ch === '{') prof++;
      else if (ch === '}') { prof--; if (prof === 0) { try { return JSON.parse(t.slice(i, j + 1)); } catch (e) { break; } } }
    }
    i = t.indexOf('{', i + 1);
  }
  return null;
}
function iaExterna(prompt, signal){

    }).then(function(r){

      return r.json();
    }).then(function(j){
      var txt = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
      var obj = extraerJSON(txt);
      if (!obj) throw {code: 'invalid_json'};
      return obj;
    });

}

function iniciarQuiz(ids, opts){
  ids = ids.filter(function(id){ return MCX[id]; });
  if (!ids.length) { toast('No hay preguntas para practicar acá.'); return; }
  var perm = {};
  ids.forEach(function(id){ perm[id] = shuffle([0, 1, 2, 3]); });

  S = Object.assign({view:'quiz', mode:'practica', ids: ids, i: 0, perm: perm, ans: {}, done: false, titulo: '', volver: {view: 'home'}, clave: null, t0: Date.now()}, opts || {});

}
function porNivel(qs){ return ['normal', 'dificil', 'muy_dificil'].reduce(function(acc, n){ return acc.concat(shuffle(qs.filter(function(q){ return q.nivel === n; }))); }, []); }
function letra(i){ return 'ABCD'.charAt(i); }

function vQuiz(){
  if (S.done) return vQuizFin();

  }).join('');
  var nav;
  if (sim) {
    nav = '<button class="btn" data-act="anterior"' + (S.i === 0 ? ' disabled' : '') + '>← Anterior</button>' +
      (S.i < n - 1 ? '<button class="btn primario" data-act="siguiente">Siguiente →</button>' : '<button class="btn primario" data-act="entregar">Entregar</button>');
  } else {
    nav = fb ? '<button class="btn primario" data-act="siguiente" id="btn-sig">' + (S.i < n - 1 ? 'Siguiente →' : 'Ver resultado') + '</button>' : '<span class="pista">Elegí una opción (en compu: teclas 1 a 4).</span>';
  }

  '<div class="quiz-top"><button class="volver" data-act="salir-quiz">← ' + (sim ? 'Salir del simulacro' : 'Volver') + '</button>' +

    '<span class="quiz-cont">' + (S.i + 1) + ' / ' + n + '</span></div>' +
  '<div class="barra" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + (S.i + 1) + '"><i style="width:' + Math.round(100 * (S.i + 1) / n) + '%"></i></div>' +
  '<article class="card pregunta">' +
    '<div class="chips"><span class="chip">' + esc(TEMA[q.tema].titulo) + '</span><span class="chip suave"><span class="dots" aria-hidden="true">' + NIVEL[q.nivel].dots + '</span> ' + NIVEL[q.nivel].label + '</span><span class="chip suave">' + esc(corto(q.autor)) + '</span></div>' +
    '<h2 class="enunciado">' + md(q.enunciado) + '</h2>' +

function feedbackHTML(q, elegida, perm){

    '<p class="fb-tit">' + (ok ? '¡Bien!' : 'No es esa.') + ' <span>La correcta es la ' + letra(perm.indexOf(q.correcta)) + '.</span></p>' +

function porQueNo(q, perm, elegida, abierto){
  var pq = q.por_que_no || [];

  return '<details class="pqn"' + (abierto ? ' open' : '') + '><summary>Por qué no las otras</summary><ul>' + items.map(function(x){
    return '<li' + (x.orig === elegida ? ' class="tuya"' : '') + '><b>' + letra(x.pos) + '.</b> ' + md(pq[x.orig]) + '</li>';
  }).join('') + '</ul></details>';
}
function reloj(){
  var s = Math.max(0, Math.floor((Date.now() - (S.t0 || Date.now())) / 1000));

}
setInterval(function(){

  if (S.view === 'des' && S.examen && !S.res) { var ex = document.getElementById('crono-ex'); if (ex) ex.textContent = reloj(); }
}, 1000);

function terminarQuiz(){
  S.done = true;
  var ids = S.ids, bien = 0;
  ids.forEach(function(id){
    var ok = S.ans[id] === MCX[id].correcta;
    if (ok) bien++;
    if (S.mode === 'sim' && S.ans[id] !== undefined) registrarMC(id, ok);
  });
  var pct = ids.length ? Math.round(100 * bien / ids.length) : 0;
  if (S.clave) { var prev = P.best[S.clave]; if (prev == null || pct > prev) P.best[S.clave] = pct; }
  P.hist = (P.hist || []).concat([{t: Date.now(), titulo: S.titulo, bien: bien, n: ids.length, modo: S.mode}]).slice(-40);
  S.minutos = Math.round((Date.now() - (S.t0 || Date.now())) / 60000);
  guardar();
}
function vQuizFin(){

  '</section>' + tabla +

function revItem(id, k){
  var q = MCX[id], perm = S.perm[id], el = S.ans[id], ok = el === q.correcta;
  var ops = perm.map(function(orig, pos){
    var c = orig === q.correcta ? ' ok' : (orig === el ? ' mal' : '');

    return '<span class="rev-op' + c + '">' + letra(pos) + '. ' + esc(q.opciones[orig]) + tag + '</span>';
  }).join('');
  return '<details class="rev"' + (ok ? '' : ' open') + '><summary><span class="ic ' + (ok ? 'ok' : 'mal') + '">' + (ok ? '✓' : (el === undefined ? '–' : '✗')) + '</span><span>' + (k + 1) + '. ' + md(q.enunciado) + '</span></summary>' +

    (!ok && el !== undefined && (q.por_que_no || [])[el] ? '<p><b>Por qué no la tuya:</b> ' + md(q.por_que_no[el]) + '</p>' : '') + '</div></details>';
}
function cierreDesarrollo(){
  var niv = S.simNivel && NIVEL[S.simNivel] ? S.simNivel : 'normal';
  var seguros = shuffle(DES.filter(function(d){ return (d.tema === 'P4' || d.tema === 'P5') && d.nivel === niv; }));
  var otros = shuffle(DES.filter(function(d){ return d.tema !== 'P4' && d.tema !== 'P5' && d.nivel === niv; }));

    var x = puntos.filter(function(y){ return y.id === p.id; })[0];
    if (x && x.estado === 'completo') { got += w; k++; } else if (w >= 3) faltaClave = true;

  var min = minPalabras(d.extension), corta = nPal < min * 0.6;
  var nota = Math.round(ratio * 10);

  var ver = (ratio >= 0.75 && !faltaClave && !corta) ? 'bien' : (ratio >= 0.45 ? 'incompleta' : 'mal');

  } else if (k === 'enter' || k === 'arrowright') {
    if (k === 'enter' && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    var n = document.querySelector('[data-act="siguiente"],[data-act="entregar"]');
    if (n && !n.disabled) { n.click(); e.preventDefault(); }
  } else if (k === 'arrowleft' && S.mode === 'sim') {
    var p = document.querySelector('[data-act="anterior"]');
    if (p && !p.disabled) { p.click(); e.preventDefault(); }
  }
});
window.addEventListener('pagehide', flushDraft);

/* ---------- arranque (conserva la vista si el visor recarga una versión nueva) ---------- */
var hot = window.claude && window.claude.hot;
function arrancar(data){
  if (data && data.S && data.S.view) {
    S = data.S;
    if (S.view === 'quiz' && (!S.ids || !S.ids.every(function(x){ return MCX[x]; }))) S = {view: 'home'};
    if (S.view === 'des' && (!S.ids || !S.ids.every(function(x){ return DESX[x]; }))) S = {view: 'home'};
    S.loading = false;
  }
  render();
}
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(function(){ flushDraft(); return {S: S}; }); } catch (e) {}
if (hot && typeof hot.ready === 'function') { try { hot.ready(arrancar); } catch (e) { arrancar({}); } }
else arrancar((hot && hot.data) || {});
})();
</script>
