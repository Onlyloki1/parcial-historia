te y zanahoria**: excepciones de precios, contratos con **ganancia garantizada** (el Estado asumía el riesgo) y, en la guerra, precios fijos. Las **ganancias** crecieron tanto que las firmas se autofinanciaron.","Caso textil: las cuotas forzosas de fibra sintética fallaron; los **incentivos** de 1936 funcionaron más de lo esperado, y las empresas invirtieron pensando en la posguerra.","Síntesis: un **híbrido** de mercado y directivas estatales (Hayes), con empresarios movidos por «codicia y supervivencia» (Nicosia y Huener). Estado y economía eran **inseparables**: cargos por conexiones personales, contratos por contactos con el partido y **amiguismo** constitutivo del régimen (Bajohr), como muestra **Flick**."],"pags":"PDF pp. 6-8"},{"titulo":"La «arianización»","puntos":["Fue el **tercer puente** entre empresas y régimen. Los nazis la veían como **redención** (devolver bienes «saqueados» por los judíos); quitarles la propiedad era quitarles dignidad y alentar la **deshumanización** que llevó al genocidio.","También servía para **adquirir activos**. Al principio fue **descentralizada y desde abajo**: jefes locales del partido tomaban firmas judías y las vendían a allegados por una fracción de su valor.","Desde 1935 Berlín intentó encauzarla, entre otros fines para controlar las **divisas** judías; después de 1936, las oficinas de divisas liquidaban riqueza judía. Varió por región (en **Hamburgo** se preservaron firmas que generaban divisas).","**1938**: plan sistemático ligado al comercio y al rearme, con precedente en **Austria** tras el Anschluss. Tras la **Kristallnacht**, **Göring** centralizó los valores judíos e impuso un **impuesto punitivo** (1.100 millones de RM) para aliviar deuda y déficit.","Gross rechaza la tesis principal de **Aly** (los alemanes siguieron muy gravados), aunque admite que ese impuesto llegó en un momento crítico.","Los empresarios actuaron con **pragmatismo amoral** (bancos intermediarios, compras por contactos, precios cada vez menores); Gross les extiende la «**sociedad descaradamente consumista**» de **Geyer**. Conclusión: la **maleabilidad del capitalismo**."],"pags":"PDF pp. 8-9"},{"titulo":"Guerra, imperio formal y legado","puntos":["Desde 1939 el **imperio formal** debía realizar el Lebensraum y resolver las crisis que el informal no había resuelto.","**Corto plazo**: rindió. Saqueo, fábricas desmontadas en el Este y costos de ocupación pagados con moneda emitida por los bancos centrales ocupados (**exportación de la inflación**); Alemania acumuló una deuda de más de 20.000 millones de marcos nunca devuelta.","**Largo plazo**: fracasó. Monedas destruidas, productores rurales retirados y **hambrunas** (Grecia, Serbia); el Este devastado rindió poco (Francia aportó más que la URSS ocupada). El imperio cubrió solo el **25%** del costo bélico (35% con trabajo esclavo).","Dilema «**matar a la vaca u ordeñarla**» sin política clara: saqueo en el Este, producción en el Oeste hasta que el reclutamiento forzoso de **Sauckel** (desde 1942) contribuyó a hundirla.","La guerra fusionó aún más Estado y economía: corrupción (**Neuhausen** en Serbia) y comités de **Speer** con «**autorresponsabilidad**» industrial.","**Legado**: contra la idea de «hora cero» y pura **americanización**, Gross destaca **continuidades** (Volkswagen, canales Estado-industria, formación vocacional) del **capitalismo coordinado** de posguerra; deja abierto si el nepotismo nazi difiere del clientelismo de otros capitalismos."],"pags":"PDF pp. 10-12"}],"conceptos":[{"termino":"Economía capitalista dirigista","def":"Caracterización central de Gross: capitalismo con fuerte dirección estatal (a veces coercitiva), plagado de amiguismo y orientado al imperio, el rearme y el despojo de los judíos. Mantuvo competencia y ganancia, pero la propiedad privada quedó condicionada a los fines del régimen."},{"termino":"Amiguismo y corrupción («capitalismo de amigos»)","def":"«Capitalismo de amigos» es el rótulo de los apuntes; Gross habla de «amiguismo», «corrupción» y «conexiones nepotistas», que (siguiendo a Bajohr) considera constitutivos del régimen: cargos por conexiones personales de tecnócratas venidos de las empresas y contratos públicos por contactos con el partido. Ejemplo: Flick."},{"termino":"Híbrido de mercado y directivas estatales","def":"Fórmula de Hayes que Gross adopta: mezcla de incentivos e instrucciones, recompensas y represalias. Supera la disyuntiva «coerción total» vs. «libertad empresaria»; los empresarios actuaban por «codicia y supervivencia» (Nicosia y Huener)."},{"termino":"Policracia","def":"Superposición de organismos (fuerzas armadas, Plan Cuatrienal, ministerios) con objetivos propios y a menudo opuestos. Muestra que no hubo un mando económico claro entre 1937 y 1942 y permitió a las empresas conservar autonomía."},{"termino":"Protokeynesianismo","def":"Lectura que ve al nazismo como precursor de las políticas anticíclicas. Gross la rechaza: el gasto fue sobre todo militar, los programas de empleo venían de Weimar y los déficits no eran excepcionales; la recuperación se explica por la militarización temprana."},{"termino":"Semiperiferia","def":"Concepto (Tooze) para la Alemania de entreguerras: nivel de vida alto pero menor que el de EE.UU. y Gran Bretaña, con industria moderna y agro atrasado. Ayuda a explicar la búsqueda de un imperio para competir como potencia global."},{"termino":"Lebensraum («espacio vital»)","def":"Continente propio en Europa del Este que, según Hitler, daría a Alemania espacio, recursos y mercados para una economía de producción masiva como la de EE.UU. Se justificaba además con la ideología racial (desprecio por los eslavos)."},{"termino":"Imperio informal / imperio formal","def":"Informal: influencia comercial y financiera sobre los vecinos sin control político (sudeste europeo, España), con acuerdos de compensación y tratados bilaterales; era la vía de Schacht. Formal: dominio territorial directo (anexiones y conquista), la base duradera del poder según Hitler."},{"termino":"HISMA-ROWAK","def":"Monopolio nazi de importación y exportación creado en la Guerra Civil Española: controlaba los envíos de armas a Franco y transformó las deudas de su régimen en propiedad alemana de empresas españolas de minería, agricultura y transporte."},{"termino":"Nuevo Plan (1934)","def":"Respuesta de Schacht al creciente déficit comercial: suspensión del pago de la deuda externa y control de divisas mediante 25 agencias que las asignaban a los importadores según las prioridades del rearme."},{"termino":"Plan Cuatrienal (1936)","def":"Respuesta a la crisis de divisas de 1936, a cargo de Göring: sintéticos para sustituir importaciones, nacionalización de algunos yacimientos de carbón y más control del comercio exterior. Amplió el papel del Estado, pero solo alivió problemas temporarios."},{"termino":"Dialéctica crisis-regulación / «profecía autocumplida»","def":"Mecanismo por el cual las crisis que provocaba el rearme (sobre todo de comercio exterior y divisas) justificaban más control estatal, que generaba nuevas crisis. Kaiser: el rearme pensado para independizarse del mercado mundial aumentó la dependencia y adelantó la conquista."},{"termino":"Arianización","def":"Expulsión forzada de los judíos de la economía mediante el despojo de sus bienes. Para los nazis, una «redención» de la comunidad nacional; en la práctica, también fuente de activos y divisas, con participación activa de bancos y empresarios."},{"termino":"Exportación de la inflación","def":"Mecanismo de la ocupación: los bancos centrales de los países conquistados debían emitir moneda local para canjear los pagarés de la Wehrmacht, de modo que la inflación quedaba fuera de Alemania. A largo plazo destruyó esas monedas y provocó hambrunas."},{"termino":"«Matar a la vaca u ordeñarla»","def":"Imagen de Umbreit para la tensión entre saquear los activos de los países ocupados o mantenerlos produciendo. Los nazis nunca definieron una política clara: saqueo en el Este, producción en el Oeste hasta las requisas de mano de obra de Sauckel."}],"cronologia":[{"fecha":"Década de 1890","hecho":"Pensadores liberales (Jäckh) proponen asegurar exportaciones y poder penetrando comercialmente a los vecinos, no colonizándolos."},{"fecha":"1931","hecho":"Crisis bancarias y colapso del comercio mundial: el Estado de Weimar controla finanzas y divisas; se combinan acuerdos de compensación y tratados bilaterales."},{"fecha":"Fines de 1932","hecho":"La inversión privada ya empieza a recuperarse antes de la llegada de Hitler (Buchheim)."},{"fecha":"1933","hecho":"Toma del poder; congelamiento de salarios; expropiación de la fábrica de aviones Junkers; ley de julio que impide a los judíos emigrantes sacar divisas."},{"fecha":"1934","hecho":"Primera crisis: Schacht suspende el pago de la deuda externa y lanza el Nuevo Plan; el gasto militar ya triplica al civil."},{"fecha":"1935","hecho":"El gobierno central intenta encauzar la arianización local, canalizar activos a Berlín y controlar las divisas de los judíos."},{"fecha":"1936","hecho":"Nueva crisis comercial y monetaria: Plan Cuatrienal y congelamiento de precios; Alemania ya tiene pleno empleo."},{"fecha":"1937","hecho":"Renuncia de Schacht; los yacimientos de Salzgitter pasan al estatal Reichswerke Hermann Göring."},{"fecha":"1938","hecho":"Anschluss: precedente austríaco de la arianización sistemática; en noviembre, Kristallnacht e impuesto punitivo a la riqueza judía; a fin de año, nueva crisis por el rearme."},{"fecha":"1938-1939","hecho":"Anexión de Austria (Anschluss, 1938) y de Checoslovaquia: aportan reservas de minerales y divisas ante los cuellos de botella del rearme."},{"fecha":"1939","hecho":"Comienza la guerra y la construcción de un imperio formal; los pedidos de exportación caen a su nivel más bajo en una década y las reservas están agotadas."},{"fecha":"1942","hecho":"Reformas de Speer (comités y «autorresponsabilidad» de la industria; más de 200 en 1943); Sauckel recluta por la fuerza mano de obra en toda Europa."},{"fecha":"1945","hecho":"Derrota; Alemania debe a Europa más de 20.000 millones de marcos. Debate posterior sobre la «hora cero»."},{"fecha":"1953","hecho":"Pese a los Acuerdos de Deuda de Londres, la deuda de la ocupación (más de 20.000 millones de marcos) nunca se reembolsa."},{"fecha":"2014-2015","hecho":"Crisis del euro: líderes griegos reclaman reparaciones por la ocupación nazi."}],"guia":[{"tema":"P6","pregunta":"Según Gross, ¿qué tipo de economía fue la economía nazi? ¿Se puede hablar de capitalismo? ¿De qué tipo?","puntos":["Sí, fue **capitalista**: se mantuvieron la propiedad privada, la **competencia** y la **ganancia** como motores; las ganancias empresarias subieron mucho después de 1933.","Pero **fuertemente dirigista** y a veces coercitiva: la propiedad quedó **condicionada** a la agenda nazi (expropiación de Junkers en 1933; Reichswerke Hermann Göring en 1937; Mannesmann temía ser expropiada), el Estado controló divisas, materias primas y capital y congeló salarios (1933) y precios (1936).","Orientada a la **expansión imperial**, la **producción militar** y la **expoliación de los judíos**.","**Plagada de amiguismo**: cargos por conexiones personales (tecnócratas venidos de las empresas, que protegían a sus firmas) y contratos públicos por contactos con el partido; corrupción como elemento constitutivo del régimen (Bajohr); ejemplo: Flick.","No fue **keynesiana** (el gasto fue sobre todo militar; se recuperó por militarizarse antes) ni una **economía dirigida tipo soviética** (policracia: no estaba claro quién mandaba; las empresas conservaron autonomía; incentivos de precios y ganancias).","Conclusión: un **híbrido** de mercado y directivas estatales, de incentivos y amenazas (Hayes), donde Estado y economía son inseparables. Muestra la **maleabilidad del capitalismo**."],"ojo":"«Capitalismo de amigos» (tu apunte) es válido como un rasgo —Gross habla de una economía «plagada de amiguismo»—, pero solo no alcanza: hay que decir capitalismo **dirigista** y orientado al rearme, el imperio y el despojo. Además, Gross deja abierto si el nepotismo nazi difiere cualitativamente del clientelismo de otros capitalismos (desarrollismos latinoamericanos o incluso EE.UU. actual): el amiguismo, solo, no define lo específico del nazismo. No digas que abolió la propiedad privada ni que fue socialista: «economía vampírica», «capitalismo de crisis con garrote», «socialismo heterodoxo» o «capitalismo prístino» son rótulos de otros autores que Gross reseña, no su tesis."},{"tema":"P6","pregunta":"Según Gross, ¿por qué las crisis le resultaban convenientes al régimen nazi? ¿Qué tipo de crisis eran?","puntos":["Eran sobre todo crisis de **comercio exterior**: **déficit comercial**, falta de **divisas** y de **materias primas**.","Las provocaba en gran medida el propio **rearme** (había que importar petróleo y mineral de hierro de calidad), además del intento de reorientar el comercio hacia los vecinos.","El régimen las **aprovechaba para ampliar el control estatal** (asignación de divisas, materias primas y capital): una **dialéctica** en la que cada regulación generaba nuevas crisis y más regulación.","Antecedente: fines de Weimar (crisis bancaria y cambiaria, 1931). Después de 1933 se aceleró porque la Depresión desacreditó el laissez-faire y el patrón oro y el mundo se volvió proteccionista.","Secuencia: 1934 **Nuevo Plan** (Schacht: moratoria de la deuda externa y divisas por prioridades) → 1936 **Plan Cuatrienal** (sintéticos, nacionalización de algunos yacimientos de carbón, control del comercio) → 1938-1939: cuellos de botella del rearme; la expansión territorial (Austria —Anschluss, 1938— y Checoslovaquia) aporta minerales y divisas; a fines de 1938, nueva crisis → 1939, guerra.","Debate: para **Mason**, la guerra de agresión servía para «solucionar» esa acumulación de problemas y para imponer a la población sacrificios imposibles en tiempos de paz. Para **Overy**, ese relato nació de ilusiones británicas y de la oposición conservadora a los controles de Hitler; a fines de los 30 Alemania ya había superado sus peores crisis y solo tenía fricciones comunes a todo capitalismo avanzado. Gross: el vínculo no es tan directo, pero en el comercio vale la «**profecía autocumplida**» de Kaiser: el rearme para no depender del mercado mundial aumentó la dependencia y adelantó la conquista del Lebensraum."],"ojo":"Gross no usa la palabra «trampa»: lo que describe es un **círculo** (dialéctica) en el que el rearme generaba crisis que el régimen usaba para controlar más, y que terminó empujando a la expansión. No las presentes como crisis inventadas ni como crisis bursátiles o de sobreproducción. No confundas el **Nuevo Plan** (1934, Schacht) con el **Plan Cuatrienal** (1936, a cargo de Göring)."},{"tema":"P6","pregunta":"Imperialismo nazi según Gross: ¿con qué lógica económica?, ¿hacia qué territorios se expandió?, ¿qué conflictos generó?","puntos":["Lógica: Alemania era una economía **semiperiférica** (Tooze) que quería competir con EE.UU.; necesitaba un **Lebensraum** con espacio, recursos y mercados para la producción en masa. El imperialismo, además, unía al régimen con empresarios que buscaban mercados.","No fue solo económico: la **ideología racial** era central (lucha contra una supuesta conspiración judía mundial; desprecio por los eslavos → imperio en Europa del Este).","**Imperio informal** (años 30): comercio bilateral y acuerdos de compensación con el **sudeste de Europa** (p. ej., Yugoslavia) y **España** (HISMA-ROWAK); servía para conseguir insumos del rearme sin gastar divisas. Schacht quería influir sin anexar.","**Imperio formal**: Hitler veía el comercio como transitorio. Anexión de **Austria y Checoslovaquia** (minerales y divisas) y, desde 1939, conquista de **Europa del Este** y ocupación de **Europa occidental** (Francia, Bélgica, Países Bajos), además de Grecia y Serbia.","Conflictos: la **guerra**; saqueo y desmantelamiento de fábricas; **exportación de la inflación** → colapso de monedas y **hambrunas** (Grecia, Serbia); deuda de más de 20.000 millones de marcos nunca pagada (reclamo griego de 2014-2015); dilema «matar a la vaca u ordeñarla»; trabajo forzado (Sauckel) y caída de la producción; corrupción (Neuhausen).","Balance: rindió en el corto plazo, pero solo cubrió el **25%** del costo de la guerra (35% con trabajo esclavo)."],"ojo":"No hables de colonias de ultramar: el eje es el continente europeo. Distinguí imperio **informal** (comercial, sin control político) de **formal** (territorial). En los años 30, España y el sudeste europeo fueron zona de influencia comercial (imperio informal); en la guerra, parte del sudeste (Grecia, Serbia) sí fue ocupada; España, nunca. El texto no da una lista completa: nombra Austria, Checoslovaquia, la URSS ocupada, Francia, Bélgica, Países Bajos, Bohemia, Grecia y Serbia (Polonia no aparece). Gross propone comparar este imperio informal con las inversiones de China en África."},{"tema":"P6","pregunta":"Según Gross, ¿qué fue la «arianización» y cómo se desarrolló?","puntos":["Definición: **expulsión forzada de los judíos de la economía** y despojo de sus bienes; el **tercer puente** (junto con el imperialismo y el rearme) entre empresas y régimen.","Sentido ideológico: «redención» de la comunidad nacional; quitar la propiedad era quitar dignidad y derechos → **deshumanización** que condujo al **genocidio**.","Sentido económico: adquirir **activos** y, en especial, **divisas** (una ley de julio de 1933 impedía a los emigrantes sacarlas; desde 1935 Berlín intenta encauzar el proceso y centralizarlas; después de 1936, las oficinas de divisas liquidan riqueza judía).","Etapas: al principio, **descentralizada y desde abajo** (jefes locales del partido, fideicomisos, ventas baratas a amigos; exclusión de contratos municipales); desde 1935, intentos de centralizar; variaciones regionales (Hamburgo).","**1938**: plan sistemático (precedente austríaco tras el Anschluss; Göring; Kristallnacht; valores judíos depositados y supervisados; **impuesto punitivo** de 1.100 millones de RM) para aliviar la **deuda pública y el déficit comercial**.","Participación empresaria activa: bancos intermediarios, compras por contactos, precios cada vez menores (los judíos perdían margen para negociar); Flick. Gross: **pragmatismo amoral**; extiende a los empresarios la «sociedad descaradamente consumista» de Geyer (lucrar con la exclusión de otros) y concluye la **maleabilidad del capitalismo**."],"ojo":"No fue un plan centralizado desde 1933: hasta 1938 fue local y variable. Tampoco fue solo ideológico: estuvo ligado a la escasez de divisas y al rearme. Gross relativiza a Aly: el despojo no financió la guerra ni liberó a los alemanes de impuestos, aunque el impuesto de 1938 ayudó en un momento crítico. En la traducción, «Decano (2008)» es el historiador Martin Dean."},{"tema":"P6","pregunta":"Según Gross, ¿cómo salió Alemania de la Gran Depresión? ¿Aplicó una política keynesiana? ¿Qué legados dejó la economía nazi?","puntos":["Visión protokeynesiana: unos 5 millones de empleos recuperados hacia 1936, obras financiadas con crédito, autopistas, Volkswagen, préstamos matrimoniales, déficit y emisión.","Corrección de Gross (Buchheim): la inversión privada ya repuntaba a fines de 1932; los programas se **heredaron de Weimar**; el clima de negocios mejoró por la **destrucción de los sindicatos**.","El **gasto militar** dominó desde 1934 (triplicaba al civil); las autopistas se aceleraron recién en 1936, con pleno empleo; déficit, emisión y deuda (≈50% del PIB) eran normales antes de 1936.","Conclusión: no fue más keynesiano que otros países; se recuperó más rápido porque **militarizó antes** su economía.","Legados: Gross discute la «**hora cero**» y la tesis de la americanización: Volkswagen y la producción masiva automotriz, los canales Estado-industria de los comités de Speer y la formación vocacional alimentaron el **capitalismo coordinado** de Alemania Occidental."],"ojo":"No digas que las autopistas resolvieron el desempleo ni que los nazis inventaron los programas de empleo. No le atribuyas a Gross la idea de un «New Deal nazi»: su punto es que Alemania se recuperó más rápido porque militarizó antes su economía (la inversión privada ya venía creciendo a fines de 1932)."}],"mc":[{"id":"gro-n1","tema":"P6","nivel":"normal","enunciado":"Según Gross, ¿cuál de las siguientes caracterizaciones de la economía del Tercer Reich es la que él sostiene?","opciones":["Una economía de planificación centralizada similar a la soviética, en la que la ganancia y la competencia dejaron de orientar las decisiones empresarias.","Una economía de mercado clásica, en la que el Estado se limitó a mantener el orden y respetó la propiedad privada como un derecho fundamental.","Un capitalismo muy intervenido por el Estado, a veces por la fuerza, atravesado por el favoritismo y volcado al rearme, la conquista y el despojo de los judíos.","Una economía keynesiana pionera, que salió de la Depresión con obras públicas civiles financiadas con déficit antes de que Keynes formulara su teoría."],"correcta":2,"explicacion":"Gross define la economía nazi como capitalista —conservó la competencia y la ganancia como incentivos— pero fuertemente dirigida por el Estado, a veces por la fuerza, «plagada de amiguismo» y puesta al servicio de la expansión imperial, la producción militar y la expoliación de los judíos. Por eso descarta tanto la imagen de una planificación soviética como la de un libre mercado o la de un keynesianismo pionero.","por_que_no":["Confunde con la URSS: Gross subraya que la competencia y las ganancias siguieron siendo motores importantes y que no hubo un mando económico único.","Contradice el texto: la propiedad privada estaba condicionada a las necesidades del régimen, que llegó a expropiar empresas (Junkers, los yacimientos de Salzgitter).","","Es la «versión escolar» que Gross corrige: el gasto fue sobre todo militar y Alemania no fue más keynesiana que otros países occidentales."],"pag":"PDF p. 1"},{"id":"gro-n2","tema":"P6","nivel":"normal","enunciado":"Según Gross, ¿qué papel tuvieron la corrupción y el amiguismo en la economía nazi?","opciones":["Eran constitutivos del régimen: cargos obtenidos por conexiones personales y contratos públicos ganados por contactos con el partido.","Fueron desvíos excepcionales que el régimen castigaba con dureza, como lo muestra el envío del jerarca nazi Neuhausen a un campo de concentración en 1944.","Aparecieron recién en los territorios ocupados durante la guerra, cuando la disputa por activos extranjeros escapó al control de Berlín.","Afectaron sobre todo a la pequeña empresa, porque los grandes grupos industriales negociaban con el Estado en igualdad de condiciones."],"correcta":0,"explicacion":"Gross, siguiendo a Bajohr, sostiene que la corrupción y el amiguismo fueron un «elemento constitutivo» del gobierno nazi: tecnócratas que llegaban a sus cargos por conexiones personales protegían desde allí a sus empresas, y las corporaciones ganaban contratos públicos por sus contactos con el partido. El conglomerado de Flick obtuvo así pedidos militares y minas judías arianizadas.","por_que_no":["","Trampa con un dato real: Neuhausen terminó en un campo, pero porque su corrupción era escandalosa incluso para los estándares nazis; fue la excepción por exceso, no la regla.","Confunde el período: la guerra multiplicó la corrupción, pero el amiguismo ya era constitutivo antes (Flick, arianizaciones, contratos públicos).","Contradice el texto: Flick era un gran conglomerado que se benefició de sus contactos, y la industria no era un socio igualitario del régimen."],"pag":"PDF p. 8"},{"id":"gro-n3","tema":"P6","nivel":"normal","enunciado":"Según Gross, ¿qué relación hubo entre las crisis económicas y la expansión del poder estatal bajo el nazismo?","opciones":["Las crisis obligaron al régimen a abandonar los controles y a dejar en manos del mercado la asignación de divisas para reactivar las exportaciones.","Las crisis provenían de un exceso de exportaciones industriales que saturó los mercados vecinos y obligó al Estado a fijar cupos de producción.","Las crisis eran herencia de la Depresión y se cerraron en 1933, por lo que los controles posteriores respondieron a la ideología y no a la economía.","El rearme generaba crisis de comercio exterior y de divisas que el régimen usaba para ampliar sus controles, y esa regulación abría paso a nuevas crisis."],"correcta":3,"explicacion":"Gross describe una «dialéctica»: el rearme obligaba a importar materias primas, agotaba las divisas y ampliaba el déficit comercial; cada crisis así provocada habilitaba más regulación estatal, que a su vez generaba nuevas crisis. Por eso las crisis —sobre todo las del comercio exterior— le servían al régimen para extender su control sobre la economía.","por_que_no":["Invierte la relación: cada crisis llevó a más control (Nuevo Plan en 1934, Plan Cuatrienal en 1936), no a liberalizar.","Confunde el problema: no sobraban exportaciones sino que faltaban; el déficit venía de importar insumos para el rearme.","Contradice el texto: después de 1933 hubo nuevas crisis (1934, 1936, fines de 1938) causadas sobre todo por el rearme.",""],"pag":"PDF p. 4"},{"id":"gro-n4","tema":"P6","nivel":"normal","enunciado":"Según Gross, ¿qué problema intentó resolver el Plan Cuatrienal de 1936 y por qué medios?","opciones":["El desempleo masivo heredado de Weimar, mediante obras públicas como la red de autopistas y la construcción de la fábrica de Volkswagen.","La escasez de divisas por el déficit comercial, sustituyendo importaciones con sintéticos y controlando más el comercio exterior.","La inflación provocada por la emisión del Reichsbank, mediante el congelamiento de precios y el regreso a la disciplina del patrón oro.","La caída de la inversión privada, mediante la privatización de los yacimientos de carbón y la libre importación de insumos industriales."],"correcta":1,"explicacion":"En 1936 los sectores militar y agrícola reclamaban más importaciones, el déficit comercial crecía y Alemania perdía reservas. El Plan Cuatrienal buscó ahorrar divisas fabricando sintéticos que reemplazaran importaciones, nacionalizando ciertos yacimientos de carbón y controlando con más rigor el comercio exterior. Gross aclara que solo postergó los problemas.","por_que_no":["Confunde objetivo y momento: hacia 1936 Alemania ya tenía pleno empleo; el plan apuntaba al problema de las divisas.","","Mezcla un dato real (en 1936 se congelaron los precios) con un objetivo falso: la Depresión había desacreditado el patrón oro y el plan no volvía a él.","Invierte las medidas: el plan nacionalizó ciertos yacimientos de carbón y endureció el control de las importaciones."],"pag":"PDF p. 4"},{"id":"gro-n5","tema":"P6","nivel":"normal","enunciado":"Según Gross, que retoma a Tooze, ¿qué lógica económica tenía la búsqueda de Lebensraum por parte de Hitler?","opciones":["Obtener colonias en África y Asia que abastecieran a Alemania de materias primas tropicales y absorbieran sus excedentes agrícolas.","Reinsertar a Alemania en el mercado mundial y volver al patrón oro, pagando la deuda externa con los recursos de las tierras anexadas.","Darle a Alemania un espacio continental propio, con recursos y mercados suficientes para una economía de producción masiva como la estadounidense.","Formar una zona de influencia comercial en la que los vecinos le dieran a Alemania un trato preferencial sin necesidad de dominarlos políticamente."],"correcta":2,"explicacion":"Hitler veía que EE.UU. tenía un enorme mercado interno y materias primas dentro de sus fronteras, lo que le había permitido ser la primera nación de producción masiva. Para competir como potencia global, creía que Alemania —una economía semiperiférica según Tooze— necesitaba un continente propio en Europa del Este que le diera espacio, recursos y mercados.","por_que_no":["Cambia el escenario: el imperio nazi se proyectaba sobre el continente europeo, sobre todo Europa del Este, no sobre colonias de ultramar.","Invierte el sentido: los nazis buscaban desligar a Alemania del mercado mundial, y la Depresión había desacreditado el patrón oro.","","Describe el imperio informal que defendían Schacht y otras élites; Hitler, en cambio, quería un imperio territorial formal."],"pag":"PDF p. 2"},{"id":"gro-n6","tema":"P6","nivel":"normal","enunciado":"Según Gross, ¿qué fue la «arianización» y qué alcance tuvo más allá de lo económico?","opciones":["Quitarles por la fuerza los bienes a los judíos; como ser propietario era parte de ser ciudadano, también los humillaba y los dejaba fuera de la nación.","La exclusión forzosa de los judíos de la economía; para el régimen era ante todo un saneamiento financiero, sin el sentido de «redención» que le atribuyen los historiadores.","El despojo de los bienes judíos; su alcance fue acotado, porque en Europa la propiedad se consideraba un asunto privado, separado de los derechos civiles.","La confiscación de empresas y cuentas judías; su sentido extraeconómico fue propagandístico: mostrar ante el mundo que Alemania recuperaba su soberanía."],"correcta":0,"explicacion":"Gross define la «arianización» como la eliminación forzada de los judíos de la economía. Como en Europa la propiedad privada estaba estrechamente asociada a los derechos civiles y las libertades individuales, despojarlos implicaba quitarles dignidad, excluirlos de la comunidad nacional y alimentar la deshumanización que condujo al genocidio. Los propios nazis la presentaban como una «redención» de bienes supuestamente saqueados.","por_que_no":["","Invierte la atribución: eran los propios nazis quienes veían la arianización como una «redención» de la comunidad nacional; tenía fines financieros, pero también un sentido racial.","Usa los términos del texto al revés: Gross dice que en Europa la propiedad estaba estrechamente asociada a los derechos civiles; por eso el despojo tuvo un alcance enorme.","Invierte un dato: desde 1935 Berlín buscó evitar la publicidad internacional; el alcance extraeconómico fue la exclusión y la deshumanización de los judíos, no la propaganda exterior."],"pag":"PDF p. 8"},{"id":"gro-n7","tema":"P6","nivel":"normal","enunciado":"Según Gross, ¿por qué Alemania salió de la Depresión más rápido que Gran Bretaña o Estados Unidos?","opciones":["Porque aplicó antes que nadie un gran gasto deficitario en obras civiles, como las autopistas, que absorbió el desempleo desde 1933.","Porque se mantuvo dentro del patrón oro y con disciplina fiscal, lo que le devolvió la confianza de los acreedores y el crédito externo.","Porque los sindicatos lograron aumentos salariales que ampliaron el consumo interno y reactivaron la demanda de bienes durables.","Porque volcó su economía a la producción militar antes que esas potencias, no por una política anticíclica novedosa."],"correcta":3,"explicacion":"Gross relativiza la imagen protokeynesiana: el gasto militar ya dominaba el gasto público en 1934, las autopistas se aceleraron recién en 1936 y, antes del Plan Cuatrienal, déficit, emisión y deuda no eran excepcionales. Concluye que el Tercer Reich no fue más keynesiano que otros países y que se recuperó antes porque militarizó su economía antes que Gran Bretaña o EE.UU.","por_que_no":["Es la versión protokeynesiana que Gross corrige: el gasto en autopistas se aceleró recién en 1936, con pleno empleo, y el gasto fue sobre todo militar.","Contradice el texto: la Depresión desacreditó el patrón oro y en 1934 Alemania suspendió el pago de su deuda externa.","Invierte lo ocurrido: el régimen destruyó el poder de los sindicatos y congeló los salarios en 1933.",""],"pag":"PDF pp. 5-6"},{"id":"gro-d1","tema":"P6","nivel":"dificil","enunciado":"En el debate historiográfico sobre cuánta libertad tuvieron las empresas bajo el nazismo, ¿qué posición considera Gross más adecuada?","opciones":["Que ambas lecturas aciertan en parte, aunque al final pesó más la coerción, ya que cualquier empresa que no cumpliera podía ser expropiada por el Estado.","Que el Estado guiaba a las firmas con estímulos y amenazas a la vez, y que ellas actuaban tanto por afán de lucro como por instinto de conservación.","Que conviene matizar la coerción, pero reconociendo que primó la libertad: las ganancias crecieron y muchas firmas pudieron autofinanciarse.","Que la autonomía empresaria fue real hasta 1936, pero se extinguió cuando el congelamiento de precios de ese año suprimió la competencia por ganancias."],"correcta":1,"explicacion":"Gross critica las dos posturas extremas —quienes enfatizan la coerción subestiman lo sofisticado de los estímulos del régimen; quienes enfatizan la libertad olvidan las amenazas implícitas y explícitas— y no inclina la balanza hacia ninguna ni propone etapas. Las mejores descripciones combinan ambas: un híbrido de mercado y directivas estatales (Hayes), con empresarios guiados por «codicia y supervivencia» (Nicosia y Huener).","por_que_no":["Inclina la balanza hacia la coerción: las expropiaciones existieron, pero Gross dice que esa lectura subestima los estímulos del régimen (excepciones de precios, contratos con ganancia garantizada).","","Inclina la balanza hacia la libertad: las ganancias crecieron, pero Gross dice que esa lectura exagera la libertad, porque la industria enfrentaba amenazas y no era un socio igualitario.","Contradice el texto: el congelamiento de 1936 tuvo innumerables excepciones, y la competencia y las ganancias siguieron motivando a las empresas también durante la guerra."],"pag":"PDF pp. 7-8"},{"id":"gro-d2","tema":"P6","nivel":"dificil","enunciado":"Gross sostiene que, después de 1933, el proceso por el cual las crisis traían más regulación estatal cobró una dinámica nueva por tres factores. ¿Cuál de ellos considera el más importante?","opciones":["El descrédito del laissez-faire y del patrón oro tras la Depresión, que abrió un espacio intelectual para políticas heterodoxas.","El fracaso reiterado de la cooperación internacional y el proteccionismo de otras potencias, que empujaron a Alemania a cerrarse.","Las crisis bancaria y cambiaria de fines de Weimar, que llevaron al Estado a hacerse cargo del sistema financiero y de las divisas.","La presión del rearme, que forzaba a importar petróleo y hierro, agotaba las divisas y desequilibraba la economía."],"correcta":3,"explicacion":"Gross enumera tres factores y marca el tercero como el más importante: la implacable campaña de rearme, que obligaba a importar bienes que Alemania no producía (petróleo, mineral de hierro de alta calidad), agotaba materias primas y divisas y agravaba el déficit comercial, generando desequilibrios macroeconómicos.","por_que_no":["Es verdadero —es el primer factor que menciona Gross—, pero no el que él considera más importante.","Es verdadero —es el segundo factor—, pero Gross no lo señala como el principal.","Es el antecedente anterior a 1933, no uno de los factores de la nueva dinámica posterior a la toma del poder.",""],"pag":"PDF p. 4"},{"id":"gro-d3","tema":"P6","nivel":"dificil","enunciado":"Según Gross, ¿cuál es el orden en que el régimen nazi respondió a sus sucesivas crisis de comercio exterior?","opciones":["Moratoria de la deuda externa y reparto de divisas por prioridades; luego, sustitución de importaciones con sintéticos; por último, anexiones que aportaran minerales y divisas.","Sustitución de importaciones con sintéticos; luego, moratoria de la deuda externa y reparto de divisas por prioridades; por último, anexiones que aportaran minerales y divisas.","Anexiones que aportaran minerales y divisas; luego, moratoria de la deuda externa y reparto de divisas por prioridades; por último, sustitución de importaciones con sintéticos.","Moratoria de la deuda externa y reparto de divisas por prioridades; luego, anexiones que aportaran minerales y divisas; por último, sustitución de importaciones con sintéticos."],"correcta":0,"explicacion":"En 1934 Schacht suspendió el pago de la deuda externa y creó el Nuevo Plan, que asignaba divisas según las prioridades del rearme. En 1936 llegó el Plan Cuatrienal, centrado en los sintéticos para sustituir importaciones. Hacia 1938-1939, ante nuevos cuellos de botella, la expansión territorial (Austria y Checoslovaquia, ricas en minerales y divisas) apareció como salida.","por_que_no":["","Invierte el Nuevo Plan (1934) y el Plan Cuatrienal (1936).","Ubica las anexiones al principio, cuando fueron la respuesta a los cuellos de botella de 1938-1939.","Adelanta las anexiones: el Plan Cuatrienal (1936) fue anterior a la expansión territorial."],"pag":"PDF pp. 4-5"},{"id":"gro-d4","tema":"P6","nivel":"dificil","enunciado":"¿En qué se diferenciaba, según Gross, la concepción de Hjalmar Schacht sobre la expansión alemana de la de Hitler?","opciones":["Schacht promovía la conquista militar del Este para asegurar materias primas, mientras Hitler confiaba en que el comercio bilateral bastaba para sostener el poder alemán.","Schacht quería devolver a Alemania al comercio mundial multilateral, mientras Hitler aspiraba a un imperio comercial informal en el sudeste de Europa.","Schacht buscaba manejar la política económica y monetaria de los vecinos sin anexarlos; Hitler veía el comercio como algo pasajero y apostaba al dominio territorial.","Schacht rechazaba colaborar con un régimen de métodos económicos heterodoxos, mientras Hitler lo necesitaba para recuperar la confianza de los acreedores externos."],"correcta":2,"explicacion":"Schacht encarnaba el imperio informal: quería comercio sin la volatilidad de los mercados globales y controlar la política monetaria y económica de países como Yugoslavia o España, dejando la soberanía en manos locales porque el imperio político le parecía demasiado caro. Hitler usó ese comercio para el rearme, pero lo consideraba un medio transitorio: el poder alemán debía anclarse en un imperio territorial formal.","por_que_no":["Invierte las posiciones: el imperio territorial era la meta de Hitler, y Schacht lo consideraba demasiado costoso.","Ambas mitades fallan: Schacht quería evitar la volatilidad del mercado mundial y Hitler no se conformaba con un imperio informal.","","Contradice el texto: Schacht colaboró de buena gana justamente porque esperaba que el régimen usara técnicas económicas poco ortodoxas."],"pag":"PDF pp. 3-4"},{"id":"gro-d5","tema":"P6","nivel":"dificil","enunciado":"Según Gross, ¿cómo se llevó a cabo la «arianización» antes de 1938?","opciones":["Mediante un plan centralizado desde Berlín, que registraba todos los bienes judíos y sometía cada venta a la aprobación del gobierno central.","Sin plan general y por iniciativas locales: jefes del partido se apoderaban de firmas judías y las cedían a allegados por mucho menos de su valor.","Mediante un impuesto punitivo sobre los patrimonios judíos, que se convirtió en la principal fuente del Estado para financiar el rearme.","De manera uniforme en todo el país, empezando por las grandes ciudades comerciales como Hamburgo, donde se concentraban las firmas judías."],"correcta":1,"explicacion":"Gross explica que antes de 1938 los nazis no tenían un plan maestro: la «arianización» fue descentralizada y surgió desde abajo. Amparados en leyes para confiscar bienes de opositores, jefes locales del partido tomaban empresas judías, las ponían en fideicomiso y las vendían a amigos o patrocinadores a una fracción de su costo. Recién en 1938 Berlín armó un plan sistemático.","por_que_no":["Describe lo que se hizo en Austria tras el Anschluss (1938) y luego se extendió a Alemania: es posterior.","","Mezcla período y alcance: el impuesto punitivo es de noviembre de 1938, y Gross niega que el despojo haya financiado lo principal del rearme.","Contradice el texto: la arianización varió por región; en el campo avanzó antes, y en Hamburgo muchas firmas judías se mantuvieron porque generaban divisas."],"pag":"PDF pp. 8-9"},{"id":"gro-d6","tema":"P6","nivel":"dificil","enunciado":"¿Cómo describe Gross la actitud de empresarios y banqueros alemanes frente a la «arianización»?","opciones":["Mantuvieron reparos hasta 1938: sus argumentos en contra recién se desvanecieron cuando la Kristallnacht volvió habitual el robo estatal organizado.","Pagaron precios cada vez más altos por las firmas judías, porque la competencia entre muchos compradores alemanes encarecía esos activos año tras año.","Usaron sus contactos políticos para frenar las ventas forzadas, y los bancos intermediaron para que los dueños judíos cobraran precios justos.","Sacaron provecho: la banca medió en las ventas y los compradores, con padrinos políticos, pagaban menos cuanto más acorralados estaban los dueños."],"correcta":3,"explicacion":"Para Gross, hacia 1938 el «robo estatal organizado» se había vuelto habitual y la élite comercial lo aprovechó: las objeciones se habían disipado ya en 1934, los bancos actuaron como intermediarios en la venta de activos judíos y los empresarios usaron sus contactos políticos para comprar firmas a precios que bajaban a medida que los judíos perdían opciones de negociar con contrapartes de buena fe. Habla de un pragmatismo amoral.","por_que_no":["Trampa de cronología: los argumentos contra la arianización ya se habían desvanecido en 1934; en 1938 el robo estatal organizado ya era lo habitual.","Invierte el dato: los precios bajaron con el tiempo porque los judíos tenían cada vez menos contrapartes de buena fe.","Usa palabras del texto en la relación equivocada: los contactos políticos servían para comprar empresas judías y los bancos gestionaban esas ventas, no para proteger a los dueños.",""],"pag":"PDF p. 9"},{"id":"gro-d7","tema":"P6","nivel":"dificil","enunciado":"Según Gross, ¿por qué la explotación económica de la Europa ocupada resulta un fracaso cuando se la evalúa a largo plazo?","opciones":["Porque trasladar la inflación a los países sometidos hundió sus monedas y retrajo a los campesinos, y la devastación del Este redujo lo que podía extraerse.","Porque Alemania pagó en divisas y al contado todo lo que importaba de los territorios ocupados, lo que terminó de agotar las reservas del Reichsbank.","Porque los territorios del Este rindieron menos de lo previsto, y Francia, por su parte, casi no aportó alimentos ni materiales industriales al Reich.","Porque la Wehrmacht prohibió el saqueo para ganarse a las poblaciones locales, lo que privó al Reich del botín que esperaba de la conquista."],"correcta":0,"explicacion":"Gross admite que la ocupación rindió en el corto plazo, pero sostiene que fracasó a largo plazo: obligar a los bancos centrales ocupados a emitir para pagar a la Wehrmacht hizo colapsar las monedas locales, los productores rurales se retiraron del mercado y hubo hambrunas (Grecia, Serbia); además, la destrucción nazi hizo que el Este produjera muy poco. El imperio cubrió solo un 25% del costo de la guerra.","por_que_no":["","Invierte el mecanismo: Alemania importaba más de lo que exportaba y pagaba acumulando deudas en cuentas de compensación, que nunca saldó.","Mitad bien, mitad mal: el Este rindió poco por la destrucción, pero Francia aportó más alimentos y materiales que toda la URSS ocupada.","Contradice el texto: la ocupación empezaba con una ola de saqueo de la Wehrmacht y, en el Este, con el desmantelamiento de fábricas."],"pag":"PDF p. 10"},{"id":"gro-m1","tema":"P6","nivel":"muy_dificil","enunciado":"Según Gross, ¿cuáles de las siguientes afirmaciones sobre la economía nazi son correctas? I. El régimen conservó la competencia y la ganancia como estímulos para las empresas privadas. II. La propiedad privada dependía de que la empresa sirviera a los fines del régimen, que podía expropiarla. III. Tras la salida de Schacht en 1937, un único organismo planificador fijó las metas de toda la industria. IV. Los contactos personales con el partido influían en quién obtenía contratos públicos.","opciones":["Solo I, II y III","Solo I, II y IV","Solo II, III y IV","Solo I y III"],"correcta":1,"explicacion":"I es correcta: los nazis mantuvieron la competencia y la ganancia como incentivos. II también: la propiedad estaba condicionada a las necesidades del régimen (Junkers, Salzgitter, el temor de Mannesmann a ser expropiada). IV es correcta: el amiguismo era constitutivo y los contratos se conseguían por contactos con el partido. III es falsa: entre la renuncia de Schacht (1937) y las reformas de Speer (1942) no está claro quién mandaba; la economía fue un ejemplo de policracia.","por_que_no":["Incluye III, que es falsa (policracia: entre 1937 y 1942 no estaba claro quién mandaba), y omite IV: según Gross, las corporaciones ganaban contratos públicos gracias a sus contactos con el partido.","","Incluye III, que es falsa, y omite I: la competencia y la ganancia siguieron siendo motores de la actividad privada.","Incluye III, que es falsa, y omite II y IV, que son correctas: la propiedad estaba condicionada a los fines del régimen y los contactos con el partido pesaban en los contratos."],"pag":"PDF pp. 1, 6-8"},{"id":"gro-m2","tema":"P6","nivel":"muy_dificil","enunciado":"Si alguien afirmara que Hitler desató la guerra en 1939 como salida directa y calculada a una crisis económica interna, ¿qué respondería Gross?","opciones":["Que tiene razón: así lo planteó Mason, y los historiadores de la diplomacia lo confirmaron con la documentación de los años treinta.","Que el nexo directo entre crisis y guerra es discutible, pero que en el comercio el rearme sí empujó a conquistar recursos antes de lo previsto.","Que se equivoca: como plantea Overy, hacia 1939 Alemania tenía su comercio exterior equilibrado y sus reservas de divisas en buen nivel.","Que se equivoca: la guerra respondió a la ideología racial y al Lebensraum, y los problemas de divisas no pesaron en el momento elegido para expandirse."],"correcta":1,"explicacion":"Gross presenta la tesis de Mason —la guerra de agresión como «solución» a la crisis de 1938-1939, que además permitía imponer sacrificios imposibles en paz— y la crítica de Overy, para quien ese relato venía de ilusiones británicas y de conservadores opuestos a los controles de Hitler. Concluye que la línea entre crisis y guerra no es tan directa, pero que en el comercio el argumento se sostiene: según Kaiser, el rearme pensado para independizarse del mercado mundial dificultó obtener recursos y adelantó la conquista del Lebensraum.","por_que_no":["Inventa un respaldo: Gross dice que los historiadores de la diplomacia evitan en gran medida explicar la guerra por la crisis económica.","","Gross no adopta la postura de Overy, y sus datos para 1939 (reservas agotadas, pedidos de exportación en su mínimo de la década) contradicen esa descripción.","Desconoce la dimensión económica: Gross muestra que figuras del partido buscaban en la expansión (Austria, Checoslovaquia) minerales y divisas."],"pag":"PDF p. 5"},{"id":"gro-m3","tema":"P6","nivel":"muy_dificil","enunciado":"Las explicaciones marxistas (como la de Anievas) y liberales (como la de Frieden) vinculan el imperialismo alemán con las condiciones económicas de entreguerras. ¿Qué objeción les plantea Gross?","opciones":["Que sobrevaloran la ideología racial y descuidan los condicionantes estructurales de la economía política internacional de entreguerras.","Que se equivocan sobre el endeudamiento, porque Alemania financió su modernización con ahorro interno y no con crédito externo.","Que omiten que la sobreproducción de posguerra favoreció a Alemania y le permitió ampliar sus exportaciones durante la Depresión.","Que, al buscar rasgos comunes con Italia y Japón, no captan lo propio del caso nazi: el lugar central de la ideología racial en su proyecto imperial."],"correcta":3,"explicacion":"Gross reconoce que ambos enfoques destacan la primacía de la economía política internacional y encuentran factores estructurales comunes a Alemania, Italia y Japón. Su objeción es que pierden la especificidad nazi: el imperio se concebía como una lucha existencial contra una supuesta conspiración judía mundial y se justificaba en el desprecio por los eslavos. Por eso el imperialismo nazi no puede entenderse solo desde la economía.","por_que_no":["Invierte la crítica: lo que Gross les reprocha es descuidar la ideología racial, no sobrevalorarla.","Contradice el texto: las naciones semiperiféricas como Alemania se endeudaron fuertemente en el exterior para modernizarse.","Contradice el texto: la sobreproducción y el colapso del comercio llevaron a las élites a buscar grandes bloques económicos.",""],"pag":"PDF pp. 2-3"},{"id":"gro-m4","tema":"P6","nivel":"muy_dificil","enunciado":"¿Cuál de las siguientes afirmaciones expresa mejor la relación que Gross establece entre la «arianización» y los problemas del comercio exterior alemán?","opciones":["El régimen quiso captar las divisas judías y, desde 1938, usó el despojo sistemático para aliviar deuda estatal y déficit externo.","La emigración judía se llevó al exterior la mayor parte de las reservas del Reichsbank y fue la causa principal de la crisis de divisas.","El despojo financió el grueso del rearme, de modo que los alemanes casi no soportaron sus costos hasta 1942-1943, como prueban las cifras fiscales.","Avanzó por motivos de pureza racial aun a costa de las divisas, liquidando primero las firmas judías exportadoras de ciudades como Hamburgo."],"correcta":0,"explicacion":"Gross muestra que desde 1935 un objetivo importante era centralizar las divisas en manos judías para mitigar las crisis comerciales (ya una ley de julio de 1933 impedía a los emigrantes sacarlas). En 1938 el plan sistemático de Göring respondía a los desafíos del comercio y el rearme: buscaba aliviar la deuda pública y el déficit comercial. Por eso en Hamburgo se preservaron firmas judías que generaban divisas.","por_que_no":["","Invierte la relación: el régimen impidió que los emigrantes sacaran divisas, y la crisis venía sobre todo del rearme.","Es la tesis principal de Aly, que Gross rechaza: Alemania siguió siendo una de las naciones con más impuestos; solo acepta que el impuesto de 1938 ayudó en un momento crítico.","Contradice el texto: en Hamburgo muchas firmas judías se mantuvieron justamente porque generaban divisas y tenían vínculos con Europa occidental."],"pag":"PDF pp. 8-9"},{"id":"gro-m5","tema":"P6","nivel":"muy_dificil","enunciado":"Según Gross, ¿cuáles de las siguientes afirmaciones sobre la expansión económica alemana son correctas? I. En España, las deudas que Franco acumulaba por sus compras a Alemania se convirtieron en propiedad alemana de empresas locales, sin anexión territorial. II. Austria y Checoslovaquia fueron anexadas, entre otras razones, por sus reservas de minerales y de divisas. III. Por la riqueza de su territorio, la URSS ocupada le aportó a Alemania más alimentos e insumos industriales que la Francia ocupada. IV. Las deudas que Alemania acumuló con los países ocupados en las cuentas de compensación se saldaron con los Acuerdos de Londres de 1953.","opciones":["Solo I y III","Solo I y II","Solo II y IV","Solo I, II y III"],"correcta":1,"explicacion":"I es correcta: HISMA-ROWAK convirtió la deuda de Franco en propiedad de empresas mineras, agrícolas y de transporte (imperio informal, sin anexión). II también: esas anexiones aportaron valiosas reservas minerales y divisas. III invierte el dato: Gross destaca como revelador que Francia proveyó más alimentos y materiales que toda la URSS ocupada, por la destrucción en el Este. IV es falsa: la deuda de más de 20.000 millones de marcos nunca se reembolsó, pese a los Acuerdos de Londres de 1953.","por_que_no":["Incluye III, que invierte el dato (Francia aportó más que toda la URSS ocupada), y omite II, que es correcta.","","Omite I (el caso español de HISMA-ROWAK) e incluye IV, que es falsa: la deuda de la ocupación nunca se devolvió.","Incluye III, que es falsa: Gross destaca que Francia aportó más que toda la URSS ocupada."],"pag":"PDF pp. 3, 5, 10"},{"id":"gro-m6","tema":"P6","nivel":"muy_dificil","enunciado":"Gross retoma la imagen de Umbreit sobre si convenía «matar a la vaca u ordeñarla» en los territorios ocupados. ¿Qué afirmación resume mejor cómo se resolvió ese dilema?","opciones":["Se impuso en todos los territorios la opción de preservar la producción local, ya que el saqueo inicial había resultado un fracaso en Europa del Este.","En el Oeste predominó el saqueo y en el Este se conservaron las fábricas, porque allí estaban los recursos que exigía el Lebensraum.","No hubo una política clara: el Este fue saqueado y en el Oeste se sostuvo la producción hasta que el reclutamiento forzoso de trabajadores contribuyó a hundirla.","Desde 1939 se optó por el saqueo en todas partes, porque la industria de Europa occidental se negaba a cumplir pedidos militares alemanes."],"correcta":2,"explicacion":"Gross dice que los nazis nunca fijaron una política clara. En Europa del Este prefirieron el saqueo; en Europa occidental, los gobernadores locales quisieron mantener la producción y hasta 1942 Bélgica, Francia, los Países Bajos y Bohemia cumplieron importantes pedidos militares. Pero desde 1942 las requisas de trabajadores de Sauckel hicieron que muchos abandonaran sus puestos y contribuyeron a la rápida caída de la producción occidental.","por_que_no":["Contradice el núcleo del texto: no hubo una política única, y en el Este siguió predominando el saqueo.","Invierte las regiones: el saqueo predominó en el Este; en el Oeste se intentó mantener la producción.","","Contradice el texto: hasta 1942 la industria occidental cumplió importantes pedidos militares para Alemania."],"pag":"PDF p. 10"},{"id":"gro-m7","tema":"P6","nivel":"muy_dificil","enunciado":"Según Gross, ¿cuál de los siguientes pares reúne dos herencias del Tercer Reich que contribuyeron al éxito económico de Alemania Occidental después de 1945?","opciones":["Los canales Estado-industria que dejaron los comités de Speer y la expansión del sistema de formación de aprendices en los oficios.","La industria automotriz de producción masiva, con Volkswagen a la cabeza, y el congelamiento salarial que abarató la reconstrucción.","Los canales Estado-industria que dejaron los comités de Speer y la sustitución de importaciones del Plan Cuatrienal, que siguió vigente.","La industria automotriz de producción masiva, con Volkswagen a la cabeza, y el sistema de precios fijos por producto de la guerra."],"correcta":0,"explicacion":"Gross cuestiona la «hora cero» y menciona tres herencias que alimentaron el capitalismo coordinado de Alemania Occidental: la base de producción en masa del sector automotor (Volkswagen), los canales Estado-industria consolidados por los comités de Speer y la ampliación del aprendizaje vocacional. Solo la opción correcta reúne dos de ellas; el congelamiento salarial, la sustitución de importaciones y los precios fijos de guerra no figuran como legados.","por_que_no":["","Mitad bien: Volkswagen y la producción masiva sí son un legado, pero Gross no menciona el congelamiento salarial como herencia de posguerra.","Mitad bien: los comités de Speer sí dejaron canales Estado-industria, pero la sustitución de importaciones no figura como legado; la posguerra trajo, más bien, libre comercio.","Mitad bien: Volkswagen sí es un legado, pero el sistema de precios fijos de la guerra no figura entre las continuidades que destaca Gross."],"pag":"PDF p. 11"}],"desarrollo":[{"id":"gro-d-n1","tema":"P6","nivel":"normal","consigna":"Según Gross, ¿qué tipo de economía fue la economía nazi? ¿Puede considerarse capitalista? Desarrolle.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Capitalista: competencia y ganancia","detalle":"Afirma que fue capitalista porque conservó la propiedad privada, la competencia y la ganancia como incentivos (las ganancias crecieron mucho después de 1933).","peso":3,"indicios":[["mantuv","conserv","preserv","siguieron","siguio","persist","incentiv","motor"],["competen","ganancia","lucro","rentab","incentiv"]]},{"id":"b","punto":"Fuertemente dirigista y a veces coercitiva","detalle":"Explica que el Estado orientaba la industria hacia sus fines, controlaba divisas, materias primas y capital, congelaba salarios y precios y usaba amenazas o expropiaciones (Junkers, Reichswerke Göring).","peso":3,"indicios":[["dirigis","interven","coerci","control estatal","orientacion estatal","fuertemente dirig"],["expropi","congel","divisa","materias primas","junkers","goring"]]},{"id":"c","punto":"Orientada al rearme, el imperio y el despojo","detalle":"Señala que la economía estaba al servicio de la producción militar, la expansión imperial y la expoliación de los judíos.","peso":2,"indicios":[["rearm","militar","armament"],["imperi","expansi","judi","arianiz","despoj","expoli"]]},{"id":"d","punto":"Amiguismo y corrupción constitutivos","detalle":"Menciona que estaba plagada de amiguismo: cargos por conexiones personales y contratos públicos por contactos con el partido; la corrupción era un rasgo constitutivo del régimen (Bajohr), con el ejemplo de Flick.","peso":3,"indicios":[["amigu","amigos","corrup","nepot","clientel","contactos","conexiones","favoritis"]]},{"id":"e","punto":"Propiedad privada condicionada","detalle":"Aclara que la propiedad privada no era un derecho pleno, sino que estaba condicionada a la agenda del régimen.","peso":2,"indicios":[["propiedad"],["condicionad","expropi","subordin","amenaz","no era un derecho"]]},{"id":"f","punto":"Ni keynesiana ni soviética: un híbrido","detalle":"Concluye que no fue protokeynesiana ni una economía planificada (policracia), sino un híbrido de mercado y directivas estatales, de incentivos y represalias.","peso":2,"indicios":[["hibrid","mezcla","combina","policracia","ni keynes","no fue keynes","no era keynes","ni una economia planificad","no fue una economia planificad"]]}],"respuesta_modelo":"Para Stephen Gross, la economía nazi fue capitalista, aunque de un tipo particular. Los nazis conservaron la propiedad privada, la competencia y la búsqueda de ganancias como incentivos, y las ganancias empresarias crecieron mucho después de 1933. Pero construyeron un capitalismo fuertemente dirigista y a veces coercitivo: la propiedad quedó condicionada a la agenda del régimen (expropiación de Junkers en 1933, Reichswerke Hermann Göring en 1937), el Estado controló la asignación de divisas, materias primas y capital y congeló salarios y precios. Toda la economía se orientó al rearme, a la expansión imperial y a la expoliación de los judíos. Además, estaba plagada de amiguismo: los cargos se conseguían por conexiones personales y los contratos públicos por contactos con el partido, y la corrupción era un rasgo constitutivo del régimen, como muestra el caso Flick. Por eso Gross no la considera keynesiana ni una economía planificada al estilo soviético, sino un híbrido de mecanismos de mercado y directivas estatales, de incentivos y amenazas.","errores_comunes":["Decir que fue una economía planificada como la soviética o que abolió la propiedad privada: Gross subraya que se mantuvieron la competencia y la ganancia.","Reducirla a «capitalismo de amigos» sin mencionar la fuerte dirección estatal ni su orientación al rearme, el imperio y el despojo de los judíos.","Presentarla como un keynesianismo pionero basado en obras públicas: para Gross el gasto fue sobre todo militar."],"pag":"PDF pp. 1, 5-8"},{"id":"gro-d-n2","tema":"P6","nivel":"normal","consigna":"Según Gross, ¿qué fue la «arianización»? Explique qué objetivos perseguía, cómo se desarrolló hasta 1938 y qué cambió ese año.","extension":"10-15 líneas","puntos_clave":[{"id":"a","punto":"Exclusión forzada de los judíos","detalle":"Define la arianización como la eliminación forzada de los judíos de la economía mediante el despojo de sus empresas y bienes.","peso":3,"indicios":[["judi"],["despoj","expropi","confisc","robo","robar","elimin","exclu","saque","expuls"]]},{"id":"b","punto":"Objetivo ideológico: purificación","detalle":"Explica que los nazis la veían como una «redención» de la comunidad nacional y que quitar la propiedad era quitar dignidad, un paso hacia la deshumanización y el genocidio.","peso":2,"indicios":[["purific","redenc","redent","deshuman","genocid","dignidad","comunidad nacional","holocausto"]]},{"id":"c","punto":"Objetivo económico: activos y divisas","detalle":"Señala que también servía para adquirir activos y, en especial, divisas, para aliviar las crisis comerciales y, en 1938, la deuda y el déficit.","peso":3,"indicios":[["divisa","activo","moneda extranjera","deficit","recaud"]]},{"id":"d","punto":"Al principio: descentralizada, desde abajo","detalle":"Describe que al principio no hubo plan maestro: jefes locales del partido tomaban empresas judías y las vendían baratas a allegados; el proceso variaba por región (Hamburgo).","peso":2,"indicios":[["local","descentraliz","desde abajo","jefes","region","hamburgo","sin plan"]]},{"id":"e","punto":"1935-1936: Berlín encauza y centraliza","detalle":"Explica que desde 1935 el gobierno central intentó encauzar las iniciativas locales, canalizar activos y centralizar las divisas judías (ya una ley de julio de 1933 impedía sacarlas), y que después de 1936 las oficinas de divisas sirvieron para liquidar la riqueza judía.","peso":2,"indicios":[["encauz","canaliz","oficinas monetarias","oficinas de divisas","oficina de divisas","publicidad internacional","liquidar la riqueza","liquidar riqueza","liquidar los bienes","radicaliz"]]},{"id":"f","punto":"1938: plan sistemático con Göring","detalle":"Indica qué cambió en 1938: con el precedente austríaco tras el Anschluss y después de la Kristallnacht, Göring centralizó el proceso e impuso un impuesto punitivo a la riqueza judía, ligado a la deuda y al déficit.","peso":2,"indicios":[["goring","kristallnacht","anschluss","austria","impuesto"]]},{"id":"g","punto":"Participación activa de bancos y empresarios","detalle":"Menciona que bancos y empresarios aprovecharon el despojo (intermediación, contactos políticos, precios cada vez menores), con un pragmatismo amoral.","peso":2,"indicios":[["empresari","banco","bancar","elite","flick","compradores"],["aprovech","intermedi","contacto","pragmat","amoral","precio","sin reparo","no dud"]]}],"respuesta_modelo":"Según Gross, la «arianización» fue la eliminación forzada de los judíos de la economía mediante el despojo de sus empresas y bienes. Tenía un objetivo ideológico: los nazis la presentaban como una «redención» de bienes supuestamente saqueados, y quitarles la propiedad era quitarles dignidad, lo que alimentó la deshumanización que llevó al genocidio. También buscaba activos y, en especial, divisas. Al principio no hubo plan: jefes locales del partido tomaban firmas judías y las vendían baratas a allegados, con diferencias regionales (en Hamburgo se conservaron firmas que generaban divisas). Desde 1935 Berlín intentó encauzar esas iniciativas, canalizar activos y centralizar las divisas judías, y después de 1936 usó las oficinas de divisas para liquidar la riqueza judía. En 1938 el proceso se volvió sistemático: con el precedente de Austria y tras la Kristallnacht, Göring lo centralizó e impuso un impuesto punitivo para aliviar la deuda y el déficit. Bancos y empresarios lo aprovecharon con pragmatismo amoral: intermediaron ventas y compraron cada vez más barato.","errores_comunes":["Presentarla como un plan centralizado desde 1933: al principio fue local y heterogénea; desde 1935 Berlín intentó encauzarla y recién en 1938 hubo un plan sistemático.","Reducirla a un fenómeno ideológico, sin su función económica (activos, divisas, deuda y déficit).","Decir que los empresarios fueron obligados a participar: Gross destaca que la aprovecharon.","Afirmar, como Aly, que el despojo financió la guerra y liberó de impuestos a los alemanes: Gross lo relativiza."],"pag":"PDF pp. 8-9"},{"id":"gro-d-d1","tema":"P6","nivel":"dificil","consigna":"Explique por qué, según Gross, las crisis económicas resultaron funcionales al régimen nazi. ¿Qué tipo de crisis eran, qué las provocaba y cómo se relacionaron con la expansión territorial?","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Crisis de comercio exterior y divisas","detalle":"Identifica que eran sobre todo crisis del comercio exterior: déficit comercial y escasez de divisas y de materias primas.","peso":3,"indicios":[["divisa","comercio exterior","deficit comercial","balanza","materias primas","reservas"]]},{"id":"b","punto":"Causadas sobre todo por el rearme","detalle":"Explica que el rearme obligaba a importar petróleo y mineral de hierro y agotaba las divisas: para Gross, el factor más importante.","peso":3,"indicios":[["rearm","armament","militar"],["import","petrol","hierro","divisa"]]},{"id":"c","punto":"Dialéctica: crisis, más control, nuevas crisis","detalle":"Plantea que el régimen usaba cada crisis para ampliar la regulación estatal, que a su vez generaba nuevas crisis y más regulación.","peso":3,"indicios":[["regula","control","intervenc"],["dialect","circul","espiral","nuevas crisis","mas crisis","retroaliment","ciclo","otra crisis","a su vez"]]},{"id":"d","punto":"Contexto: Weimar y la Depresión","detalle":"Menciona que el proceso empezó a fines de Weimar y se aceleró porque la Depresión desacreditó el laissez-faire y el patrón oro, y las otras potencias se volvieron proteccionistas.","peso":1,"indicios":[["weimar","laissez","patron oro","proteccion","cooperacion internacional"]]},{"id":"e","punto":"Nuevo Plan (1934) y Plan Cuatrienal (1936)","detalle":"Ejemplifica con el Nuevo Plan de Schacht (moratoria de la deuda y divisas por prioridades) y el Plan Cuatrienal (sintéticos, control del comercio), que solo dieron alivios temporarios.","peso":2,"indicios":[["nuevo plan","schacht","cuatrienal","sintetic","moratoria"]]},{"id":"f","punto":"De la crisis a la conquista","detalle":"Relaciona los cuellos de botella de 1938-1939 con la expansión (Austria y Checoslovaquia por minerales y divisas; «profecía autocumplida» de Kaiser) y aclara que el vínculo directo con la guerra es debatido (Mason vs. Overy).","peso":2,"indicios":[["austria","checoslov","lebensraum","conquista","anexi"],["mason","overy","kaiser","autocumpl","antes de lo previsto","adelant"]]}],"respuesta_modelo":"Para Gross, las crisis no fueron un obstáculo para el nazismo sino una oportunidad: el régimen las aprovechó para extender el control estatal sobre la economía. Eran sobre todo crisis del comercio exterior: déficit comercial y falta de divisas y de materias primas. El mecanismo venía de fines de Weimar y se aceleró después de 1933, porque la Depresión había desacreditado el laissez-faire y el patrón oro y las demás potencias se volvían proteccionistas. Pero el factor decisivo fue el rearme, que obligaba a importar petróleo y mineral de hierro y agotaba las divisas. Se formó así una dialéctica: cada crisis provocada por el rearme justificaba más regulación, que a su vez generaba nuevas crisis. En 1934 Schacht suspendió el pago de la deuda externa y, con el Nuevo Plan, repartió las divisas según las prioridades militares; en 1936 otra crisis llevó al Plan Cuatrienal, centrado en sustituir importaciones con sintéticos, que solo dio alivios temporarios. Ante los cuellos de botella de 1938-1939, la expansión territorial (Austria y Checoslovaquia) aportó minerales y divisas, y a fines de 1938 la crisis volvió. Mason sostuvo que la guerra fue una salida a esa crisis, que además permitía imponer sacrificios imposibles en paz; Overy lo negó. Gross cree que el vínculo no es tan directo, pero que en el comercio se verifica la «profecía autocumplida» de Kaiser: el rearme para no depender del mercado mundial aumentó esa dependencia y adelantó la conquista del Lebensraum.","errores_comunes":["Hablar de crisis «inventadas» o de una trampa planificada: Gross describe crisis reales, provocadas en gran parte por el rearme, que el régimen aprovechaba.","Confundir el Nuevo Plan (1934, Schacht) con el Plan Cuatrienal (1936) o invertir su orden.","Afirmar sin matices que la guerra fue la salida planeada a la crisis económica: Gross relativiza la tesis de Mason.","Describirlas como crisis de sobreproducción o bursátiles: eran crisis de comercio exterior y divisas."],"pag":"PDF pp. 4-5"},{"id":"gro-d-d2","tema":"P6","nivel":"dificil","consigna":"Gross distingue entre un imperio «informal» y uno «formal». A partir de esa distinción, explique la lógica económica del imperialismo nazi, hacia qué territorios se orientó cada variante y por qué Hitler no se conformó con la primera.","extension":"15-20 líneas","puntos_clave":[{"id":"a","punto":"Lógica: semiperiferia y Lebensraum","detalle":"Explica que Alemania, economía semiperiférica, buscaba un Lebensraum con espacio, recursos y mercados para una economía de producción en masa como la de EE.UU.","peso":3,"indicios":[["lebensraum","espacio vital"],["recurso","mercado","materias primas","produccion en masa","estados unidos","semiperif"]]},{"id":"b","punto":"Imperio informal: qué es y dónde","detalle":"Define el imperio informal como penetración comercial sin control político, orientada al sudeste de Europa (p. ej., Yugoslavia) y a España.","peso":3,"indicios":[["comercial","comercio","penetra","influencia","sin control politico","sin anex"],["sudeste","espana","yugoslav","balcan","franco"]]},{"id":"c","punto":"Instrumentos del imperio informal","detalle":"Nombra herramientas como los acuerdos de compensación y los tratados bilaterales, HISMA-ROWAK o el Mitteleuropäische Wirtschaftstag, que permitían obtener insumos sin gastar divisas.","peso":2,"indicios":[["bilateral","compensac","hisma","rowak","clearing","wirtschaftstag","sin gastar divisas"]]},{"id":"d","punto":"Schacht frente a Hitler","detalle":"Contrasta a Schacht (influencia económica sin anexión, porque el imperio político era caro) con Hitler, para quien el comercio era transitorio y el poder debía apoyarse en un imperio territorial.","peso":2,"indicios":[["schacht"],["transitori","pasajer","temporari","caro","costos","soberan"]]},{"id":"e","punto":"Imperio formal: anexiones y conquista","detalle":"Señala la anexión de Austria y Checoslovaquia (minerales y divisas) y, desde 1939, la conquista de Europa del Este y la ocupación de Europa occidental, que debían realizar el Lebensraum y resolver las crisis.","peso":2,"indicios":[["austria","checoslov","europa del este","europa oriental","union sovietica","urss","polonia"],["anex","conquist","invad","ocup","guerra"]]},{"id":"f","punto":"No solo economía: ideología racial","detalle":"Aclara que el imperialismo nazi no se explica solo por la economía: la ideología racial (supuesta conspiración judía, desprecio por los eslavos) era central.","peso":1,"indicios":[["racial","raza","eslav","ideolog","racis"]]}],"respuesta_modelo":"Gross explica el imperialismo nazi a partir de la posición de Alemania en entreguerras. Siguiendo a Tooze, la describe como una economía semiperiférica, con buen nivel de vida pero por debajo de Gran Bretaña y Estados Unidos. Con EE.UU. como modelo, Hitler creía que Alemania necesitaba un continente propio, el Lebensraum, con espacio, recursos y mercados para la producción en masa; además, el imperialismo unía al régimen con empresarios que buscaban mercados. Gross distingue dos variantes. El imperio informal consistía en penetrar comercialmente a los vecinos sin controlarlos políticamente: tras la Depresión, el comercio se volcó al sudeste de Europa y a España mediante acuerdos de compensación y tratados bilaterales; HISMA-ROWAK convirtió las deudas de Franco en empresas alemanas y el Mitteleuropäische Wirtschaftstag invirtió para que el sudeste proveyera materias primas. Schacht encarnaba esta vía: quería manejar la política económica de países como Yugoslavia sin el costo de gobernarlos. Hitler usó ese comercio para obtener insumos del rearme sin gastar divisas, pero lo consideraba transitorio: el poder debía basarse en un imperio territorial. Ante los cuellos de botella de 1938-1939, Alemania anexó Austria y Checoslovaquia, ricas en minerales y divisas, y desde 1939 conquistó Europa del Este y ocupó Europa occidental (Francia, Bélgica, Países Bajos), además de Grecia y Serbia. Gross advierte que este imperialismo no se entiende solo por la economía: la ideología racial y el desprecio por los eslavos eran centrales.","errores_comunes":["Ubicar el imperialismo nazi en colonias de ultramar: el proyecto era continental, centrado en Europa del Este.","Confundir el imperio informal (comercial, sin control político) con el formal (territorial), o atribuirle a Schacht la idea de conquistar el Este.","Explicarlo solo por razones económicas, omitiendo la centralidad de la ideología racial."],"pag":"PDF pp. 2-5, 10"},{"id":"gro-d-m1","tema":"P6","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «La conquista de Europa le permitió al Tercer Reich resolver sus problemas económicos». ¿Es correcta según Gross? Justifique considerando los mecanismos de explotación, sus resultados a corto y largo plazo y los conflictos que generó.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Postura: válida solo a corto plazo","detalle":"Evalúa la afirmación: es correcta solo para el corto plazo; a largo plazo el imperio formal fracasó como solución económica.","peso":3,"indicios":[["corto plazo","inicialmente","al principio","en un primer momento"],["fracas","no resolvi","no soluciono","no logr","parcial","insuficient"]]},{"id":"b","punto":"Mecanismos de explotación","detalle":"Describe el saqueo de la Wehrmacht, el desmantelamiento de fábricas en el Este, los costos de ocupación pagados con emisión de los bancos centrales ocupados (exportación de la inflación) y los déficits pagados con deuda en cuentas de compensación.","peso":3,"indicios":[["saque","desmant","pagare","emisi","emitir","imprimir","inflac","compensac"]]},{"id":"c","punto":"Deuda nunca pagada","detalle":"Menciona que Alemania terminó debiendo más de 20.000 millones de marcos, nunca devueltos pese a los Acuerdos de Londres (1953), y que Grecia los reclamó en 2014-2015.","peso":2,"indicios":[["veinte mil","londres","repara","nunca devuel","nunca devol","no devol","sin devol","nunca reembols","nunca pag","nunca se pag","impag","nunca salda"]]},{"id":"d","punto":"Fracaso a largo plazo: monedas y hambrunas","detalle":"Explica que la inflación exportada destruyó las monedas, los campesinos se retiraron del mercado y hubo hambrunas (Grecia, Serbia); el Este devastado rindió poco (Francia aportó más que la URSS ocupada).","peso":3,"indicios":[["hambr","colaps","monedas locales","destruy"],["grecia","serbia","francia","sovietic","urss"]]},{"id":"e","punto":"Solo cubrió una parte del costo bélico","detalle":"Usa el dato de que el imperio cubrió apenas el 25% del costo de la guerra (35% contando el trabajo esclavo).","peso":2,"indicios":[["solo cubri","apenas cubri","cubrio solo","cubrio apenas","cubrio solamente","cuarta parte","un cuarto","veinticinco"],["costo","coste","gasto","financ"]]},{"id":"f","punto":"Dilema saquear o producir; trabajo forzado","detalle":"Plantea la tensión entre saquear o producir («matar a la vaca u ordeñarla»), sin política clara, y cómo las requisas de mano de obra de Sauckel contribuyeron a hundir la producción occidental.","peso":2,"indicios":[["vaca","sauckel","requis","reclut","trabajo forzado","trabajadores extranjeros"]]},{"id":"g","punto":"Corrupción y fusión Estado-economía","detalle":"Agrega que la disputa por activos extranjeros generó corrupción a gran escala (Neuhausen en Serbia) y que Göring usó inversión estatal para tomar empresas extranjeras.","peso":1,"indicios":[["corrup","neuhausen","satrap"]]}],"respuesta_modelo":"Según Gross, la afirmación es correcta solo para el corto plazo; a largo plazo, el imperio formal fracasó como solución económica. Desde 1939, Hitler esperaba que la conquista de Europa del Este realizara el Lebensraum y resolviera las crisis de divisas y materias primas que el imperio comercial informal no había resuelto. Al principio, la explotación rindió: como señala Liberman, solo los conquistadores despiadados logran que las sociedades vencidas paguen tributo. La Wehrmacht saqueaba los bienes de los gobiernos ocupados, en el Este se desmantelaban fábricas para llevarlas al Reich y los costos de ocupación se trasladaban a los vencidos, cuyos bancos centrales debían emitir moneda para canjear los pagarés militares; así Alemania exportaba su inflación. Además, importaba más de lo que exportaba y pagaba acumulando deuda en cuentas de compensación: en 1945 debía más de 20.000 millones de marcos, nunca devueltos pese a los Acuerdos de Londres de 1953, un conflicto que reapareció cuando Grecia reclamó reparaciones en la crisis del euro. Pero a largo plazo el balance fue negativo. La inflación exportada destruyó las monedas locales, los productores rurales se retiraron del mercado y hubo hambrunas en Grecia y Serbia; el Este, arrasado, produjo muy poco, al punto de que Francia aportó más que toda la URSS ocupada. En total, el imperio cubrió apenas el 25% del costo de la guerra (35% sumando el trabajo esclavo). A esto se sumó la indefinición entre «matar a la vaca u ordeñarla»: en el Este se saqueó y en el Oeste se mantuvo la producción hasta 1942, pero las requisas forzosas de trabajadores de Sauckel provocaron abandonos y contribuyeron a una rápida caída productiva. La disputa por activos extranjeros también generó corrupción masiva, como la de Neuhausen en Serbia. En síntesis, la conquista alivió problemas inmediatos, pero no resolvió la economía alemana y dejó un legado conflictivo.","errores_comunes":["Afirmar que la conquista resolvió los problemas económicos sin distinguir corto y largo plazo.","Decir que el Este fue la región más provechosa para Alemania: Francia aportó más que toda la URSS ocupada.","Creer que Alemania pagó lo que obtenía de los países ocupados: acumuló deudas que nunca devolvió.","Atribuir a los nazis una política única de explotación: nunca resolvieron el dilema entre saquear y producir."],"pag":"PDF pp. 10-11"},{"id":"gro-d-m2","tema":"P6","nivel":"muy_dificil","consigna":"Analice la siguiente afirmación: «La economía nazi fue una forma temprana de keynesianismo; y si no lo fue, se trató de una economía planificada como la soviética». Discuta ambas caracterizaciones según Gross y explique cuál es la que propone el autor.","extension":"20-30 líneas","puntos_clave":[{"id":"a","punto":"Argumentos de la lectura protokeynesiana","detalle":"Presenta la visión protokeynesiana: unos 5 millones de empleos recuperados hacia 1936, obras con crédito, autopistas, Volkswagen, préstamos matrimoniales, déficit y emisión.","peso":1,"indicios":[["autopista","volkswagen","prestamos matrimoniales","obras publicas","obras financiadas","anticicl","gasto deficitario","emision"]]},{"id":"b","punto":"Por qué no fue keynesiana","detalle":"Explica que la inversión privada ya crecía en 1932, los programas venían de Weimar, el gasto militar dominaba desde 1934 y las autopistas se aceleraron con pleno empleo: la recuperación vino de la militarización temprana.","peso":3,"indicios":[["militar","rearm"],["weimar","triplic","pleno empleo","militariz","antes que gran bretana","antes que estados unidos","antes que otros"]]},{"id":"c","punto":"Rasgos de economía dirigida","detalle":"Expone los argumentos a favor de una economía dirigida: propiedad condicionada, expropiaciones (Junkers, Reichswerke Göring), control de insumos, Estado como gran cliente, congelamiento de salarios y precios.","peso":2,"indicios":[["expropi","junkers","salzgitter","congel","condicionad","goring"]]},{"id":"d","punto":"Por qué no fue planificada","detalle":"Argumenta que no fue una economía planificada: no estaba claro quién mandaba (1937-1942), había policracia y el régimen usó incentivos (excepciones de precios, ganancia garantizada, competencia; caso textil).","peso":3,"indicios":[["policracia","al mando","quien mandaba","incentiv"
